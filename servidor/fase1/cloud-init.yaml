#cloud-config
# GastroGoan · servidor de la FASE 1 (web de reservas en IP propia). Vale para cualquier Ubuntu reciente (probado
# el diseño con 24.04; en 26.04 no depende de ningún paquete que cambie de nombre).
# GENERADO por servidor/fase1/generar-cloud-init.py: no editar a mano.
#
# Se pega en el campo «User data» (Cloud config) al crear el servidor en Hetzner. NO lleva llaves ni contraseñas.
# Qué deja hecho: firewall (solo 80 y 443; el 22 de entrada CERRADO), actualizaciones de seguridad automáticas,
# Caddy (descarga oficial verificada por huella) con HTTPS automático y un temporizador que cada 5 minutos baja de
# GitHub la última web de reservas. Va escribiendo por la consola de Hetzner (>_) lo que hace. Sin acceso remoto:
# si hiciera falta tocarlo, se borra y se vuelve a crear con este mismo texto (3-5 minutos; los datos viven en Firebase).
timezone: Europe/Madrid
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - ufw
  - unattended-upgrades
ssh_pwauth: false
write_files:
  - path: /etc/caddy/Caddyfile
    permissions: '0644'
    content: |
      # GastroGoan · FASE 1 (solo la web de reservas en IP propia).
      # Motivo: los bloqueos de LaLiga caen sobre IP de Cloudflare. Esta web es lo que
      # el cliente final necesita para reservar. La app, el panel y los pagos siguen en
      # Cloudflare hasta comprobar en un partido que este servidor responde.
      # Caddy obtiene y renueva solo el certificado HTTPS.

      (reservas) {
      	encode zstd gzip
      	header {
      		X-Content-Type-Options nosniff
      		Referrer-Policy strict-origin-when-cross-origin
      		Strict-Transport-Security "max-age=31536000"
      		# CSP: la MISMA que deploy/reservas/public/_headers (test/csp.mjs lo exige). frame-ancestors https: = se puede incrustar en la web del restaurante.
      		Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://gastro.gastrogoan.workers.dev; frame-src 'self' blob: data: https://*.firebaseapp.com; worker-src 'self'; manifest-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https:"
      		-Server
      	}
      	# Se puede incrustar en la web del restaurante: SIN X-Frame-Options (igual que _headers).
      	@html path *.html / /sw-reservas.js
      	header @html Cache-Control "no-cache"
      	@fuentes path /fonts/*
      	header @fuentes Cache-Control "public, max-age=31536000, immutable"

      	root * /srv/gastrogoan/sitios/reservas
      	# Enlace corto reservas.gastrogoan.com/casapaco: cualquier ruta que no sea un fichero
      	# devuelve la misma página, como hace el 404.html de Pages.
      	try_files {path} /index.html
      	file_server
      }

      # El nombre de verdad. No se usa hasta que se cambie el DNS.
      reservas.gastrogoan.com {
      	import reservas
      }

      # Dirección de PRUEBA con la IP del servidor (x-x-x-x.sslip.io), generada al arrancar:
      # permite abrir la web desde el móvil o la tablet con certificado válido ANTES de tocar el DNS.
      import extra/*.caddy
  - path: /usr/local/bin/gg-actualizar
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Baja de GitHub la última web de reservas y la deja en el sitio. Lo ejecuta el servidor solo, cada 5 minutos.
      # NO usa llaves ni contraseñas: el repositorio es público y solo se LEE (nunca escribe en GitHub).
      # Cada versión se guarda en su carpeta y «reservas» es un enlace que cambia de golpe a la nueva: nadie ve la web
      # a medias, y volver atrás es cambiar el enlace. Si algo falla (sin red, GitHub caído, versión rota) NO se toca
      # lo que ya estaba publicado.
      set -euo pipefail
      BASE="${GG_BASE:-/srv/gastrogoan}"
      REPO="${GG_REPO:-https://github.com/gastrogoan-rgb/gastrogoan.git}"
      RAMA="${GG_RAMA:-main}"
      mkdir -p "$BASE/sitios/versiones" "$BASE/repo"
      cd "$BASE/repo"
      if [ ! -d .git ]; then
        git init -q
        git remote add origin "$REPO"
        git config core.sparseCheckout true
        printf 'deploy/reservas/public/\n' > .git/info/sparse-checkout   # solo esa carpeta, no el repositorio entero
      fi
      git fetch -q --depth 1 origin "$RAMA"
      git reset -q --hard FETCH_HEAD
      ORIGEN="$BASE/repo/deploy/reservas/public"
      # Red de seguridad: sin la página principal no se publica nada.
      [ -s "$ORIGEN/index.html" ] || { echo "gg-actualizar: falta index.html en $RAMA, no se publica" >&2; exit 1; }
      HASH="$(git rev-parse --short HEAD)"
      DEST="$BASE/sitios/versiones/$HASH"
      if [ ! -s "$DEST/index.html" ]; then
        rm -rf "$DEST.tmp"; mkdir -p "$DEST.tmp"
        cp -a "$ORIGEN/." "$DEST.tmp/"
        rm -rf "$DEST"; mv "$DEST.tmp" "$DEST"
      fi
      # Cambio de golpe: el enlace nuevo se crea aparte y sustituye al anterior en un solo paso.
      ln -sfn "versiones/$HASH" "$BASE/sitios/reservas.nuevo"
      mv -T "$BASE/sitios/reservas.nuevo" "$BASE/sitios/reservas"
      # Se guardan las 3 últimas versiones (para volver atrás) y se borra el resto.
      ls -1dt "$BASE"/sitios/versiones/*/ 2>/dev/null | tail -n +4 | xargs -r rm -rf
      echo "gg-actualizar: publicado $HASH $(date -Is)"
  - path: /usr/local/bin/gg-arranque
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Se ejecuta UNA vez, al crear el servidor. Instala Caddy (descarga oficial con comprobación de huella), pone la
      # dirección de prueba con la IP, publica la web y deja el temporizador de actualización en marcha.
      # Va contando por la consola de Hetzner (>_) lo que hace y si algo falla, para poder ver dónde se paró.
      # No depende de la versión de Ubuntu ni de Docker.
      set -u
      LOG=/var/log/gg-arranque.log
      # La consola de Hetzner enseña la pantalla tty1; /dev/console puede ir a otra salida (serie), así que se escribe en las dos.
      di(){ echo "GG-ARRANQUE: $*" >> "$LOG"; echo "GG-ARRANQUE: $*" > /dev/tty1 2>/dev/null || true; echo "GG-ARRANQUE: $*" > /dev/console 2>/dev/null || true; }
      fallo(){ di "FALLO en el paso: $1. Mira /var/log/gg-arranque.log"; exit 1; }
      V=2.8.4
      case "$(dpkg --print-architecture)" in
        amd64) ARQ=amd64; SUMA=b8bec15d14fb033562af9f207850027bcbaa1f891edc9efe00d38bf39e1bf9944f8b6b8eba041ddd4c171cd70c905174c704d705be2f23bc678fe1eaf37a2485 ;;
        arm64) ARQ=arm64; SUMA=5466234be3e988071cef937aedbdd94c15b6f75cf7307397e67c2641219ac9bfe2c2bb3b31fc05bc68d3b6398bbe50abfa16ccf3b127318ccac31115ad26507c ;;
        *) fallo "arquitectura no soportada" ;;
      esac
      di "1/5 descargando Caddy $V"
      cd /tmp
      curl -fsSL --retry 5 --retry-delay 5 -o caddy.tgz "https://github.com/caddyserver/caddy/releases/download/v$V/caddy_${V}_linux_${ARQ}.tar.gz" >>"$LOG" 2>&1 || fallo "descarga de Caddy"
      echo "$SUMA  caddy.tgz" | sha512sum -c - >>"$LOG" 2>&1 || fallo "la huella de Caddy no coincide (descarga alterada)"
      tar xzf caddy.tgz caddy >>"$LOG" 2>&1 || fallo "descomprimir Caddy"
      install -m 0755 caddy /usr/local/bin/caddy
      id caddy >/dev/null 2>&1 || useradd --system --home-dir /var/lib/caddy --create-home --shell /usr/sbin/nologin caddy
      mkdir -p /etc/caddy/extra /srv/gastrogoan/sitios
      di "2/5 preparando la dirección de prueba"
      IP="$(curl -fsS --max-time 15 http://169.254.169.254/hetzner/v1/metadata/public-ipv4 2>>"$LOG" || true)"
      if [ -n "$IP" ]; then
        printf '%s\n' "${IP//./-}.sslip.io {" "	import reservas" "}" > /etc/caddy/extra/prueba.caddy
        di "   IP del servidor: $IP -> https://${IP//./-}.sslip.io"
      else
        di "   no se pudo leer la IP; la dirección de prueba no se crea (el servidor sigue)"
      fi
      di "3/5 descargando la web de reservas de GitHub"
      /usr/local/bin/gg-actualizar >>"$LOG" 2>&1 || di "   primera descarga fallida: el temporizador lo reintentará cada 5 minutos"
      di "4/5 arrancando Caddy"
      systemctl daemon-reload
      systemctl enable --now caddy >>"$LOG" 2>&1 || fallo "arrancar Caddy"
      di "5/5 temporizador de actualización"
      systemctl enable --now gg-actualizar.timer >>"$LOG" 2>&1 || fallo "temporizador"
      sleep 5
      if systemctl is-active --quiet caddy; then di "LISTO: Caddy en marcha. Abre https://${IP//./-}.sslip.io desde el móvil."; else fallo "Caddy no está activo"; fi
  - path: /etc/systemd/system/caddy.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Caddy (web de reservas de GastroGoan)
      After=network-online.target
      Wants=network-online.target
      [Service]
      User=caddy
      Group=caddy
      ExecStart=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
      ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      Restart=on-failure
      RestartSec=5
      LimitNOFILE=1048576
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/gg-actualizar.service
    permissions: '0644'
    content: |
      [Unit]
      Description=GastroGoan: bajar la última web de reservas de GitHub
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/gg-actualizar
  - path: /etc/systemd/system/gg-actualizar.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=GastroGoan: comprobar cada 5 minutos si hay web nueva
      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=5min
      Persistent=true
      [Install]
      WantedBy=timers.target
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
runcmd:
  - [ bash, -c, "ufw default deny incoming; ufw default allow outgoing; ufw allow 80/tcp; ufw allow 443/tcp; ufw allow 443/udp; ufw --force enable" ]
  - [ /usr/local/bin/gg-arranque ]

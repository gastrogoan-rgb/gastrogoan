<style>
/* Mismo sistema de diseño que la app y que admin-panel/app.html. */
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/schibsted-grotesk-400-normal.woff2") format("woff2");}
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/schibsted-grotesk-600-normal.woff2") format("woff2");}
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/schibsted-grotesk-700-normal.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/ibm-plex-mono-400-normal.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/ibm-plex-mono-500-normal.woff2") format("woff2");}
:root{
  --ink:#1C1A17; --olive:#4A5D4E; --cream:#F1EFE9; --bg:#FAF8F4; --surface:#FFFFFF; --border:#E7E2D9;
  --text:#1C1A17; --body:#3D3A34; --muted:#716C65; --brand-cream:#FAF8F4;
  --green:#4A5D4E; --green-l:#EDF1EC; --red:#8A4A3B; --red-l:#F5EBE7; --amber:#8A7440; --amber-l:#F5F0E3;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Schibsted Grotesk',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--body);min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:20px 20px 80px;display:flex;flex-direction:column;gap:16px}
header{background:var(--ink);color:#FAF8F4;padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .logo{width:40px;height:40px;background:var(--olive);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:none;font-family:'IBM Plex Mono',monospace}
header h1{font-family:'Schibsted Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:180px}
header .hd-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);padding:12px 18px;min-height:46px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;
     text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;background:#fff;color:var(--text)}
.btn:hover{background:var(--cream)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#FAF8F4}
.btn-primary:hover{background:var(--olive);border-color:var(--olive)}
.btn-sm{min-height:36px;padding:7px 12px;font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);padding:18px}
label{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--border);padding:11px;font-size:14px;font-family:inherit;background:#fff;min-height:46px;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.field{margin-bottom:12px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
.hidden{display:none!important}
#login-gate{max-width:420px;margin:60px auto}
#login-gate .card{display:flex;flex-direction:column;gap:12px}
.folder-tile{background:var(--surface);border:1px solid var(--border);padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px}
.folder-tile:hover{background:var(--cream)}
.folder-tile .avatar{width:38px;height:38px;background:var(--ink);color:#FAF8F4;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'IBM Plex Mono',monospace;flex:none}
.status-line{font-size:12.5px;color:var(--muted)}
.p360-toprow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.p360-card{flex:1;min-width:220px;background:#fff;border:1px solid var(--border);padding:16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:background-color .12s ease}
.p360-card:hover{background:var(--brand-cream)}
.p360-card i{font-size:22px;color:var(--ink);flex:none;margin-top:2px}
.p360-card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.p360-card p{font-size:12px;color:var(--muted)}
.p360-summary-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;cursor:pointer;min-height:44px}
.p360-summary-bar:hover{background:var(--brand-cream)}
.p360-summary-count{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted)}
.p360-week{margin-bottom:18px}
.p360-week-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.p360-week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.p360-day{background:#fff;border:1px solid var(--border);border-left:4px solid var(--border);padding:12px 10px;min-height:76px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;justify-content:center}
.p360-day:hover{background:var(--brand-cream)}
.p360-day-weekday{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.p360-day-date{font-size:15px;font-weight:700;overflow-wrap:break-word}
.p360-day-tag{font-size:10.5px;color:var(--muted);margin-top:2px}
.p360-day-progress{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px}
.p360-day-presencial{background:var(--ink);border-left-color:var(--ink);color:#fff}
.p360-day-presencial .p360-day-weekday,.p360-day-presencial .p360-day-tag{color:#fff;opacity:.75}
.p360-task-done .p360-task-text{text-decoration:line-through;color:var(--muted)}
</style>
</head>
<body>

<div id="login-gate" class="wrap">
  <div class="card">
    <h1 style="font-size:18px;margin-bottom:6px">🔑 Plan 360° — panel del coach</h1>
    <p class="muted" style="margin-bottom:14px">Archivo privado. Inicia sesión con tu email y contraseña de administrador.</p>
    <label>Email</label>
    <input id="login-email" type="email" placeholder="gastrogoan@gmail.com" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
    <label style="margin-top:10px">Contraseña</label>
    <input id="login-pass" type="password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" style="width:100%;margin-top:6px" onclick="doLogin()">Entrar</button>
    <p id="login-status" class="muted" style="margin-top:6px"></p>
  </div>
</div>

<div id="panel" class="wrap hidden">
  <header>
    <div class="logo">GG</div>
    <h1>Plan 360°<span style="display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#C9A15A;margin-top:4px">ARCHIVO PRIVADO</span></h1>
    <div class="hd-btns">
      <a class="btn" href="index.html">← Panel</a>
      <button class="btn" onclick="ggAdminHardReload()">↻ Actualizar</button>
      <button class="btn" onclick="doLogout()">Salir</button>
    </div>
  </header>

  <div id="view-list">
    <div class="card" style="margin-bottom:4px"><span class="muted">Clientes con Plan 360° activo. Aparecen solos en cuanto activan la casilla al emitirles el código.</span></div>
    <div id="client-list" style="display:flex;flex-direction:column;gap:8px"></div>
    <p id="client-list-empty" class="muted hidden">Todavía no hay ningún cliente con el Plan 360° activo.</p>
  </div>

  <div id="view-client" class="hidden">
    <button class="btn btn-sm" onclick="closeClient()">← Clientes</button>
    <h2 id="client-name" style="margin:10px 0 4px"></h2>
    <p id="client-status" class="status-line" style="margin-bottom:10px"></p>
    <div id="client-startdate" class="card" style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap"></div>
    <div id="client-grid"></div>
  </div>
</div>

<script>
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Sin service worker ni versión propia aquí: una URL con parámetro nuevo
// nunca tiene caché previa del navegador, así que fuerza una carga real.

// Marca "actividad nueva" comparando lo último que hizo el negocio
// (lastActivityAt, publicado por plan360PingActivity en js/core.js) con la
// última vez que TÚ abriste su ficha (guardado en este mismo navegador).
function plan360SeenKey(tenantId){ return 'gg_p360_seen_' + tenantId; }
async function loadClientList(){
  const snap = await getApp().database().ref('gastrogoan/coaching360').once('value');
  const val = snap.val() || {};
  const entries = Object.keys(val).map(tenantId => ({
    tenantId, name: val[tenantId].name || '(sin nombre)', lastActivityAt: val[tenantId].lastActivityAt || 0,
  }));
  entries.sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById('client-list-empty').classList.toggle('hidden', entries.length > 0);
  document.getElementById('client-list').innerHTML = entries.map(e => {
    const visto = Number(localStorage.getItem(plan360SeenKey(e.tenantId)) || 0);
    const nuevo = e.lastActivityAt > visto;
    return `<div class="folder-tile" onclick="openClient('${esc(e.tenantId)}','${esc(e.name)}')">
      <div class="avatar">${esc(e.name.slice(0,2).toUpperCase())}</div>
      <div style="flex:1"><strong>${esc(e.name)}</strong></div>
      ${nuevo ? '<span style="background:var(--olive);color:#fff;font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;flex:none">Nuevo</span>' : ''}
    </div>`;
  }).join('');
}

/* ============================================================
   CONEXIÓN A LA NUBE DE CADA NEGOCIO — se busca su configuración en
   tenantLookup (la publica su propia app al conectarse, ver publishTenantLookup
   en js/core.js) y se abre una instancia de Firebase aparte, con SU MISMA
   base de datos. Es el mismo mecanismo por el que la tablet y el móvil de un
   negocio ven los mismos datos: aquí este panel es un dispositivo más.
   ============================================================ */
let currentTenantId = null;
let currentBizRef = null;
let remoteBiz = null;
let savingRemote = false;
let lastPushedJson = null;

async function openClient(tenantId, name){
  try{ localStorage.setItem(plan360SeenKey(tenantId), String(Date.now())); }catch(e){}
  document.getElementById('view-list').classList.add('hidden');
  document.getElementById('view-client').classList.remove('hidden');
  document.getElementById('client-name').textContent = name;
  document.getElementById('client-status').textContent = 'Conectando con su nube...';
  document.getElementById('client-grid').innerHTML = '';
  startDateEditing = false;
  if(currentBizRef) currentBizRef.off();
  currentTenantId = tenantId;
  try{
    const lookupSnap = await getApp().database().ref('gastrogoan/tenantLookup/' + tenantId).once('value');
    const cfg = lookupSnap.val();
    if(!cfg || !cfg.apiKey || !cfg.databaseURL){
      document.getElementById('client-status').textContent = '⚠️ No se encontró la nube de este negocio (todavía no ha sincronizado ninguna vez).';
      return;
    }
    const appName = 'biz-' + tenantId;
    let bizApp;
    try{ bizApp = firebase.app(appName); }catch(e){ bizApp = firebase.initializeApp(cfg, appName); }
    if(!bizApp.auth().currentUser) await bizApp.auth().signInAnonymously();
    currentBizRef = bizApp.database().ref('gastrogoan/tenants/' + tenantId + '/db/business');
    currentBizRef.on('value', snap => {
      const val = snap.val();
      const json = JSON.stringify(val);
      if(json === lastPushedJson) return; // es el eco de lo que acabamos de escribir nosotros mismos
      remoteBiz = val || {};
      ensureRemotePlan360();
      document.getElementById('client-status').textContent = 'Conectado — los cambios se ven al instante en su app, y los suyos aquí.';
      renderClientGrid();
    }, err => {
      console.error(err);
      document.getElementById('client-status').textContent = '⚠️ Error de conexión: ' + (err.message || err.code || 'error');
    });
  }catch(e){
    console.error(e);
    document.getElementById('client-status').textContent = '⚠️ No se pudo conectar: ' + (e.message || e.code || 'error');
  }
}
function closeClient(){
  if(currentBizRef) currentBizRef.off();
  currentBizRef = null; currentTenantId = null; remoteBiz = null;
  document.getElementById('view-client').classList.add('hidden');
  document.getElementById('view-list').classList.remove('hidden');
  loadClientList();
}
// Firebase rechaza CUALQUIER escritura que contenga un valor undefined en
// cualquier parte del objeto — no solo ese campo, la escritura entera. Un
// solo dato mal formado en cualquier rincón (día, tarea, objetivo...)
// bastaba para que ESTA función fallara siempre, en silencio, sin que
// nada de lo que se guardara desde el panel llegara nunca a la nube.
function sinIndefinidos(v){
  if(v === undefined) return null;
  if(typeof v === 'number' && !Number.isFinite(v)) return null;
  if(v === null || typeof v !== 'object') return v;
  if(Array.isArray(v)) return Array.from(v, x => x === undefined ? null : sinIndefinidos(x));
  const out = {};
  Object.keys(v).forEach(k => { if(v[k] !== undefined) out[k] = sinIndefinidos(v[k]); });
  return out;
}
function saveRemoteBiz(){
  if(!currentBizRef || !remoteBiz) return;
  const limpio = sinIndefinidos(remoteBiz);
  const json = JSON.stringify(limpio);
  lastPushedJson = json;
  savingRemote = true;
  currentBizRef.set(limpio).catch(e => {
    console.error('Error guardando en la nube del negocio', e);
    alert('No se pudo guardar en la nube: ' + (e.message || e.code || 'error'));
  }).finally(() => { savingRemote = false; });
}

function plan360MisteryBlockAvg(block){
  const scored = block.items.filter(i => i.score !== null && i.score !== undefined && i.score !== '');
  if(!scored.length) return null;
  const sum = scored.reduce((s, i) => s + Number(i.score), 0);
  return Math.round((sum / scored.length) * 10) / 10;
}
function plan360MisteryOverallAvg(mc){
  const avgs = mc.blocks.map(plan360MisteryBlockAvg).filter(a => a !== null);
  if(!avgs.length) return null;
  return Math.round((avgs.reduce((s, a) => s + a, 0) / avgs.length) * 10) / 10;
}
function plan360FreshMisteryCheck(){
  return {
    blocks: PLAN360_MISTERY_BLOCKS.map(b => ({
      title: b.title,
      items: b.items.map(text => ({text, score: null})),
      openQuestions: (b.openQuestions || []).map(q => ({q, a: ''})),
    })),
    sentAt: null,
  };
}
// Reunión inicial con el hostelero: lo que el cliente siente y ve de su
// negocio, complementario a lo que observa el coach en el cliente
// misterioso. Pocas preguntas a propósito — es una conversación, no un
// formulario — para sacar el punto de dolor real.
const PLAN360_REUNION_PREGUNTAS = [
  'Si tuvieras que explicarle a un amigo, en una frase, qué le pasa a tu negocio ahora mismo, ¿qué le dirías?',
  'De todo lo que va mal, ¿qué es lo que de verdad te quita el sueño?',
  '¿Cuándo empezaste a notar que algo no iba bien, y qué crees que lo desencadenó?',
  '¿Qué has probado ya para arreglarlo, y por qué crees que no ha funcionado o no lo has llegado a hacer?',
  'Ahora mismo, ¿el negocio te da de comer a ti o tú le das de comer al negocio?',
  'Si nada cambia en los próximos 6 meses, ¿qué crees que va a pasar?',
  'Piensa en tu equipo: si pudieras cambiar una sola cosa de cómo trabaja tu gente, ¿qué cambiarías?',
  '¿Quién más tiene que estar de acuerdo con los cambios, y tú mismo vienes con ganas o porque ya no sabes qué más hacer?',
  '¿Cuánto quieres ganar limpio al mes, y cuántas horas quieres trabajar para conseguirlo?',
  'Dentro de un año, si esto sale bien, ¿qué es lo primero que notarías distinto en tu vida, no solo en el negocio?',
];
function plan360FreshReunionInicial(){
  return {
    answers: PLAN360_REUNION_PREGUNTAS.map(q => ({q, a: ''})),
    sentAt: null,
  };
}
function ensureRemotePlan360(){
  if(!Array.isArray(remoteBiz.plan360Docs) || !remoteBiz.plan360Docs.length){
    remoteBiz.plan360Docs = PLAN360_DOCS_TEMPLATE.map(d => ({id: d.id, title: d.title, body: '', visible: true}));
  }
  const intakeDesactualizado = remoteBiz.plan360Intake
    && Array.isArray(remoteBiz.plan360Intake.sections)
    && remoteBiz.plan360Intake.sections.map(s => s.title).join('|') !== PLAN360_INTAKE_TEMPLATE.map(s => s.title).join('|');
  if(!remoteBiz.plan360Intake || !Array.isArray(remoteBiz.plan360Intake.sections) || intakeDesactualizado){
    remoteBiz.plan360Intake = {sections: PLAN360_INTAKE_TEMPLATE.map(s => ({title: s.title, questions: s.questions.map(q => ({q, a: ''}))}))};
  }
  if(!Array.isArray(remoteBiz.plan360Program) || !remoteBiz.plan360Program.length){
    remoteBiz.plan360Program = PLAN360_DEFAULT_PROGRAM.map(d => {
      if(d.phase === 'presencial'){
        // ⚠️ Firebase rechaza CUALQUIER guardado con un undefined en
        // cualquier parte del objeto: el día 2 no lleva la clave en
        // absoluto (nunca "objectives: undefined"), o cualquier .set()
        // posterior de todo el negocio fallaba en silencio.
        const dia = {day: d.day, phase: 'presencial', title: d.title, notes: '', privateNote: ''};
        if(d.day === 1){
          dia.objectives = [];
          dia.misteryCheck = plan360FreshMisteryCheck();
          dia.reunionInicial = plan360FreshReunionInicial();
        }
        return dia;
      }
      return {day: d.day, phase: 'trabajo', title: d.title, priority: null, reviewType: null, tasks: [{text: d.task, done: false, note: '', fileData: null, fileName: null}]};
    });
  }
  // Migración: negocios cuyo día 1 se creó antes de que existiera el
  // checklist de cliente misterioso o la reunión inicial se quedarían sin
  // ellos para siempre.
  const dia1Existente = (remoteBiz.plan360Program || []).find(d => d.day === 1);
  if(dia1Existente && !dia1Existente.misteryCheck){
    dia1Existente.misteryCheck = plan360FreshMisteryCheck();
  }
  if(dia1Existente && !dia1Existente.reunionInicial){
    dia1Existente.reunionInicial = plan360FreshReunionInicial();
  }
  if(!remoteBiz.plan360StartDate) remoteBiz.plan360StartDate = todayStr();
  if(!remoteBiz.plan360Contract){
    remoteBiz.plan360Contract = {
      clienteNombre: '', clienteNIF: '', clienteDireccion: '', precio: '', formaPago: '',
      signedName: '', signedDNI: '', signedAt: null,
    };
  }
  if(remoteBiz.plan360WelcomeShown === undefined) remoteBiz.plan360WelcomeShown = false;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDaysStr(fechaStr, dias){
  const [y,m,d] = fechaStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + dias);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function plan360DateForDay(day){
  return addDaysStr(remoteBiz.plan360StartDate || todayStr(), day - 1);
}
function plan360FormatDate(day){
  const dstr = plan360DateForDay(day);
  const [y, m, d] = dstr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return {
    weekday: dt.toLocaleDateString('es-ES', {weekday: 'short'}),
    dayMonth: dt.toLocaleDateString('es-ES', {day: 'numeric', month: 'short'}),
  };
}
function plan360PriorityColor(p){ return p === 'alta' ? 'var(--red)' : p === 'media' ? 'var(--amber)' : p === 'baja' ? 'var(--green)' : null; }

function renderClientGrid(){
  renderStartDateControl();
  const prog = remoteBiz.plan360Program || [];
  const trabajo = prog.filter(d => d.phase === 'trabajo');
  const hechos = trabajo.reduce((n, d) => n + d.tasks.filter(x => x.done).length, 0);
  const totalTareas = trabajo.reduce((n, d) => n + d.tasks.length, 0);
  const semanas = [];
  prog.forEach(d => {
    const fecha = plan360DateForDay(d.day);
    const [y, m, dd] = fecha.split('-').map(Number);
    const diaSemana = (new Date(y, m - 1, dd).getDay() + 6) % 7;
    const inicioSemana = addDaysStr(fecha, -diaSemana);
    let semana = semanas.find(s => s.inicio === inicioSemana);
    if(!semana){ semana = {inicio: inicioSemana, dias: []}; semanas.push(semana); }
    semana.dias.push(d);
  });
  const dayCard = d => {
    const {weekday, dayMonth} = plan360FormatDate(d.day);
    if(d.phase === 'presencial'){
      return `<div class="p360-day p360-day-presencial" onclick="renderDayDetail(${d.day})">
        <div class="p360-day-weekday">${esc(weekday)}</div>
        <div class="p360-day-date">${esc(dayMonth)}</div>
        <div class="p360-day-tag">Presencial</div>
      </div>`;
    }
    const col = plan360PriorityColor(d.priority);
    const done = d.tasks.length && d.tasks.every(x => x.done);
    const doneCount = d.tasks.filter(x => x.done).length;
    return `<div class="p360-day" style="${col ? 'border-left-color:' + col : ''}" onclick="renderDayDetail(${d.day})">
      <div class="p360-day-weekday">${esc(weekday)}</div>
      <div class="p360-day-date">${esc(dayMonth)}</div>
      ${d.reviewType ? `<div class="p360-day-tag">${d.reviewType === 'presencial' ? 'Revisión presencial' : 'Reunión online'}</div>` : ''}
      ${d.tasks.length ? `<div class="p360-day-progress">${done ? '✓' : doneCount + '/' + d.tasks.length}</div>` : ''}
    </div>`;
  };
  document.getElementById('client-grid').innerHTML = `
    <div class="p360-toprow">
      <div class="p360-card" onclick="renderIntakePage()">
        <i class="ti ti-clipboard-text"></i>
        <div><h3>Documentación inicial</h3><p>Cuestionario para conocer el negocio antes de la primera visita</p></div>
      </div>
      <div class="p360-card" onclick="renderDocsPage()">
        <i class="ti ti-folder"></i>
        <div><h3>Recursos</h3><p>Identidad de marca, playbooks y demás documentos del programa</p></div>
      </div>
    </div>
    <div class="card p360-summary-bar" onclick="renderSummaryPage()">
      <div>Programa de 30 días</div>
      <div class="p360-summary-count">★ ${hechos} / ${totalTareas}</div>
    </div>
    ${semanas.map((s, i) => `
      <div class="p360-week">
        <div class="p360-week-label">Semana ${i + 1}</div>
        <div class="p360-week-grid">${s.dias.map(dayCard).join('')}</div>
      </div>
    `).join('')}
  `;
}

function saveObjetivos(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d) return;
  syncObjectivesFromForm(d);
  d.objectives = d.objectives.filter(o => o.text);
  const priv = document.getElementById('private-note');
  if(priv) d.privateNote = priv.value.trim();
  saveRemoteBiz();
  renderObjetivosPage(day);
}
/* ---- Reunión inicial: guion de 10 preguntas con dictado por voz ----
   La idea (pedida expresamente por el coach) es que él no tenga que estar
   escribiendo mientras habla con el hostelero: pulsa el micro, la respuesta
   se va transcribiendo sola en el recuadro con el reconocimiento de voz
   nativo del navegador (gratis, sin servidor), y queda editable por si el
   dictado se equivoca. Solo funciona bien en Chrome/Android; en Safari
   puede no estar disponible, así que el botón se oculta si el navegador no
   lo soporta y el recuadro sigue siendo editable a mano igualmente. */
function plan360SpeechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
let plan360ActiveRecognition = null;
let plan360ActiveRecognitionIdx = null;
function plan360ToggleDictado(idx){
  const btn = document.getElementById('reunion-mic-' + idx);
  const ta = document.getElementById('reunion-a-' + idx);
  if(!btn || !ta) return;
  if(plan360ActiveRecognition && plan360ActiveRecognitionIdx === idx){
    plan360ActiveRecognition.stop();
    return;
  }
  if(plan360ActiveRecognition){
    plan360ActiveRecognition.stop();
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'es-ES';
  rec.continuous = true;
  rec.interimResults = true;
  const base = ta.value ? ta.value.replace(/\s+$/, '') + ' ' : '';
  rec.onresult = (ev) => {
    let texto = '';
    for(let i = 0; i < ev.results.length; i++){
      texto += ev.results[i][0].transcript;
    }
    ta.value = base + texto;
  };
  rec.onerror = () => {
    btn.classList.remove('btn-primary');
    btn.innerHTML = '<i class="ti ti-microphone"></i>';
    plan360ActiveRecognition = null;
    plan360ActiveRecognitionIdx = null;
  };
  rec.onend = () => {
    btn.classList.remove('btn-primary');
    btn.innerHTML = '<i class="ti ti-microphone"></i>';
    plan360ActiveRecognition = null;
    plan360ActiveRecognitionIdx = null;
  };
  rec.start();
  plan360ActiveRecognition = rec;
  plan360ActiveRecognitionIdx = idx;
  btn.classList.add('btn-primary');
  btn.innerHTML = '<i class="ti ti-player-stop"></i>';
}
function renderReunionPage(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d || !d.reunionInicial) return;
  const r = d.reunionInicial;
  const soporte = plan360SpeechSupported();
  document.getElementById('client-grid').innerHTML = `
    <button class="btn btn-sm" onclick="renderDayDetail(${day})">← Día 1</button>
    <h2 style="margin:10px 0 4px">Reunión inicial con el hostelero</h2>
    <p class="muted" style="margin-bottom:14px">Unas pocas preguntas de mucho valor para entender lo que él siente y ve de su negocio — complementa al cliente misterioso.</p>
    ${!soporte ? '<p class="muted" style="margin-bottom:10px">Este navegador no permite dictado por voz — escribe a mano.</p>' : ''}
    <div class="card">
      ${r.answers.map((it, i) => `
        <div class="field" style="margin-bottom:16px">
          <label>${i + 1}. ${esc(it.q)}</label>
          <div style="display:flex;gap:8px;align-items:flex-start">
            <textarea id="reunion-a-${i}" rows="3" style="flex:1">${esc(it.a || '')}</textarea>
            ${soporte ? `<button type="button" id="reunion-mic-${i}" class="btn btn-sm" style="flex-shrink:0" onclick="plan360ToggleDictado(${i})"><i class="ti ti-microphone"></i></button>` : ''}
          </div>
        </div>
      `).join('')}
      <button class="btn btn-sm" onclick="saveReunion(${day})" style="margin-bottom:10px">Guardar</button>
      ${!r.sentAt ? `<button class="btn btn-primary" onclick="sendReunion(${day})" style="display:block">Enviar al negocio</button>` : '<p class="muted">Ya enviada al negocio — se puede seguir editando y se actualiza en su pantalla.</p>'}
    </div>
  `;
}
function syncReunionFromForm(d){
  d.reunionInicial.answers.forEach((it, i) => {
    const ta = document.getElementById('reunion-a-' + i);
    if(ta) it.a = ta.value.trim();
  });
}
function saveReunion(day){
  if(plan360ActiveRecognition) plan360ActiveRecognition.stop();
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d || !d.reunionInicial) return;
  syncReunionFromForm(d);
  saveRemoteBiz();
  renderReunionPage(day);
}
function sendReunion(day){
  if(!confirm('¿Enviar la reunión inicial al negocio? A partir de ahora la verá en su pantalla (y se actualizará si la sigues editando).')) return;
  if(plan360ActiveRecognition) plan360ActiveRecognition.stop();
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d || !d.reunionInicial) return;
  syncReunionFromForm(d);
  d.reunionInicial.sentAt = Date.now();
  saveRemoteBiz();
  renderReunionPage(day);
}
/* ---- Cliente misterioso: 14 bloques, una pantalla cada uno ---- */
function renderMisteryHub(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d || !d.misteryCheck) return;
  const mc = d.misteryCheck;
  const media = plan360MisteryOverallAvg(mc);
  document.getElementById('client-grid').innerHTML = `
    <button class="btn btn-sm" onclick="renderDayDetail(${day})">← Día ${day}</button>
    <h2 style="margin:10px 0 4px">Cliente misterioso</h2>
    <p class="muted" style="margin-bottom:14px">Puntúa cada bloque; la nota del bloque y la nota final se calculan solas.</p>
    ${mc.sentAt ? `<div class="card" style="background:var(--green-l);border-color:var(--green);margin-bottom:14px">✓ Enviado al negocio el ${esc(new Date(mc.sentAt).toLocaleString('es-ES'))}</div>` : ''}
    ${mc.blocks.map((b, bi) => {
      const avg = plan360MisteryBlockAvg(b);
      return `<div class="card" style="margin-bottom:8px;cursor:pointer" onclick="renderMisteryBlockPage(${day},${bi})">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="flex:1"><strong>${esc(b.title)}</strong></div>
          <div class="p360-day-tag" style="margin:0;flex:none">${avg !== null ? avg + '/10' : 'Sin empezar'}</div>
          <i class="ti ti-chevron-right"></i>
        </div>
      </div>`;
    }).join('')}
    <div class="card" style="margin-top:14px;text-align:center">
      <div style="font-weight:700;margin-bottom:6px">Nota media del local</div>
      <div style="font-size:28px;font-weight:700">${media !== null ? media + '/10' : '—'}</div>
      ${!mc.sentAt ? `<button class="btn btn-primary" style="margin-top:10px" onclick="sendMisteryCheck(${day})">Enviar diagnóstico al negocio</button>
        <p class="muted" style="margin-top:8px">El negocio verá el informe entero, tal cual, con todas las notas.</p>` : ''}
    </div>
  `;
}
function renderMisteryBlockPage(day, blockIdx){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  const b = d.misteryCheck.blocks[blockIdx];
  document.getElementById('client-grid').innerHTML = `
    <button class="btn btn-sm" onclick="renderMisteryHub(${day})">← Cliente misterioso</button>
    <h2 style="margin:10px 0 4px">${esc(b.title)}</h2>
    <div class="card" style="margin-top:14px">
      ${b.items.map((it, i) => `
        <div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;font-size:13.5px">${esc(it.text)}</div>
          <select id="mi-score-${i}" style="width:auto;min-width:64px;flex:none">
            <option value="">—</option>
            ${Array.from({length: 11}, (_, n) => n).map(n => `<option value="${n}" ${it.score === n ? 'selected' : ''}>${n}</option>`).join('')}
          </select>
        </div>
      `).join('')}
      <div class="field" style="margin-top:6px"><label>Comentario del bloque (opcional)</label><textarea id="mi-comment" rows="2">${esc(b.comment || '')}</textarea></div>
      ${(b.openQuestions || []).map((q, qi) => `
        <div class="field" style="margin-top:10px"><label>${esc(q.q)}</label><textarea id="mi-open-${qi}" rows="3">${esc(q.a)}</textarea></div>
      `).join('')}
      <button class="btn btn-primary" style="margin-top:14px" onclick="saveMisteryBlock(${day},${blockIdx})">Guardar</button>
    </div>
  `;
}
function saveMisteryBlock(day, blockIdx){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  const b = d.misteryCheck.blocks[blockIdx];
  b.items.forEach((it, i) => {
    const val = document.getElementById('mi-score-' + i).value;
    it.score = val === '' ? null : Number(val);
  });
  b.comment = (document.getElementById('mi-comment').value || '').trim();
  (b.openQuestions || []).forEach((q, qi) => { q.a = (document.getElementById('mi-open-' + qi).value || '').trim(); });
  saveRemoteBiz();
  renderMisteryHub(day);
}
function sendMisteryCheck(day){
  if(!confirm('¿Enviar el diagnóstico? El negocio verá el informe entero, con todas las notas, en su propia app.')) return;
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  d.misteryCheck.sentAt = Date.now();
  saveRemoteBiz();
  renderMisteryHub(day);
}
function addObjective(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d || !Array.isArray(d.objectives)) return;
  syncObjectivesFromForm(d);
  d.objectives.push({text: '', priority: 'media', done: false});
  document.getElementById('obj-list').innerHTML = d.objectives.map((o, i) => objRow(o, i)).join('');
}
function syncObjectivesFromForm(d){
  d.objectives.forEach((o, i) => {
    const t = document.getElementById('obj-text-' + i), p = document.getElementById('obj-prio-' + i);
    if(t) o.text = t.value.trim();
    if(p) o.priority = p.value;
  });
}
function savePresencial(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d) return;
  if(Array.isArray(d.objectives)){
    syncObjectivesFromForm(d);
    d.objectives = d.objectives.filter(o => o.text);
    const priv = document.getElementById('private-note');
    if(priv) d.privateNote = priv.value.trim();
  }
  d.notes = (document.getElementById('pres-notes').value || '').trim();
  saveRemoteBiz();
  renderClientGrid();
}

/* ---- Días de trabajo ---- */
const PLAN360_MAX_FILE_BYTES = 350 * 1024;
function taskRow(tk, i){
  return `<div class="card p360-task-row${tk.done ? ' p360-task-done' : ''}" id="task-row-${i}" style="padding:10px;margin-bottom:8px">
    <div style="display:flex;gap:8px;align-items:flex-start">
      <i class="ti ${tk.done ? 'ti-circle-check' : 'ti-circle'}" id="task-icon-${i}" data-done="${tk.done ? '1' : '0'}" onclick="toggleTask(${i})" style="cursor:pointer;font-size:24px;flex:none;margin-top:2px;color:${tk.done ? 'var(--green)' : 'var(--border)'}"></i>
      <textarea id="task-text-${i}" class="p360-task-text" rows="2" style="flex:1">${esc(tk.text)}</textarea>
    </div>
    <div class="field" style="margin:6px 0 0"><label>Comentario</label><textarea id="task-note-${i}" rows="2">${esc(tk.note || '')}</textarea></div>
    <div style="margin-top:6px;font-size:12px;color:var(--muted)">
      <input type="file" id="task-file-${i}" accept="image/*,.pdf" style="width:auto">
      ${tk.fileName ? esc(tk.fileName) + ' <a href="#" onclick="event.preventDefault();document.getElementById(\'task-file-clear-' + i + '\').value=\'1\'">Eliminar</a><input type="hidden" id="task-file-clear-' + i + '">' : ''}
    </div>
  </div>`;
}
function renderTrabajoPage(d){
  const {weekday, dayMonth} = plan360FormatDate(d.day);
  document.getElementById('client-grid').innerHTML = `
    ${plan360PageHeader(d.title, weekday + ' · ' + dayMonth)}
    <div class="card" style="margin-top:14px">
      <div class="field"><label>Título del día</label><input id="day-title" value="${esc(d.title)}"></div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <div class="field" style="flex:1;margin-bottom:0"><label>Prioridad</label>
          <select id="day-priority">
            <option value="" ${!d.priority?'selected':''}>—</option>
            <option value="alta" ${d.priority==='alta'?'selected':''}>Alta</option>
            <option value="media" ${d.priority==='media'?'selected':''}>Media</option>
            <option value="baja" ${d.priority==='baja'?'selected':''}>Baja</option>
          </select>
        </div>
        <div class="field" style="flex:1;margin-bottom:0"><label>Tipo de revisión</label>
          <select id="day-reviewtype">
            <option value="" ${!d.reviewType?'selected':''}>—</option>
            <option value="presencial" ${d.reviewType==='presencial'?'selected':''}>Revisión presencial</option>
            <option value="online" ${d.reviewType==='online'?'selected':''}>Reunión online</option>
          </select>
        </div>
      </div>
      <div style="font-weight:600;margin-bottom:6px">Tareas</div>
      <div id="task-list">${d.tasks.map((tk, i) => taskRow(tk, i)).join('')}</div>
      <button class="btn btn-sm" onclick="addTask(${d.day})" style="margin:6px 0 16px">+ Añadir tarea</button>
      <button class="btn btn-primary" onclick="saveTrabajo(${d.day})">Guardar</button>
    </div>
  `;
}
function addTask(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d) return;
  syncTasksFromForm(d);
  d.tasks.push({text: '', done: false, note: '', fileData: null, fileName: null});
  document.getElementById('task-list').innerHTML = d.tasks.map((tk, i) => taskRow(tk, i)).join('');
}
function toggleTask(i){
  const icon = document.getElementById('task-icon-' + i);
  const row = document.getElementById('task-row-' + i);
  if(!icon || !row) return;
  const done = icon.dataset.done !== '1';
  icon.dataset.done = done ? '1' : '0';
  icon.className = 'ti ' + (done ? 'ti-circle-check' : 'ti-circle');
  icon.style.color = done ? 'var(--green)' : 'var(--border)';
  row.classList.toggle('p360-task-done', done);
}
function syncTasksFromForm(d){
  d.tasks.forEach((tk, i) => {
    const t = document.getElementById('task-text-' + i), dn = document.getElementById('task-icon-' + i),
          n = document.getElementById('task-note-' + i), cl = document.getElementById('task-file-clear-' + i);
    if(t) tk.text = t.value.trim();
    if(dn) tk.done = dn.dataset.done === '1';
    if(n) tk.note = n.value.trim();
    if(cl && cl.value === '1'){ tk.fileData = null; tk.fileName = null; }
  });
}
function readFileAsDataUrl(file){
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}
async function saveTrabajo(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d) return;
  d.title = (document.getElementById('day-title').value || '').trim() || d.title;
  d.priority = document.getElementById('day-priority').value || null;
  d.reviewType = document.getElementById('day-reviewtype').value || null;
  syncTasksFromForm(d);
  d.tasks = d.tasks.filter(tk => tk.text);
  for(let i = 0; i < d.tasks.length; i++){
    const fileEl = document.getElementById('task-file-' + i);
    const file = fileEl && fileEl.files && fileEl.files[0];
    if(!file) continue;
    if(file.size > PLAN360_MAX_FILE_BYTES){ alert('El archivo pesa demasiado (máx. 350 KB)'); continue; }
    d.tasks[i].fileData = await readFileAsDataUrl(file);
    d.tasks[i].fileName = file.name;
  }
  saveRemoteBiz();
  renderClientGrid();
}

/* ---- Resumen ---- */
function renderSummaryPage(){
  const prog = remoteBiz.plan360Program || [];
  const dia1 = prog.find(x => x.day === 1);
  const objetivos = (dia1 && dia1.objectives) || [];
  const trabajo = prog.filter(x => x.phase === 'trabajo');
  const tareas = trabajo.reduce((arr, d) => arr.concat(d.tasks.map(tk => ({...tk, day: d.day}))), []);
  const hechas = tareas.filter(tk => tk.done);
  const pendientes = tareas.filter(tk => !tk.done);
  document.getElementById('client-grid').innerHTML = `
    ${plan360PageHeader('★ Resumen del programa')}
    <div class="card" style="margin-top:14px">
      <div style="font-weight:600;margin-bottom:6px">Objetivos</div>
      ${objetivos.length ? objetivos.map(o => `
        <div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
          <span>${o.done ? '✓' : '○'}</span><span style="flex:1">${esc(o.text)}</span>
          <span style="font-size:11px;color:${plan360PriorityColor(o.priority) || 'var(--muted)'}">${esc(o.priority||'')}</span>
        </div>`).join('') : '<p class="muted">Todavía no hay objetivos definidos</p>'}
      <div style="font-weight:600;margin:14px 0 6px">Tareas completadas (${hechas.length}/${tareas.length})</div>
      ${pendientes.length ? `<div style="font-weight:600;margin:10px 0 6px;color:var(--muted);font-size:12px">Pendientes</div>
        ${pendientes.map(tk => `<div style="padding:4px 0;font-size:13px">${esc(plan360FormatDate(tk.day).dayMonth)} — ${esc(tk.text)}</div>`).join('')}` : ''}
    </div>
  `;
}
</script>
</body>

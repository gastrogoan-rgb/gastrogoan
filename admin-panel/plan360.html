/* ---- Reunión inicial: guion de 10 preguntas con dictado por voz ----
   La idea (pedida expresamente por el coach) es que él no tenga que estar
   escribiendo mientras habla con el hostelero: pulsa el micro, la respuesta
   se va transcribiendo sola en el recuadro con el reconocimiento de voz
   nativo del navegador (gratis, sin servidor), y queda editable por si el
   dictado se equivoca. Solo funciona bien en Chrome/Android; en Safari
   puede no estar disponible, así que el botón se oculta si el navegador no
   lo soporta y el recuadro sigue siendo editable a mano igualmente. */
function plan360SpeechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
let plan360ActiveRecognition = null;
let plan360ActiveRecognitionIdx = null;
let plan360DictadoParar = false;
// ⚠️ El primer intento usaba continuous:true, y en Chrome/Android ESE modo
// concreto tiene un fallo conocido del propio navegador (no del código):
// cada nuevo tramo de voz reescribe el reconocimiento entero desde el
// principio, así que el texto se iba doblando ("puespues quepues que...").
// La solución que de verdad funciona en Android es la contraria: sesiones
// CORTAS (continuous:false, una frase y termina sola) que se relanzan
// automáticamente en cuanto acaban — el coach no nota el corte, pero cada
// frase llega limpia porque nace en un reconocimiento nuevo, no reescrito.
function plan360ToggleDictado(idx, grupo){
  grupo = grupo || 'reunion';
  const clave = grupo + ':' + idx;
  const btn = document.getElementById(grupo + '-mic-' + idx);
  const ta = document.getElementById(grupo + '-a-' + idx);
  if(!btn || !ta) return;
  if(plan360ActiveRecognition && plan360ActiveRecognitionIdx === clave){
    plan360DictadoParar = true;
    plan360ActiveRecognition.stop();
    return;
  }
  if(plan360ActiveRecognition){
    plan360DictadoParar = true;
    plan360ActiveRecognition.stop();
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let acumulado = ta.value ? ta.value.replace(/\s+$/, '') + ' ' : '';
  plan360DictadoParar = false;
  plan360ActiveRecognitionIdx = clave;
  const lanzarSesion = () => {
    const rec = new SR();
    rec.lang = 'es-ES';
    rec.continuous = false;
    rec.interimResults = true;
    rec.onresult = (ev) => {
      let interino = '';
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const tramo = ev.results[i][0].transcript;
        if(ev.results[i].isFinal) acumulado += tramo.trim() + ' ';
        else interino += tramo;
      }
      ta.value = acumulado + interino;
    };
    rec.onerror = (e) => {
      // 'no-speech' salta con cualquier silencio entre frases — normal,
      // no hay que cortar el dictado por eso, se relanza en onend.
      if(e.error !== 'no-speech' && e.error !== 'aborted') plan360DictadoParar = true;
    };
    rec.onend = () => {
      ta.value = acumulado.trim();
      if(plan360DictadoParar || plan360ActiveRecognitionIdx !== clave){
        btn.classList.remove('btn-primary');
        btn.innerHTML = '<i class="ti ti-microphone"></i>';
        plan360ActiveRecognition = null;

  {categoria: 'Delivery', titulo: 'Actualizar fichas en la plataforma', descripcion: 'Revisa que las fotos y descripciones de los platos en Glovo/Uber Eats/Just Eat estén actualizadas y sean atractivas.', metrica: 'Nº de platos actualizados'},
  {categoria: 'Delivery', titulo: 'Reducir tiempo de preparación de pedidos online', descripcion: 'Cronometra el tiempo real desde que llega el pedido hasta que sale, durante una semana.', metrica: 'Minutos medios de preparación'},
  {categoria: 'Cliente', titulo: 'Mapa del recorrido del cliente', descripcion: 'Dibuja, aunque sea a mano, todos los puntos de contacto del cliente desde que ve el negocio hasta que se va, y marca los 2 peores momentos.', metrica: 'Nº de puntos de fricción detectados'},
  {categoria: 'Cliente', titulo: 'Programa de clientes recurrentes', descripcion: 'Diseña algo simple (tarjeta de sellos, descuento a la 5ª visita...) para premiar a quien repite.', metrica: 'Nº de clientes recurrentes identificados'},
  {categoria: 'Cliente', titulo: 'Revisar quejas de los últimos 3 meses', descripcion: 'Lee todas las quejas o reseñas negativas de los últimos 3 meses y saca el patrón más repetido.', metrica: 'Patrón principal identificado'},
  {categoria: 'Cliente', titulo: 'Mistery check interno', descripcion: 'Que alguien del equipo (o el propio dueño) viva la experiencia como cliente un día y anote 3 cosas a mejorar.', metrica: 'Nº de mejoras detectadas'},
];
function plan360BancoCategorias(){
  return [...new Set(PLAN360_CONTENT_BANK.map(m => m.categoria))];
}
function plan360BancoModulosHtml(categoria){
  const usados = new Set((plan360TrabajoDiaActivo.tasks || []).map(tk => tk.title));
  return PLAN360_CONTENT_BANK
    .map((m, idx) => ({m, idx}))
    .filter(({m}) => !categoria || m.categoria === categoria)
    .map(({m, idx}) => `<button class="btn btn-sm" ${usados.has(m.titulo) ? 'disabled title="Ya está en este día"' : `onclick="addTaskDesdeBanco(${idx})"`}>${esc(m.titulo)}</button>`)
    .join('');
}
function cambiarBancoCategoria(){
  const sel = document.getElementById('banco-categoria');
  document.getElementById('banco-modulos').innerHTML = plan360BancoModulosHtml(sel.value);
}
function addTaskDesdeBanco(idx){
  const d = plan360TrabajoDiaActivo;
  if(!d) return;
  syncTasksFromForm(d);
  const m = PLAN360_CONTENT_BANK[idx];
  d.tasks.push({id: plan360GenId(), objectiveId: null, title: m.titulo, description: m.descripcion + (m.metrica ? `\n\nMétrica sugerida: ${m.metrica}` : ''), status: 'pendiente', note: '', fileData: null, fileName: null});
  document.getElementById('task-list').innerHTML = d.tasks.map((tk, i) => taskRow(tk, i)).join('');
  const sel = document.getElementById('banco-categoria');
  document.getElementById('banco-modulos').innerHTML = plan360BancoModulosHtml(sel ? sel.value : '');
}
const PLAN360_MAX_FILE_BYTES = 350 * 1024;
const PLAN360_TASK_ESTADO_LABEL = {pendiente: 'Pendiente', hecha: 'Hecha', no_hecha: 'No hecha'};
const PLAN360_TASK_ESTADO_COLOR = {pendiente: 'var(--muted)', hecha: 'var(--green)', no_hecha: 'var(--red)'};
function plan360ObjetivosDelDia2(){
  const dia2 = (remoteBiz.plan360Program || []).find(x => x.day === 2);
  return ((dia2 && dia2.objectives) || []).filter(o => o.titulo);
}
function taskRow(tk, i){
  const objetivos = plan360ObjetivosDelDia2();
  const estado = tk.status || 'pendiente';
  return `<div class="card" id="task-row-${i}" style="padding:10px;margin-bottom:8px">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <select id="task-objetivo-${i}" style="flex:1">
        <option value="">— Sin objetivo —</option>
        ${objetivos.map(o => `<option value="${o.id}" ${tk.objectiveId === o.id ? 'selected' : ''}>${esc(o.titulo)}</option>`).join('')}
      </select>
      <span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;background:${PLAN360_TASK_ESTADO_COLOR[estado]};white-space:nowrap">${PLAN360_TASK_ESTADO_LABEL[estado]}</span>
      <button class="btn btn-sm btn-icon" onclick="borrarTask(${i})" title="Quitar tarea"><i class="ti ti-trash"></i></button>
    </div>
    <div class="field" style="margin-bottom:8px"><label>Título</label><input id="task-title-${i}" value="${esc(tk.title)}" placeholder="Qué hay que hacer"></div>
    <div class="field" style="margin-bottom:8px"><label>Descripción</label><textarea id="task-desc-${i}" rows="3" placeholder="Por qué / cómo se hace">${esc(tk.description || '')}</textarea></div>
    ${tk.note ? `<div class="field" style="margin-bottom:8px"><label>Nota del negocio</label><p style="font-size:13px;margin:0;padding:8px;background:var(--brand-cream);border-radius:6px">${esc(tk.note)}</p></div>` : ''}
    <div style="font-size:12px;color:var(--muted)">
      <input type="file" id="task-file-${i}" accept="image/*,.pdf" style="width:auto">
      ${tk.fileName ? esc(tk.fileName) + ' <a href="#" onclick="event.preventDefault();document.getElementById(\'task-file-clear-' + i + '\').value=\'1\'">Eliminar</a><input type="hidden" id="task-file-clear-' + i + '">' : ''}
    </div>
  </div>`;
}
function renderTrabajoPage(d){
  plan360TrabajoDiaActivo = d;
  const {weekday, dayMonth} = plan360FormatDate(d.day);
  document.getElementById('client-grid').innerHTML = `
    ${plan360PageHeader(d.title, weekday + ' · ' + dayMonth)}
    <div class="card" style="margin-top:14px">
      <div class="field"><label>Título del día</label><input id="day-title" value="${esc(d.title)}"></div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <div class="field" style="flex:1;margin-bottom:0"><label>Prioridad</label>
          <select id="day-priority">
            <option value="" ${!d.priority?'selected':''}>—</option>
            <option value="alta" ${d.priority==='alta'?'selected':''}>Alta</option>
            <option value="media" ${d.priority==='media'?'selected':''}>Media</option>
            <option value="baja" ${d.priority==='baja'?'selected':''}>Baja</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Reunión de este día</label>
        <select id="day-reunion-tipo" onchange="cambiarReunionTipo(${d.day}, this.value)">
          <option value="" ${!d.reunion?'selected':''}>Sin reunión</option>
          <option value="presencial" ${d.reunion && d.reunion.tipo==='presencial'?'selected':''}>Presencial</option>
          <option value="online" ${d.reunion && d.reunion.tipo==='online'?'selected':''}>Online</option>
        </select>
      </div>
      ${d.reunion ? `
        <div class="card" style="margin-bottom:10px;background:var(--brand-cream)">
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Agenda — qué objetivos se revisan</div>
          ${plan360ObjetivosDelDia2().length ? plan360ObjetivosDelDia2().map(o => `
            <label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer">
              <input type="checkbox" ${d.reunion.objectiveIds.includes(o.id)?'checked':''} onchange="toggleReunionObjetivo(${d.day},${o.id},this.checked)">
              <span>${esc(o.titulo)}</span>
            </label>
          `).join('') : '<p class="muted" style="margin:0">Todavía no hay objetivos en el Día 2.</p>'}
          <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
            <span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;background:${d.reunion.hecha?'var(--green)':'var(--muted)'}">${d.reunion.hecha?'Hecha':'Pendiente'}</span>
            ${d.reunion.notas ? `<p style="font-size:13px;margin:8px 0 0">${esc(d.reunion.notas)}</p>` : '<p class="muted" style="font-size:12px;margin:8px 0 0">Todavía sin notas del negocio.</p>'}
          </div>
        </div>
      ` : ''}
      <div style="font-weight:600;margin-bottom:6px">Tareas</div>
      ${!plan360ObjetivosDelDia2().length ? `<p class="muted" style="margin-bottom:10px">Todavía no hay objetivos fijados en el Día 2 — las tareas se pueden crear igual, pero sin enganchar a ninguno hasta que el negocio los ponga.</p>` : ''}
      <div class="card" style="margin-bottom:10px;background:var(--brand-cream)">
        <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Banco de contenido — un toque para añadirla a este día (luego se puede editar como cualquier otra)</div>
        <select id="banco-categoria" onchange="cambiarBancoCategoria()" style="margin-bottom:8px">
          <option value="">Todas las categorías</option>
          ${plan360BancoCategorias().map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
        </select>
        <div id="banco-modulos" style="display:flex;flex-wrap:wrap;gap:6px">${plan360BancoModulosHtml('')}</div>
      </div>
      <div id="task-list">${d.tasks.map((tk, i) => taskRow(tk, i)).join('')}</div>
      <button class="btn btn-sm" onclick="addTask(${d.day})" style="margin:6px 0 16px">+ Añadir tarea (especial de este local)</button>
      <button class="btn btn-primary" onclick="saveTrabajo(${d.day})">Guardar</button>
    </div>
  `;
}
function addTask(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d) return;
  syncTasksFromForm(d);
  d.tasks.push({id: plan360GenId(), objectiveId: null, title: '', description: '', status: 'pendiente', note: '', fileData: null, fileName: null});
  document.getElementById('task-list').innerHTML = d.tasks.map((tk, i) => taskRow(tk, i)).join('');
}
function borrarTask(i){
  if(!plan360TrabajoDiaActivo) return;
  syncTasksFromForm(plan360TrabajoDiaActivo);
  plan360TrabajoDiaActivo.tasks.splice(i, 1);
  document.getElementById('task-list').innerHTML = plan360TrabajoDiaActivo.tasks.map((tk, i2) => taskRow(tk, i2)).join('');
  const sel = document.getElementById('banco-categoria');
  const banco = document.getElementById('banco-modulos');
  if(banco) banco.innerHTML = plan360BancoModulosHtml(sel ? sel.value : '');
}
function syncTasksFromForm(d){
  d.tasks.forEach((tk, i) => {
    const obj = document.getElementById('task-objetivo-' + i), ti = document.getElementById('task-title-' + i),
          de = document.getElementById('task-desc-' + i), cl = document.getElementById('task-file-clear-' + i);
    if(obj) tk.objectiveId = obj.value ? Number(obj.value) : null;
    if(ti) tk.title = ti.value.trim();
    if(de) tk.description = de.value.trim();
    if(cl && cl.value === '1'){ tk.fileData = null; tk.fileName = null; }
  });
}
function readFileAsDataUrl(file){
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}
let plan360TrabajoDiaActivo = null;
// La reunión se guarda al momento (cambiarReunionTipo/toggleReunionObjetivo),
// no espera al botón Guardar general — así el select y los checks de la
// agenda no se pierden si el coach navega a otro día antes de guardar.
function cambiarReunionTipo(day, tipo){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d) return;
  d.reunion = tipo ? (d.reunion ? {...d.reunion, tipo} : {tipo, objectiveIds: [], notas: '', hecha: false, completadaAt: null}) : null;
  saveRemoteBiz();
  renderTrabajoPage(d);
}
function toggleReunionObjetivo(day, objId, checked){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d || !d.reunion) return;
  const set = new Set(d.reunion.objectiveIds || []);
  if(checked) set.add(objId); else set.delete(objId);
  d.reunion.objectiveIds = [...set];
  saveRemoteBiz();
}
async function saveTrabajo(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d) return;
  d.title = (document.getElementById('day-title').value || '').trim() || d.title;
  d.priority = document.getElementById('day-priority').value || null;
  syncTasksFromForm(d);
  // Los archivos se leen ANTES de quitar las tareas vacías: los inputs van
  // numerados por la posición en pantalla, y filtrar primero corría las
  // posiciones — el adjunto de la tarea 3 acababa en la 2.
  for(let i = 0; i < d.tasks.length; i++){
    const fileEl = document.getElementById('task-file-' + i);
    const file = fileEl && fileEl.files && fileEl.files[0];
    if(!file) continue;
    if(file.size > PLAN360_MAX_FILE_BYTES){ alert('El archivo pesa demasiado (máx. 350 KB)'); continue; }
    d.tasks[i].fileData = await readFileAsDataUrl(file);
    d.tasks[i].fileName = file.name;
  }
  const sinTitulo = d.tasks.filter(tk => !tk.title && (tk.description || tk.fileName)).length;
  d.tasks = d.tasks.filter(tk => tk.title);
  if(sinTitulo) alert(sinTitulo === 1 ? 'Una tarea sin título no se ha guardado: ponle título para que el negocio la vea.' : sinTitulo + ' tareas sin título no se han guardado: ponles título para que el negocio las vea.');
  saveRemoteBiz();
  renderClientGrid();
}

/* ---- Resumen: ahora agrupado por objetivo, no solo por hecha/pendiente —
   es la vista que deja ver de un vistazo si el trabajo de las 4 semanas
   está repartido de verdad entre los objetivos del Día 2, o si alguno se
   ha quedado sin ninguna tarea detrás. ---- */
// Mismo cálculo que plan360MedicionesResumenHtml en js/app.js (que el
// negocio ve en su propia app): primer valor vs. último, para que tú
// también veas si el objetivo se mueve de verdad, no solo si hay tareas
// tachadas debajo.
function plan360MedicionesResumenHtml(obj){
  if(!obj.metrica) return '';
  const m = obj.mediciones || [];
  if(!m.length) return `<p class="muted" style="margin:0 0 6px;font-size:12.5px">${esc(obj.metrica)} — todavía sin ninguna medición</p>`;
  const primero = m[0], ultimo = m[m.length - 1];
  return `<div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">
    ${esc(obj.metrica)}: ${m.length > 1 ? `<strong style="color:var(--text)">${esc(primero.valor)}</strong> → ` : ''}<strong style="color:var(--text)">${esc(ultimo.valor)}</strong> <span>(${esc(ultimo.fecha)})</span>
  </div>`;
}
function renderSummaryPage(){
  const prog = remoteBiz.plan360Program || [];
  const dia2 = prog.find(x => x.day === 2);
  const orden = {prioritario: 0, esencial: 1, complementario: 2};
  const objetivos = ((dia2 && dia2.objectives) || []).filter(o => o.titulo).slice().sort((a, b) => (orden[a.prioridad] ?? 1) - (orden[b.prioridad] ?? 1));
  const trabajo = prog.filter(x => x.phase === 'trabajo');
  const tareas = trabajo.reduce((arr, d) => arr.concat(d.tasks.filter(tk => tk.title).map(tk => ({...tk, day: d.day}))), []);
  const hechas = tareas.filter(tk => tk.status === 'hecha');
  const grupos = objetivos.map(o => ({obj: o, tareas: tareas.filter(tk => tk.objectiveId === o.id)}));
  const sinObjetivo = tareas.filter(tk => !tk.objectiveId || !objetivos.some(o => o.id === tk.objectiveId));
  const tareaLinea = tk => `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px">
    <span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;background:${PLAN360_TASK_ESTADO_COLOR[tk.status || 'pendiente']};flex:none">${PLAN360_TASK_ESTADO_LABEL[tk.status || 'pendiente']}</span>
    <span class="muted" style="flex:none">${esc(plan360FormatDate(tk.day).dayMonth)}</span>
    <span style="flex:1">${esc(tk.title)}</span>
  </div>`;
  document.getElementById('client-grid').innerHTML = `
    ${plan360PageHeader('★ Resumen del programa')}
    <div class="card" style="margin-top:14px">
      <div style="font-weight:600">Tareas completadas</div>
      <div style="font-size:28px;font-weight:800;margin-top:4px">${hechas.length}<span style="font-size:16px;color:var(--muted);font-weight:600"> / ${tareas.length}</span></div>
    </div>
    <div style="font-weight:600;margin:16px 0 4px">Trabajo por objetivo</div>
    ${!objetivos.length ? '<p class="muted">Todavía no hay objetivos definidos en el Día 2.</p>' : grupos.map(g => `
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="width:9px;height:9px;border-radius:50%;background:${plan360ObjPriorityColor(g.obj.prioridad)};flex:none"></span>
          <strong style="flex:1">${esc(g.obj.titulo)}</strong>
          <span class="muted" style="font-size:12px">${g.tareas.length} tarea${g.tareas.length === 1 ? '' : 's'}</span>
        </div>
        ${plan360MedicionesResumenHtml(g.obj)}
        ${g.tareas.length ? g.tareas.map(tareaLinea).join('')
          : '<p style="margin:0;font-size:13px;color:var(--red)">⚠ Sin ninguna tarea asignada todavía en los 26 días de trabajo.</p>'}
      </div>`).join('')}
    ${sinObjetivo.length ? `
      <div class="card" style="margin-bottom:10px;border-color:var(--amber)">
        <strong>Sin objetivo asignado</strong>
        ${sinObjetivo.map(tareaLinea).join('')}
      </div>` : ''}
  `;
}
</script>
</body>
</html>

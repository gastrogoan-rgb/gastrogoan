  'gestion-mermas': {
    eyebrow: 'Guía · Cocina',
    titulo: 'Mermas: cómo evitarlas',
    sub: 'Cada gramo que se tira es dinero que se pierde. Guía práctica para el equipo de cocina.',
    bloques: [
      {t: 'dato', items: [{v: '1 €', l: 'que se tira es 1 € menos de beneficio'}, {v: '2', l: 'tipos de merma: la técnica y la evitable'}, {v: '10', l: 'hábitos que la reducen'}, {v: '30 s', l: 'es lo que cuesta anotar una merma en la app'}]},
      {t: 'cap', n: '01', titulo: 'Por qué importa', sub: 'La merma no se ve en la caja, pero se paga.'},
      {t: 'p', x: 'Merma es todo lo que se compra y no llega a venderse: lo que caduca, lo que se estropea, lo que se produce de más, lo que se corta mal o lo que vuelve de sala. No es un problema de la dirección: se decide cada día en la cocina, en cada pedido, en cada corte y en cada ración.'},
      {t: 'p', x: 'Cuando un plato deja un 70 % de margen, tirar el producto de una ración se come el beneficio de varias. Por eso reducir mermas es la forma más rápida de ganar dinero sin vender más.'},
      {t: 'h', x: 'La cuenta que nadie hace'},
      {t: 'tabla', cab: ['Lo que se tira cada semana', 'Al año'], filas: [['2 kg de merluza a 14 €/kg (28 €)', '1.456 €'], ['1 kg de solomillo a 25 €/kg (25 €)', '1.300 €'], ['5 raciones de guarnición a 1 € (5 €)', '260 €'], ['3 barras de pan a 1,20 € (3,60 €)', '187 €']]},
      {t: 'regla', x: 'Solo esas cuatro líneas son más de 3.200 € al año. Para recuperarlos vendiendo, con un 10 % de beneficio neto habría que facturar 32.000 € más.'},
      {t: 'h', x: 'Dónde se genera la merma'},
      {t: 'tarjetas', items: [{k: '01', t: 'En la compra', d: 'Se pide de más o llega producto en mal estado y se acepta.'}, {k: '02', t: 'En la conservación', d: 'Caduca, se estropea por temperatura o se olvida al fondo de la cámara.'}, {k: '03', t: 'En la producción', d: 'Se produce de más, se corta sin aprovechar o se falla una elaboración.'}, {k: '04', t: 'En el servicio', d: 'Raciones a ojo, errores de comanda y platos que vuelven.'}]},

      {t: 'cap', n: '02', titulo: 'Merma técnica y merma evitable', sub: 'No toda la merma es un error. Pero toda hay que conocerla.'},
      {t: 'tarjetas', items: [{k: 'Técnica', t: 'La que no se puede evitar', d: 'Espinas, piel, hueso, cáscaras, lo que pierde la carne al cocinarse. Se paga igual, así que va en el escandallo.'}, {k: 'Evitable', t: 'La que no debería existir', d: 'Lo que caduca, se estropea, sobra o se corta mal. Esa es la que esta guía quiere reducir.'}]},
      {t: 'h', x: 'El coste real de lo que se aprovecha'},
      {t: 'p', x: 'Si una merluza entera cuesta 14 €/kg y solo se aprovecha el 60 %, cada kilo útil cuesta 14 ÷ 0,60 = 23,33 €. Un plato escandallado con los 14 € de la factura parece mucho más rentable de lo que es.'},
      {t: 'tabla', titulo: 'Rendimientos orientativos', cab: ['Producto', 'Se aprovecha', 'Merma técnica'], filas: [['Pescado entero (merluza, lubina)', '50–60 %', '40–50 %'], ['Pollo entero', '65–70 %', '30–35 %'], ['Alcachofa', '35–40 %', '60–65 %'], ['Cebolla o zanahoria pelada', '85–90 %', '10–15 %'], ['Solomillo sin limpiar', '75–80 %', '20–25 %']]},
      {t: 'regla', x: 'Estas cifras son una guía. Mide las tuyas: pesa antes y después de limpiar tres veces y quédate con la media.'},
      {t: 'h', x: 'Cómo se refleja en la app'},
      {t: 'p', x: 'En el escandallo de cada receta, cada ingrediente tiene su columna «Merma %». Pones la cantidad neta que va al plato y la merma medida, y la app calcula la cantidad bruta, el coste real por ración y el food cost. El mismo porcentaje se usa al descontar stock con cada venta, así que el inventario también cuadra.'},
      {t: 'campo', id: 'rendimientos', label: 'Nuestros rendimientos medidos', ayuda: 'Producto y porcentaje real de esta cocina'},

      {t: 'cap', n: '03', titulo: 'Causas y soluciones', sub: 'Casi toda la merma tiene una causa concreta. Y una solución.'},
      {t: 'tabla', cab: ['La causa', 'Cómo se evita'], filas: [['Pedir «a ojo»', 'Pedir según stock mínimo y reservas previstas'], ['Mala rotación', 'Primero entra, primero sale; todo etiquetado'], ['Temperaturas fuera de rango', 'Registro diario y cámaras sin sobrecargar'], ['Producir de más', 'Lista de producción según la previsión del día'], ['Cortes sin aprovechar', 'Ficha de despiece y destino para cada recorte'], ['Raciones a ojo', 'Pesar siempre según la ficha técnica'], ['Errores de comanda', 'Cantar, confirmar y revisar en el pase'], ['Platos que vuelven', 'Preguntar el motivo y corregirlo en la ficha']]},

      {t: 'cap', n: '04', titulo: 'Los 10 hábitos del equipo', sub: 'Lo que hace cada persona de la cocina, cada día.'},
      {t: 'lista', titulo: 'Diez hábitos, sin excepciones', items: ['Primero entra, primero sale: lo antiguo delante, lo nuevo detrás.', 'Todo etiquetado: producto, fecha de elaboración y caducidad.', 'Pesa, no calcules a ojo: la ficha técnica manda.', 'Produce lo que dice la lista, no más «por si acaso».', 'Revisa la cámara al empezar el turno: qué hay que usar primero.', 'Aprovecha antes de tirar: recortes, huesos, pan, fruta madura.', 'Guarda bien: tapado, film, recipiente adecuado y a su temperatura.', 'Avisa de lo que está a punto de caducar para que se use hoy.', 'Anota cada merma, con su cantidad y su motivo.', 'Si un plato vuelve de sala, pregunta por qué.']},
      {t: 'regla', x: 'Antes de tirar nada, tres preguntas: ¿se puede aprovechar? ¿por qué ha pasado? ¿lo he anotado?'},

      {t: 'cap', n: '05', titulo: 'Aprovechamiento', sub: 'Lo que hoy se tira, mañana puede ser un plato.'},
      {t: 'tabla', cab: ['Lo que sobra', 'En qué se puede convertir'], filas: [['Recortes de verdura', 'Fondos, cremas, sofritos'], ['Huesos y espinas', 'Fondos y caldos'], ['Pan del día anterior', 'Picatostes, pan rallado, torrijas'], ['Fruta madura', 'Postres, compotas, zumos'], ['Recortes de carne o pescado', 'Croquetas, rellenos, comida de personal'], ['Hierbas a punto de estropearse', 'Aceites, pestos, salsas verdes']]},
      {t: 'campo', id: 'aprovechamiento', label: 'Nuestros aprovechamientos', ayuda: 'Los que ya hacemos o queremos hacer en esta cocina'},
      {t: 'regla', x: 'Aprovechar nunca es servir algo en mal estado. Si hay dudas sobre la seguridad, se tira y se anota.'},

      {t: 'cap', n: '06', titulo: 'El registro de mermas', sub: 'Lo que no se anota no se puede corregir.'},
      {t: 'p', x: 'Cada merma evitable se anota en el momento, en la app: Stock → «Anotar merma». Producto, cantidad y motivo; si el motivo no está en la lista, se elige «Otro» y se escribe. La app la pasa a euros con el precio de la Mega Lista y la descuenta del stock. Es medio minuto y es la única forma de saber qué está fallando.'},
      {t: 'tabla', titulo: 'Qué se anota', cab: ['Dato', 'Cómo'], filas: [['Producto', 'De la Mega Lista o una elaboración'], ['Cantidad', 'En la unidad en que se compra'], ['Motivo', 'Caducado · en mal estado · sobreproducción · error · devolución · otro'], ['Coste', 'Lo calcula la app'], ['Quién y cuándo', 'Lo guarda la app']]},
      {t: 'p', x: 'El botón «Mermas» de Stock da la revisión semanal hecha: lo tirado esta semana frente a la anterior, lo que más se tira, los motivos y lo que costaría en un año a ese ritmo. Si un producto se tira de forma constante, se ajusta el pedido al proveedor, el stock mínimo o la ración de la ficha técnica.'},
      {t: 'check', titulo: 'Revisión semanal', items: ['¿Qué producto se tira más?', '¿Por qué motivo?', '¿Qué cambiamos: pedido, ración, producción o conservación?', '¿Ha bajado respecto a la semana anterior?']},
      {t: 'campos', items: [
        {id: 'resp-mermas', label: 'Responsable del registro', ayuda: 'Nombre'},
        {id: 'dia-revision', label: 'Día de la revisión semanal', ayuda: 'Por ejemplo, lunes'},
        {id: 'objetivo-mermas', label: 'Nuestro objetivo', ayuda: 'Por ejemplo, reducir un 20 % en 3 meses'},
      ]},
      {t: 'campo', id: 'nota-coach', label: 'Nota de tu coach', ayuda: 'Lo que más merma genera en esta cocina y por dónde empezar', grande: true},

  'ingenieria-carta': {
    eyebrow: 'Método · Cocina y gestión',
    titulo: 'Ingeniería de carta',
    sub: 'Qué plato se queda, cuál se toca y cuál se va. Decidirlo con las ventas y los costes, no con el gusto.',
    bloques: [
      {t: 'dato', items: [{v: '2', l: 'preguntas: ¿se vende? ¿deja dinero?'}, {v: '4', l: 'tipos de plato, cada uno con su acción'}, {v: '1 mes', l: 'de ventas como mínimo para decidir'}, {v: '€', l: 'el margen se mide en euros, no solo en %'}]},
      {t: 'cap', n: '01', titulo: 'Por qué importa', sub: 'La carta es el vendedor que tienes en cada mesa.'},
      {t: 'p', x: 'Casi todas las cartas crecen por acumulación: un plato que gustó, otro que pidió un cliente, uno que se quedó de la temporada pasada. Nadie se pregunta si cada plato se gana su sitio. La ingeniería de carta responde a eso con dos datos que ya tienes: cuánto se vende cada plato y cuánto deja.'},
      {t: 'p', x: 'No se trata de quitar platos por quitar. Una carta más corta y bien pensada se produce mejor, genera menos merma, se vende más fácil y deja más dinero con los mismos clientes.'},
      {t: 'regla', x: 'Lo que manda es cuántos euros deja un plato, no lo bonito que queda su food cost.'},
      {t: 'p', x: 'Un arroz con un 26 % de food cost a 16 € deja 11,80 €. Una ensalada con un 20 % a 9 € deja 7,20 €. La ensalada tiene mejor porcentaje, pero cada vez que se vende el arroz entran 4,60 € más.'},

      {t: 'cap', n: '02', titulo: 'Los cuatro tipos de plato', sub: 'Cada plato cae en uno. Cada uno pide una cosa distinta.'},
      {t: 'tarjetas', items: [{k: 'Estrella', t: 'Se vende mucho y deja buen margen', d: 'Es el corazón de la carta. Se cuida, se destaca y no se toca la receta.'}, {k: 'Revisar precio o receta', t: 'Se vende mucho, deja poco', d: 'El cliente lo quiere. Se sube un poco el precio o se ajusta la receta sin que se note.'}, {k: 'Promocionar', t: 'Deja buen margen, se vende poco', d: 'Tiene que verse más: mejor sitio en la carta, recomendación de sala, mejor nombre o foto.'}, {k: 'Candidato a quitar', t: 'Se vende poco y deja poco', d: 'Ocupa cámara, mise en place y cabeza. Se quita o se rehace, salvo que tenga una razón para estar.'}]},
      {t: 'tabla', titulo: 'Qué hacer y qué no hacer', cab: ['Tipo', 'Sí', 'No'], filas: [['Estrella', 'Mejor sitio de la carta, que la sala lo recomiende, mantener calidad', 'Cambiar la receta o subir mucho el precio'], ['Revisar precio o receta', 'Subir 0,50–1,50 €, ajustar ración o guarnición, cambiar un ingrediente caro', 'Quitarlo: es de lo que más se vende'], ['Promocionar', 'Moverlo arriba, destacarlo, contarlo en sala, mejorar el nombre', 'Bajarle el precio de entrada'], ['Candidato a quitar', 'Quitarlo o rehacerlo como plato nuevo', 'Mantenerlo por costumbre']]},
      {t: 'regla', x: 'Antes de quitar un plato, pregúntate si cumple una función: el plato infantil, la opción vegana, el que pide un cliente fijo cada semana. Si la cumple, se queda y se intenta mejorar su margen.'},

      {t: 'cap', n: '03', titulo: 'Cómo se hace', sub: 'Una vez al mes o al trimestre, en media hora.'},
      {t: 'pasos', etiqueta: 'Consejo', items: [
        {t: 'Elige el periodo', d: 'Un mes completo como mínimo. Con una semana, un día de lluvia o un grupo grande lo distorsionan todo.', e: 'Mejor un mes o un trimestre entero, y comparar siempre periodos parecidos.'},
        {t: 'Compara platos de la misma sección', d: 'Principales con principales, postres con postres. Un postre nunca va a vender como un principal y no por eso es malo.', e: ''},
        {t: 'Comprueba los escandallos', d: 'La clasificación es tan buena como los costes. Un escandallo sin merma o con precios viejos da un margen falso.', e: 'Revisa la columna «Merma %» y los precios de la Mega Lista antes de mirar la matriz.'},
        {t: 'Clasifica cada plato', d: 'Se vende mucho o poco comparado con la mitad de su sección; deja mucho o poco margen comparado con el resto.', e: 'La app lo hace sola en Panel de Control → Análisis de Platos → Matriz de rentabilidad.'},
        {t: 'Mira los euros', d: 'Junto al cuadrante, mira cuánto dinero deja cada plato en el mes: unidades × margen en euros. Así sabes cuánto pesa cada decisión.', e: ''},
        {t: 'Decide una acción por plato', d: 'Una sola y concreta: subir 1 €, mover a la primera línea, quitar. Anótala con la fecha.', e: ''},
        {t: 'Mide el mes siguiente', d: 'Repite el análisis con el nuevo mes y comprueba si la acción funcionó. Si no, se prueba otra.', e: ''},
      ]},
      {t: 'p', x: 'Para que la app calcule la matriz, cada plato de la carta tiene que tener su escandallo vinculado y hacen falta al menos cuatro platos con ventas en el periodo.'},

      {t: 'cap', n: '04', titulo: 'Un ejemplo resuelto', sub: 'Seis principales, un mes de ventas. Las cifras son de ejemplo, sin IVA.'},

function plan360DocTextoAnterior(doc){
  const body = doc && typeof doc.body === 'string' ? doc.body.trim() : '';
  if(!body) return '';
  const base = (PLAN360_DOCS_TEMPLATE.find(d => d.id === doc.id) || {}).seed || '';
  return body === base.trim() ? '' : body;
}

function plan360InvEuros(n){

function plan360MisteryBlockAvg(block){
  const scored = block.items.filter(i => i.score !== null && i.score !== undefined && i.score !== '');
  if(!scored.length) return null;
  const sum = scored.reduce((s, i) => s + Number(i.score), 0);
  return Math.round((sum / scored.length) * 10) / 10;
}
function plan360MisteryOverallAvg(mc){
  const avgs = mc.blocks.map(plan360MisteryBlockAvg).filter(a => a !== null);
  if(!avgs.length) return null;
  return Math.round((avgs.reduce((s, a) => s + a, 0) / avgs.length) * 10) / 10;
}

}

// Team building: no es una nota, es un guion de presentación para leer o
// apoyarse delante de TODO el equipo — de ahí que nazca con un texto real
// y no en blanco. El coach lo ajusta al negocio antes de usarlo.
const PLAN360_TEAMBUILDING_SCRIPT = `EL DESAFÍO DE LOS 5 SENTIDOS
Dinámica de equipo — Día 2, tras presentar el plan. Duración total: 35-40 min.

POR QUÉ ESTA Y NO OTRA
Nada de "reto de cocina" ni de rondas de confianza de manual. Es un JUEGO de verdad, con dos equipos, puntos y un ganador — eso genera la energía y las risas que ningún ejercicio reflexivo consigue. Y de paso entrena algo útil de verdad: el vocabulario sensorial es la herramienta con la que el equipo de sala describe los platos a un cliente.

PREPARACIÓN (antes de la sesión, 15-20 min)
Prepara tú (el coach) el material de los 5 sentidos — así la dinámica arranca rápido y no se pierde tiempo montando cosas delante del equipo:
- OÍDO: 3-4 sonidos grabados (móvil vale) — la freidora, la campana del pase, la cafetera, el cuchillo sobre la tabla...
- GUSTO: 3-4 muestras pequeñas a ciegas de sabores o ingredientes que ellos mismos usan en su carta.
- OLFATO: 3-4 especias o ingredientes con aroma reconocible de su propia cocina.
- TACTO: 3-4 texturas para tocar con los ojos vendados (un producto crudo, algo del almacén, una herramienta).
- VISTA: 3-4 fotos muy recortadas o borrosas de platos o rincones del propio local.

Todo tiene que salir DE SU NEGOCIO, no de objetos random — así el juego no es genérico, es "sobre nosotros", y la gente se ríe reconociendo su propio día a día.

1. DIVISIÓN DE EQUIPOS (2 min)
Dos equipos MEZCLADOS a propósito — cocina y sala repartidos entre los dos, nunca "cocina contra sala". El objetivo es que se conozcan entre puestos, no que gane un departamento.

2. LAS RONDAS (25-30 min)
Por turnos, un equipo presenta al otro una muestra de un sentido (a ciegas cuando aplique: antifaz para gusto, olfato y tacto). El equipo rival adivina. Un acierto = un punto.

Antes de revelar si aciertan, el equipo que preparó la muestra cuenta en 10 segundos POR QUÉ eligió justo eso — un ingrediente que le encanta, un sonido que oye 8 horas al día, una textura con la que curra a diario. Aquí es donde se cuela la parte humana: no es un ejercicio aparte, es parte del juego, y sale sola sin forzarla.

Se van alternando sentidos y turnos hasta agotar el material. Gana el equipo con más puntos.

3. CIERRE (5-8 min)
El equipo ganador elige algo simbólico — poner nombre a un plato nuevo, decidir el orden de turnos de la semana que viene, algo que de verdad pese un poco (nada de trofeos cutres).

Aprovecha este momento, con el equipo ya suelto y de buen humor, para conectar con el mensaje real: "esto es lo que vamos a construir juntos" — y enlaza con los objetivos y el plan que ya habéis presentado antes en la sesión.`;

        delete o.done;
      }
      // Id estable para poder enganchar tareas de los días de trabajo a
      // un objetivo concreto — antes los objetivos no tenían ninguno
      // (solo se leían por posición, y esa posición cambia al filtrar y
      // reordenar por prioridad en cada guardado).
      if(o.id === undefined){ o.id = plan360GenId(); migracionIdsPendiente = true; }
      if(o.metrica === undefined) o.metrica = '';
      if(!Array.isArray(o.mediciones)) o.mediciones = [];
      if(o.estadoFinal === undefined) o.estadoFinal = null;
    });
  });
  // Igual que los objetivos: las tareas de los 26 días de trabajo pasan
  // de "un texto suelto + hecho/no hecho" a título+descripción (lo que
  // plantea el coach) enganchado a un objetivo, con un estado de tres
  // valores que rellena el negocio (pendiente/hecha/no hecha) y su nota
  // de feedback aparte — sin perder nada de lo que ya hubiera escrito.
  (remoteBiz.plan360Program || []).filter(x => x.phase === 'trabajo').forEach(x => {
    (x.tasks || []).forEach(tk => {
      if(tk.id === undefined){ tk.id = plan360GenId(); migracionIdsPendiente = true; }
      if(tk.title === undefined){
        tk.title = tk.text || '';
        tk.description = tk.description || '';
        tk.objectiveId = tk.objectiveId || null;
        tk.status = tk.status || (tk.done ? 'hecha' : 'pendiente');
        delete tk.text;
        delete tk.done;
      }
    });
  });
  // Migración: el checklist creció de 14 a 18 bloques (18/09, al mover
  // "Concepto y posicionamiento", "Ingeniería de carta", "Gestión y
  // números" y "Fidelización" desde la desaparecida Reunión presencial).
  // Los negocios con un checklist ya empezado se quedarían con solo los
  // 14 bloques originales para siempre si no se completan los que faltan
  // — sin tocar lo ya puntuado.
  if(dia1Existente && dia1Existente.misteryCheck && Array.isArray(dia1Existente.misteryCheck.blocks)
    && dia1Existente.misteryCheck.blocks.length < PLAN360_MISTERY_BLOCKS.length){
    const titulosYa = dia1Existente.misteryCheck.blocks.map(b => b.title);
    PLAN360_MISTERY_BLOCKS.forEach(b => {
      if(!titulosYa.includes(b.title)){
        dia1Existente.misteryCheck.blocks.push({
          title: b.title,
          items: b.items.map(text => ({text, score: null})),
          openQuestions: (b.openQuestions || []).map(q => ({q, a: ''})),
        });
      }
    });
  }
  // Se guarda al momento: sin guardar, cada día que se abría el negocio la
  // fecha de inicio era «hoy» otra vez y el calendario entero se desplazaba.
  if(!remoteBiz.plan360StartDate){ remoteBiz.plan360StartDate = todayStr(); migracionIdsPendiente = true; }
  if(!remoteBiz.plan360Cierre) remoteBiz.plan360Cierre = plan360FreshCierre();
  if(!remoteBiz.plan360Contract){
    remoteBiz.plan360Contract = {
      clienteNombre: '', clienteNIF: '', clienteDireccion: '', precio: '', formaPago: '',
      signedName: '', signedDNI: '', signedAt: null,
    };
  }
  if(remoteBiz.plan360WelcomeShown === undefined) remoteBiz.plan360WelcomeShown = false;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDaysStr(fechaStr, dias){
  const [y,m,d] = fechaStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + dias);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function plan360DateForDay(day){
  return addDaysStr(remoteBiz.plan360StartDate || todayStr(), day - 1);
}
function plan360FormatDate(day){
  const dstr = plan360DateForDay(day);
  const [y, m, d] = dstr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return {
    weekday: dt.toLocaleDateString('es-ES', {weekday: 'short'}),
    dayMonth: dt.toLocaleDateString('es-ES', {day: 'numeric', month: 'short'}),
  };
}
function plan360PriorityColor(p){ return p === 'alta' ? 'var(--red)' : p === 'media' ? 'var(--amber)' : p === 'baja' ? 'var(--green)' : null; }
// Aparte de la prioridad de los DÍAS de trabajo (alta/media/baja, ya
// existente): la urgencia de los OBJETIVOS usa sus propias 3 etiquetas.
function plan360ObjPriorityColor(p){ return p === 'prioritario' ? 'var(--red)' : p === 'esencial' ? 'var(--amber)' : p === 'complementario' ? 'var(--green)' : null; }

// Los lunes del mes (4 o 5), como AAAA-MM-DD.
function mantLunesDelMes(clave){
  const [y, m] = clave.split('-').map(Number);
  const d = new Date(y, m - 1, 1);
  while(d.getDay() !== 1) d.setDate(d.getDate() + 1);
  const out = [];
  while(d.getMonth() === m - 1){
    out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    d.setDate(d.getDate() + 7);
  }
  return out;
}

}

// Firebase borra lo vacío: un mes sin nada vuelve sin semanas, y una
// semana sin gadgets, sin items. Se repone al leer, nunca se da por hecho.
function mantMes(clave, crear){
  if(!remoteBiz.plan360Mant || typeof remoteBiz.plan360Mant !== 'object'){
    if(!crear) return null;
    remoteBiz.plan360Mant = {meses: {}};
  }
  const mant = remoteBiz.plan360Mant;
  if(!mant.meses || typeof mant.meses !== 'object') mant.meses = {};
  if(!mant.meses[clave]){
    if(!crear) return null;
    mant.meses[clave] = {semanas: {}};
  }
  const mes = mant.meses[clave];
  if(!mes.semanas || typeof mes.semanas !== 'object') mes.semanas = {};
  return mes;
}
function mantSemana(mes, sk){
  if(!mes.semanas[sk]) mes.semanas[sk] = {canal: 'whatsapp', items: {}};
  if(!mes.semanas[sk].items || typeof mes.semanas[sk].items !== 'object') mes.semanas[sk].items = {};
  return mes.semanas[sk];
}
function mantItemsOrdenados(sem){
  return Object.keys(sem.items || {}).map(id => Object.assign({id}, sem.items[id]))
    .sort((a, b) => (a.orden || 0) - (b.orden || 0));
}
function mantFechaCorta(f){
  const [y, m, d] = f.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('es-ES', {weekday: 'long', day: 'numeric', month: 'long'});
}

        <p style="margin:0 0 8px">Este mes está vacío.</p>

    ${(() => {

function mantMoverMes(delta){
  const [y, m] = mantMesActivo.split('-').map(Number);
  renderMantPage(mantMesClave(new Date(y, m - 1 + delta, 1)));
}
function mantGuardarYPintar(){ saveRemoteBiz(); renderMantPage(); }
function mantAplicarPlantilla(){
  const mes = mantMes(mantMesActivo, true);
  const plantilla = mantPlantilla();
  mantLunesDelMes(mantMesActivo).forEach((f, i) => {
    const sk = 's' + (i + 1);
    const p = plantilla[sk];
    if(!p) return;   // el 5º lunes nace libre
    const sem = mantSemana(mes, sk);
    sem.canal = p.canal || 'whatsapp';
    (p.items || []).forEach((it, k) => {
      const g = typeof it === 'string' ? mantGadgetPorTitulo(it) : it;
      sem.items[mantId()] = {tipo: g.tipo, titulo: g.titulo, detalle: g.detalle || '', icono: g.icono || MANT_ICONO_LIBRE[g.tipo] || '', hecho: false, orden: k};
    });
  });
  mantGuardarYPintar();
}
function mantEmpezarVacio(){
  const mes = mantMes(mantMesActivo, true);
  mantLunesDelMes(mantMesActivo).forEach((f, i) => { mantSemana(mes, 's' + (i + 1)).canal = i % 2 ? 'video' : 'whatsapp'; });
  // Sin ningún gadget, Firebase no guardaría nada: se deja una marca.
  mes.creado = Date.now();
  mantGuardarYPintar();
}
function mantCambiarCanal(sk, canal){
  const mes = mantMes(mantMesActivo, true);
  mantSemana(mes, sk).canal = canal;
  mantGuardarYPintar();
}
function mantAnadir(sk){
  const sel = document.getElementById('mant-add-' + sk);
  if(!sel) return;
  let g;
  if(sel.value === '__entrega' || sel.value === '__tarea'){
    const titulo = (prompt(sel.value === '__tarea' ? '¿Qué tarea le dejas al negocio?' : '¿Qué le entregas?') || '').trim();
    if(!titulo) return;
    g = {tipo: sel.value.slice(2), titulo, detalle: '', icono: MANT_ICONO_LIBRE[sel.value.slice(2)]};
  } else {
    g = mantGadgetPorTitulo(sel.value);
  }
  const sem = mantSemana(mantMes(mantMesActivo, true), sk);
  mantMeter(sem, g);
  mantGuardarYPintar();
}
function mantMeter(sem, g){
  const orden = Object.values(sem.items).reduce((mx, it) => Math.max(mx, (it && it.orden) || 0), -1) + 1;
  sem.items[mantId()] = {tipo: g.tipo, titulo: g.titulo, detalle: g.detalle || '', icono: g.icono || MANT_ICONO_LIBRE[g.tipo] || '', hecho: false, orden};
}
// «Este mes toca»: lo que va por fecha y todavía no está puesto en el mes.
function mantSugerencias(clave){
  const mesNum = Number(clave.split('-')[1]);
  const mes = mantMes(clave, false);
  const ya = new Set();
  if(mes) Object.values(mes.semanas).forEach(s => Object.values((s && s.items) || {}).forEach(it => it && ya.add(it.titulo)));
  return MANT_GADGETS.filter(g => g.meses && g.meses.includes(mesNum) && !ya.has(g.titulo));
}
function mantAnadirSugerencia(idx){
  const g = mantSugerencias(mantMesActivo)[idx];
  const sel = document.getElementById('mant-sug-sem-' + idx);
  if(!g || !sel) return;
  mantMeter(mantSemana(mantMes(mantMesActivo, true), sel.value), g);
  mantGuardarYPintar();
}
const MANT_DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
// La fecha real de un gadget: su lunes + el día que le pongas (0 = lunes).
function mantFechaItem(clave, sk, it){
  const lunes = mantLunesDelMes(clave)[Number(sk.slice(1)) - 1];
  if(!lunes) return null;
  const d = Math.max(0, Math.min(6, Number((it && it.dia) || 0)));
  return addDaysStr(lunes, d);
}
function mantCambiarDia(sk, id, valor){
  const it = mantItem(sk, id);
  if(!it) return;
  it.dia = Math.max(0, Math.min(6, Number(valor) || 0));
  mantGuardarYPintar();
}
// Mover conserva el id, lo marcado y la respuesta del negocio: es la misma
// tarea en otra semana, no una nueva.
function mantMover(sk, id, destino){
  const mes = mantMes(mantMesActivo, false);
  const it = mantItem(sk, id);
  if(!mes || !it || destino === sk) return;
  let mesDestino = mes, skDestino = destino;
  if(destino === 'sig'){
    const [y, m] = mantMesActivo.split('-').map(Number);
    mesDestino = mantMes(mantMesClave(new Date(y, m, 1)), true);
    skDestino = 's1';
  }
  const sem = mantSemana(mesDestino, skDestino);
  if(destino === 'sig' && !sem.canal) sem.canal = 'whatsapp';
  sem.items[id] = it;
  delete mes.semanas[sk].items[id];
  mes.creado = mes.creado || Date.now();
  mantGuardarYPintar();
}
function mantIcono(it){
  const ic = it && it.icono;
  return /^ti-[a-z0-9-]+$/.test(ic || '') ? ic : MANT_ICONO_LIBRE[(it && it.tipo) || 'tarea'];
}
function mantItem(sk, id){
  const mes = mantMes(mantMesActivo, false);
  return mes && mes.semanas[sk] && mes.semanas[sk].items && mes.semanas[sk].items[id];
}
function mantMarcar(sk, id, hecho){
  const it = mantItem(sk, id);
  if(!it) return;
  it.hecho = !!hecho;
  it.hechoEn = hecho ? Date.now() : null;
  mantGuardarYPintar();
}
function mantEditar(sk, id, campo, valor){
  const it = mantItem(sk, id);
  if(!it) return;
  it[campo] = valor.trim();
  saveRemoteBiz();   // sin repintar: se está escribiendo
}
function mantBorrar(sk, id){
  const mes = mantMes(mantMesActivo, false);
  if(!mes || !mes.semanas[sk] || !mes.semanas[sk].items) return;
  if(!confirm('¿Quitar este gadget del mes?')) return;
  delete mes.semanas[sk].items[id];
  mes.creado = mes.creado || Date.now();
  mantGuardarYPintar();
}
function mantGuardarComoPlantilla(){
  const mes = mantMes(mantMesActivo, false);
  if(!mes) return;
  const p = {};
  Object.keys(mes.semanas).forEach(sk => {
    const sem = mes.semanas[sk];
    p[sk] = {canal: sem.canal, items: mantItemsOrdenados(mantSemana(mes, sk)).map(it => ({tipo: it.tipo, titulo: it.titulo, detalle: it.detalle || '', icono: it.icono || ''}))};
  });
  try { localStorage.setItem(MANT_PLANTILLA_LS, JSON.stringify(p)); } catch(e){}
  mantPlantillaRef().set(p).then(() => {
    mantPlantillaNube = p;
    alert('Guardada en la nube. Los meses nuevos se rellenarán así, en cualquier ordenador.');
  }).catch(e => {
    console.error(e);
    alert('Guardada solo en este navegador: la nube no la ha aceptado. Hay que publicar las reglas nuevas de la plataforma (reglas/reglas-de-la-plataforma.json).');
  });
}
function mantRestaurarPlantilla(){
  if(!confirm('¿Olvidar tu plantilla y volver al mes tipo de fábrica? Los meses ya creados no cambian.')) return;
  try { localStorage.removeItem(MANT_PLANTILLA_LS); } catch(e){}
  mantPlantillaNube = null;
  mantPlantillaRef().remove().catch(e => console.error(e));
  alert('Hecho.');
}

/* ---- «Mi semana»: todos los clientes de mantenimiento de un vistazo ----
   Con 12 negocios, entrar uno a uno para saber qué toca era depender de la
   memoria. Aquí se lee SOLO plan360Mant de cada nube (unos pocos KB) y se
   desconecta al terminar: no deja ninguna conexión abierta en la nube de
   nadie. Cada lectura va contra la nube DEL NEGOCIO, así que no cuesta
   nada a GastroGoan. */
function mantLunesDeHoy(){
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
// Qué hay de un negocio: lo de esta semana, lo atrasado y lo que ha
// contestado sin que lo hayas visto. Función pura, para poder probarla.
function mantResumenNegocio(mant, hoyStr, vistoTs){
  const lunesHoy = (() => { const [y, m, d] = hoyStr.split('-').map(Number); const f = new Date(y, m - 1, d); f.setDate(f.getDate() - ((f.getDay() + 6) % 7)); return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0'); })();
  const finSemana = addDaysStr(lunesHoy, 7);
  const r = {canal: null, tuyas: [], suyas: [], atrasadas: [], respuestas: [], hechasSemana: 0};
  const meses = (mant && mant.meses && typeof mant.meses === 'object') ? mant.meses : {};
  Object.keys(meses).forEach(clave => {
    const semanas = (meses[clave] && meses[clave].semanas) || {};
    const lunes = mantLunesDelMes(clave);
    Object.keys(semanas).forEach(sk => {
      const sem = semanas[sk] || {};
      if(lunes[Number(sk.slice(1)) - 1] === lunesHoy) r.canal = sem.canal || null;
      Object.keys(sem.items || {}).forEach(id => {
        const it = sem.items[id];
        if(!it || !it.titulo) return;
        const f = mantFechaItem(clave, sk, it);
        if(!f) return;
        const esta = f >= lunesHoy && f < finSemana;
        if(esta && it.hecho) r.hechasSemana++;
        if(esta && !it.hecho) (it.tipo === 'tarea' ? r.suyas : r.tuyas).push(it.titulo);
        if(!esta && f < lunesHoy && !it.hecho) r.atrasadas.push(it.titulo);
        if(it.respuesta && (it.respuestaEn || 0) > (vistoTs || 0)) r.respuestas.push(it.titulo);
      });
    });
  });
  return r;
}
function mantVistoKey(tenantId){ return 'gg_mant_visto_' + tenantId; }
async function mantLeerDeUnNegocio(e){
  const lookupSnap = await getApp().database().ref('gastrogoan/tenantLookup/' + e.tenantId).once('value');
  const cfg = lookupSnap.val();
  if(!cfg || !cfg.apiKey || !cfg.databaseURL) return {sinNube: true};
  const appName = 'biz-' + e.tenantId;
  let bizApp;
  try{ bizApp = firebase.app(appName); }catch(err){ bizApp = firebase.initializeApp(cfg, appName); }
  if(!bizApp.auth().currentUser) await bizApp.auth().signInAnonymously();
  const db = bizApp.database();
  db.goOnline();
  try {
    const snap = await db.ref('gastrogoan/tenants/' + e.tenantId + '/db/business/plan360Mant').once('value');
    return {mant: snap.val()};
  } finally {
    // Si no es el negocio que tienes abierto, se suelta la conexión.
    if(currentTenantId !== e.tenantId) db.goOffline();
  }
}
async function renderMiSemana(){
  const cont = document.getElementById('mi-semana');
  if(!cont) return;
  cont.innerHTML = '<div class="card"><span class="muted">Mirando la semana de cada negocio…</span></div>';
  const snap = await getApp().database().ref('gastrogoan/coaching360').once('value');
  const val = snap.val() || {};
  const clientes = Object.keys(val).map(tenantId => ({tenantId, name: val[tenantId].name || '(sin nombre)'}));
  const hoy = new Date(); const hoyStr = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0');
  const filas = await Promise.all(clientes.map(async c => {
    try {
      const lectura = await Promise.race([mantLeerDeUnNegocio(c), new Promise((_, no) => setTimeout(() => no(new Error('tiempo')), 12000))]);
      if(lectura.sinNube || !lectura.mant) return null;   // sin mantenimiento: no sale
      return Object.assign({}, c, mantResumenNegocio(lectura.mant, hoyStr, Number(localStorage.getItem(mantVistoKey(c.tenantId)) || 0)));
    } catch(err){
      console.warn('Mi semana: no se pudo leer', c.name, err);
      return Object.assign({}, c, {error: true});
    }
  }));
  const conMant = filas.filter(Boolean);
  if(!conMant.length){ cont.innerHTML = '<div class="card"><span class="muted">Ningún cliente tiene todavía un mes de mantenimiento preparado.</span></div>'; return; }
  const tot = k => conMant.reduce((n, f) => n + ((f[k] && f[k].length) || 0), 0);
  const whats = conMant.filter(f => f.canal === 'whatsapp').length, videos = conMant.filter(f => f.canal === 'video').length;
  conMant.sort((a, b) => (b.atrasadas || []).length + (b.respuestas || []).length - (a.atrasadas || []).length - (a.respuestas || []).length);
  const lista = (arr, n) => arr.slice(0, n).map(esc).join(' · ') + (arr.length > n ? ` y ${arr.length - n} más` : '');
  cont.innerHTML = `
    <div class="card" style="margin-bottom:10px">
      <div style="font-weight:700;font-size:16px;margin-bottom:6px">Mi semana · ${conMant.length} ${conMant.length === 1 ? 'negocio' : 'negocios'}</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:14px">
        <span><i class="ti ti-send"></i> ${tot('tuyas')} entregas tuyas</span>
        <span><i class="ti ti-brand-whatsapp"></i> ${whats} por WhatsApp</span>
        <span><i class="ti ti-video"></i> ${videos} videollamadas</span>
        <span style="color:#86600F"><i class="ti ti-checkbox"></i> ${tot('suyas')} tareas suyas pendientes</span>
        ${tot('atrasadas') ? `<span style="color:var(--red)"><i class="ti ti-alert-triangle"></i> ${tot('atrasadas')} atrasadas</span>` : ''}
        ${tot('respuestas') ? `<span style="color:var(--olive)"><i class="ti ti-message-circle"></i> ${tot('respuestas')} respuestas nuevas</span>` : ''}
      </div>
    </div>
    ${conMant.map(f => f.error ? `<div class="card" style="margin-bottom:8px"><strong>${esc(f.name)}</strong> <span class="muted">— no se pudo leer su nube ahora mismo.</span></div>` : `
      <div class="card" style="margin-bottom:8px;cursor:pointer" data-t="${esc(f.tenantId)}" data-n="${esc(f.name)}" onclick="mantAbrirDesdeSemana(this.dataset.t, this.dataset.n)">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
          <strong style="flex:1">${esc(f.name)}</strong>
          ${f.canal ? `<span style="font-size:12px"><i class="ti ${f.canal === 'video' ? 'ti-video' : 'ti-brand-whatsapp'}"></i> ${f.canal === 'video' ? 'Videollamada' : 'WhatsApp'}</span>` : '<span class="muted" style="font-size:12px">Sin plan esta semana</span>'}
        </div>
        ${f.tuyas.length ? `<div style="font-size:13px"><span style="color:#2F6B3A;font-weight:600">Tú:</span> ${lista(f.tuyas, 3)}</div>` : ''}
        ${f.suyas.length ? `<div style="font-size:13px"><span style="color:#86600F;font-weight:600">Negocio:</span> ${lista(f.suyas, 3)}</div>` : ''}
        ${f.atrasadas.length ? `<div style="font-size:13px;color:var(--red)"><i class="ti ti-alert-triangle"></i> ${f.atrasadas.length} sin hacer de semanas pasadas: ${lista(f.atrasadas, 2)}</div>` : ''}
        ${f.respuestas.length ? `<div style="font-size:13px;color:var(--olive)"><i class="ti ti-message-circle"></i> Te ha contestado en: ${lista(f.respuestas, 2)}</div>` : ''}
        ${!f.tuyas.length && !f.suyas.length && !f.atrasadas.length && !f.respuestas.length ? `<div class="muted" style="font-size:13px"><i class="ti ti-circle-check"></i> Todo al día${f.hechasSemana ? ` · ${f.hechasSemana} hechas esta semana` : ''}.</div>` : ''}
      </div>`).join('')}
  `;
}
async function mantAbrirDesdeSemana(tenantId, name){
  try{ localStorage.setItem(mantVistoKey(tenantId), String(Date.now())); }catch(e){}
  await openClient(tenantId, name);
  // Espera a que llegue su bloque y entra directo en su mes.
  const t0 = Date.now();
  const esperar = () => {
    if(remoteBiz && currentTenantId === tenantId){ mantMesActivo = null; renderMantPage(); return; }
    if(Date.now() - t0 < 10000) setTimeout(esperar, 150);
  };
  esperar();
}

// Mismo parser que en js/app.js (que ve el negocio): ## título de sección,
// > frase destacada, - punto de lista, | fila de tabla, ✎ campo para
// rellenar. Aquí se usa para la vista previa, debajo del textarea de
// edición — así ves cómo le va a quedar al negocio sin cambiar de pantalla.
function plan360RenderDocBody(body){
  if(!body) return '';
  const lines = body.split('\n');
  let html = '', list = [], quote = [], table = [];
  const flushList = () => { if(list.length){ html += '<ul class="p360-doc-list">' + list.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>'; list = []; } };
  const flushQuote = () => { if(quote.length){ html += '<div class="p360-doc-quote">' + quote.map(x => `<p>${esc(x)}</p>`).join('') + '</div>'; quote = []; } };
  const flushTable = () => {
    if(table.length){
      const [head, ...rows] = table;
      html += '<table class="p360-doc-table"><thead><tr>' + head.map(c => `<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>'
        + rows.map(r => '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
      table = [];
    }
  };
  const flushAll = () => { flushList(); flushQuote(); flushTable(); };
  lines.forEach(raw => {
    const l = raw.trim();
    if(!l){ flushAll(); return; }
    if(l.startsWith('### ')){ flushAll(); html += `<h4 class="p360-doc-h3">${esc(l.slice(4))}</h4>`; return; }
    if(l.startsWith('## ')){ flushAll(); html += `<h3 class="p360-doc-h2">${esc(l.slice(3))}</h3>`; return; }
    if(l.startsWith('> ')){ flushList(); flushTable(); quote.push(l.slice(2)); return; }
    if(l.startsWith('- ')){ flushQuote(); flushTable(); list.push(l.slice(2)); return; }
    if(l.startsWith('|')){ flushList(); flushQuote(); table.push(l.split('|').map(c => c.trim()).filter((c, i, arr) => !(i === 0 && c === '') && !(i === arr.length - 1 && c === ''))); return; }
    if(l.startsWith('✎')){ flushAll(); html += `<div class="p360-doc-fill">${esc(l)}</div>`; return; }
    flushAll();
    html += `<p class="p360-doc-p">${esc(l)}</p>`;
  });
  flushAll();
  return html;
}
// ---- Recursos: editor de bloques, EN el propio documento (no un textarea
// aparte). El coach edita directamente sobre el mismo diseño que verá el
// negocio — "lo que ves es lo que se guarda", nada de escribir marcas a
// mano en una caja de texto. ----
function plan360ParseDocBlocks(body){
  const blocks = [];
  if(!body) return blocks;
  const lines = body.split('\n');
  let list = [], quote = [], table = [];
  const flushList = () => { if(list.length){ blocks.push({type: 'list', items: list}); list = []; } };
  const flushQuote = () => { if(quote.length){ blocks.push({type: 'quote', items: quote}); quote = []; } };
  const flushTable = () => { if(table.length){ blocks.push({type: 'table', rows: table}); table = []; } };
  const flushAll = () => { flushList(); flushQuote(); flushTable(); };
  lines.forEach(raw => {
    const l = raw.trim();
    if(!l){ flushAll(); return; }
    if(l.startsWith('### ')){ flushAll(); blocks.push({type: 'h3', text: l.slice(4)}); return; }
    if(l.startsWith('## ')){ flushAll(); blocks.push({type: 'h2', text: l.slice(3)}); return; }
    if(l.startsWith('> ')){ flushList(); flushTable(); quote.push(l.slice(2)); return; }
    if(l.startsWith('- ')){ flushQuote(); flushTable(); list.push(l.slice(2)); return; }
    if(l.startsWith('|')){ flushList(); flushQuote(); table.push(l.split('|').map(c => c.trim()).filter((c, i, arr) => !(i === 0 && c === '') && !(i === arr.length - 1 && c === ''))); return; }
    if(l.startsWith('✎')){ flushAll(); blocks.push({type: 'fill', text: l}); return; }
    flushAll();
    blocks.push({type: 'p', text: l});
  });
  flushAll();
  return blocks;
}
function plan360BlockToMarkup(b){
  if(b.type === 'h2') return '## ' + b.text;
  if(b.type === 'h3') return '### ' + b.text;
  if(b.type === 'p') return b.text;
  if(b.type === 'fill') return b.text.startsWith('✎') ? b.text : '✎ ' + b.text;
  if(b.type === 'list') return b.items.filter(x => x.trim()).map(x => '- ' + x).join('\n');
  if(b.type === 'quote') return b.items.filter(x => x.trim()).map(x => '> ' + x).join('\n');
  if(b.type === 'table') return b.rows.map(r => '| ' + r.join(' | ') + ' |').join('\n');
  return '';
}
function plan360BlockToHtml(b, idx){
  const tools = `<div class="p360-block-tools">
    <button type="button" title="Subir" onclick="plan360MoveBlock(${idx},-1)"><i class="ti ti-chevron-up"></i></button>
    <button type="button" title="Bajar" onclick="plan360MoveBlock(${idx},1)"><i class="ti ti-chevron-down"></i></button>
    <button type="button" title="Borrar" onclick="plan360DeleteBlock(${idx})"><i class="ti ti-trash"></i></button>
  </div>`;
  let inner = '';
  if(b.type === 'h2') inner = `<h3 class="p360-doc-h2" contenteditable="true">${esc(b.text)}</h3>`;
  else if(b.type === 'h3') inner = `<h4 class="p360-doc-h3" contenteditable="true">${esc(b.text)}</h4>`;
  else if(b.type === 'p') inner = `<p class="p360-doc-p" contenteditable="true">${esc(b.text)}</p>`;
  else if(b.type === 'fill') inner = `<div class="p360-doc-fill" contenteditable="true">${esc(b.text)}</div>`;

function plan360SyncBlockFromDom(idx){
  const b = (window.__plan360EditBlocks || [])[idx];
  const node = document.querySelector(`.p360-block[data-idx="${idx}"]`);
  if(!b || !node) return;
  if(b.type === 'h2' || b.type === 'h3' || b.type === 'p' || b.type === 'fill'){
    const child = node.querySelector('[contenteditable]');
    b.text = (child ? child.textContent : '').trim();
  } else if(b.type === 'list'){
    b.items = [...node.querySelectorAll('li')].map(li => li.textContent.trim());
  } else if(b.type === 'quote'){
    b.items = [...node.querySelectorAll('p')].map(p => p.textContent.trim());
  } else if(b.type === 'table'){
    const head = [...node.querySelectorAll('thead th')].map(th => th.textContent.trim());
    const rows = [...node.querySelectorAll('tbody tr')].map(tr => [...tr.querySelectorAll('td')].map(td => td.textContent.trim()));
    b.rows = [head, ...rows];
  }
}
function plan360SyncAllBlocksFromDom(){
  (window.__plan360EditBlocks || []).forEach((b, i) => plan360SyncBlockFromDom(i));
}
function plan360AddBlock(type){
  plan360SyncAllBlocksFromDom();
  const blocks = window.__plan360EditBlocks || (window.__plan360EditBlocks = []);
  const fresh = {
    h2: {type: 'h2', text: 'Nuevo título'},
    h3: {type: 'h3', text: 'Nuevo subtítulo'},
    p: {type: 'p', text: ''},
    list: {type: 'list', items: ['']},
    quote: {type: 'quote', items: ['']},
    fill: {type: 'fill', text: '✎ Completar…'},
    table: {type: 'table', rows: [['Columna 1', 'Columna 2'], ['', '']]},
  }[type];
  if(!fresh) return;
  blocks.push(fresh);
  plan360RenderDocEditor();
  const nodes = document.querySelectorAll('.p360-block');
  const last = nodes[nodes.length - 1];
  const focusable = last && last.querySelector('[contenteditable]');
  if(focusable) focusable.focus();
}
function plan360AddTableRow(idx){
  plan360SyncBlockFromDom(idx);
  const b = (window.__plan360EditBlocks || [])[idx];

function plan360MoveBlock(idx, dir){
  plan360SyncAllBlocksFromDom();

  [blocks[idx], blocks[j]] = [blocks[j], blocks[idx]];
  plan360RenderDocEditor();
}
function plan360DeleteBlock(idx){

/* ---- Descargar en PDF: el mismo documento, pero como archivo de verdad
   (ventana de impresión → "Guardar como PDF", igual que el resto de
   informes de la app — cero coste, nada de librerías). El contenido se
   adapta según cómo sea la respuesta, en vez de repetir 150 veces el
   mismo bloque "pregunta en cursiva + párrafo":
   - varias líneas o una lista corta separada por comas → lista numerada.
   - una respuesta muy corta → dato destacado (grande) con la pregunta
     como etiqueta pequeña debajo, como una ficha.
   - el resto → párrafo normal.
   Las 5 preguntas de "Competidores directos e indirectos (DAFO)" se
   reconocen por su enunciado y se pintan como una matriz con líneas
   gruesas en vez de una lista más. Nada sin responder aparece: es la
   entrega final, no el borrador de trabajo. */
function plan360FormatearRespuesta(texto){
  const t = (texto || '').trim();
  if(!t) return null;
  const lineas = t.split('\n').map(x => x.trim()).filter(Boolean);
  if(lineas.length >= 2) return {tipo: 'lista', items: lineas};
  if(!t.includes('.') && t.length < 180){
    const partes = t.split(/[;,]\s+/).map(x => x.trim()).filter(Boolean);
    if(partes.length >= 3) return {tipo: 'lista', items: partes};
  }
  if(t.length <= 90) return {tipo: 'corta', texto: t};
  return {tipo: 'larga', texto: t};
}
function plan360RenderPreguntaPdf(q){
  const f = plan360FormatearRespuesta(q.a);
  if(!f) return '';
  if(f.tipo === 'lista'){
    return `<div class="lm-bloque">
      <div class="lm-q">${esc(q.q)}</div>
      <div class="lm-lista">${f.items.map((it, i) => `<div class="lm-lista-item"><span class="lm-lista-num">${String(i + 1).padStart(2, '0')}</span><span>${esc(it)}</span></div>`).join('')}</div>
    </div>`;
  }
  if(f.tipo === 'corta'){
    return `<div class="lm-bloque lm-corta">
      <div class="lm-corta-valor">${esc(f.texto)}</div>
      <div class="lm-corta-label">${esc(q.q)}</div>
    </div>`;
  }
  return `<div class="lm-bloque">
    <div class="lm-q">${esc(q.q)}</div>
    <div class="lm-p">${esc(f.texto)}</div>
  </div>`;
}
function plan360EsSubsecDafo(title){
  return title === 'Competidores directos e indirectos (DAFO)';

function plan360RenderDafoPdf(subsec){
  const buscar = p => { const q = subsec.questions.find(x => x.q.startsWith(p)); return (q && q.a) ? q.a.trim() : ''; };
  const partir = t => {
    const l = t.split('\n').map(x => x.trim()).filter(Boolean);
    return (l.length >= 2 ? l : t.split(/[;,]\s+/).map(x => x.trim()).filter(Boolean)).filter(Boolean);
  };
  const cuadrantes = [
    {label: 'Fortalezas', color: '#4A5D4E', items: partir(buscar('Analiza 5 fortalezas'))},
    {label: 'Debilidades', color: '#8A4A3B', items: partir(buscar('Analiza 5 debilidades'))},
    {label: 'Oportunidades', color: '#4A5D4E', items: partir(buscar('Analiza 5 oportunidades'))},
    {label: 'Amenazas', color: '#8A4A3B', items: partir(buscar('Analiza 5 amenazas'))},
  ];
  const otras = subsec.questions.filter(q => !/^Analiza 5 (fortalezas|debilidades|oportunidades|amenazas)/.test(q.q) && q.a);
  const matriz = cuadrantes.some(c => c.items.length) ? `
    <div class="lm-h3">Síntesis del DAFO</div>
    <div class="lm-dafo">
      ${cuadrantes.map(c => `<div class="lm-dafo-cuad">

        ${c.items.length ? c.items.map(it => `<div class="lm-dafo-item">${esc(it)}</div>`).join('') : '<div class="lm-dafo-item lm-muted">—</div>'}
      </div>`).join('')}
    </div>` : '';
  return otras.map(plan360RenderPreguntaPdf).join('') + matriz;
}

function descargarLibroMarcaPdf(){
  const dia1 = (remoteBiz.plan360Program || []).find(x => x.day === 1);
  const negocio = dia1 && dia1.negocio;
  if(!negocio) return;
  const win = window.open('', '_blank');
  if(!win){ alert('El navegador ha bloqueado la ventana emergente — permite pop-ups para descargar el PDF.'); return; }
  win.document.write(plan360ConstruirHtmlLibroMarcaPdf(negocio, plan360LibroImagenesDeArea, remoteBiz.name || 'tu negocio'));
  win.document.close();
}
const PLAN360_LIBRO_PDF_MAX_MB = 7; // en base64 ocupa un tercio más: 7 MB ≈ 9,4 MB, bajo el tope de 10 MB por texto de Firebase
function libroTienePdf(doc){ return !!(doc && (doc.pdfData || doc.pdfName)); }
// Libros subidos antes de separar el PDF: se mudan solos al abrir el negocio.
function migrarLibroPdfANodo(){
  const doc = (remoteBiz.plan360Docs || []).find(d => d.id === 'identidad');
  if(!doc || !doc.pdfData || !currentLibroPdfRef) return;
  const data = doc.pdfData;
  currentLibroPdfRef.set({data, nombre: doc.pdfName || 'libro-de-marca.pdf', size: doc.pdfSize || 0, subidoAt: Date.now()}).then(() => {
    libroPdfCache = data;
    doc.pdfData = null;
    saveRemoteBiz();
  }).catch(e => console.error('No se pudo mudar el PDF del Libro de marca', e));
}
async function verLibroPdf(){
  let data = libroPdfCache;
  if(!data && currentLibroPdfRef){
    const snap = await currentLibroPdfRef.once('value');
    data = snap.val() && snap.val().data;
    libroPdfCache = data || null;
  }
  const doc = (remoteBiz.plan360Docs || []).find(d => d.id === 'identidad');
  data = data || (doc && doc.pdfData);
  if(!data){ alert('No se encontró el PDF en la nube del negocio.'); return; }
  const a = document.createElement('a');
  a.href = data; a.download = (doc && doc.pdfName) || 'libro-de-marca.pdf';
  document.body.appendChild(a); a.click(); a.remove();
}
function subirLibroMarcaPdf(input){
  const file = input.files[0];
  if(!file) return;
  if(file.type !== 'application/pdf'){
    alert('Tiene que ser un PDF.');
    input.value = '';
    return;
  }
  if(file.size > PLAN360_LIBRO_PDF_MAX_MB * 1024 * 1024){
    alert('El PDF pesa demasiado (máximo ' + PLAN360_LIBRO_PDF_MAX_MB + ' MB). Comprímelo o exporta las fotos a menor resolución.');
    input.value = '';
    return;
  }
  const doc = (remoteBiz.plan360Docs || []).find(d => d.id === 'identidad');
  if(!doc) return;
  const reader = new FileReader();
  reader.onload = () => {
    if(!currentLibroPdfRef){ alert('No hay conexión con la nube del negocio.'); return; }
    const data = reader.result;
    currentLibroPdfRef.set({data, nombre: file.name, size: file.size, subidoAt: Date.now()}).then(() => {
      libroPdfCache = data;
      doc.pdfData = null;
      doc.pdfName = file.name;
      doc.pdfSize = file.size;
      saveRemoteBiz();
      renderLibroMarcaHub();
    }).catch(e => alert('No se pudo subir el PDF: ' + (e.message || e.code || 'error')));
  };
  reader.onerror = () => alert('No se pudo leer el archivo.');
  reader.readAsDataURL(file);
}
function quitarLibroMarcaPdf(){
  if(!confirm('¿Quitar el PDF subido? El negocio dejará de verlo.')) return;
  const doc = (remoteBiz.plan360Docs || []).find(d => d.id === 'identidad');
  if(!doc) return;
  if(currentLibroPdfRef) currentLibroPdfRef.remove().catch(e => console.error(e));
  libroPdfCache = null;
  doc.pdfData = null;
  doc.pdfName = null;
  doc.pdfSize = null;
  saveRemoteBiz();
  renderLibroMarcaHub();
}

// redacte el libro de marca — no hay IA dentro de la app, es el propio
// coach quien lleva esto a la conversación y trae de vuelta el texto ya
// escrito para pegarlo en la plantilla del libro de marca.
function plan360NegocioComoTexto(d){
  let out = 'CUESTIONARIO EN PROFUNDIDAD — ' + (remoteBiz.name || 'negocio') + '\n\n';
  d.negocio.areas.forEach(a => {
    out += '=== ' + a.title.toUpperCase() + ' ===\n\n';
    a.subsections.forEach(s => {
      out += '-- ' + s.title + ' --\n';
      s.questions.forEach(q => {
        out += 'P: ' + q.q + '\n';
        out += 'R: ' + (q.a ? q.a : '(sin responder)') + (q.archivo && q.fileName ? '  [archivo adjunto: ' + q.fileName + ']' : '') + '\n\n';
      });
    });
  });
  return out;
}

function subirArchivoNegocio(input, day, areaIdx, subIdx, qIdx){

// Un solo punto de entrada para "cuántos lleva este equipo en este
// sentido", sea cual sea su forma (sopa / banco / reto) — así el
// marcador general y el desglose final no tienen que saber los detalles
// de cada uno.
// Los 5 sentidos usan solo dos formas: Vista es la sopa de letras
// (tbSopaTotal) y las otras 4 son un banco compartido (tbBancoTotal) —
// ya no queda ningún sentido con el modelo viejo de "reto" (dos listas,
// una por equipo), así que no hace falta rama para eso.
function tbSentidoTotal(tb, senId, equipo){
  if(senId === 'vista') return tbSopaTotal(tb.sentidos.vista, equipo);
  return tbBancoTotal(tb.sentidos[senId], equipo);
}
function tbTotalGeneral(tb, equipo){
  let total = (tb.kahoot.puntos[equipo] || 0) + (tb.creatividad.puntos[equipo] || 0);
  PLAN360_TB_SENTIDOS.forEach(sen => { total += tbSentidoTotal(tb, sen.id, equipo); });
  return total;
}
// Autorreparación: un negocio real se ha quedado con sentidos en una
// forma incompleta o antigua más de una vez ya (primero .vista sin el
// resto; luego cada sentido de sonido/olor/sabor/tacto pasó del modelo
// viejo "reto" al banco compartido). En vez de que cada función que
// toca tb.sentidos[algo] tenga que defenderse por su cuenta, se repara
// aquí, en el único sitio por el que pasa cualquier acceso al team
// building — así ningún negocio se queda con una pantalla rota, tenga
// la forma que tenga su dato guardado.
function tbSentidosRepair(tb){
  if(!tb || !tb.sentidos) return;
  PLAN360_TB_SENTIDOS.forEach(sen => {
    if(sen.id === 'vista'){
      if(!tb.sentidos.vista || !Array.isArray(tb.sentidos.vista.palabras)) tb.sentidos.vista = plan360FreshSopa();
    } else if(!tb.sentidos[sen.id] || !Array.isArray(tb.sentidos[sen.id].items)){
      tb.sentidos[sen.id] = plan360FreshBanco();
    }
  });
  if(tb.creatividad){
    if(!tb.creatividad.notas) tb.creatividad.notas = {A: {}, B: {}};
    if(!tb.creatividad.notas.A) tb.creatividad.notas.A = {};
    if(!tb.creatividad.notas.B) tb.creatividad.notas.B = {};
  }
  if(!tb.creatividad || !Array.isArray(tb.creatividad.criterios)){
    const fresh = plan360FreshTeamBuilding().creatividad;
    tb.creatividad = {...fresh, ...tb.creatividad, criterios: (tb.creatividad && tb.creatividad.criterios) || fresh.criterios, notas: (tb.creatividad && tb.creatividad.notas) || fresh.notas};
  }
}
function tbGet(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d || !d.teamBuilding) return null;
  tbSentidosRepair(d.teamBuilding);
  return d.teamBuilding;
}
// Cabecera con el marcador GENERAL, fija arriba en las 3 pruebas — así
// se sabe en todo momento quién va ganando, no solo en la pantalla final.
function tbMiniMarcador(tb){
  const totalA = tbTotalGeneral(tb, 'A'), totalB = tbTotalGeneral(tb, 'B');
  return `
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;margin-bottom:14px;font-weight:700"
      title="${esc(tb.equipoA)}: ${esc(tb.integrantesA || 'sin integrantes anotados')}\n${esc(tb.equipoB)}: ${esc(tb.integrantesB || 'sin integrantes anotados')}">
      <span>${esc(tb.equipoA)}</span><span style="font-size:18px">${totalA}</span>
      <span style="opacity:.5">—</span>
      <span style="font-size:18px">${totalB}</span><span>${esc(tb.equipoB)}</span>
    </div>`;
}
// La tira de las 9 pantallas — se pulsa cualquiera directamente, no hace
// falta ir en orden (el coach puede saltar a Creatividad si ya lo dejó
// preparado y volver luego al Kahoot).
const PLAN360_TB_PANTALLA_LABEL = {intro:'Explicación', kahoot:'Test', oido:'Oído', gusto:'Gusto', olfato:'Olfato', tacto:'Tacto', vista:'Vista', creatividad:'Prueba 3 · Creatividad', final:'Marcador final'};
function tbNav(day, actual){
  // Envuelta en su propia caja con borde y fondo — suelta entre el resto
  // de botones de la página (Volver, Empezar Prueba 1...) no se leía como
  // una barra de navegación, se confundía con "un montón de botones más".
  return `
    <div style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:16px;background:var(--bg)">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:8px">Ir a</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${PLAN360_TB_PANTALLAS.map(p => `<button class="btn btn-sm ${p===actual?'btn-primary':''}" onclick="tbIr(${day},'${p}')">${esc(PLAN360_TB_PANTALLA_LABEL[p])}</button>`).join('')}
      </div>
    </div>`;
}
function tbIr(day, pantalla){
  const tb = tbGet(day);
  if(!tb) return;
  // La barra de navegación deja saltar a CUALQUIER pantalla en cualquier
  // momento, así que hay que parar aquí, en el único sitio por el que pasa
  // cualquier cambio de pantalla, los cronómetros que no se calculan contra
  // reloj real (el del Test y el de memorizar de Vista) — si no, seguían
  // corriendo de fondo: sonando, tocando datos y forzando un repintado de
  // la pantalla nueva cuando llegaban a cero. El de Creatividad no hace
  // falta pararlo aquí porque se calcula contra Date.now(), no cuenta ticks.
  clearInterval(tbTimerHandle);
  tbTimerHandle = null;
  tbSonidoActivo = false;
  clearInterval(tbMemorizarHandle);
  tbMemorizarHandle = null;
  tb.pantalla = pantalla;
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function renderTeamBuildingPage(day){
  const tb = tbGet(day);
  if(!tb) return;
  document.getElementById('client-grid').innerHTML = `
    <button class="btn btn-sm" onclick="renderDayDetail(${day})">← Día ${day}</button>
    <h2 style="margin:10px 0 4px">Team building</h2>
    <p class="muted" style="margin-bottom:14px">3 pruebas: Test → 5 sentidos → Creatividad. Marca los aciertos en vivo, delante del equipo.</p>
    ${tbNav(day, tb.pantalla)}
    <div id="tb-pantalla"></div>
  `;
  tbRenderPantalla(day, tb);
}
function tbRenderPantalla(day, tb){
  const box = document.getElementById('tb-pantalla');
  if(!box) return;
  // Envuelto en try/catch a propósito: un fallo aquí dejaba la pantalla
  // en blanco sin ninguna pista de qué había pasado ("no me deja entrar,
  // están vacías") — ahora al menos se ve el error de verdad en vez de la
  // nada, para poder arreglarlo con datos reales en vez de a ciegas.
  try{
    if(tb.pantalla === 'intro') return tbRenderIntro(box, day, tb);
    if(tb.pantalla === 'kahoot') return tbRenderKahoot(box, day, tb);
    if(tb.pantalla === 'creatividad') return tbRenderCreatividad(box, day, tb);
    if(tb.pantalla === 'final') return tbRenderFinal(box, day, tb);
    return tbRenderSentido(box, day, tb, tb.pantalla);
  }catch(e){
    console.error('Error pintando team building', tb.pantalla, e);
    box.innerHTML = `<div class="card" style="border:2px solid var(--red)">
      <strong style="color:var(--red)">Error al mostrar esta pantalla</strong>
      <p class="muted" style="margin:8px 0">Pantalla: ${esc(tb.pantalla)} — copia este texto y pásaselo a soporte:</p>
      <pre style="white-space:pre-wrap;font-size:11px;background:var(--bg);padding:10px;border-radius:8px">${esc(e.message)}\n${esc(e.stack || '')}</pre>
      <button class="btn btn-sm" onclick="tbIr(${day},'intro')" style="margin-top:8px">← Volver a Explicación</button>
    </div>`;
  }
}
/* ---- Pantalla 0: Explicación ---- */
// Las 3 pruebas explicadas como tarjetas, no como una lista de texto: se
// lee de un vistazo (icono + número + una frase), no hay que leerse un
// párrafo para saber "qué toca ahora" — el coach lo puede enseñar en

      <i class="ti ${icon}" style="font-size:22px;flex-shrink:0;color:var(--muted)"></i>

}

        <textarea rows="3" placeholder="Un nombre por línea" oninput="tbIntegrantesLocal(${day},'B',this.value)" onblur="tbIntegrantesGuardar(${day},'B',this.value)" style="width:100%">${esc(tb.integrantesB || '')}</textarea>
      </div>
    </div>
    <details class="card">

      <div class="field" style="margin-top:10px"><label>Guion</label><textarea id="tb-script" rows="14">${esc(tb.script || '')}</textarea></div>
      <button class="btn btn-sm" onclick="saveTeamBuilding(${day})">Guardar guion</button>

// Bug real reportado: con solo onchange (dispara al perder el foco), si
// el coach escribía los integrantes y pulsaba directamente una pestaña de
// navegación SIN hacer clic fuera del textarea antes, el cambio nunca
// llegaba a dispararse y esa pantalla se repintaba entera con el dato
// vacío de antes — parecía que "no dejaba poner integrantes" cuando en
// realidad es que se perdía silenciosamente. Con oninput el dato ya vive
// en el objeto en memoria en cada tecla (ninguna navegación puede
// perderlo); onblur es solo el momento en que además se guarda en la nube.
function tbIntegrantesLocal(day, equipo, valor){
  const tb = tbGet(day);
  if(!tb) return;
  tb[equipo === 'A' ? 'integrantesA' : 'integrantesB'] = valor;
}
function tbIntegrantesGuardar(day, equipo, valor){
  tbIntegrantesLocal(day, equipo, valor);
  saveRemoteBiz();
}
function tbRenombrar(day, equipo, valor){
  const tb = tbGet(day);
  if(!tb) return;
  const limpio = (valor || '').trim() || (equipo === 'A' ? 'Equipo A' : 'Equipo B');
  tb[equipo === 'A' ? 'equipoA' : 'equipoB'] = limpio;
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function saveTeamBuilding(day){
  const tb = tbGet(day);
  if(!tb) return;
  const ta = document.getElementById('tb-script');
  if(ta) tb.script = ta.value.trim();
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function marcarTeamBuildingHecha(day){
  const tb = tbGet(day);
  if(!tb) return;
  tb.completadoAt = Date.now();
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
/* ---- Pantalla Kahoot (Prueba 1): una pregunta a la vez, con cuenta
   atrás y tictac de fondo (sintetizado, sin depender de ningún archivo
   de audio externo), el coach marca qué equipo acertó primero.

   Formato de respuesta: EN VOZ ALTA, no por móvil — montar un buzz-in
   real desde el móvil de cada equipo exigiría que cada uno entre a una
   sala en vivo desde su propio aparato y una sincronización en tiempo
   real con esta pantalla (WebSockets o Firebase Realtime, con un código
   de sala, reconexión si alguien pierde cobertura...). Es una app
   aparte, no una tarde de mejora. La cuenta atrás + el tictac ya dan la
   tensión de un Kahoot real sin ese coste: los equipos gritan la
   respuesta y el coach, que ve la pantalla, decide quién la dijo
   primero — exactamente el mismo criterio que ya usa el resto de
   pruebas (el coach arbitra en vivo, no hace falta un buzzer). */
const PLAN360_TB_DIFICULTAD_LABEL = {facil: 'Fácil', media: 'Media', dificil: 'Difícil'};
const PLAN360_TB_DIFICULTAD_COLOR = {facil: 'var(--green)', media: 'var(--amber, #c98a1f)', dificil: 'var(--red)'};
// Los 4 colores + forma de Kahoot de verdad (rojo triángulo, azul rombo,
// amarillo círculo, verde cuadrado) — así las opciones se pueden nombrar
// a voces ("¡la roja!", "¡el rombo azul!") sin tener que leer el texto
// entero, que es justo el punto de ese diseño y lo que lo hace sentir
// como el juego real y no cuatro cajas blancas con un borde.
const PLAN360_TB_FORMAS = [
  {color: '#E53E3E', icon: 'ti-triangle'},
  {color: '#3182CE', icon: 'ti-diamond'},
  {color: '#D69E2E', icon: 'ti-circle'},
  {color: '#38A169', icon: 'ti-square'},
];
let tbTimerHandle = null;
let tbTimerRestante = 0;
let tbAudioCtx = null;
let tbSonidoActivo = false;
function tbGetAudioCtx(){
  if(!tbAudioCtx) tbAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return tbAudioCtx;
}
function tbTic(){
  // Un "tic" corto sintetizado con el propio navegador — nada que
  // descargar ni alojar, y funciona sin conexión en mitad de una sala.
  try{
    const ctx = tbGetAudioCtx();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.05, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.08);
  }catch(e){ /* algunos navegadores exigen una interacción antes de sonar — no pasa nada, sigue sin sonido */ }
}
// Acorde ascendente al revelar la respuesta — el "ta-chán" corto que
// marca el corte entre "se está jugando" y "esto es lo que era".
function tbAcorde(){
  try{
    const ctx = tbGetAudioCtx();
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.frequency.value = freq;
      const t0 = ctx.currentTime + i * 0.08;
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.exponentialRampToValueAtTime(0.08, t0 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 0.5);
    });
  }catch(e){}
}
function tbKahootEmpezarTiempo(day){
  const tb = tbGet(day);
  if(!tb) return;
  clearInterval(tbTimerHandle);
  tbTimerRestante = tb.kahoot.tiempoSeg;
  tbSonidoActivo = true;
  tbTimerHandle = setInterval(() => {
    tbTimerRestante--;
    if(tbSonidoActivo) tbTic();
    const barra = document.getElementById('tb-kahoot-barra');
    const num = document.getElementById('tb-kahoot-num');
    if(barra) barra.style.width = Math.max(0, (tbTimerRestante / tb.kahoot.tiempoSeg) * 100) + '%';
    if(num) num.textContent = Math.max(0, tbTimerRestante);
    // Al agotarse el tiempo se revela sola — como en el Kahoot real, no
    // hace falta que el coach pulse nada si nadie contestó a tiempo.
    if(tbTimerRestante <= 0) tbKahootRevelar(day);
  }, 1000);
  renderTeamBuildingPage(day);
}
function tbKahootPararTiempo(){
  clearInterval(tbTimerHandle);
  tbTimerHandle = null;
  tbSonidoActivo = false;
}
// Revelar es un paso propio, separado de marcar quién acertó — mientras
// no se revela, ni el propio coach ve la opción correcta resaltada en su
// pantalla: así se puede tener la pantalla a la vista del equipo (móvil,
// tablet, proyector) sin chafar la respuesta antes de tiempo.
function tbKahootRevelar(day){
  const tb = tbGet(day);
  if(!tb) return;
  tbKahootPararTiempo();
  tb.kahoot.revelada = true;
  tbAcorde();
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbRenderKahoot(box, day, tb){
  const k = tb.kahoot;
  if(k.terminado) return tbRenderKahootResultado(box, day, tb);
  const total = k.preguntas.length;
  const i = Math.min(k.actual, Math.max(0, total - 1));
  const q = k.preguntas[i];
  const corriendo = tbTimerHandle !== null;
  const marc = k.marcActual || (k.marcActual = {A: false, B: false});
  box.innerHTML = `
    ${tbMiniMarcador(tb)}
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px">
        <strong>Test</strong>
        <span class="muted">Pregunta ${total ? i + 1 : 0} de ${total}</span>
      </div>
      ${!q ? '<p class="muted">No hay preguntas todavía — añade alguna en el editor de abajo.</p>' : `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;background:${PLAN360_TB_DIFICULTAD_COLOR[q.dificultad]||'var(--muted)'}">${esc(PLAN360_TB_DIFICULTAD_LABEL[q.dificultad] || '')}</span>
          <div style="flex:1;height:8px;background:var(--bg);border-radius:99px;overflow:hidden">
            <div id="tb-kahoot-barra" style="height:100%;background:var(--ink);width:${corriendo ? (tbTimerRestante/k.tiempoSeg*100) : (k.revelada?0:100)}%;transition:width 1s linear"></div>
          </div>
          <span id="tb-kahoot-num" style="font-weight:800;min-width:22px;text-align:right">${corriendo ? Math.max(0,tbTimerRestante) : (k.revelada?0:k.tiempoSeg)}</span>
        </div>
        <div style="font-size:20px;font-weight:800;margin-bottom:14px;text-align:center">${esc(q.texto)}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
          ${q.opciones.map((op, oi) => {
            const forma = PLAN360_TB_FORMAS[oi] || PLAN360_TB_FORMAS[0];
            const esCorrecta = k.revelada && oi === q.correcta;
            const atenuada = k.revelada && oi !== q.correcta;
            return `
            <div style="padding:16px 12px;border-radius:10px;background:${forma.color};color:#fff;display:flex;align-items:center;gap:10px;min-height:64px;
              opacity:${atenuada?0.35:1};transform:${esCorrecta?'scale(1.03)':'scale(1)'};
              box-shadow:${esCorrecta?'0 0 0 3px #fff, 0 0 0 6px '+forma.color:'none'};transition:all .3s ease">
              <i class="ti ${forma.icon}" style="font-size:22px;flex-shrink:0"></i>
              <span style="font-weight:700;font-size:15px">${esc(op)}</span>
              ${esCorrecta ? '<i class="ti ti-check" style="margin-left:auto;font-size:22px"></i>' : ''}
            </div>`;
          }).join('')}
        </div>
        ${!k.revelada ? `
          <p class="muted" style="font-size:12px">Enseña esta pantalla al equipo si quieres (la respuesta no se ve hasta revelarla). Se responde EN VOZ ALTA, nombrando el color o la forma.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${!corriendo ? `<button class="btn btn-sm" onclick="tbKahootEmpezarTiempo(${day})"><i class="ti ti-player-play"></i> Empezar tiempo (${k.tiempoSeg}s)</button>`
                         : `<button class="btn btn-sm" onclick="tbKahootPararTiempo();renderTeamBuildingPage(${day})"><i class="ti ti-player-pause"></i> Parar tiempo</button>`}
            <button class="btn btn-primary" onclick="tbKahootRevelar(${day})">Ver respuesta →</button>
          </div>
        ` : `
          <p class="muted" style="font-size:12px">¿Qué equipos la acertaron? Los dos pueden llevarse el punto si los dos la dijeron bien.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
            <button class="btn ${marc.A?'btn-primary':''}" onclick="tbKahootPunto(${day},'A')">${marc.A?'✓ ':''}Acertó ${esc(tb.equipoA)}</button>
            <button class="btn ${marc.B?'btn-primary':''}" onclick="tbKahootPunto(${day},'B')">${marc.B?'✓ ':''}Acertó ${esc(tb.equipoB)}</button>
          </div>
          <button class="btn btn-sm" onclick="tbKahootSiguiente(${day})">${i < total - 1 ? 'Siguiente pregunta →' : 'Ver resultado del Test →'}</button>
        `}
      `}
    </div>

function tbKahootRepetir(day){
  const tb = tbGet(day);
  if(!tb) return;
  tb.kahoot.actual = 0;
  tb.kahoot.revelada = false;
  tb.kahoot.terminado = false;
  tb.kahoot.marcActual = {A: false, B: false};
  tb.kahoot.puntos = {A: 0, B: 0};
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}

  const tb = tbGet(day);

  tb.kahoot.tiempoSeg = Math.max(5, Number(valor) || 20);

  renderTeamBuildingPage(day);
}

}
// Botón-interruptor: los dos equipos pueden acertar la misma pregunta
// (antes marcar uno pasaba sola a la siguiente y el otro equipo, aunque
// también hubiera contestado bien, se quedaba sin su punto). Pulsar de
// nuevo quita el punto, por si se toca sin querer.
function tbKahootPunto(day, equipo){
  const tb = tbGet(day);
  if(!tb) return;
  const marc = tb.kahoot.marcActual || (tb.kahoot.marcActual = {A: false, B: false});
  const yaMarcado = marc[equipo];
  tb.kahoot.puntos[equipo] = Math.max(0, (tb.kahoot.puntos[equipo] || 0) + (yaMarcado ? -1 : 1));
  marc[equipo] = !yaMarcado;
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbKahootSiguiente(day){
  const tb = tbGet(day);
  if(!tb) return;
  tbKahootPararTiempo();
  const k = tb.kahoot;
  if(k.actual >= k.preguntas.length - 1){
    // Pregunta 30 ya resuelta: no hay pregunta 31, toca ver el resultado.
    k.terminado = true;
    saveRemoteBiz();
    renderTeamBuildingPage(day);
    return;
  }
  k.actual++;
  k.revelada = false;
  k.marcActual = {A: false, B: false};
  saveRemoteBiz();
  // La pregunta siguiente empieza sola — el coach no tiene que volver a
  // pulsar "Empezar tiempo" cada vez, solo la primera de todas.
  tbKahootEmpezarTiempo(day);
}

/* -- Oído / Olfato / Gusto / Tacto: reto por listas -----------------

   archivo de sonido y reproducirlo ahí mismo — Olfato/Gusto/Tacto son

// El Test arranca con 30 preguntas listas y la sopa con 12 palabras —

function tbBancoSubirAudio(ev, day, senId, idx){

  const it = tb.sentidos[senId].items[idx];

function tbBancoReproducir(url){
  // Los sonidos son un blob local (URL.createObjectURL): si la página se
  // refrescó desde que se subieron, el blob ya no existe y .play() falla
  // de forma ASÍNCRONA (una promesa rechazada, no una excepción), así que
  // el try/catch de siempre no la atrapaba — sonaba a "no ha hecho nada"
  // en vez de avisar de que hay que volver a subir el archivo.
  try{
    const p = new Audio(url).play();
    if(p && p.catch) p.catch(() => alert('No se puede reproducir: si la página se refrescó desde que se subió, hay que volver a subirlo.'));
  }catch(e){}
}

/* -- Vista: sopa de letras interactiva --------------------------------
   Antes era solo una imagen de la cuadrícula, sin más interacción que
   los botones de +1/-1 sueltos — "de juguete", tal cual lo describió el
   coach. Ahora se puede tocar de verdad: se pulsa la primera letra de
   una palabra y la última, se traza la línea recta entre ellas (recta
   en cualquiera de las 8 direcciones, del derecho o del revés) y si
   coincide con una palabra pendiente, queda marcada en el sitio y pide
   a quién dar el punto. */
function tbGenerarSopa(palabras, size){
  size = size || PLAN360_TB_SOPA_SIZE;
  const grid = Array.from({length: size}, () => Array(size).fill(null));
  const dirs = [[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1],[1,-1],[-1,1]];
  palabras.forEach(palabra => {
    const w = (palabra || '').toUpperCase().replace(/[^A-ZÑ]/g, '');
    if(!w || w.length > size) return;
    let colocada = false, intentos = 0;
    while(!colocada && intentos < 400){
      intentos++;
      const dir = dirs[Math.floor(Math.random() * dirs.length)];
      const f0 = Math.floor(Math.random() * size), c0 = Math.floor(Math.random() * size);
      const fFin = f0 + dir[0] * (w.length - 1), cFin = c0 + dir[1] * (w.length - 1);
      if(fFin < 0 || fFin >= size || cFin < 0 || cFin >= size) continue;
      let cabe = true;
      for(let i = 0; i < w.length; i++){
        const f = f0 + dir[0] * i, c = c0 + dir[1] * i;
        if(grid[f][c] && grid[f][c] !== w[i]){ cabe = false; break; }
      }
      if(!cabe) continue;
      for(let i = 0; i < w.length; i++){
        const f = f0 + dir[0] * i, c = c0 + dir[1] * i;
        grid[f][c] = w[i];
      }
      colocada = true;
    }
  });
  const letras = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ';
  for(let f = 0; f < size; f++) for(let c = 0; c < size; c++){
    if(!grid[f][c]) grid[f][c] = letras[Math.floor(Math.random() * letras.length)];
  }
  return grid;
}

function tbSopaClick(day, f, c){
  const tb = tbGet(day);
  if(!tb) return;
  const v = tb.sentidos.vista;
  if(!v.equipoActivo) return;  // hay que elegir primero quién está buscando
  if(Object.values(v.encontradas || {}).some(e => e.celdas.some(([ff,cc]) => ff===f && cc===c))) return; // ya encontrada, no se vuelve a tocar
  if(!tbSopaSel){ tbSopaSel = {f, c}; renderTeamBuildingPage(day); return; }
  const {f: f0, c: c0} = tbSopaSel;
  tbSopaSel = null;
  if(f0 === f && c0 === c){ renderTeamBuildingPage(day); return; }
  const recta = f === f0 || c === c0 || Math.abs(f - f0) === Math.abs(c - c0);
  if(!recta){ renderTeamBuildingPage(day); return; }
  const df = Math.sign(f - f0), dc = Math.sign(c - c0);
  const len = Math.max(Math.abs(f - f0), Math.abs(c - c0)) + 1;
  const celdas = [];
  let str = '';
  for(let i = 0; i < len; i++){
    const ff = f0 + df * i, cc = c0 + dc * i;
    celdas.push([ff, cc]);
    str += v.sopa[ff][cc];
  }
  const rev = str.split('').reverse().join('');
  const match = v.palabras.map(w => w.toUpperCase()).find(w => (w === str || w === rev) && !(v.encontradas || {})[w]);
  if(match){
    // Se apunta directa al equipo activo — sin diálogo de por medio,
    // que es justo lo que pedía el coach: elegir el equipo ANTES de
    // buscar, no después de encontrar la palabra.
    (v.encontradas || (v.encontradas = {}))[match] = {equipo: v.equipoActivo, celdas};
    saveRemoteBiz();
  }
  renderTeamBuildingPage(day);
}

function tbCreatividadResolver(day){
  const tb = tbGet(day);
  if(!tb) return;
  const c = tb.creatividad;
  const subA = c.criterios.reduce((s, cr) => s + (c.notas.A[cr] || 0), 0);
  const subB = c.criterios.reduce((s, cr) => s + (c.notas.B[cr] || 0), 0);

  renderTeamBuildingPage(day);

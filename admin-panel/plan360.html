<style>
/* Mismo sistema de diseño que la app y que admin-panel/app.html. */
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/schibsted-grotesk-400-normal.woff2") format("woff2");}
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/schibsted-grotesk-600-normal.woff2") format("woff2");}
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/schibsted-grotesk-700-normal.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/ibm-plex-mono-400-normal.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/ibm-plex-mono-500-normal.woff2") format("woff2");}
:root{
  --ink:#1C1A17; --olive:#4A5D4E; --cream:#F1EFE9; --bg:#FAF8F4; --surface:#FFFFFF; --border:#E7E2D9;
  --text:#1C1A17; --body:#3D3A34; --muted:#716C65; --brand-cream:#FAF8F4;
  --green:#4A5D4E; --green-l:#EDF1EC; --red:#8A4A3B; --red-l:#F5EBE7; --amber:#8A7440; --amber-l:#F5F0E3;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Schibsted Grotesk',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--body);min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:20px 20px 80px;display:flex;flex-direction:column;gap:16px}
header{background:var(--ink);color:#FAF8F4;padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .logo{width:40px;height:40px;background:var(--olive);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:none;font-family:'IBM Plex Mono',monospace}
header h1{font-family:'Schibsted Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:180px}
header .hd-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);padding:12px 18px;min-height:46px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;
     text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;background:#fff;color:var(--text)}
.btn:hover{background:var(--cream)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#FAF8F4}
.btn-primary:hover{background:var(--olive);border-color:var(--olive)}
.btn-sm{min-height:36px;padding:7px 12px;font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);padding:18px}
label{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--border);padding:11px;font-size:14px;font-family:inherit;background:#fff;min-height:46px;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.field{margin-bottom:12px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
.hidden{display:none!important}
#login-gate{max-width:420px;margin:60px auto}
#login-gate .card{display:flex;flex-direction:column;gap:12px}
.folder-tile{background:var(--surface);border:1px solid var(--border);padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px}
.folder-tile:hover{background:var(--cream)}
.folder-tile .avatar{width:38px;height:38px;background:var(--ink);color:#FAF8F4;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'IBM Plex Mono',monospace;flex:none}
.status-line{font-size:12.5px;color:var(--muted)}
.p360-toprow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.p360-card{flex:1;min-width:220px;background:#fff;border:1px solid var(--border);padding:16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:background-color .12s ease}
.p360-card:hover{background:var(--brand-cream)}
.p360-card i{font-size:22px;color:var(--ink);flex:none;margin-top:2px}
.p360-card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.p360-card p{font-size:12px;color:var(--muted)}
.p360-summary-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;cursor:pointer;min-height:44px}
.p360-summary-bar:hover{background:var(--brand-cream)}
.p360-summary-count{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted)}
.p360-week{margin-bottom:18px}
.p360-week-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.p360-week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.p360-day{background:#fff;border:1px solid var(--border);border-left:4px solid var(--border);padding:12px 10px;min-height:76px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;justify-content:center}
.p360-day:hover{background:var(--brand-cream)}
.p360-day-weekday{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.p360-day-date{font-size:15px;font-weight:700;overflow-wrap:break-word}
.p360-day-tag{font-size:10.5px;color:var(--muted);margin-top:2px}
.p360-day-progress{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px}
.p360-day-presencial{background:var(--ink);border-left-color:var(--ink);color:#fff}
.p360-day-presencial .p360-day-weekday,.p360-day-presencial .p360-day-tag{color:#fff;opacity:.75}
/* Mismo fallo que en css/styles.css: .p360-day:hover pone fondo claro para
   el resto de días, pero un día presencial (1 y 2) ya tiene fondo oscuro y
   letra blanca — sin esto, al pasar el ratón por encima quedaba texto
   blanco sobre fondo claro, casi invisible. */
.p360-day-presencial:hover{background:var(--olive)}
.p360-task-done .p360-task-text{text-decoration:line-through;color:var(--muted)}
</style>
</head>
<body>

<div id="login-gate" class="wrap">
  <div class="card">
    <h1 style="font-size:18px;margin-bottom:6px">🔑 Plan 360° — panel del coach</h1>
    <p class="muted" style="margin-bottom:14px">Archivo privado. Inicia sesión con tu email y contraseña de administrador.</p>
    <label>Email</label>
    <input id="login-email" type="email" placeholder="gastrogoan@gmail.com" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
    <label style="margin-top:10px">Contraseña</label>
    <input id="login-pass" type="password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" style="width:100%;margin-top:6px" onclick="doLogin()">Entrar</button>
    <p id="login-status" class="muted" style="margin-top:6px"></p>
  </div>
</div>

<div id="panel" class="wrap hidden">
  <header>
    <div class="logo">GG</div>
    <h1>Plan 360°<span style="display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#C9A15A;margin-top:4px">ARCHIVO PRIVADO</span></h1>
    <div class="hd-btns">
      <a class="btn" href="index.html">← Panel</a>
      <button class="btn" onclick="ggAdminHardReload()">↻ Actualizar</button>
      <button class="btn" onclick="doLogout()">Salir</button>
    </div>
  </header>

  <div id="view-list">
    <div class="card" style="margin-bottom:4px"><span class="muted">Clientes con Plan 360° activo. Aparecen solos en cuanto activan la casilla al emitirles el código.</span></div>
    <div id="client-list" style="display:flex;flex-direction:column;gap:8px"></div>
    <p id="client-list-empty" class="muted hidden">Todavía no hay ningún cliente con el Plan 360° activo.</p>
  </div>

let currentTenantId = null;
let currentBizRef = null;
let remoteBiz = null;
let savingRemote = false;
let lastPushedJson = null;

async function openClient(tenantId, name){
  try{ localStorage.setItem(plan360SeenKey(tenantId), String(Date.now())); }catch(e){}
  document.getElementById('view-list').classList.add('hidden');
  document.getElementById('view-client').classList.remove('hidden');

  document.getElementById('client-status').textContent = 'Conectando con su nube...';
  document.getElementById('client-grid').innerHTML = '';
  startDateEditing = false;
  if(currentBizRef) currentBizRef.off();
  if(currentCoachPrivateRef) currentCoachPrivateRef.off();
  currentTenantId = tenantId;
  migracionCoachPrivadoHecha = false;
  try{
    const lookupSnap = await getApp().database().ref('gastrogoan/tenantLookup/' + tenantId).once('value');
    const cfg = lookupSnap.val();
    if(!cfg || !cfg.apiKey || !cfg.databaseURL){
      document.getElementById('client-status').textContent = '⚠️ No se encontró la nube de este negocio (todavía no ha sincronizado ninguna vez).';
      return;
    }
    const appName = 'biz-' + tenantId;
    let bizApp;
    try{ bizApp = firebase.app(appName); }catch(e){ bizApp = firebase.initializeApp(cfg, appName); }
    if(!bizApp.auth().currentUser) await bizApp.auth().signInAnonymously();
    currentBizRef = bizApp.database().ref('gastrogoan/tenants/' + tenantId + '/db/business');
    currentBizRef.on('value', snap => {
      const val = snap.val();
      const json = stableJson(val);
      if(json === lastPushedJson) return; // es el eco de lo que acabamos de escribir nosotros mismos
      remoteBiz = val || {};
      ensureRemotePlan360();
      intentarMigrarReunionPersonal();
      document.getElementById('client-status').textContent = 'Conectado — los cambios se ven al instante en su app, y los suyos aquí.';
      renderClientGrid();
    }, err => {
      console.error(err);
      document.getElementById('client-status').textContent = '⚠️ Error de conexión: ' + (err.message || err.code || 'error');
    });
    // Nodo hermano, no dentro de db/business: por eso necesita su propia
    // conexión. La app del negocio no lo lee nunca, así que aquí no hay
    // ningún "eco de nuestro propio guardado" que temer del lado del
    // negocio — pero sí puede haberlo si este mismo panel está abierto en
    // dos pestañas, de ahí el mismo filtro por lastPushedCoachPrivateJson.
    currentCoachPrivateRef = bizApp.database().ref('gastrogoan/tenants/' + tenantId + '/db/coachPrivate');
    currentCoachPrivateRef.on('value', snap => {
      const val = snap.val();

      if(json === lastPushedCoachPrivateJson) return;
      coachPrivate = val || {};

// Firebase rechaza CUALQUIER escritura que contenga un valor undefined en
// cualquier parte del objeto — no solo ese campo, la escritura entera. Un
// solo dato mal formado en cualquier rincón (día, tarea, objetivo...)
// bastaba para que ESTA función fallara siempre, en silencio, sin que
// nada de lo que se guardara desde el panel llegara nunca a la nube.
function sinIndefinidos(v){
  if(v === undefined) return null;
  if(typeof v === 'number' && !Number.isFinite(v)) return null;
  if(v === null || typeof v !== 'object') return v;
  if(Array.isArray(v)) return Array.from(v, x => x === undefined ? null : sinIndefinidos(x));
  const out = {};
  Object.keys(v).forEach(k => { if(v[k] !== undefined) out[k] = sinIndefinidos(v[k]); });
  return out;
}
// ⚠️ Firebase NO conserva el orden de inserción de las claves de un objeto:
// al releer lo que se acaba de escribir, puede devolver las claves en otro
// orden. Comparar con JSON.stringify normal (sensible al orden) hacía que
// casi CUALQUIER guardado se confundiera con un cambio real llegado de
// fuera y disparara renderClientGrid() — el bug de "al dar tick me manda a
// la pantalla de inicio". stableJson ordena las claves antes de comparar,
// así el eco de nuestro propio guardado se reconoce siempre.
// Igual que genId() en js/core.js (que aquí no está disponible: este panel
// es un HTML autocontenido aparte) — único incluso si dos pestañas del
// panel crean datos casi a la vez.
function plan360GenId(){ return Date.now() * 1000 + Math.floor(Math.random() * 1000); }
function stableJson(v){
  if(Array.isArray(v)) return '[' + v.map(stableJson).join(',') + ']';
  if(v && typeof v === 'object'){
    return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableJson(v[k])).join(',') + '}';
  }
  return JSON.stringify(v);
}
function saveRemoteBiz(){
  if(!currentBizRef || !remoteBiz) return;
  const limpio = sinIndefinidos(remoteBiz);
  lastPushedJson = stableJson(limpio);
  savingRemote = true;
  currentBizRef.set(limpio).catch(e => {
    console.error('Error guardando en la nube del negocio', e);
    alert('No se pudo guardar en la nube: ' + (e.message || e.code || 'error'));
  }).finally(() => { savingRemote = false; });
}
/* ============================================================
   "COACH PRIVATE" — db/coachPrivate, HERMANO de db/business, no dentro.
   Aquí viven las respuestas en crudo de la Voz del equipo (Reunión con el
   personal): antes vivían dentro de reunionPersonal, en el MISMO bloque
   que se sincroniza entero a cada dispositivo del negocio (tablet, móvil
   del dueño, del encargado...) por el simple hecho de abrir la app — la
   promesa de "esto nunca se envía" era solo de interfaz, el dato en
   crudo viajaba igual a cada aparato. Ahora es un nodo hermano que la
   app del negocio NUNCA lee ni descarga: solo este panel lo abre. No
   cambia la limitación ya documentada de que `tenants/$tenantId` da
   lectura a cualquiera autenticado (Cloud Function + Blaze, descartado),
   pero ya no viaja dentro de la sincronización rutinaria de cada aparato.
   ============================================================ */
let currentCoachPrivateRef = null;
let coachPrivate = null;
let lastPushedCoachPrivateJson = null;
function plan360FreshCoachPrivadoDia(){
  return {preguntas: PLAN360_REUNION_PERSONAL_PREGUNTAS.map(q => ({q, a: ''})), notaLibre: ''};
}
// Clave 'd'+day, NUNCA el número desnudo: Firebase Realtime Database
// convierte en ARRAY cualquier objeto cuyas claves sean todas números
// consecutivos, y aquí el día 1 (sin día 0) ya dispara ese caso — con la
// letra delante se guarda siempre como objeto de verdad.
function coachPrivadoClave(day){ return 'd' + day; }
function coachPrivadoDia(day){
  if(!coachPrivate) coachPrivate = {};
  const clave = coachPrivadoClave(day);
  if(!coachPrivate[clave]) coachPrivate[clave] = plan360FreshCoachPrivadoDia();
  return coachPrivate[clave];
}
function saveCoachPrivate(){
  if(!currentCoachPrivateRef || !coachPrivate) return;
  const limpio = sinIndefinidos(coachPrivate);
  lastPushedCoachPrivateJson = stableJson(limpio);
  currentCoachPrivateRef.set(limpio).catch(e => {
    console.error('Error guardando la voz del equipo (privado)', e);
    alert('No se pudo guardar en la nube: ' + (e.message || e.code || 'error'));
  });
}
// Migración de negocios que ya tenían las respuestas en crudo dentro de
// reunionPersonal (de antes de este cambio): se mueven a coachPrivate y se
// borran de remoteBiz en cuanto los dos nodos han cargado al menos una vez.
// Sin esto, un negocio dado de alta antes de este cambio seguiría
// exponiendo las respuestas de su equipo en cada sincronización.
let migracionCoachPrivadoHecha = false;
function intentarMigrarReunionPersonal(){
  if(migracionCoachPrivadoHecha || !remoteBiz || !coachPrivate) return;
  let tocado = false;
  (remoteBiz.plan360Program || []).forEach(d => {
    if(d.reunionPersonal && Array.isArray(d.reunionPersonal.preguntas)){
      const clave = coachPrivadoClave(d.day);
      if(!coachPrivate[clave]){
        coachPrivate[clave] = {preguntas: d.reunionPersonal.preguntas, notaLibre: d.reunionPersonal.notaLibre || ''};
      }
      delete d.reunionPersonal.preguntas;
      delete d.reunionPersonal.notaLibre;
      tocado = true;
    }
  });
  migracionCoachPrivadoHecha = true;
  if(tocado){ saveRemoteBiz(); saveCoachPrivate(); }
}

function plan360MisteryBlockAvg(block){
  const scored = block.items.filter(i => i.score !== null && i.score !== undefined && i.score !== '');
  if(!scored.length) return null;
  const sum = scored.reduce((s, i) => s + Number(i.score), 0);
  return Math.round((sum / scored.length) * 10) / 10;
}
function plan360MisteryOverallAvg(mc){
  const avgs = mc.blocks.map(plan360MisteryBlockAvg).filter(a => a !== null);
  if(!avgs.length) return null;
  return Math.round((avgs.reduce((s, a) => s + a, 0) / avgs.length) * 10) / 10;
}
// Semáforo de la nota (0-10): rojo por debajo de aprobado, ámbar hasta
// notable, verde de ahí para arriba. Mismos colores que el resto de la app.
function plan360ScoreColor(score){
  if(score === null || score === undefined) return null;
  if(score < 5) return 'var(--red)';
  if(score < 7.5) return 'var(--amber)';
  return 'var(--green)';
}

// Team building: no es una nota, es un guion de presentación para leer o
// apoyarse delante de TODO el equipo — de ahí que nazca con un texto real
// y no en blanco. El coach lo ajusta al negocio antes de usarlo.
const PLAN360_TEAMBUILDING_SCRIPT = `EL DESAFÍO DE LOS 5 SENTIDOS
Dinámica de equipo — Día 2, tras presentar el plan. Duración total: 35-40 min.

POR QUÉ ESTA Y NO OTRA
Nada de "reto de cocina" ni de rondas de confianza de manual. Es un JUEGO de verdad, con dos equipos, puntos y un ganador — eso genera la energía y las risas que ningún ejercicio reflexivo consigue. Y de paso entrena algo útil de verdad: el vocabulario sensorial es la herramienta con la que el equipo de sala describe los platos a un cliente.

PREPARACIÓN (antes de la sesión, 15-20 min)
Prepara tú (el coach) el material de los 5 sentidos — así la dinámica arranca rápido y no se pierde tiempo montando cosas delante del equipo:
- OÍDO: 3-4 sonidos grabados (móvil vale) — la freidora, la campana del pase, la cafetera, el cuchillo sobre la tabla...
- GUSTO: 3-4 muestras pequeñas a ciegas de sabores o ingredientes que ellos mismos usan en su carta.
- OLFATO: 3-4 especias o ingredientes con aroma reconocible de su propia cocina.
- TACTO: 3-4 texturas para tocar con los ojos vendados (un producto crudo, algo del almacén, una herramienta).
- VISTA: 3-4 fotos muy recortadas o borrosas de platos o rincones del propio local.

Todo tiene que salir DE SU NEGOCIO, no de objetos random — así el juego no es genérico, es "sobre nosotros", y la gente se ríe reconociendo su propio día a día.

1. DIVISIÓN DE EQUIPOS (2 min)
Dos equipos MEZCLADOS a propósito — cocina y sala repartidos entre los dos, nunca "cocina contra sala". El objetivo es que se conozcan entre puestos, no que gane un departamento.

2. LAS RONDAS (25-30 min)
Por turnos, un equipo presenta al otro una muestra de un sentido (a ciegas cuando aplique: antifaz para gusto, olfato y tacto). El equipo rival adivina. Un acierto = un punto.

Antes de revelar si aciertan, el equipo que preparó la muestra cuenta en 10 segundos POR QUÉ eligió justo eso — un ingrediente que le encanta, un sonido que oye 8 horas al día, una textura con la que curra a diario. Aquí es donde se cuela la parte humana: no es un ejercicio aparte, es parte del juego, y sale sola sin forzarla.

Se van alternando sentidos y turnos hasta agotar el material. Gana el equipo con más puntos.

3. CIERRE (5-8 min)
El equipo ganador elige algo simbólico — poner nombre a un plato nuevo, decidir el orden de turnos de la semana que viene, algo que de verdad pese un poco (nada de trofeos cutres).

Aprovecha este momento, con el equipo ya suelto y de buen humor, para conectar con el mensaje real: "esto es lo que vamos a construir juntos" — y enlaza con los objetivos y el plan que ya habéis presentado antes en la sesión.`;

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDaysStr(fechaStr, dias){
  const [y,m,d] = fechaStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + dias);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function plan360DateForDay(day){
  return addDaysStr(remoteBiz.plan360StartDate || todayStr(), day - 1);
}
function plan360FormatDate(day){
  const dstr = plan360DateForDay(day);
  const [y, m, d] = dstr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return {
    weekday: dt.toLocaleDateString('es-ES', {weekday: 'short'}),
    dayMonth: dt.toLocaleDateString('es-ES', {day: 'numeric', month: 'short'}),
  };
}
function plan360PriorityColor(p){ return p === 'alta' ? 'var(--red)' : p === 'media' ? 'var(--amber)' : p === 'baja' ? 'var(--green)' : null; }
// Aparte de la prioridad de los DÍAS de trabajo (alta/media/baja, ya
// existente): la urgencia de los OBJETIVOS usa sus propias 3 etiquetas.
function plan360ObjPriorityColor(p){ return p === 'prioritario' ? 'var(--red)' : p === 'esencial' ? 'var(--amber)' : p === 'complementario' ? 'var(--green)' : null; }

function plan360CierreKpi(cierre, key){
  if(!cierre.kpis) cierre.kpis = {};
  if(!cierre.kpis[key]) cierre.kpis[key] = {antes: '', hoy: ''};
  return cierre.kpis[key];
}
// No hace falta que nadie cuente a mano cuántas acciones de cada color se
// cerraron: cada tarea ya sabe a qué objetivo está enganchada, y cada
// objetivo ya sabe su nivel (prioritario/esencial/complementario =
// rojo/amarillo/verde) — se cuenta solo.
function plan360AccionesPorNivel(){
  const dia2 = (remoteBiz.plan360Program || []).find(x => x.day === 2);
  const objetivos = ((dia2 && dia2.objectives) || []);
  const trabajo = (remoteBiz.plan360Program || []).filter(x => x.phase === 'trabajo');
  const tareas = trabajo.reduce((arr, d) => arr.concat(d.tasks.filter(tk => tk.title)), []);
  return ['prioritario', 'esencial', 'complementario'].map(nivel => {
    const idsDeNivel = new Set(objetivos.filter(o => o.prioridad === nivel).map(o => o.id));
    const deEseNivel = tareas.filter(tk => idsDeNivel.has(tk.objectiveId));
    return {nivel, total: deEseNivel.length, hechas: deEseNivel.filter(tk => tk.status === 'hecha').length};
  });
}

        ${plan360AccionesPorNivel().map(n => `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span>${PLAN360_NIVEL_LABEL[n.nivel]}</span><span>${n.hechas} / ${n.total}</span></div>`).join('')}

function plan360CierreUsarNotaMisterio(nota){
  if(!remoteBiz.plan360Cierre) remoteBiz.plan360Cierre = plan360FreshCierre();
  plan360CierreKpi(remoteBiz.plan360Cierre, 'notaLocal').antes = String(nota);
  saveRemoteBiz();
  renderClientGrid();
}
function guardarCierreKpi(key, cual, valor){
  if(!remoteBiz.plan360Cierre) remoteBiz.plan360Cierre = plan360FreshCierre();
  plan360CierreKpi(remoteBiz.plan360Cierre, key)[cual] = valor.trim();
  saveRemoteBiz();
}
function guardarCierreTexto(campo, valor){
  if(!remoteBiz.plan360Cierre) remoteBiz.plan360Cierre = plan360FreshCierre();
  remoteBiz.plan360Cierre[campo] = valor.trim();

}
function guardarCierreMantenimientoPrecio(valor){
  if(!remoteBiz.plan360Cierre) remoteBiz.plan360Cierre = plan360FreshCierre();
  if(!remoteBiz.plan360Cierre.mantenimiento) remoteBiz.plan360Cierre.mantenimiento = {precio: '', respuesta: null, volverAHablarFecha: '', firmaNombre: '', firmaFecha: null};
  remoteBiz.plan360Cierre.mantenimiento.precio = valor.trim();
  saveRemoteBiz();
}
function cambiarEstadoFinalObjetivo(objId, valor){
  const dia2 = (remoteBiz.plan360Program || []).find(x => x.day === 2);

  if(!o) return;
  o.estadoFinal = valor || null;
  saveRemoteBiz();
}

/* ---- Libro de marca: espejo visual y resumido del cuestionario en
   profundidad. El coach pega aquí el texto que Claude redacta a partir
   del "Ver / copiar todo" del cuestionario — el diseño es siempre el
   mismo, solo cambia el contenido de cada negocio. Las imágenes de cada
   sección (logo, paleta, moodboard, mesa, vajilla...) se traen SOLAS de
   los archivos ya subidos en el cuestionario, sin volver a subirlas. */
function plan360LibroImagenesDeArea(areaTitle){
  const dia1 = (remoteBiz.plan360Program || []).find(x => x.day === 1);
  const areaNeg = dia1 && dia1.negocio && dia1.negocio.areas.find(a => a.title === areaTitle);
  if(!areaNeg) return [];
  const imgs = [];
  areaNeg.subsections.forEach(s => s.questions.forEach(q => {
    if(q.archivo && q.fileData) imgs.push({name: q.fileName, data: q.fileData});
  }));
  return imgs;
}

  const doc = (remoteBiz.plan360Docs || []).find(d => d.id === 'identidad');

  document.getElementById('client-grid').innerHTML = `

// redacte el libro de marca — no hay IA dentro de la app, es el propio
// coach quien lleva esto a la conversación y trae de vuelta el texto ya
// escrito para pegarlo en la plantilla del libro de marca.
function plan360NegocioComoTexto(d){
  let out = 'CUESTIONARIO EN PROFUNDIDAD — ' + (remoteBiz.name || 'negocio') + '\n\n';
  d.negocio.areas.forEach(a => {
    out += '=== ' + a.title.toUpperCase() + ' ===\n\n';
    a.subsections.forEach(s => {
      out += '-- ' + s.title + ' --\n';
      s.questions.forEach(q => {
        out += 'P: ' + q.q + '\n';
        out += 'R: ' + (q.a ? q.a : '(sin responder)') + (q.archivo && q.fileName ? '  [archivo adjunto: ' + q.fileName + ']' : '') + '\n\n';
      });
    });
  });
  return out;
}

const PLAN360_NEGOCIO_ARCHIVO_MAX_KB = 1500;
function subirArchivoNegocio(input, day, areaIdx, subIdx, qIdx){
  const file = input.files[0];
  if(!file) return;
  if(file.size > PLAN360_NEGOCIO_ARCHIVO_MAX_KB * 1024){
    alert('El archivo pesa demasiado (máximo 1,5 MB).');
    input.value = '';
    return;
  }
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  const block = d && d.negocio && d.negocio.areas[areaIdx] && d.negocio.areas[areaIdx].subsections[subIdx];
  const q = block && block.questions[qIdx];
  if(!q) return;
  plan360SyncNegocioBlock(block);
  const reader = new FileReader();
  reader.onload = () => {
    q.fileData = reader.result;
    q.fileName = file.name;
    saveRemoteBiz();
    renderNegocioBlockPage(day, areaIdx, subIdx);
  };
  reader.onerror = () => alert('No se pudo leer el archivo.');
  reader.readAsDataURL(file);
}

  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  const block = d && d.negocio && d.negocio.areas[areaIdx] && d.negocio.areas[areaIdx].subsections[subIdx];

  renderNegocioBlockPage(day, areaIdx, subIdx);

          <option value="ambar" ${x.enfoqueColor === 'ambar' ? 'selected' : ''}>Ámbar</option>

function guardarEnfoqueDia(workDay){
  const x = (remoteBiz.plan360Program || []).find(p => p.day === workDay);
  if(!x) return;

/* ---- Team building: marcador en vivo + guion de presentación ----
   Dos piezas separadas a propósito: el marcador se toca EN VIVO delante
   del equipo (un tap por acierto, letra grande para leerlo desde lejos —
   la pantalla se puede dejar apoyada en la mesa mientras se juega), el
   guion se prepara ANTES con calma y se consulta menos durante la
   partida. Mezclarlos en un único bloque habría hecho torpe lo segundo
   para ganar algo que el primero no necesita. */
/* ---- Team building: 3 pruebas + explicación + premio final ----
   Kahoot (trivia) → 5 sentidos (uno por pantalla, Vista con sopa de
   letras) → Creatividad (reto de cocina con presupuesto y tiempo) →
   marcador final con el premio para el ganador. Cada pantalla se toca
   EN VIVO delante del equipo — de ahí los botones grandes y el guion de
   preparación aparte, en su propia pantalla, para no estorbar durante
   el juego. */
function tbBancoTotal(banco, equipo){
  return (banco.items || []).filter(it => equipo === 'A' ? it.aciertoA : it.aciertoB).length;
}
function tbSopaTotal(sopa, equipo){
  return Object.values(sopa.encontradas || {}).filter(f => f.equipo === equipo).length;
}
// Un solo punto de entrada para "cuántos lleva este equipo en este
// sentido", sea cual sea su forma (sopa / banco / reto) — así el
// marcador general y el desglose final no tienen que saber los detalles
// de cada uno.
// Los 5 sentidos usan solo dos formas: Vista es la sopa de letras
// (tbSopaTotal) y las otras 4 son un banco compartido (tbBancoTotal) —
// ya no queda ningún sentido con el modelo viejo de "reto" (dos listas,
// una por equipo), así que no hace falta rama para eso.
function tbSentidoTotal(tb, senId, equipo){
  if(senId === 'vista') return tbSopaTotal(tb.sentidos.vista, equipo);
  return tbBancoTotal(tb.sentidos[senId], equipo);
}
function tbTotalGeneral(tb, equipo){
  let total = (tb.kahoot.puntos[equipo] || 0) + (tb.creatividad.puntos[equipo] || 0);
  PLAN360_TB_SENTIDOS.forEach(sen => { total += tbSentidoTotal(tb, sen.id, equipo); });
  return total;
}
// Autorreparación: un negocio real se ha quedado con sentidos en una
// forma incompleta o antigua más de una vez ya (primero .vista sin el
// resto; luego cada sentido de sonido/olor/sabor/tacto pasó del modelo
// viejo "reto" al banco compartido). En vez de que cada función que
// toca tb.sentidos[algo] tenga que defenderse por su cuenta, se repara
// aquí, en el único sitio por el que pasa cualquier acceso al team
// building — así ningún negocio se queda con una pantalla rota, tenga
// la forma que tenga su dato guardado.
function tbSentidosRepair(tb){
  if(!tb || !tb.sentidos) return;
  PLAN360_TB_SENTIDOS.forEach(sen => {
    if(sen.id === 'vista'){
      if(!tb.sentidos.vista || !Array.isArray(tb.sentidos.vista.palabras)) tb.sentidos.vista = plan360FreshSopa();
    } else if(!tb.sentidos[sen.id] || !Array.isArray(tb.sentidos[sen.id].items)){
      tb.sentidos[sen.id] = plan360FreshBanco();
    }
  });
  if(!tb.creatividad || !Array.isArray(tb.creatividad.criterios)){
    const fresh = plan360FreshTeamBuilding().creatividad;
    tb.creatividad = {...fresh, ...tb.creatividad, criterios: (tb.creatividad && tb.creatividad.criterios) || fresh.criterios, notas: (tb.creatividad && tb.creatividad.notas) || fresh.notas};
  }
}
function tbGet(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d || !d.teamBuilding) return null;
  tbSentidosRepair(d.teamBuilding);
  return d.teamBuilding;
}

/* ---- Pantalla Kahoot (Prueba 1): una pregunta a la vez, con cuenta

   real desde el móvil de cada equipo exigiría que cada uno entre a una
   sala en vivo desde su propio aparato y una sincronización en tiempo
   real con esta pantalla (WebSockets o Firebase Realtime, con un código

   aparte, no una tarde de mejora. La cuenta atrás + el tictac ya dan la

const PLAN360_TB_DIFICULTAD_LABEL = {facil: 'Fácil', media: 'Media', dificil: 'Difícil'};
const PLAN360_TB_DIFICULTAD_COLOR = {facil: 'var(--green)', media: 'var(--amber, #c98a1f)', dificil: 'var(--red)'};
// Los 4 colores + forma de Kahoot de verdad (rojo triángulo, azul rombo,
// amarillo círculo, verde cuadrado) — así las opciones se pueden nombrar
// a voces ("¡la roja!", "¡el rombo azul!") sin tener que leer el texto
// entero, que es justo el punto de ese diseño y lo que lo hace sentir
// como el juego real y no cuatro cajas blancas con un borde.
const PLAN360_TB_FORMAS = [
  {color: '#E53E3E', icon: 'ti-triangle'},
  {color: '#3182CE', icon: 'ti-diamond'},
  {color: '#D69E2E', icon: 'ti-circle'},
  {color: '#38A169', icon: 'ti-square'},

function tbTic(){
  // Un "tic" corto sintetizado con el propio navegador — nada que
  // descargar ni alojar, y funciona sin conexión en mitad de una sala.
  try{
    const ctx = tbGetAudioCtx();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.05, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.08);
  }catch(e){ /* algunos navegadores exigen una interacción antes de sonar — no pasa nada, sigue sin sonido */ }
}
// Acorde ascendente al revelar la respuesta — el "ta-chán" corto que
// marca el corte entre "se está jugando" y "esto es lo que era".
function tbAcorde(){
  try{
    const ctx = tbGetAudioCtx();
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.frequency.value = freq;
      const t0 = ctx.currentTime + i * 0.08;
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.exponentialRampToValueAtTime(0.08, t0 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 0.5);
    });
  }catch(e){}
}
function tbKahootEmpezarTiempo(day){
  const tb = tbGet(day);
  if(!tb) return;
  clearInterval(tbTimerHandle);
  tbTimerRestante = tb.kahoot.tiempoSeg;
  tbSonidoActivo = true;
  tbTimerHandle = setInterval(() => {
    tbTimerRestante--;
    if(tbSonidoActivo) tbTic();
    const barra = document.getElementById('tb-kahoot-barra');
    const num = document.getElementById('tb-kahoot-num');
    if(barra) barra.style.width = Math.max(0, (tbTimerRestante / tb.kahoot.tiempoSeg) * 100) + '%';
    if(num) num.textContent = Math.max(0, tbTimerRestante);
    // Al agotarse el tiempo se revela sola — como en el Kahoot real, no
    // hace falta que el coach pulse nada si nadie contestó a tiempo.
    if(tbTimerRestante <= 0) tbKahootRevelar(day);
  }, 1000);
  renderTeamBuildingPage(day);
}
function tbKahootPararTiempo(){
  clearInterval(tbTimerHandle);
  tbTimerHandle = null;
  tbSonidoActivo = false;
}
// Revelar es un paso propio, separado de marcar quién acertó — mientras
// no se revela, ni el propio coach ve la opción correcta resaltada en su
// pantalla: así se puede tener la pantalla a la vista del equipo (móvil,
// tablet, proyector) sin chafar la respuesta antes de tiempo.
function tbKahootRevelar(day){
  const tb = tbGet(day);
  if(!tb) return;
  tbKahootPararTiempo();
  tb.kahoot.revelada = true;
  tbAcorde();
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}

function tbKahootRepetir(day){
  const tb = tbGet(day);
  if(!tb) return;
  tb.kahoot.actual = 0;
  tb.kahoot.revelada = false;
  tb.kahoot.terminado = false;
  tb.kahoot.marcActual = {A: false, B: false};
  tb.kahoot.puntos = {A: 0, B: 0};
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbKahootTiempo(day, valor){
  const tb = tbGet(day);
  if(!tb) return;
  tb.kahoot.tiempoSeg = Math.max(5, Number(valor) || 20);
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbKahootDificultad(day, qi, valor){
  const tb = tbGet(day);
  if(!tb) return;
  tb.kahoot.preguntas[qi].dificultad = valor;
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
// Botón-interruptor: los dos equipos pueden acertar la misma pregunta
// (antes marcar uno pasaba sola a la siguiente y el otro equipo, aunque
// también hubiera contestado bien, se quedaba sin su punto). Pulsar de
// nuevo quita el punto, por si se toca sin querer.
function tbKahootPunto(day, equipo){
  const tb = tbGet(day);
  if(!tb) return;
  const marc = tb.kahoot.marcActual || (tb.kahoot.marcActual = {A: false, B: false});
  const yaMarcado = marc[equipo];
  tb.kahoot.puntos[equipo] = Math.max(0, (tb.kahoot.puntos[equipo] || 0) + (yaMarcado ? -1 : 1));
  marc[equipo] = !yaMarcado;
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbKahootSiguiente(day){
  const tb = tbGet(day);
  if(!tb) return;
  tbKahootPararTiempo();
  const k = tb.kahoot;
  if(k.actual >= k.preguntas.length - 1){
    // Pregunta 30 ya resuelta: no hay pregunta 31, toca ver el resultado.
    k.terminado = true;
    saveRemoteBiz();
    renderTeamBuildingPage(day);
    return;
  }
  k.actual++;
  k.revelada = false;
  k.marcActual = {A: false, B: false};
  saveRemoteBiz();
  // La pregunta siguiente empieza sola — el coach no tiene que volver a
  // pulsar "Empezar tiempo" cada vez, solo la primera de todas.
  tbKahootEmpezarTiempo(day);
}
function tbKahootAnadir(day){
  const tb = tbGet(day);
  if(!tb) return;
  tb.kahoot.preguntas.push({texto: '', opciones: ['', '', '', ''], correcta: 0});
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbKahootBorrar(day, qi){
  const tb = tbGet(day);
  if(!tb) return;
  tb.kahoot.preguntas.splice(qi, 1);
  if(tb.kahoot.actual >= tb.kahoot.preguntas.length) tb.kahoot.actual = Math.max(0, tb.kahoot.preguntas.length - 1);
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbKahootEditarTexto(day, qi, valor){
  const tb = tbGet(day);
  if(!tb) return;
  tb.kahoot.preguntas[qi].texto = valor;
  saveRemoteBiz();
}
function tbKahootEditarOpcion(day, qi, oi, valor){
  const tb = tbGet(day);
  if(!tb) return;
  tb.kahoot.preguntas[qi].opciones[oi] = valor;
  saveRemoteBiz();
}
function tbKahootMarcarCorrecta(day, qi, oi){
  const tb = tbGet(day);
  if(!tb) return;
  tb.kahoot.preguntas[qi].correcta = oi;

/* -- Oído / Olfato / Gusto / Tacto: reto por listas -----------------
   Cada equipo prepara una lista de cosas (sonidos/olores/sabores/
   texturas) para que adivine el CONTRARIO. Oído además deja subir el
   archivo de sonido y reproducirlo ahí mismo — Olfato/Gusto/Tacto son
   físicos de verdad (no se puede "subir un olor"), así que ahí la
   lista es solo el nombre de lo que se preparó, tachado en cuanto se
   adivina. El punto es siempre para quien ADIVINA. */
// El Test arranca con 30 preguntas listas y la sopa con 12 palabras —
// Oído/Olfato/Gusto/Tacto en cambio arrancaban en una lista vacía del
// todo, sin ni una idea, que es justo lo que hacía que se sintieran
// "menos cuidados" que el resto. Con estas sugerencias (un toque y se
// añaden) el coach parte de algo en vez de la hoja en blanco — las puede
// borrar o cambiar igual que cualquier otra.
const PLAN360_TB_SUGERENCIAS = {
  oido: ['Freidora', 'Campana del pase', 'Cafetera espresso', 'Cuchillo sobre la tabla', 'Hielo en la coctelera', 'Grifo de cerveza', 'Máquina de café moliendo', 'Silla arrastrándose', 'Corcho al descorchar', 'Lavavajillas'],
  olfato: ['Canela', 'Albahaca fresca', 'Café molido', 'Ajo', 'Limón', 'Vinagre', 'Chocolate', 'Romero', 'Café con leche', 'Aceite de oliva'],
  gusto: ['Limón', 'Sal', 'Azúcar', 'Vinagre', 'Miel', 'Café solo', 'Guindilla', 'Menta', 'Chocolate negro', 'Aceituna'],
  tacto: ['Hielo', 'Harina', 'Un limón entero', 'Servilleta de tela', 'Cuchara de madera', 'Papel de aluminio', 'Un corcho', 'Sal gorda', 'Piel de naranja', 'Posavasos de corcho'],
};
/* -- Oído / Olfato: banco compartido (distinto de Gusto/Tacto, que
   siguen siendo "reto" con dos listas) --
   Un solo listado de hasta 10 elementos que anota/prepara el coach antes
   de jugar (con Oído, además, el archivo de sonido de verdad). Por cada
   uno, el "?" revela qué era solo cuando el coach quiere — para no
   chafarlo mientras los equipos siguen oliendo/escuchando/pensando — y
   los dos equipos pueden acertar el mismo, con un botón cada uno en modo
   interruptor, igual que en el Test. */
const PLAN360_TB_BANCO_HINT = {
  oido: 'Sube hasta 10 sonidos antes de jugar. Por cada uno: reprodúcelo, y cuando los equipos digan su respuesta pulsa el "?" para revelar cuál era — pueden acertar los dos equipos, uno, o ninguno.',
  olfato: 'Prepara hasta 10 olores antes de jugar (especias, ingredientes de la cocina). Por cada uno: que los equipos huelan a ciegas y digan qué es, y pulsa el "?" para revelar cuál era — pueden acertar los dos equipos, uno, o ninguno.',
  gusto: 'Prepara hasta 10 muestras de sabor antes de jugar. Por cada una: que los equipos prueben a ciegas y digan qué es, y pulsa el "?" para revelar cuál era — pueden acertar los dos equipos, uno, o ninguno.',
  tacto: 'Prepara hasta 10 objetos o texturas antes de jugar. Por cada uno: que los equipos lo toquen con los ojos vendados y digan qué es, y pulsa el "?" para revelar cuál era — pueden acertar los dos equipos, uno, o ninguno.',
};
function tbRenderBanco(day, tb, sen){

          <button class="btn btn-sm ${it.aciertoA?'btn-primary':''}" onclick="tbBancoAcierto(${day},'${sen.id}',${idx},'A')">${it.aciertoA?'✓ ':''}${esc(tb.equipoA)}</button>

/* -- Vista: sopa de letras interactiva --------------------------------
   Antes era solo una imagen de la cuadrícula, sin más interacción que
   los botones de +1/-1 sueltos — "de juguete", tal cual lo describió el
   coach. Ahora se puede tocar de verdad: se pulsa la primera letra de
   una palabra y la última, se traza la línea recta entre ellas (recta
   en cualquiera de las 8 direcciones, del derecho o del revés) y si
   coincide con una palabra pendiente, queda marcada en el sitio y pide
   a quién dar el punto. */
function tbGenerarSopa(palabras, size){
  size = size || PLAN360_TB_SOPA_SIZE;
  const grid = Array.from({length: size}, () => Array(size).fill(null));
  const dirs = [[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1],[1,-1],[-1,1]];
  palabras.forEach(palabra => {
    const w = (palabra || '').toUpperCase().replace(/[^A-ZÑ]/g, '');
    if(!w || w.length > size) return;
    let colocada = false, intentos = 0;
    while(!colocada && intentos < 400){
      intentos++;
      const dir = dirs[Math.floor(Math.random() * dirs.length)];
      const f0 = Math.floor(Math.random() * size), c0 = Math.floor(Math.random() * size);
      const fFin = f0 + dir[0] * (w.length - 1), cFin = c0 + dir[1] * (w.length - 1);
      if(fFin < 0 || fFin >= size || cFin < 0 || cFin >= size) continue;
      let cabe = true;
      for(let i = 0; i < w.length; i++){
        const f = f0 + dir[0] * i, c = c0 + dir[1] * i;
        if(grid[f][c] && grid[f][c] !== w[i]){ cabe = false; break; }
      }
      if(!cabe) continue;
      for(let i = 0; i < w.length; i++){
        const f = f0 + dir[0] * i, c = c0 + dir[1] * i;
        grid[f][c] = w[i];
      }
      colocada = true;
    }
  });
  const letras = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ';
  for(let f = 0; f < size; f++) for(let c = 0; c < size; c++){
    if(!grid[f][c]) grid[f][c] = letras[Math.floor(Math.random() * letras.length)];
  }
  return grid;
}

function tbSopaClick(day, f, c){
  const tb = tbGet(day);
  if(!tb) return;
  const v = tb.sentidos.vista;
  if(!v.equipoActivo) return;  // hay que elegir primero quién está buscando
  if(Object.values(v.encontradas || {}).some(e => e.celdas.some(([ff,cc]) => ff===f && cc===c))) return; // ya encontrada, no se vuelve a tocar
  if(!tbSopaSel){ tbSopaSel = {f, c}; renderTeamBuildingPage(day); return; }
  const {f: f0, c: c0} = tbSopaSel;
  tbSopaSel = null;
  if(f0 === f && c0 === c){ renderTeamBuildingPage(day); return; }
  const recta = f === f0 || c === c0 || Math.abs(f - f0) === Math.abs(c - c0);
  if(!recta){ renderTeamBuildingPage(day); return; }
  const df = Math.sign(f - f0), dc = Math.sign(c - c0);
  const len = Math.max(Math.abs(f - f0), Math.abs(c - c0)) + 1;
  const celdas = [];
  let str = '';
  for(let i = 0; i < len; i++){
    const ff = f0 + df * i, cc = c0 + dc * i;
    celdas.push([ff, cc]);
    str += v.sopa[ff][cc];
  }
  const rev = str.split('').reverse().join('');
  const match = v.palabras.map(w => w.toUpperCase()).find(w => (w === str || w === rev) && !(v.encontradas || {})[w]);
  if(match){
    // Se apunta directa al equipo activo — sin diálogo de por medio,
    // que es justo lo que pedía el coach: elegir el equipo ANTES de
    // buscar, no después de encontrar la palabra.
    (v.encontradas || (v.encontradas = {}))[match] = {equipo: v.equipoActivo, celdas};
    saveRemoteBiz();
  }
  renderTeamBuildingPage(day);
}

// Prueba 3, de un vistazo: explicación visual → cronómetro real →

function tbCreatividadEmpezar(day){
  const tb = tbGet(day);
  if(!tb) return;

  tb.creatividad.inicioAt = Date.now();
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbCreatFormatoTiempo(segTotal){
  segTotal = Math.max(0, Math.round(segTotal));
  const m = Math.floor(segTotal / 60), s = segTotal % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}
function tbRenderCreatividadPreparando(box, day, tb){
  const c = tb.creatividad;

    ${tbMiniMarcador(tb)}
    <div class="card" style="text-align:center">

      <div id="tb-creat-num" style="font-size:56px;font-weight:800;font-variant-numeric:tabular-nums">${tbCreatFormatoTiempo(c.tiempoMin * 60)}</div>
      <div style="height:10px;border-radius:6px;background:var(--border);margin:14px 0;overflow:hidden">
        <div id="tb-creat-barra" style="height:100%;width:100%;background:var(--brand-orange,#F0A868);transition:width 1s linear"></div>
      </div>
      <p class="muted" style="margin:0">Presupuesto ${c.presupuesto}€ por equipo · ${esc(c.brief)}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px">
        <button class="btn btn-sm" onclick="tbCreatividadAjustarTiempo(${day},5)">+5 min</button>
        <button class="btn btn-sm" onclick="tbCreatividadAjustarTiempo(${day},-5)">-5 min</button>
        <button class="btn btn-primary" onclick="tbCreatividadTerminarTiempo(${day})">🍽️ Terminar y pasar a evaluar</button>
      </div>
    </div>
  `;
  tbCreatividadArrancarReloj(day);
}
let tbCreatTimerHandle = null;
// Cuenta atrás contra la hora real (inicioAt), no un contador que
// descuenta 1 cada segundo: así, si el coach cambia de pantalla y
// vuelve, o si se refresca la página a media compra, el tiempo que
// queda sigue siendo el correcto en vez de congelarse.
function tbCreatividadArrancarReloj(day){
  clearInterval(tbCreatTimerHandle);
  const tick = () => {
    const tb = tbGet(day);
    if(!tb || tb.pantalla !== 'creatividad' || tb.creatividad.fase !== 'preparando'){ clearInterval(tbCreatTimerHandle); return; }
    const c = tb.creatividad;
    const totalSeg = c.tiempoMin * 60;
    const restante = totalSeg - (Date.now() - c.inicioAt) / 1000;
    const num = document.getElementById('tb-creat-num');
    const barra = document.getElementById('tb-creat-barra');
    if(num){ num.textContent = tbCreatFormatoTiempo(restante); num.style.color = restante <= 0 ? 'var(--red,#E53E3E)' : ''; }
    if(barra) barra.style.width = Math.max(0, Math.min(100, (restante / totalSeg) * 100)) + '%';
  };
  tick();
  tbCreatTimerHandle = setInterval(tick, 1000);
}
function tbCreatividadAjustarTiempo(day, delta){
  const tb = tbGet(day);
  if(!tb) return;
  tb.creatividad.tiempoMin = Math.max(5, tb.creatividad.tiempoMin + delta);
  saveRemoteBiz();
}
function tbCreatividadTerminarTiempo(day){
  const tb = tbGet(day);
  if(!tb) return;
  clearInterval(tbCreatTimerHandle);
  tb.creatividad.fase = 'evaluando';
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbRenderCreatividadEvaluando(box, day, tb){

  box.innerHTML = `

      <p class="muted" style="margin:6px 0 14px">Cada equipo presenta su plato. Sube una foto y puntúa del 0 al 10 en cada criterio — el de más nota se lleva los ${c.puntosPrueba} puntos de la prueba.</p>
      <p style="font-size:12px;color:var(--amber,#c98a1f);margin:-6px 0 14px"><i class="ti ti-alert-triangle"></i> Las fotos son solo de esta sesión: si refrescas la página antes del marcador final, hay que volver a subirlas.</p>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px">
        ${tbCreatividadFotoBox(day, 'A', tb.equipoA, c.fotoA)}

      </div>
      <div style="display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;align-items:center">
        <div></div>
        <div style="text-align:center;font-weight:700;font-size:12px">${esc(tb.equipoA)}</div>
        <div style="text-align:center;font-weight:700;font-size:12px">${esc(tb.equipoB)}</div>
        ${c.criterios.map(cr => `
          <div>${esc(cr)}</div>
          <input type="number" min="0" max="10" value="${c.notas.A[cr] || 0}" onchange="tbCreatividadNota(${day},'A','${esc(cr)}',this.value)" style="width:56px;text-align:center">
          <input type="number" min="0" max="10" value="${c.notas.B[cr] || 0}" onchange="tbCreatividadNota(${day},'B','${esc(cr)}',this.value)" style="width:56px;text-align:center">

        <div style="font-weight:700">Total</div>
        <div style="text-align:center;font-weight:800;font-size:18px">${subA}</div>
        <div style="text-align:center;font-weight:800;font-size:18px">${subB}</div>
      </div>
      <button class="btn btn-primary" style="margin-top:16px" onclick="tbCreatividadResolver(${day})">🍽️ Decidir ganador de la prueba (${subA > subB ? esc(tb.equipoA) : (subB > subA ? esc(tb.equipoB) : 'empate ahora mismo')})</button>

function tbCreatividadCampo(day, campo, valor){
  const tb = tbGet(day);
  if(!tb) return;
  tb.creatividad[campo] = (campo === 'brief') ? valor : (Number(valor) || 0);
  saveRemoteBiz();
  if(campo === 'tiempoMin' || campo === 'puntosPrueba') renderTeamBuildingPage(day);
}
// Mismo criterio que el audio de Oído: blob LOCAL del navegador
// (URL.createObjectURL), sin subir a ningún sitio — vale para enseñarla
// en el momento y en el marcador final de esa misma sesión, pero no
// sobrevive a un refresco de página.
function tbCreatividadFotoBox(day, equipo, nombreEquipo, url){
  return `
    <div style="flex:1;min-width:160px;text-align:center">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">${esc(nombreEquipo)}</div>
      ${url ? `<img src="${esc(url)}" style="width:100%;max-width:200px;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--border)">`
            : `<div style="width:100%;max-width:200px;aspect-ratio:1;border-radius:10px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto;color:var(--muted)"><i class="ti ti-camera" style="font-size:28px"></i></div>`}
      <label class="btn btn-sm" style="margin-top:8px;cursor:pointer;display:inline-flex">
        <i class="ti ti-upload"></i> ${url ? 'Cambiar foto' : 'Subir foto'}

      </label>
    </div>`;
}
function tbCreatividadFoto(ev, day, equipo){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const tb = tbGet(day);
  if(!tb) return;
  tb.creatividad[equipo === 'A' ? 'fotoA' : 'fotoB'] = URL.createObjectURL(file);
  renderTeamBuildingPage(day);
}
function tbCreatividadNota(day, equipo, criterio, valor){
  const tb = tbGet(day);
  if(!tb) return;
  const n = Math.max(0, Math.min(10, Number(valor) || 0));
  tb.creatividad.notas[equipo][criterio] = n;
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbCreatividadCriterioAnadir(day){
  const tb = tbGet(day);
  const input = document.getElementById('tb-nuevo-criterio');
  if(!tb || !input || !input.value.trim()) return;
  tb.creatividad.criterios.push(input.value.trim());
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbCreatividadCriterioBorrar(day, idx){
  const tb = tbGet(day);
  if(!tb) return;
  const cr = tb.creatividad.criterios[idx];
  tb.creatividad.criterios.splice(idx, 1);
  delete tb.creatividad.notas.A[cr];
  delete tb.creatividad.notas.B[cr];
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}
function tbCreatividadResolver(day){
  const tb = tbGet(day);
  if(!tb) return;
  const c = tb.creatividad;
  const subA = c.criterios.reduce((s, cr) => s + (c.notas.A[cr] || 0), 0);
  const subB = c.criterios.reduce((s, cr) => s + (c.notas.B[cr] || 0), 0);
  if(subA === subB){ c.puntos.A = Math.round(c.puntosPrueba / 2); c.puntos.B = Math.round(c.puntosPrueba / 2); }
  else if(subA > subB){ c.puntos.A = c.puntosPrueba; c.puntos.B = 0; }
  else { c.puntos.B = c.puntosPrueba; c.puntos.A = 0; }
  c.resuelta = true;
  c.fase = 'resultado';
  saveRemoteBiz();
  renderTeamBuildingPage(day);
}

        ${c.fotoB ? `<div style="text-align:center"><img src="${esc(c.fotoB)}" style="width:150px;height:150px;object-fit:cover;border-radius:10px;border:${ganaB ? '3px solid var(--brand-orange,#F0A868)' : '1px solid var(--border)'}"><div style="font-size:12px;margin-top:4px">${esc(tb.equipoB)}</div></div>` : ''}

function tbCreatividadRepetir(day){

  saveRemoteBiz();
  renderTeamBuildingPage(day);
}

// Separado del cómputo de puntos a propósito: el coach lee el marcador en
// voz alta con el equipo delante y quiere un momento propio de "y el
// equipo ganador es…" en vez de que el nombre ya esté escrito arriba
// desde que se entra a la pantalla. Toca el DOM directo (sin re-render)
// para no perder este estado si se vuelve a pintar la pantalla por otra
// cosa mientras tanto.
function tbMostrarGanadorFinal(day){
  const tb = tbGet(day);
  if(!tb) return;
  const totalA = tbTotalGeneral(tb, 'A'), totalB = tbTotalGeneral(tb, 'B');
  const ganaA = totalA > totalB, ganaB = totalB > totalA;
  const elA = document.getElementById('tb-final-totalA');

/* ---- Reunión inicial: guion de 10 preguntas con dictado por voz ----
   La idea (pedida expresamente por el coach) es que él no tenga que estar
   escribiendo mientras habla con el hostelero: pulsa el micro, la respuesta
   se va transcribiendo sola en el recuadro con el reconocimiento de voz
   nativo del navegador (gratis, sin servidor), y queda editable por si el
   dictado se equivoca. Solo funciona bien en Chrome/Android; en Safari
   puede no estar disponible, así que el botón se oculta si el navegador no
   lo soporta y el recuadro sigue siendo editable a mano igualmente. */
function plan360SpeechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
let plan360ActiveRecognition = null;
let plan360ActiveRecognitionIdx = null;
let plan360DictadoParar = false;
// ⚠️ El primer intento usaba continuous:true, y en Chrome/Android ESE modo
// concreto tiene un fallo conocido del propio navegador (no del código):
// cada nuevo tramo de voz reescribe el reconocimiento entero desde el
// principio, así que el texto se iba doblando ("puespues quepues que...").
// La solución que de verdad funciona en Android es la contraria: sesiones
// CORTAS (continuous:false, una frase y termina sola) que se relanzan
// automáticamente en cuanto acaban — el coach no nota el corte, pero cada
// frase llega limpia porque nace en un reconocimiento nuevo, no reescrito.
function plan360ToggleDictado(idx, grupo){
  grupo = grupo || 'reunion';
  const clave = grupo + ':' + idx;
  const btn = document.getElementById(grupo + '-mic-' + idx);
  const ta = document.getElementById(grupo + '-a-' + idx);
  if(!btn || !ta) return;
  if(plan360ActiveRecognition && plan360ActiveRecognitionIdx === clave){
    plan360DictadoParar = true;
    plan360ActiveRecognition.stop();
    return;
  }
  if(plan360ActiveRecognition){
    plan360DictadoParar = true;
    plan360ActiveRecognition.stop();
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let acumulado = ta.value ? ta.value.replace(/\s+$/, '') + ' ' : '';
  plan360DictadoParar = false;
  plan360ActiveRecognitionIdx = clave;
  const lanzarSesion = () => {
    const rec = new SR();
    rec.lang = 'es-ES';
    rec.continuous = false;
    rec.interimResults = true;
    rec.onresult = (ev) => {
      let interino = '';
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const tramo = ev.results[i][0].transcript;
        if(ev.results[i].isFinal) acumulado += tramo.trim() + ' ';
        else interino += tramo;
      }
      ta.value = acumulado + interino;
    };
    rec.onerror = (e) => {
      // 'no-speech' salta con cualquier silencio entre frases — normal,
      // no hay que cortar el dictado por eso, se relanza en onend.
      if(e.error !== 'no-speech' && e.error !== 'aborted') plan360DictadoParar = true;
    };
    rec.onend = () => {
      ta.value = acumulado.trim();
      if(plan360DictadoParar || plan360ActiveRecognitionIdx !== clave){
        btn.classList.remove('btn-primary');
        btn.innerHTML = '<i class="ti ti-microphone"></i>';
        plan360ActiveRecognition = null;
        plan360ActiveRecognitionIdx = null;
        return;
      }
      lanzarSesion();
    };
    rec.start();
    plan360ActiveRecognition = rec;
  };
  lanzarSesion();
  btn.classList.add('btn-primary');
  btn.innerHTML = '<i class="ti ti-player-stop"></i>';
}

function addTask(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d) return;
  syncTasksFromForm(d);
  d.tasks.push({id: plan360GenId(), objectiveId: null, title: '', description: '', status: 'pendiente', note: '', fileData: null, fileName: null});
  document.getElementById('task-list').innerHTML = d.tasks.map((tk, i) => taskRow(tk, i)).join('');
}
function borrarTask(i){
  if(!plan360TrabajoDiaActivo) return;
  syncTasksFromForm(plan360TrabajoDiaActivo);
  plan360TrabajoDiaActivo.tasks.splice(i, 1);
  document.getElementById('task-list').innerHTML = plan360TrabajoDiaActivo.tasks.map((tk, i2) => taskRow(tk, i2)).join('');
  const sel = document.getElementById('banco-categoria');
  const banco = document.getElementById('banco-modulos');
  if(banco) banco.innerHTML = plan360BancoModulosHtml(sel ? sel.value : '');
}
function syncTasksFromForm(d){
  d.tasks.forEach((tk, i) => {
    const obj = document.getElementById('task-objetivo-' + i), ti = document.getElementById('task-title-' + i),
          de = document.getElementById('task-desc-' + i), cl = document.getElementById('task-file-clear-' + i);
    if(obj) tk.objectiveId = obj.value ? Number(obj.value) : null;
    if(ti) tk.title = ti.value.trim();
    if(de) tk.description = de.value.trim();
    if(cl && cl.value === '1'){ tk.fileData = null; tk.fileName = null; }
  });
}
function readFileAsDataUrl(file){
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}
let plan360TrabajoDiaActivo = null;
// La reunión se guarda al momento (cambiarReunionTipo/toggleReunionObjetivo),
// no espera al botón Guardar general — así el select y los checks de la
// agenda no se pierden si el coach navega a otro día antes de guardar.
function cambiarReunionTipo(day, tipo){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d) return;
  d.reunion = tipo ? (d.reunion ? {...d.reunion, tipo} : {tipo, objectiveIds: [], notas: '', hecha: false, completadaAt: null}) : null;
  saveRemoteBiz();
  renderTrabajoPage(d);
}
function toggleReunionObjetivo(day, objId, checked){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d || !d.reunion) return;
  const set = new Set(d.reunion.objectiveIds);
  if(checked) set.add(objId); else set.delete(objId);
  d.reunion.objectiveIds = [...set];
  saveRemoteBiz();
}
async function saveTrabajo(day){
  const d = (remoteBiz.plan360Program || []).find(x => x.day === day);
  if(!d) return;
  d.title = (document.getElementById('day-title').value || '').trim() || d.title;
  d.priority = document.getElementById('day-priority').value || null;
  syncTasksFromForm(d);
  d.tasks = d.tasks.filter(tk => tk.title);
  for(let i = 0; i < d.tasks.length; i++){
    const fileEl = document.getElementById('task-file-' + i);
    const file = fileEl && fileEl.files && fileEl.files[0];
    if(!file) continue;
    if(file.size > PLAN360_MAX_FILE_BYTES){ alert('El archivo pesa demasiado (máx. 350 KB)'); continue; }
    d.tasks[i].fileData = await readFileAsDataUrl(file);
    d.tasks[i].fileName = file.name;
  }
  saveRemoteBiz();
  renderClientGrid();
}

    </div>
    <div style="font-weight:600;margin:16px 0 4px">Trabajo por objetivo</div>
    ${!objetivos.length ? '<p class="muted">Todavía no hay objetivos definidos en el Día 2.</p>' : grupos.map(g => `
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="width:9px;height:9px;border-radius:50%;background:${plan360ObjPriorityColor(g.obj.prioridad)};flex:none"></span>
          <strong style="flex:1">${esc(g.obj.titulo)}</strong>
          <span class="muted" style="font-size:12px">${g.tareas.length} tarea${g.tareas.length === 1 ? '' : 's'}</span>
        </div>
        ${plan360MedicionesResumenHtml(g.obj)}
        ${g.tareas.length ? g.tareas.map(tareaLinea).join('')
          : '<p style="margin:0;font-size:13px;color:var(--red)">⚠ Sin ninguna tarea asignada todavía en los 26 días de trabajo.</p>'}
      </div>`).join('')}
    ${sinObjetivo.length ? `
      <div class="card" style="margin-bottom:10px;border-color:var(--amber)">
        <strong>Sin objetivo asignado</strong>
        ${sinObjetivo.map(tareaLinea).join('')}
      </div>` : ''}
  `;
}
</script>
</body>
</html>

<style>
/* Mismo sistema de diseño que la app y que admin-panel/app.html. */
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/schibsted-grotesk-400-normal.woff2") format("woff2");}
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/schibsted-grotesk-600-normal.woff2") format("woff2");}
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/schibsted-grotesk-700-normal.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/ibm-plex-mono-400-normal.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/ibm-plex-mono-500-normal.woff2") format("woff2");}
:root{
  --ink:#1C1A17; --olive:#4A5D4E; --cream:#F1EFE9; --bg:#FAF8F4; --surface:#FFFFFF; --border:#E7E2D9;
  --text:#1C1A17; --body:#3D3A34; --muted:#716C65; --brand-cream:#FAF8F4;
  --green:#4A5D4E; --green-l:#EDF1EC; --red:#8A4A3B; --red-l:#F5EBE7; --amber:#8A7440; --amber-l:#F5F0E3;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Schibsted Grotesk',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--body);min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:20px 20px 80px;display:flex;flex-direction:column;gap:16px}
header{background:var(--ink);color:#FAF8F4;padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .logo{width:40px;height:40px;background:var(--olive);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:none;font-family:'IBM Plex Mono',monospace}
header h1{font-family:'Schibsted Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:180px}
header .hd-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);padding:12px 18px;min-height:46px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;
     text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;background:#fff;color:var(--text)}
.btn:hover{background:var(--cream)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#FAF8F4}
.btn-primary:hover{background:var(--olive);border-color:var(--olive)}
.btn-sm{min-height:36px;padding:7px 12px;font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);padding:18px}
label{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--border);padding:11px;font-size:14px;font-family:inherit;background:#fff;min-height:46px;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.field{margin-bottom:12px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
.hidden{display:none!important}
#login-gate{max-width:420px;margin:60px auto}
#login-gate .card{display:flex;flex-direction:column;gap:12px}
.folder-tile{background:var(--surface);border:1px solid var(--border);padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px}
.folder-tile:hover{background:var(--cream)}
.folder-tile .avatar{width:38px;height:38px;background:var(--ink);color:#FAF8F4;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'IBM Plex Mono',monospace;flex:none}
.status-line{font-size:12.5px;color:var(--muted)}
.p360-toprow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.p360-card{flex:1;min-width:220px;background:#fff;border:1px solid var(--border);padding:16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:background-color .12s ease}
.p360-card:hover{background:var(--brand-cream)}
.p360-card i{font-size:22px;color:var(--ink);flex:none;margin-top:2px}
.p360-card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.p360-card p{font-size:12px;color:var(--muted)}
.p360-summary-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;cursor:pointer;min-height:44px}
.p360-summary-bar:hover{background:var(--brand-cream)}
.p360-summary-count{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted)}
.p360-week{margin-bottom:18px}
.p360-week-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.p360-week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.p360-day{background:#fff;border:1px solid var(--border);border-left:4px solid var(--border);padding:12px 10px;min-height:76px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;justify-content:center}
.p360-day:hover{background:var(--brand-cream)}
.p360-day-weekday{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.p360-day-date{font-size:15px;font-weight:700;overflow-wrap:break-word}
.p360-day-tag{font-size:10.5px;color:var(--muted);margin-top:2px}
.p360-day-progress{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px}
.p360-day-presencial{background:var(--ink);border-left-color:var(--ink);color:#fff}
.p360-day-presencial .p360-day-weekday,.p360-day-presencial .p360-day-tag{color:#fff;opacity:.75}
/* Mismo fallo que en css/styles.css: .p360-day:hover pone fondo claro para
   el resto de días, pero un día presencial (1 y 2) ya tiene fondo oscuro y
   letra blanca — sin esto, al pasar el ratón por encima quedaba texto
   blanco sobre fondo claro, casi invisible. */
.p360-day-presencial:hover{background:var(--olive)}
.p360-task-done .p360-task-text{text-decoration:line-through;color:var(--muted)}
/* Vista previa de un recurso, tal como lo va a ver el negocio — mismas
   clases y mismo criterio que css/styles.css (que usa la app del
   cliente): sin esquinas redondeadas, --olive como único acento. */
.p360-doc-header{padding-bottom:14px;margin-bottom:14px;border-bottom:2px solid var(--ink)}
.p360-doc-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--olive);font-weight:700;margin-bottom:4px}
.p360-doc-title{font-size:21px;font-weight:800;color:var(--ink);line-height:1.25}
.p360-doc-subtitle{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.p360-doc-h2{font-size:15px;font-weight:800;color:var(--ink);margin:22px 0 8px;padding-left:10px;border-left:3px solid var(--olive)}
.p360-doc h3.p360-doc-h2:first-of-type{margin-top:0}
.p360-doc-h3{font-size:12.5px;font-weight:700;color:var(--olive);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 6px}
.p360-doc-p{font-size:14px;line-height:1.65;color:var(--body);margin-bottom:10px}
.p360-doc-list{margin:0 0 12px;padding:0;list-style:none}
.p360-doc-list li{font-size:14px;line-height:1.6;color:var(--body);padding-left:18px;position:relative;margin-bottom:5px}
.p360-doc-list li::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;background:var(--olive)}
.p360-doc-quote{background:var(--brand-cream,#F1EFE9);border-left:3px solid var(--olive);padding:10px 14px;margin-bottom:12px}
.p360-doc-quote p{font-size:13.5px;font-style:italic;color:var(--ink);margin:0 0 4px;line-height:1.5}
.p360-doc-quote p:last-child{margin-bottom:0}

<script>
// Banner de error global, visible en la propia página: en tablet no hay
// forma cómoda de abrir la consola del navegador para ver qué ha fallado
// de verdad, así que cualquier error sin capturar (no solo los ya
// envueltos en try/catch de sitios concretos) se enseña aquí arriba,
// en rojo, con el texto completo para poder copiarlo.
function ggMostrarErrorGlobal(msg, detalle){
  let banner = document.getElementById('gg-error-global');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'gg-error-global';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#B33;color:#fff;padding:14px 18px;font-size:13px;max-height:40vh;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.3)';
    document.body.prepend(banner);
  }
  const linea = document.createElement('div');
  linea.style.cssText = 'margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.3);white-space:pre-wrap;font-family:monospace';
  linea.textContent = msg + (detalle ? '\n' + detalle : '');
  banner.appendChild(linea);
  const cerrar = document.createElement('button');
  cerrar.textContent = '✕ Cerrar todos';
  cerrar.style.cssText = 'background:#fff;color:#B33;border:none;padding:4px 10px;border-radius:6px;font-weight:700;cursor:pointer;margin-top:4px';
  cerrar.onclick = () => banner.remove();
  banner.appendChild(cerrar);
}
window.addEventListener('error', ev => ggMostrarErrorGlobal('Error: ' + ev.message, (ev.filename||'') + ':' + (ev.lineno||'') + '\n' + (ev.error && ev.error.stack || '')));
window.addEventListener('unhandledrejection', ev => ggMostrarErrorGlobal('Promesa rechazada: ' + (ev.reason && ev.reason.message || ev.reason), ev.reason && ev.reason.stack || ''));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Sin service worker ni versión propia aquí: una URL con parámetro nuevo
// nunca tiene caché previa del navegador, así que fuerza una carga real.
function ggAdminHardReload(){ location.href = location.pathname + '?_r=' + Date.now(); }
const PLATFORM_FIREBASE_CONFIG = {
  apiKey: "AIzaSyDwZDodF6zwN11slvqkZ_yy3IOn2iko_ws",
  authDomain: "plataforma-gastrogoan.firebaseapp.com",
  databaseURL: "https://plataforma-gastrogoan-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "plataforma-gastrogoan",
  storageBucket: "plataforma-gastrogoan.firebasestorage.app",
  messagingSenderId: "894218847556",
  appId: "1:894218847556:web:2fa1f699489790bb5f8311"
};
function getApp(){
  try{ return firebase.app('platform'); }
  catch(e){ return firebase.initializeApp(PLATFORM_FIREBASE_CONFIG, 'platform'); }
}
async function doLogin(){
  const statusEl = document.getElementById('login-status');
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if(!email || !pass){ statusEl.textContent = 'Escribe email y contraseña.'; return; }
  statusEl.textContent = 'Entrando...';
  try{
    const app = getApp();
    await app.auth().signInWithEmailAndPassword(email, pass);
    onLoggedIn();
  }catch(e){
    console.error(e);
    statusEl.textContent = '⚠️ No se pudo entrar (' + (e.message || e.code || 'error') + ').';
  }
}
function doLogout(){
  getApp().auth().signOut();
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('login-gate').classList.remove('hidden');
}
async function onLoggedIn(){
  document.getElementById('login-gate').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  await loadClientList();
  mantCargarPlantillaNube();
  renderMiSemana();
}
try{
  if(typeof firebase !== 'undefined') getApp().auth().onAuthStateChanged(user => {
    if(user && user.email) onLoggedIn();
  });
}catch(e){ console.error('No se pudo comprobar la sesión persistida', e); }

// Firebase rechaza CUALQUIER escritura que contenga un valor undefined en
// cualquier parte del objeto — no solo ese campo, la escritura entera. Un
// solo dato mal formado en cualquier rincón (día, tarea, objetivo...)
// bastaba para que ESTA función fallara siempre, en silencio, sin que
// nada de lo que se guardara desde el panel llegara nunca a la nube.
function sinIndefinidos(v){
  if(v === undefined) return null;
  // Las fotos y audios del team building son un blob: LOCAL de esta pestaña.
  // Subido a la nube era un enlace roto para siempre (tras recargar, y en
  // cualquier otro aparato): se usan en la sesión, pero no se guardan.
  if(typeof v === 'string' && v.startsWith('blob:')) return null;
  if(typeof v === 'number' && !Number.isFinite(v)) return null;
  if(v === null || typeof v !== 'object') return v;
  if(Array.isArray(v)) return Array.from(v, x => x === undefined ? null : sinIndefinidos(x));
  const out = {};
  Object.keys(v).forEach(k => { if(v[k] !== undefined) out[k] = sinIndefinidos(v[k]); });
  return out;
}
// ⚠️ Firebase NO conserva el orden de inserción de las claves de un objeto:
// al releer lo que se acaba de escribir, puede devolver las claves en otro
// orden. Comparar con JSON.stringify normal (sensible al orden) hacía que
// casi CUALQUIER guardado se confundiera con un cambio real llegado de
// fuera y disparara renderClientGrid() — el bug de "al dar tick me manda a
// la pantalla de inicio". stableJson ordena las claves antes de comparar,
// así el eco de nuestro propio guardado se reconoce siempre.
// Igual que genId() en js/core.js (que aquí no está disponible: este panel
// es un HTML autocontenido aparte) — único incluso si dos pestañas del
// panel crean datos casi a la vez.
function plan360GenId(){ return Date.now() * 1000 + Math.floor(Math.random() * 1000); }
function stableJson(v){
  if(Array.isArray(v)) return '[' + v.map(stableJson).join(',') + ']';
  if(v && typeof v === 'object'){
    return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableJson(v[k])).join(',') + '}';
  }
  return JSON.stringify(v);
}
/* Lo que Firebase guarda de verdad: sin null, sin listas ni objetos vacíos.
   Antes se comparaba lo ENVIADO (lleno de null y []) con lo que volvía de
   la nube (sin ellos): nunca coincidían, el panel creía que el cambio
   venía de fuera y redibujaba el calendario tras casi cada guardado — el
   «me saca al calendario al dar un tick». */
function comoFirebase(v){
  if(v === null || v === undefined) return undefined;
  if(typeof v === 'number' && !Number.isFinite(v)) return undefined;
  if(Array.isArray(v)){
    const a = v.map(comoFirebase);
    while(a.length && a[a.length - 1] === undefined) a.pop();
    return a.length ? a.map(x => x === undefined ? null : x) : undefined;
  }
  if(typeof v === 'object'){
    const o = {};
    Object.keys(v).forEach(k => { const x = comoFirebase(v[k]); if(x !== undefined) o[k] = x; });
    return Object.keys(o).length ? o : undefined;
  }
  return v;
}
const esClavePlan360 = k => k.startsWith('plan360');
function plan360Huella(biz){
  const o = {};
  Object.keys(biz || {}).filter(esClavePlan360).forEach(k => { o[k] = biz[k]; });
  const n = comoFirebase(o);
  return stableJson(n === undefined ? null : n);
}
function avisoCambiosDelNegocio(){
  const st = document.getElementById('client-status');
  if(!st) return;
  st.innerHTML = 'El negocio ha hecho cambios en su Plan 360. <button class="btn btn-sm" onclick="renderClientGrid()">Ver calendario actualizado</button>';
}
function saveRemoteBiz(){
  if(!currentBizRef || !remoteBiz) return;
  const limpio = sinIndefinidos(remoteBiz);
  lastPushedJson = plan360Huella(limpio);
  savingRemote = true;
  // update() y SOLO las claves del Plan 360: con set() se reescribía el
  // negocio entero y, si el negocio cambiaba algo a la vez (una venta, su
  // configuración), el guardado del coach lo borraba.
  const cambios = {};
  Object.keys(limpio).filter(esClavePlan360).forEach(k => { cambios[k] = limpio[k]; });
  currentBizRef.update(cambios).catch(e => {
    console.error('Error guardando en la nube del negocio', e);
    alert('No se pudo guardar en la nube: ' + (e.message || e.code || 'error'));
  }).finally(() => { savingRemote = false; });
}

   Aquí viven las respuestas en crudo de la Voz del equipo (Reunión con el
   personal): antes vivían dentro de reunionPersonal, en el MISMO bloque

// dentro de db/business: ahí viajaba entero (hasta ~20 MB en base64) con
// CADA cambio del negocio, y pasado ~7 MB Firebase rechazaba el guardado y
// dejaba de guardarse todo lo demás.
let currentLibroPdfRef = null;
// Los id que la migración inventa se GUARDAN al momento: si no, eran
// distintos en cada carga y las tareas y reuniones no casaban con su objetivo.
let migracionIdsPendiente = false;
let libroPdfCache = null;
let coachPrivate = null;
let lastPushedCoachPrivateJson = null;
function plan360FreshCoachPrivadoDia(){
  return {preguntas: PLAN360_REUNION_PERSONAL_PREGUNTAS.map(q => ({q, a: ''})), notaLibre: ''};
}
// Clave 'd'+day, NUNCA el número desnudo: Firebase Realtime Database
// convierte en ARRAY cualquier objeto cuyas claves sean todas números
// consecutivos, y aquí el día 1 (sin día 0) ya dispara ese caso — con la
// letra delante se guarda siempre como objeto de verdad.
function coachPrivadoClave(day){ return 'd' + day; }
function coachPrivadoDia(day){
  if(!coachPrivate) coachPrivate = {};
  const clave = coachPrivadoClave(day);
  if(!coachPrivate[clave]) coachPrivate[clave] = plan360FreshCoachPrivadoDia();
  return coachPrivate[clave];
}
function saveCoachPrivate(){
  if(!currentCoachPrivateRef || !coachPrivate) return;
  const limpio = sinIndefinidos(coachPrivate);
  lastPushedCoachPrivateJson = stableJson(limpio);
  currentCoachPrivateRef.set(limpio).catch(e => {
    console.error('Error guardando la voz del equipo (privado)', e);
    alert('No se pudo guardar en la nube: ' + (e.message || e.code || 'error'));
  });
}
// Migración de negocios que ya tenían las respuestas en crudo dentro de
// reunionPersonal (de antes de este cambio): se mueven a coachPrivate y se
// borran de remoteBiz en cuanto los dos nodos han cargado al menos una vez.
// Sin esto, un negocio dado de alta antes de este cambio seguiría
// exponiendo las respuestas de su equipo en cada sincronización.
let migracionCoachPrivadoHecha = false;
function intentarMigrarReunionPersonal(){
  if(migracionCoachPrivadoHecha || !remoteBiz || !coachPrivate) return;
  let tocado = false;
  (remoteBiz.plan360Program || []).forEach(d => {
    if(d.reunionPersonal && Array.isArray(d.reunionPersonal.preguntas)){
      const clave = coachPrivadoClave(d.day);
      if(!coachPrivate[clave]){
        coachPrivate[clave] = {preguntas: d.reunionPersonal.preguntas, notaLibre: d.reunionPersonal.notaLibre || ''};
      }
      delete d.reunionPersonal.preguntas;
      delete d.reunionPersonal.notaLibre;
      tocado = true;
    }
  });
  migracionCoachPrivadoHecha = true;
  if(tocado){ saveRemoteBiz(); saveCoachPrivate(); }
}

Profundizar en experiencia, motivación y comportamientos, y comprobar coherencia. Puntuar sobre 30. Guion paso a paso:

### 2 · Presentación del local
> "Trabajo aquí como [puesto] desde [tiempo]. Somos un restaurante de [estilo], con [nº] servicios diarios y un equipo de [nº]. Nuestro pico es [horario] y buscamos cubrir [turnos/funciones]."

### 3 · Explicar el objetivo de la entrevista
> "El objetivo es comprobar tu experiencia y ver cómo resuelves situaciones reales. Si avanzas, habrá una prueba práctica presencial. ¿De acuerdo?"

### 4 · Repaso del CV y datos críticos
> "Veo que trabajaste en [Empresa]. ¿Qué rol exacto tenías y en qué fechas?"
> "¿Qué tareas hacías a diario? ¿Qué turnos realizabas?"
> "En tu CV aparece [puesto]; dime 3 tareas que hacías cada servicio."
Objetivo: verificar veracidad y responsabilidad real; detectar huecos o inflados.

### 5 · Confirmar experiencia relevante
> "Para resumir: ¿podrías en 1-2 frases describir tu experiencia más relevante para este puesto y cuándo podrías incorporarte?"

### 6 · Verificar disponibilidad y condiciones
> "¿Cuál sería tu fecha de incorporación? ¿Qué turnos puedes cubrir? ¿Alguna restricción horaria? ¿Cuál es tu expectativa salarial bruta mensual?"

### 7 · Preguntas conductuales (situación · acción · resultado)
> "Cuéntame una vez que hubo un fallo en servicio (plato equivocado, retraso, falta de producto). ¿Qué hiciste y cuál fue el resultado?"
> "Dame un ejemplo de cuando el equipo se saturó en servicio y cómo ayudaste a mantener el ritmo."
> "Cuéntame un feedback difícil que recibiste y qué cambiaste tras ello."

### 8 · Preguntas técnicas
> "En plena salida falta un ingrediente base; ¿qué haces en los próximos 5 minutos?"
> "Fallo del lavavajillas en pico: ¿cómo garantizas copas y servicio?"

Observar ejecución real. Máximo 3 acciones, de una en una (ej.: limpiar 2 salmones, pulir 20 copas, simular pase de 3 mesas).

`## Evaluación del rendimiento
Cada ítem se puntúa 1-3 (1 = necesita mejorar, 2 = correcto, 3 = sobresaliente). Suma el total sobre 21.
| Ítem | Puntuación (1-3)
| Puntualidad y asistencia (llega 10 min antes; avisa con 24 h) |
| Cumplimiento operativo (checklists HACCP, cierre) |
| Calidad técnica (consistencia en recetas / servicio) |
| Comunicación (clara, propone soluciones) |
| Trabajo en equipo (apoya en picos, colabora) |
| Actitud y profesionalidad (trato, higiene, respeto) |
| Feeling general (soltura, comodidad) |
| TOTAL / 21 |

## Reconocimiento
Cuándo reconocer: en el momento (resolución de una queja, salvar un servicio, iniciativa que evita desperdicio), al cierre del turno (micro-reconocimiento, 30 s), semanalmente (mención en el briefing con evidencia), trimestralmente (premio operativo: bono, día libre, formación).
> "Gracias, [nombre], por resolver la queja en 3 min; el cliente se fue satisfecho."
> "Reconocimiento: [nombre] por [acción] — impacto: [resultado]."
Combinar reconocimiento social y tangible (comida, turno preferente, certificado) es más efectivo que solo uno.

## Compensación
Criterios para considerar una recompensa: impacto medible (redujo tiempos, evitó una queja, ahorró coste), iniciativa y solución sin esperar instrucciones, consistencia durante X turnos (7-30 días), comportamiento cultural (colaboración, seguridad, proactividad).
Tipos de compensación, de menor a mayor:
- Reconocimiento verbal inmediato: refuerzo instantáneo.
- Mención pública en briefing: visibilidad y orgullo.
- Micro-beneficio: comida, bebida o turno preferente.
- Micro-bono (5-20€): por acción excepcional o ahorro medible.
- Bono mensual/trimestral: por rendimiento sostenido.
- Desarrollo: formación pagada o rotación a puesto de interés.
- Día libre o compensación de horas: por esfuerzo extraordinario.

## Retención — 10 acciones prácticas
- Pago anticipado de parte del salario ya ganado.
- Participación en un % mensual del beneficio si se alcanzan metas.
- Bolsa de horas flexibles canjeable por días libres o pago.
- Microformación certificable.
- Días extra pagados por antigüedad (2 cada 6 meses).
- Uniforme gratuito y reposición anual.
- Una comida completa del personal.
- Día de descanso flexible.
- Convenio con gimnasio o salud.
- Lotes de producto de calidad por buen desempeño.`},

`Pensado para un restaurante o bar de barrio, no para un experto en marketing. Lee primero "antes de gastar un euro": te ahorrará el error que comete casi todo el mundo.

## Antes de gastar un euro
Meta Ads es la herramienta para anunciarte en Instagram y Facebook. Bien usada, llena tus mesas flojas con clientes de tu zona. Mal usada, es tirar dinero.
El error nº1 que comete todo el mundo: darle al botón azul de «Promocionar publicación» en Instagram. Es cómodo, pero gastas más y segmentas peor. Siempre se crea desde el Administrador de Anuncios. Esa diferencia sola ya te ahorra dinero.
- Idea 1 — El anuncio lleva a tu perfil: antes de anunciarte, tu Instagram tiene que estar cuidado (buenas fotos, bio clara, cómo reservar). Si el perfil da pena, el cliente no viene.
- Idea 2 — Amplifica, no salva: la publicidad multiplica un buen negocio; no arregla uno malo.
- Idea 3 — Local, no el mundo: anúnciate solo a 3-5 km a la redonda.
- Idea 4 — Valor, no descuento: el que viene solo por un 50% no vuelve a pagar precio completo.
Lo que necesitas tener listo: una página de Facebook del negocio, tu Instagram vinculado a ella, una cuenta en Meta Business Suite (business.facebook.com) y un método de pago. Se crean gratis en 10 minutos.

## Crear tu campaña, paso a paso
- 1. Entra en el Administrador de Anuncios — business.facebook.com → Administrador de Anuncios → botón verde «Crear». Nunca desde el botón azul de la app.
- 2. Elige el objetivo — «Interacción» (mensajes a tu WhatsApp/Instagram) o «Tráfico» (llevar a tu web de reservas). Si dudas, empieza por interacción.
- 3. Define el presupuesto — empieza con 5-10 € al día, diario no total.
- 4. Segmenta tu público — ubicación: tu local + 3-5 km; edad y sexo: tu cliente ideal; intereses: gastronomía, restaurantes, planes locales.
- 5. Sube la creatividad — vídeo corto (10-20 s) que dé hambre o una foto muy buena del plato estrella, con un gancho y una llamada clara: «Reserva», «Te esperamos», «Pídelo».
- 6. Publica y espera — Meta lo revisa en unas horas. Déjalo correr 3-4 días sin tocarlo.
Truco: crea 2-3 versiones del anuncio (distinta foto o texto) con poco presupuesto cada una; a los pocos días, apaga las que no funcionan y pon el dinero en la ganadora.`},
  {id: 'guia-fotografica', title: 'Guía fotográfica', categoria: 'Marketing', subtitulo: 'Fotos que dan hambre, con el móvil que ya tienes.', seed:
`La foto no corrige errores: el plato sale de cocina impecable y solo entonces disparas.

## 1. Preparación previa
- Superficie y fondo neutro: madera, mármol o tela lisa; máximo 2 props coherentes.
- Luz natural lateral: junto a una ventana; evita luz directa y sombras duras.
- Organiza el flujo: ten a mano el plato, el móvil, un reflector improvisado (cartón blanco) y un paño.

## 2. Ajustes técnicos
- Activa la cuadrícula para componer con la regla de tercios.
- Dispara en RAW si tu móvil lo permite; si no, en la máxima calidad JPG.
- Bloqueo de exposición y enfoque (AE/AF Lock): toca el punto y mantén para fijar.
- HDR para platos con alto rango dinámico; prueba ON/OFF. Limpia la lente antes de cada sesión.

## 3. Iluminación
- Luz lateral suave: coloca el plato perpendicular a la ventana.
- Reflector casero: cartón blanco para rellenar sombras desde el lado opuesto.
- Evita el flash del móvil; si necesitas más luz, usa una LED continua con difusor, lateral.
- Hora ideal: luz de día, mañana o tarde con cielo ligeramente nublado.

## 4. Composición y ángulos
- 90° cenital: bowls, mesas con varios elementos o platos planos.
- 45° tres cuartos: platos con volumen y contexto de mesa.
- 10-20° bajo: carnes y platos con altura.
Regla práctica: 3 ángulos por plato (cenital, 45° y detalle cercano) y deja espacio negativo para textos o recortes.

## 5. Estilismo y detalles finales
- Último toque en el momento: hierba fresca, crujiente o gotas de aceite.
- Controla brillos: un paño mate para eliminar reflejos indeseados.
- Color: añade un elemento verde o ácido para contraste cromático.
- Acción: una toma con salsa vertiéndose o una mano aporta storytelling.

## 6. Paso a paso
Monta el plato y da el toque final → apoya el móvil estable (trípode pequeño) → ajusta encuadre y bloquea exposición/enfoque → dispara ráfaga de 5-8 fotos variando ángulo → revisa en pantalla y repite si hace falta → etiqueta la mejor con nombre y versión.

## 7. Edición rápida
Apps: Lightroom Mobile o Snapseed. Ajustes: exposición, contraste, temperatura, sombras y claridad; saturación selectiva sin exagerar. Recorte: 4:3 o 3:2 para web, 1:1 para Instagram. Exportar: JPG sRGB, lado largo 1200-1600 px, calidad 80-90%.`},

`## Mejoras del perfil
✎ Mejoras que necesita el perfil de Google de este negocio:

## Información básica
- Horario actualizado (incluye festivos y cierres).
- Teléfono correcto y operativo.

- Categoría principal correcta + secundarias relevantes.

## Fotos y vídeos (mínimo 5 nuevas al mes)
- Fotos de platos actuales, local, equipo y ambiente.
- Vídeos cortos (10-20 s).
- Eliminar fotos antiguas o de baja calidad.
- Subir fotos verticales (Google las prioriza).

## Servicios, atributos y menú
- Servicios: terraza, delivery, take away, menú del día, accesibilidad, pago con tarjeta.
- Atributos: apto para familias, pet friendly, veg-friendly, sin gluten.
- Menú actualizado con platos estrella destacados, precios y fotos reales.
- Quitar platos que ya no existen.

## Reseñas
- Responder al 100% de reseñas (máx. 24 h).
- Solicitar reseñas a clientes satisfechos.
- Detectar patrones (platos, servicio, tiempos).

## Mantenimiento
Diario: leer reseñas nuevas, responder con tono profesional, marcar las que requieren acción interna.
Semanal: subir 5 fotos, publicar 1-2 posts, revisar menú, precios, horarios y atributos.

## Protocolo de respuestas a reseñas
| Tipo | Tiempo máx. | Cómo responder
| Positiva | 24 h | Agradecer y mencionar el detalle; invitar a volver.

| Negativa (1-2★) | 6 h | Lamentar sin excusas, indicar revisión interna, ofrecer contacto.
| Falsa / injusta | — | Cordial, indicar que no hay registro pero se quiere ayudar; reportar a Google.

> Injusta: "Hola [Nombre], gracias por tu comentario. No encontramos registro de tu visita, pero queremos ayudarte. Contáctanos en [email] para revisar el caso."
> Pedir reseña: "Hola [Nombre], gracias por venir. ¿Te importaría dejarnos una reseña en Google? Nos ayuda muchísimo: [link]. ¡Mil gracias!"`},

`## Preparación antes de grabar
- Elige clientes que estén contentos y relajados.
- Busca un lugar con buena luz y poco ruido.
- Graba en vertical (Reels, TikTok, Shorts).
- Móvil a la altura de los ojos.
- Pide permiso para usar el vídeo en redes y web.
- Explica que será rápido y sencillo (1 minuto).

## Estructura del testimonio
El testimonio debe seguir esta estructura — genera más confianza que un "todo muy rico":
- Quién soy.
- Qué buscaba / qué problema tenía.
- Qué encontré en el restaurante.
- Qué me sorprendió / qué me encantó.
- Por qué volvería / por qué lo recomiendo.
- Resumen final en una frase.

## Guion de entrevista (preguntas exactas)
Haz 3-5 preguntas, no más. El cliente debe hablar en frases cortas y naturales.
> "¿Cómo te llamas y qué te trajo hoy al restaurante?"
> "¿Qué estabas buscando o qué esperabas encontrar?"
> "¿Qué es lo que más te ha gustado de la comida o del ambiente?"
> "¿Qué dirías que nos hace diferentes a otros sitios de la zona?"
> "Si tuvieras que recomendarlo a un amigo, ¿qué le dirías?"
> "Resume tu experiencia en una frase corta y contundente."

## Checklist de calidad del testimonio
- Cliente cómodo y sonriente.
- Audio claro.
- Vídeo vertical.
- Duración 20-40 segundos.
- Menciona al menos 1 beneficio (comida, servicio, ambiente).
- Menciona por qué volvería.
- Fondo limpio y luz frontal.

## Dónde usar estos testimonios
- Reels / TikTok.
- Stories destacadas.
- Google Maps (subir como vídeo).
- Web (sección testimonios).
- WhatsApp Business (bienvenida).
- Anuncios de Meta Ads (prueba social = conversión alta).`},

`Asigna un responsable a cada etapa del proceso. Lo que no tiene dueño, no se hace.

## Revisión diaria
- 1. Gestión inicial — alinear objetivos del día y resolver incidencias (proveedores, personal, pagos, clientes).
- 2. Gestión de personal — confirmar turnos, resolver incidencias de última hora y asignar sustituciones.
- 3. Repaso de reservas / ocupación — ajustar personal, prever picos y definir prioridades de servicio.
- 4. Gestión del servicio y satisfacción — detectar desviaciones operativas y resolver incidencias en tiempo real.
- 5. Cierre administrativo del día — revisar KPIs (food cost, ticket medio, ocupación, satisfacción), cerrar caja, pasar tiquets y facturas.
✎ Responsable de cada etapa diaria:

## Revisión mensual
- 1. Cierre contable mensual — consolidar ventas, costes directos e indirectos y preparar el informe de resultados del mes.
- 2. Revisión de cashflow y previsión — proyección de liquidez para 30/60 días y detección de picos de pago.
- 3. Gestión de nóminas — validar la nómina mensual, horas extras y variaciones de plantilla antes de pagar.
- 4. Gestión fiscal — preparar impuestos mensuales/trimestrales (retenciones, IVA, modelos) y coordinar con asesoría.
- 5. Inventario completo — conteo detallado de almacén para actualizar stocks.
- 6. Actualización de escandallos y precios — actualizar costes por plato frente a variaciones de producto y revisar márgenes.
- 7. Evaluación de proveedores — analizar precios, plazos y calidad; renegociar condiciones si procede.
- 8. Mantenimiento preventivo — revisar partes y coordinar intervenciones técnicas programadas.
- 9. Formación y evaluación del personal — planificar microformaciones y evaluar el desempeño del mes.
- 10. Marketing y ventas — revisar campañas, reservas, eventos y ROI de las acciones promocionales.
- 11. Revisión de KPIs del mes — ticket medio, covers, ocupación, food cost y % margen por categoría.
- 12. Planificación del mes que entra — ajustar pedidos según rotación y previsión de demanda.
- 13. Resumen mensual y plan de acción — documento ejecutable con incidencias, responsables y objetivos para el mes siguiente.
- 14. Revisión de la cuenta de resultados — ingresos, coste de ventas (food cost), gastos fijos y variables, margen bruto, EBITDA y resultado neto; identificar desviaciones y acciones correctoras.
- 15. Obligaciones legales y fiscales — IVA, Impuesto de Sociedades, retenciones e impuestos laborales (IRPF y cotizaciones), tasas locales (IAE, licencias), HACCP, contratos, seguros y revisiones periódicas.`},

  'playbook-liderazgo': {
    eyebrow: 'Playbook · Personal',
    titulo: 'Playbook de liderazgo',
    sub: 'Cómo dirigir al equipo para dejar de ser el cuello de botella: rituales, feedback, delegación y conversaciones difíciles.',
    bloques: [
      {t: 'dato', items: [{v: '2–3 min', l: 'de briefing al inicio de cada turno'}, {v: '1 + 1', l: 'una cosa bien y una a mejorar'}, {v: '15 min', l: 'a solas con cada persona, cada semana'}, {v: '48 h', l: 'como mucho para tratar un conflicto'}]},
      {t: 'cap', n: '01', titulo: 'El papel de quien dirige', sub: 'Dejar de hacerlo todo para que el equipo lo haga bien.'},
      {t: 'p', x: 'En hostelería, el responsable suele ser el mejor en su puesto: el que más rápido emplata o el que mejor lleva la sala. Por eso acaba haciéndolo todo él, y el negocio no puede funcionar un día sin su presencia. Dirigir es otra cosa: conseguir que el equipo haga bien el trabajo aunque tú no estés mirando.'},
      {t: 'h', x: 'Principios básicos para liderar'},
      {t: 'tarjetas', items: [{k: '01', t: 'Liderar con ejemplo', d: 'El mando es modelo en puntualidad, seguridad, trato y procesos. El equipo copia lo que ve, no lo que se le dice.'}, {k: '02', t: 'Comunicar con propósito', d: 'Cada comunicación con objetivo claro, receptor definido y acción esperada.'}, {k: '03', t: 'Decidir y responsabilizar', d: 'Decisiones rápidas en servicio; responsabilidades claras y escalado definido.'}, {k: '04', t: 'Aprender y mejorar', d: 'Los errores como aprendizaje, no para buscar culpables; mejoras bienvenidas y registradas.'}, {k: '05', t: 'Reconocer y visibilizar', d: 'Reconocimiento frecuente y público de lo alineado con la cultura.'}]},
      {t: 'regla', x: 'Se corrige en privado y se reconoce en público. Nunca al revés.'},
      {t: 'campo', id: 'compromiso', label: 'Nuestro compromiso como equipo', ayuda: 'La frase que nos define', grande: true},
      {t: 'lista', titulo: 'Valores clave (ejemplo)', items: ['Respeto: tratamos a clientes y compañeros con cortesía.', 'Responsabilidad: cumplimos horarios y tareas sin excusas.', 'Calidad: cuidamos cada plato y servicio.', 'Proactividad: proponemos mejoras y ayudamos sin esperar orden.', 'Seguridad: priorizamos higiene y seguridad siempre.']},
      {t: 'campo', id: 'valores', label: 'Nuestros valores', ayuda: 'Los de este negocio, con una línea que explique cada uno'},

      {t: 'cap', n: '02', titulo: 'Los rituales', sub: 'Pocos, cortos y siempre. La constancia hace el trabajo.'},
      {t: 'tabla', cab: ['Ritual', 'Cuándo', 'Duración', 'Para qué'], filas: [
        ['Briefing', 'Al inicio de cada turno', '2–3 min', 'Todos saben qué pasa hoy y qué se espera'],
        ['Micro-feedback', 'Durante el turno', '30–60 s', 'Corregir a tiempo y reforzar lo bueno'],
        ['Cierre de turno', 'Al acabar', '2 min', 'Qué salió bien, qué falló, qué queda para mañana'],
        ['Reunión a solas', 'Cada semana, con cada persona', '10–15 min', 'Detectar problemas antes de que estallen'],
        ['Reunión de equipo', 'Una vez al mes', '30 min', 'Resultados, cambios y propuestas del equipo'],
        ['Evaluación', 'Cada trimestre', '30 min', 'Ver el progreso y fijar objetivos']]},
      {t: 'h', x: 'El briefing, en cuatro puntos'},
      {t: 'check', titulo: 'Antes de cada servicio', items: ['La prioridad del día: un grupo, un plato nuevo, un evento', 'Quién hace qué: pase, partidas, zonas de sala', 'Los riesgos: faltas, producto que no llegó, reservas grandes', 'Un objetivo que se pueda medir: tiempos, cero devoluciones, postres vendidos']},
      {t: 'p', x: 'Estructura: prioridad del día · roles y responsables · riesgos · objetivo medible.'},
      {t: 'frases', titulo: 'Frases para usar', items: ['«Hoy priorizamos [X]. Responsable de pase: [A]. Riesgo: [Z]. Objetivo: mantener tiempos y cero incidencias.»', '«Hoy tenemos un grupo de 20 a las 21:30. Pase: Ana. Riesgo: vamos cortos de merluza, se ofrece el arroz. Objetivo: ningún plato devuelto.»']},
      {t: 'h', x: 'Micro-feedback en servicio (30–60 s)'},
      {t: 'p', x: '1 cosa bien + 1 mejora inmediata. Corregir en el momento; reforzar después.'},
      {t: 'h', x: 'La reunión semanal a solas'},
      {t: 'p', x: 'Diez o quince minutos con cada persona, siempre el mismo día. Agenda: estado, logro, bloqueo, objetivo semanal y apoyo requerido. Registro: una línea con la acción y la fecha de revisión.'},
      {t: 'lista', titulo: 'Las cinco preguntas', items: ['¿Cómo estás? ¿Cómo va la semana?', '¿Qué te ha salido especialmente bien?', '¿Qué te está bloqueando o te complica el trabajo?', '¿En qué quieres mejorar esta semana?', '¿Qué necesitas de mí?']},
      {t: 'h', x: 'Ritual de reconocimiento'},
      {t: 'p', x: 'Mencionar un logro en cada briefing semanal y documentarlo. Recompensas simples: turno preferente, mención en grupo, incentivo operativo.'},
      {t: 'campos', items: [
        {id: 'hora-briefing', label: 'Hora de los briefings', ayuda: 'Mediodía y noche'},
        {id: 'dia-11', label: 'Día de las reuniones a solas', ayuda: 'Por ejemplo, martes antes del servicio'},
        {id: 'reunion-equipo', label: 'Reunión de equipo', ayuda: 'Qué día de cada mes'},
      ]},

      {t: 'cap', n: '03', titulo: 'Dar feedback', sub: 'Hablar de lo que se ha visto, no de cómo es la persona.'},
      {t: 'p', x: 'El feedback que funciona describe un hecho concreto, explica su efecto y propone qué hacer. «Eres un desastre» no cambia nada; «la mesa 4 esperó 10 minutos la cuenta y se fue molesta» sí.'},
      {t: 'tarjetas', items: [{k: 'Situación', t: 'Cuándo y dónde', d: '«Ayer en el segundo turno…»'}, {k: 'Conducta', t: 'Qué se hizo, en concreto', d: '«…salieron tres platos sin revisar en el pase…»'}, {k: 'Impacto', t: 'Qué provocó', d: '«…y uno volvió porque le faltaba la salsa.»'}]},
      {t: 'tabla', cab: ['En vez de…', 'Decimos'], filas: [
        ['«Siempre llegas tarde»', '«Esta semana has llegado tarde el lunes y el jueves. ¿Qué está pasando?»'],

        ['«Espabila»', '«Tenemos cuatro mesas esperando. Primero la 6 y la 8, yo me ocupo de la 3.»'],
        ['«Muy bien» (sin más)', '«Muy bien cómo has resuelto la queja de la 5: el cliente se ha ido contento.»']]},
      {t: 'regla', x: 'En pleno servicio, solo lo urgente y en una frase. El resto, al acabar, a solas.'},

      {t: 'cap', n: '04', titulo: 'Delegar', sub: 'Delegar no es soltar la tarea: es explicarla bien una vez.'},
      {t: 'pasos', etiqueta: 'Ejemplo', items: [
        {t: 'La tarea', d: 'Qué hay que hacer, en una frase.', e: '«Te encargas del pedido de verduras de los lunes.»'},
        {t: 'El resultado esperado', d: 'Cómo se sabe que está bien hecho.', e: '«Que no nos falte nada hasta el jueves y no sobre género que se estropee.»'},
        {t: 'El plazo', d: 'Cuándo tiene que estar.', e: '«Hecho antes de las 12, para que llegue el martes.»'},
        {t: 'Los recursos', d: 'Qué tiene a mano para hacerlo.', e: '«Tienes el stock y los mínimos en la app, y el teléfono del proveedor.»'},
        {t: 'Cuándo avisar', d: 'La señal de que algo se tuerce y hay que escalarlo.', e: '«Si algo cuesta más de un 10 % de lo normal, me avisas antes de pedirlo.»'},
      ]},
      {t: 'regla', x: 'Delegar siempre con confirmación verbal: la persona lo repite con sus palabras. Si no sabe explicarlo, no está delegado.'},
      {t: 'tabla', titulo: 'Los cuatro niveles de autonomía', cab: ['Nivel', 'Significa', 'Para'], filas: [['1', 'Hazlo como te digo', 'Alguien nuevo o una tarea delicada'], ['2', 'Propón y yo decido', 'Cuando está aprendiendo a decidir'], ['3', 'Decide y me informas', 'Alguien con experiencia en esa tarea'], ['4', 'Decide tú', 'Tareas que ya domina del todo']]},
      {t: 'campo', id: 'delegado', label: 'Lo que delegamos y a quién', ayuda: 'Tarea, persona y nivel de autonomía'},

      {t: 'cap', n: '05', titulo: 'Conversaciones difíciles', sub: 'Lo que no se habla a tiempo acaba estallando en pleno servicio.'},
      {t: 'pasos', items: [
        {t: 'Prepararla', d: 'Con hechos concretos, fechas y ejemplos. Sin opiniones ni rumores.', e: ''},
        {t: 'En privado y pronto', d: 'En 24 o 48 horas, nunca delante del equipo ni en pleno servicio.', e: ''},
        {t: 'Escuchar primero', d: 'Preguntar qué está pasando. A menudo hay un motivo que no se conocía.', e: ''},
        {t: 'Acordar algo concreto', d: 'Qué cambia, desde cuándo y cómo se va a comprobar.', e: ''},
        {t: 'Revisarlo', d: 'Poner fecha para volver a hablarlo y cumplirla. Dejar una nota de lo acordado.', e: ''},

      {t: 'tabla', titulo: 'Situaciones habituales', cab: ['Qué pasa', 'Cómo se aborda'], filas: [

        ['Conflicto entre dos compañeros', 'Primero cada uno por separado, después juntos, centrados en cómo trabajar a partir de ahora'],
        ['Bajo rendimiento', 'Qué se espera exactamente, qué está fallando y qué apoyo necesita. Revisión en dos semanas'],
        ['Una falta de respeto', 'Se para en el momento y se habla ese mismo día. No se tolera, venga de quien venga'],

  'proceso-seleccion': {
    eyebrow: 'Proceso · Personal',
    titulo: 'Proceso de selección',
    sub: 'De la publicación a la contratación: cómo encontrar a la persona adecuada y no equivocarse con prisas.',
    bloques: [
      {t: 'dato', items: [{v: '6', l: 'fases, siempre en este orden'}, {v: '20–25 min', l: 'de entrevista con guion'}, {v: '60', l: 'puntos entre entrevista y prueba'}, {v: '72 h', l: 'como mucho para dar una respuesta'}]},
      {t: 'cap', n: '01', titulo: 'Antes de publicar', sub: 'Si no está claro qué se busca, no se va a encontrar.'},
      {t: 'p', x: 'La mayoría de malas contrataciones en hostelería se hacen con prisa: falta alguien para el fin de semana y se coge al primero que puede empezar. Definir el puesto antes de publicar lleva diez minutos y ahorra semanas de problemas.'},
      {t: 'ficha', filas: ['Puesto y área', 'Tareas principales', 'Turnos y días', 'Jornada y tipo de contrato', 'Salario bruto', 'Convenio aplicable', 'Fecha de incorporación', 'Imprescindible', 'Deseable']},
      {t: 'regla', x: 'El salario va en el anuncio. Ahorra entrevistas con quien nunca lo habría aceptado.'},

      {t: 'cap', n: '02', titulo: 'Publicación y recepción de candidaturas', sub: 'Un anuncio claro atrae a quien encaja.'},
      {t: 'lista', titulo: 'Dónde buscar', items: ['Escoge las plataformas: JobToday, LinkedIn, InfoJobs y otros portales de hostelería.', 'El propio equipo: quien recomienda a alguien suele recomendar bien.', 'Las redes sociales del negocio: los clientes también conocen a gente.', 'Escuelas de hostelería, para perfiles en formación.', 'El banco de candidatos de procesos anteriores.']},
      {t: 'lista', titulo: 'Cómo publicar', items: ['Un anuncio claro y breve: puesto, responsabilidades, turno y jornada, y salario orientativo.', 'Indica cómo aplicar: CV más un formulario corto (nombre, teléfono, disponibilidad y turno preferente).', 'Recoge los CV en una lista con nombre, teléfono, disponibilidad, experiencia clave y fecha. Ordénala por preferencia.']},
      {t: 'frases', titulo: 'Anuncio modelo', items: ['«Buscamos cocinero/a para restaurante de cocina mediterránea en [zona]. Jornada completa, turno partido de martes a sábado, dos días libres seguidos. [Salario] € brutos al mes. Buscamos a alguien con al menos un año de experiencia en partida de caliente, ordenado/a y con ganas de aprender. Incorporación el [fecha]. Envía tu CV y dinos tu disponibilidad y turno preferente.»']},
      {t: 'campo', id: 'plataformas', label: 'Dónde publicamos', ayuda: 'Plataformas y contactos de este negocio'},

      {t: 'cap', n: '03', titulo: 'Criba y validación inicial', sub: 'De muchas candidaturas a cinco entrevistas.'},
      {t: 'pasos', etiqueta: 'Frases para usar', items: [
        {t: 'Criba general', d: 'Revisa CV y formulario en bloques, cada 10–15 candidatos, no uno a uno a medida que llegan. Con la ficha del puesto delante: primero lo imprescindible, después lo deseable.', e: ''},
        {t: 'Los cinco mejores', d: 'Saca una lista de los 5 mejores perfiles para convocar a entrevista.', e: ''},
        {t: 'Validación inicial', d: 'Confirmar disponibilidad y convocar a entrevista por WhatsApp o llamada.', e: '«Hola [Nombre], soy [Tu nombre] de [Restaurante]. Te convocamos a una entrevista presencial el [día] a las [hora] en [dirección]. ¿Puedes confirmar asistencia? Gracias.»'},
        {t: 'Contestar a los que no encajan', d: 'Mensaje cordial y guardar su candidatura en el banco de candidatos. Es la imagen del negocio, y puede servir más adelante.', e: '«Gracias por tu interés. Esta vez seguimos con otros perfiles, pero guardamos tu candidatura para próximas ocasiones.»'},
      ]},

      {t: 'cap', n: '04', titulo: 'Entrevista presencial', sub: '20–25 minutos, con guion. Todos igual, para poder comparar.'},
      {t: 'p', x: 'Se trata de profundizar en la experiencia, la motivación y los comportamientos, y de comprobar que todo es coherente. Se puntúa sobre 30. Guion paso a paso:'},
      {t: 'pasos', etiqueta: 'Frases para usar', items: [
        {t: 'Bienvenida e introducción', d: 'Observar: puntualidad, saludo, lenguaje corporal. Registrar: llegó puntual (sí/no) y primera impresión.', e: '«Hola, soy [Nombre], responsable de [área]. Gracias por venir. La entrevista durará 20–25 minutos: revisaremos tu experiencia, haremos tres preguntas de situaciones reales y algunas técnicas. ¿Te viene bien?»'},
        {t: 'Presentación del local', d: 'Qué cocina se hace, cuántos servicios, cómo es el equipo y qué turnos se buscan.', e: '«Trabajo aquí como [puesto] desde [tiempo]. Somos un restaurante de [estilo], con [nº] servicios diarios y un equipo de [nº]. Nuestro pico es [horario] y buscamos cubrir [turnos/funciones].»'},
        {t: 'Explicar el objetivo de la entrevista', d: 'Que sepa qué se va a valorar y cuál es el siguiente paso.', e: '«El objetivo es comprobar tu experiencia y ver cómo resuelves situaciones reales. Si avanzas, habrá una prueba práctica presencial. ¿De acuerdo?»'},
        {t: 'Repaso del CV y datos críticos', d: 'Objetivo: verificar la veracidad y la responsabilidad real; detectar huecos o puestos inflados.', e: '«Veo que trabajaste en [Empresa]. ¿Qué rol exacto tenías y en qué fechas?» · «¿Qué tareas hacías a diario? ¿Qué turnos realizabas?» · «En tu CV aparece [puesto]; dime 3 tareas que hacías cada servicio.»'},
        {t: 'Confirmar la experiencia relevante', d: 'Un resumen corto, en sus palabras.', e: '«Para resumir: ¿podrías en 1–2 frases describir tu experiencia más relevante para este puesto y cuándo podrías incorporarte?»'},
        {t: 'Verificar disponibilidad y condiciones', d: 'Fecha de incorporación, turnos, restricciones y salario.', e: '«¿Cuál sería tu fecha de incorporación? ¿Qué turnos puedes cubrir? ¿Alguna restricción horaria? ¿Cuál es tu expectativa salarial bruta mensual?»'},
        {t: 'Preguntas conductuales (situación · acción · resultado)', d: 'Que cuente qué pasó, qué hizo y cómo acabó. Puntuar cada una: concreción (1–5), acción y responsabilidad (1–5), resultado y aprendizaje (1–5).', e: '«Cuéntame una vez que hubo un fallo en servicio (plato equivocado, retraso, falta de producto). ¿Qué hiciste y cuál fue el resultado?» · «Dame un ejemplo de cuando el equipo se saturó en servicio y cómo ayudaste a mantener el ritmo.» · «Cuéntame un feedback difícil que recibiste y qué cambiaste tras ello.»'},
        {t: 'Preguntas técnicas', d: 'Cómo actúa ante un problema real del puesto.', e: '«En plena salida falta un ingrediente base; ¿qué haces en los próximos 5 minutos?» · «Fallo del lavavajillas en pico: ¿cómo garantizas copas y servicio?»'},
        {t: 'Casos del puesto (respuesta en una frase)', d: 'Rapidez y criterio para priorizar.', e: '«Una mesa lleva 20 minutos desde la comanda; ¿qué haces inmediatamente?» · «Tienes que reponer cristalería para 50 cubiertos en 15 minutos y el lavavajillas está a tope; ¿qué priorizas?»'},
        {t: 'Cierre y siguientes pasos', d: 'Qué traer, cuándo se le responde y turno para sus preguntas.', e: '«¿Puedes traer DNI y referencias a la prueba práctica si te convocamos?» · «Te confirmaremos por WhatsApp o llamada en 48–72 horas. Gracias por tu tiempo.»'},
      ]},

    eyebrow: 'Guía · Gestión',
    titulo: 'Los números del negocio',
    sub: 'Los seis números que dicen si un restaurante gana dinero, cómo se calculan, dónde verlos en la app y qué hacer cuando se desvían.',

    bloques: [

      {t: 'p', x: 'Se puede tener la mejor receta, el escandallo perfecto y cero mermas, y aun así perder el margen en la compra: un proveedor que parece barato y no lo es, un pedido a ojo que acaba caducando, un albarán que no se revisa o una subida de precio que nadie ve hasta final de mes.'},

      {t: 'p', x: 'En la app, el QR de reseña puede salir al final de cada ticket (Mi Negocio, con el enlace de Google Maps puesto en Redes sociales). Y la encuesta de satisfacción privada (Promoción → Clientes) recoge las quejas antes de que acaben en Google.'},

  'guia-meta-ads': {
    eyebrow: 'Manual para el cliente · Captación',
    titulo: 'Meta Ads',
    sub: 'Cómo conseguir clientes con anuncios en Instagram y Facebook, paso a paso, sin perder dinero. Pensado para un restaurante o bar de barrio, no para un experto en marketing.',
    bloques: [
      {t: 'dato', items: [{v: '3–5 km', l: 'a la redonda: tu cliente real'}, {v: '5–10 €', l: 'al día para empezar, diario y no total'}, {v: '3–4 días', l: 'sin tocar el anuncio para que aprenda'}, {v: '2–3', l: 'versiones del anuncio para quedarte con la mejor'}]},
      {t: 'p', x: 'Lee primero el capítulo 01. Te ahorrará el error que comete casi todo el mundo.'},
      {t: 'cap', n: '01', titulo: 'Antes de gastar un euro', sub: 'Lo primero que tienes que entender: cuatro ideas antes de gastar.'},
      {t: 'p', x: 'Meta Ads es la herramienta para anunciarte en Instagram y Facebook. Bien usada, llena tus mesas flojas con clientes de tu zona. Mal usada, es tirar dinero.'},
      {t: 'regla', x: 'El error nº1 que comete todo el mundo: darle al botón azul de «Promocionar publicación» en Instagram. Es cómodo, pero gastas más y segmentas peor. Siempre se crea desde el Administrador de Anuncios. Esa diferencia sola ya te ahorra dinero.'},
      {t: 'tarjetas', items: [{k: 'Idea 1', t: 'El anuncio lleva a tu perfil', d: 'Antes de anunciarte, tu Instagram tiene que estar cuidado: buenas fotos, bio clara y cómo reservar. Si el perfil da pena, el cliente no viene.'}, {k: 'Idea 2', t: 'Amplifica, no salva', d: 'La publicidad multiplica un buen negocio; no arregla uno malo. Primero el negocio, luego el anuncio.'}, {k: 'Idea 3', t: 'Local, no el mundo', d: 'Anúnciate solo a 3–5 km a la redonda: tu cliente real es el que puede venir andando o en un trayecto corto.'}, {k: 'Idea 4', t: 'Valor, no descuento', d: 'El que viene solo por un 50 % no vuelve a pagar precio completo. Mejor un plato que da hambre que regalar margen.'}]},
      {t: 'check', titulo: 'Lo que necesitas tener listo', items: ['Una página de Facebook del negocio', 'Tu Instagram vinculado a ella', 'Una cuenta en Meta Business Suite (business.facebook.com)', 'Un método de pago', 'Si no los tienes, se crean gratis en 10 minutos']},

      {t: 'cap', n: '02', titulo: 'Crear tu campaña, paso a paso', sub: 'Manos a la obra: seis pasos.'},
      {t: 'pasos', etiqueta: 'Consejo', items: [
        {t: 'Entra en el Administrador de Anuncios', d: 'Ve a business.facebook.com → Administrador de Anuncios → botón verde «Crear». Nunca desde el botón azul de la app.', e: ''},
        {t: 'Elige el objetivo', d: 'Para un negocio local, casi siempre «Interacción» (mensajes a tu WhatsApp/Instagram) o «Tráfico» (llevar a tu web de reservas). Si dudas, empieza por interacción.', e: 'Tu web de reservas es el enlace público de GastroGoan que tienes en Mi Negocio: la reserva entra sola en la app.'},
        {t: 'Define el presupuesto', d: 'Empieza con 5–10 € al día. No hace falta más para probar. Pon presupuesto diario, no total, para controlarlo mejor.', e: ''},
        {t: 'Segmenta tu público', d: 'Ubicación: tu local + 3–5 km. Edad y sexo: tu cliente ideal. Intereses: gastronomía, restaurantes, planes locales… Empieza ancho; ya afinarás.', e: ''},
        {t: 'Sube la creatividad', d: 'Un vídeo corto (10–20 s) que dé hambre o una foto muy buena del plato estrella. Texto breve con un gancho y una llamada clara: «Reserva», «Te esperamos», «Pídelo».', e: 'Las fotos y los vídeos, con la Guía fotográfica. Un testimonio de un cliente (Guía de prueba social) convierte muy bien.'},
        {t: 'Publica y espera', d: 'Meta lo revisa en unas horas. Déjalo correr 3–4 días sin tocarlo: necesita tiempo para aprender a quién enseñarlo.', e: ''},
      ]},
      {t: 'regla', x: 'Truco: crea 2–3 versiones del anuncio (distinta foto o distinto texto) con poco presupuesto cada una. A los pocos días verás cuál funciona mejor; apaga las otras y pon el dinero en la ganadora.'},

      {t: 'cap', n: '03', titulo: 'Qué anunciar', sub: 'Un anuncio, un objetivo, un público.'},
      {t: 'tabla', cab: ['Si quieres…', 'Anuncia', 'A quién y cuándo'], filas: [
        ['Llenar los martes o miércoles', 'Un plato o un plan concreto de ese día', '3–5 km, de domingo a martes'],
        ['El menú del mediodía', 'El menú de la semana, con precio', '1–2 km alrededor, de lunes a jueves por la mañana'],
        ['Un evento o una cena especial', 'El evento, la fecha y cómo reservar', '5 km, las dos semanas antes'],
        ['Pedidos para llevar o a domicilio', 'El plato que mejor viaja y cómo pedirlo', 'Tu zona de reparto, a la hora de la cena'],
        ['Que te conozca gente nueva', 'Tu mejor reel o un testimonio', '3–5 km, siempre encendido con poco presupuesto']]},
      {t: 'campo', id: 'campanas', label: 'Nuestras campañas', ayuda: 'Qué anunciamos, a quién, cuándo y con qué presupuesto'},

      {t: 'cap', n: '04', titulo: '¿Funciona? Las cuentas', sub: 'Un anuncio se mide en reservas, no en «me gusta».'},
      {t: 'p', x: 'Ejemplo: 7 € al día durante 30 días son 210 €. Si la campaña trae 30 reservas de 2 personas con un ticket medio de 25 €, son 1.500 € en ventas. Con un food cost del 30 %, quedan unos 1.050 € para pagar lo demás: la campaña se ha pagado cinco veces.'},
      {t: 'lista', titulo: 'Cómo saber qué reservas vienen del anuncio', items: ['Preguntar al reservar: «¿Cómo nos has conocido?» y apuntarlo.', 'Usar en el anuncio una frase o un plato que solo se anuncia ahí («pregunta por el menú de martes»).', 'Mirar los mensajes y los clics al enlace de reservas que da el propio Administrador de Anuncios.', 'Comparar las reservas de esos días con las de las semanas anteriores.']},
      {t: 'tabla', titulo: 'Qué mirar en el Administrador de Anuncios', cab: ['Dato', 'Qué dice'], filas: [['Coste por resultado', 'Cuánto cuesta cada mensaje o cada clic. Es el número principal'], ['Alcance', 'Cuántas personas distintas lo han visto'], ['Frecuencia', 'Cuántas veces lo ha visto cada persona. Por encima de 3–4, cansa: cambia la creatividad'], ['CTR', 'De cada 100 que lo ven, cuántos hacen clic. Si es muy bajo, la foto o el texto no enganchan']]},
      {t: 'regla', x: 'Si en dos semanas no trae reservas, se apaga. Se cambia la creatividad o el público y se prueba otra vez.'},

      {t: 'cap', n: '05', titulo: 'Los errores más caros', sub: 'Lo que hace que la publicidad «no funcione».'},
      {t: 'lista', titulo: 'Evitar siempre', items: ['Promocionar desde el botón azul de Instagram.', 'Anunciarse a toda la provincia en vez de a 3–5 km.', 'Tocar el anuncio cada día sin dejarle aprender.', 'Un anuncio sin llamada a la acción ni forma de reservar.', 'Fotos oscuras o de catálogo: tiene que dar hambre.', 'Regalar descuentos grandes que atraen a quien no volverá.', 'No mirar nunca si trae reservas.']},
      {t: 'campos', items: [
        {id: 'presupuesto', label: 'Nuestro presupuesto', ayuda: 'Al día y al mes'},
        {id: 'zona', label: 'Nuestra zona', ayuda: 'Radio y barrios'},
      ]},
      {t: 'campo', id: 'nota-coach', label: 'Nota de tu coach', ayuda: 'Qué anunciar primero en este negocio y por qué', grande: true},
    ],
  },
  'guia-fotografica': {
    eyebrow: 'Contenido · Fotografía',
    titulo: 'Fotos que dan hambre',
    sub: 'Cómo fotografiar un plato desde el móvil. Buenas fotos con el smartphone que ya tienes.',
    bloques: [
      {t: 'dato', items: [{v: '3', l: 'ángulos por plato'}, {v: '5–8', l: 'fotos en ráfaga por toma'}, {v: '2', l: 'props como máximo'}, {v: '0', l: 'veces el flash del móvil'}]},
      {t: 'regla', x: 'La foto no corrige errores: el plato sale de cocina impecable y solo entonces disparas.'},
      {t: 'cap', n: '01', titulo: 'Preparación previa', sub: 'Antes de sacar el móvil.'},
      {t: 'lista', titulo: 'Preparación', items: ['Plato perfecto: sale de cocina impecable; la foto no corrige errores.', 'Superficie y fondo neutro: madera, mármol o tela lisa; máximo 2 props coherentes.', 'Luz natural lateral: junto a una ventana; evita luz directa y sombras duras.', 'Organiza el flujo: ten a mano el plato, el móvil, un reflector improvisado (cartón blanco) y un paño.']},

      {t: 'cap', n: '02', titulo: 'Ajustes técnicos', sub: 'Lo que hay que tocar en el móvil.'},
      {t: 'lista', titulo: 'Ajustes recomendados', items: ['Activa la cuadrícula para componer con la regla de tercios.', 'Dispara en RAW si tu móvil lo permite; si no, en la máxima calidad JPG.', 'Bloqueo de exposición y enfoque (AE/AF Lock): toca el punto y mantén para fijar.', 'HDR para platos con alto rango dinámico; prueba ON/OFF.', 'Modo retrato para platos con altura; modo manual/pro si quieres controlar ISO y velocidad.', 'Limpia la lente antes de cada sesión.']},

      {t: 'cap', n: '03', titulo: 'Iluminación', sub: 'La luz lo es casi todo.'},
      {t: 'lista', titulo: 'Luz', items: ['Luz lateral suave: coloca el plato perpendicular a la ventana.', 'Reflector casero: cartón blanco o papel para rellenar sombras desde el lado opuesto.', 'Evita el flash del móvil. Si necesitas más luz, usa una LED continua con difusor, lateral.', 'Hora ideal: luz de día, mañana o tarde con cielo ligeramente nublado.']},

      {t: 'cap', n: '04', titulo: 'Composición y ángulos', sub: 'Cada plato tiene su ángulo.'},
      {t: 'tarjetas', items: [{k: '90°', t: 'Cenital', d: 'Bowls, mesas con varios elementos o platos planos.'}, {k: '45°', t: 'Tres cuartos', d: 'Platos con volumen y contexto de mesa.'}, {k: '10–20°', t: 'Bajo', d: 'Carnes y platos con altura.'}]},
      {t: 'regla', x: 'Regla práctica: toma 3 ángulos por plato (cenital, 45° y detalle cercano) y deja espacio negativo para textos o recortes posteriores.'},

      {t: 'cap', n: '05', titulo: 'Estilismo y detalles finales', sub: 'El último minuto antes de disparar.'},
      {t: 'lista', titulo: 'Detalles', items: ['Último toque en el momento: hierba fresca, crujiente o gotas de aceite.', 'Controla brillos: un papel mate o un paño para eliminar reflejos indeseados.', 'Color: añade un elemento verde o ácido para contraste cromático.', 'Acción: una toma con salsa vertiéndose o una mano aporta storytelling.']},

      {t: 'cap', n: '06', titulo: 'Paso a paso', sub: 'La sesión, en seis movimientos.'},
      {t: 'pasos', items: [
        {t: 'Monta el plato', d: 'Y retoca el detalle final.', e: ''},
        {t: 'Apoya el móvil estable', d: 'En un trípode pequeño o bien apoyado.', e: ''},
        {t: 'Encuadra y bloquea', d: 'Ajusta encuadre, bloquea exposición y enfoque.', e: ''},
        {t: 'Dispara en ráfaga', d: 'Ráfaga de 5–8 fotos variando ligeramente distancia y ángulo.', e: ''},
        {t: 'Revisa', d: 'En pantalla, y repite si hace falta.', e: ''},
        {t: 'Etiqueta la mejor', d: 'Con el nombre del plato y la versión.', e: ''},
      ]},

      {t: 'cap', n: '07', titulo: 'Edición rápida', sub: 'Cinco minutos, no una hora.'},
      {t: 'tabla', cab: ['', 'Cómo'], filas: [['Apps', 'Lightroom Mobile o Snapseed'], ['Ajustes', 'Exposición, contraste, temperatura, sombras y claridad; saturación selectiva sin exagerar'], ['Recorte', '4:3 o 3:2 para web; 1:1 para Instagram (el vertical 4:5 también funciona muy bien en el feed)'], ['Exportar', 'JPG sRGB, lado largo 1200–1600 px, calidad 80–90 %']]},
      {t: 'regla', x: 'Si la foto necesita mucha edición, es mejor repetirla. El plato de la foto tiene que ser el que llega a la mesa.'},

      {t: 'cap', n: '08', titulo: 'Vídeo corto', sub: 'Lo que más alcance tiene hoy en redes.'},
      {t: 'lista', titulo: 'Las tomas que funcionan', items: ['La salsa cayendo o el queso fundiéndose, a cámara lenta.', 'El corte o el primer bocado.', 'El plato montándose, de principio a fin, en pocos segundos.', 'El plato saliendo del pase hacia la mesa.', 'El género fresco llegando a cocina.']},
      {t: 'check', titulo: 'Antes de publicar', items: ['Vertical (9:16) y de 10 a 20 segundos', 'Lo mejor, en los 2 primeros segundos', 'Texto en pantalla o subtítulos: mucha gente lo ve sin sonido', 'Luz lateral, como en las fotos', 'Móvil apoyado o con las dos manos, sin temblar']},

      {t: 'cap', n: '09', titulo: 'Una sesión al mes', sub: 'Tener fotos siempre, sin agobios.'},
      {t: 'p', x: 'Una mañana tranquila al mes, antes de abrir, con luz de día: se fotografían los platos nuevos y los estrella con sus tres ángulos y un vídeo de cada uno. Con eso hay material para las redes, para el perfil de Google, para la carta y para los anuncios de todo el mes.'},

  'gestion-google-maps': {
    eyebrow: 'Documento de entrega · Marketing',
    titulo: 'Gestión del perfil de Google',
    sub: 'Cómo tener un perfil que atrae clientes y cómo responder reseñas. Plan a 3 meses.',
    bloques: [
      {t: 'dato', items: [{v: '5', l: 'fotos nuevas al mes como mínimo'}, {v: '100 %', l: 'de las reseñas, respondidas'}, {v: '6 h', l: 'como mucho para responder una negativa'}, {v: '3', l: 'meses para tener un perfil que trabaje solo'}]},
      {t: 'cap', n: '01', titulo: 'Por qué importa', sub: 'Es el escaparate donde se decide la mayoría de visitas.'},
      {t: 'p', x: 'Cuando alguien busca «restaurante cerca» o el nombre del local, lo primero que ve es el perfil de Google: fotos, nota, reseñas, horario y cómo reservar. Muchos clientes deciden ahí, en segundos, sin llegar a entrar en la web ni en Instagram. Un perfil cuidado trae clientes cada día sin pagar publicidad.'},
      {t: 'campo', id: 'mejoras', label: 'Mejoras que necesita el perfil de Google de este negocio', ayuda: 'Lo que el coach ha detectado', grande: true},

      {t: 'cap', n: '02', titulo: 'Condiciones de un buen perfil', sub: 'Revisa cada punto y márcalo cuando esté.'},

      {t: 'tabla', cab: ['Cuándo', 'Qué se hace'], filas: [['Diario', 'Leer reseñas nuevas, responder con tono profesional, marcar las que requieren acción interna'], ['Semanal', 'Subir 5 fotos, publicar 1–2 posts, revisar menú, precios, horarios y atributos'], ['Mensual', 'Auditar categorías, fotos antiguas, coherencia del menú y estadísticas (visitas, llamadas, clics)']]},

      {t: 'lista', titulo: 'Cómo pedirlas', items: ['En el mejor momento: al cliente contento, al despedirse o al pagar.', 'Sin fricción: un QR que lleve directo a escribir la reseña. En la app se puede imprimir al final de cada ticket (Mi Negocio, con el enlace de Google Maps puesto en Redes sociales).', 'Por mensaje, a los clientes habituales que ya han dado su contacto.', 'La encuesta de satisfacción privada de la app ayuda a enterarse de lo que falla antes de que llegue a Google.']},
      {t: 'regla', x: 'Nunca se ofrece nada a cambio de una reseña, ni se piden solo a quien va a poner cinco estrellas de forma forzada: Google lo prohíbe y puede borrar las reseñas o penalizar el perfil.'},

      {t: 'cap', n: '05', titulo: 'Protocolo de respuestas a reseñas', sub: 'Cada tipo de reseña, con su tiempo y su tono.'},
      {t: 'tabla', cab: ['Tipo', 'Tiempo máx.', 'Cómo responder'], filas: [['Positiva', '24 h', 'Agradecer y mencionar el detalle; invitar a volver.'], ['Neutra (3★)', '12 h', 'Agradecer, tomar nota para mejorar, invitar de nuevo.'], ['Negativa (1–2★)', '6 h', 'Lamentar sin excusas, indicar revisión interna, ofrecer contacto.'], ['Falsa / injusta', '—', 'Cordial, indicar que no hay registro pero se quiere ayudar; reportar a Google.']]},
      {t: 'regla', x: 'Tono siempre: cercano pero profesional, agradecido, sin excusas, sin confrontación, ofreciendo solución y cerrando con invitación a volver.'},
      {t: 'p', x: 'Una respuesta no es solo para quien escribió la reseña: la leen todos los que miran el perfil después. Una negativa bien contestada da más confianza que diez positivas sin respuesta.'},

      {t: 'cap', n: '06', titulo: 'Plantillas listas para copiar', sub: 'Se personalizan siempre con el nombre y un detalle.'},
      {t: 'frases', titulo: 'Frases para usar', items: ['Positiva: «¡Gracias, [Nombre]! Nos alegra que hayas disfrutado de [detalle]. Te esperamos pronto para seguir sorprendiéndote.»', 'Neutra: «Gracias por tu comentario, [Nombre]. Tomamos nota de lo que mencionas para mejorar. Nos encantará verte de nuevo.»', 'Negativa: «Hola [Nombre], gracias por compartir tu experiencia. Lamentamos que [situación] no haya estado a la altura. Lo estamos revisando; escríbenos a [email] para ayudarte. Nos gustaría verte de nuevo.»', 'Injusta: «Hola [Nombre], gracias por tu comentario. No encontramos registro de tu visita, pero queremos ayudarte. Contáctanos en [email] para revisar el caso.»', 'Pedir reseña: «Hola [Nombre], gracias por venir. ¿Te importaría dejarnos una reseña en Google? Nos ayuda muchísimo: [link]. ¡Mil gracias!»']},

  'guia-prueba-social': {
    eyebrow: 'Documento de entrega · Marketing',
    titulo: 'Guía para grabar prueba social',
    sub: 'Cómo conseguir testimonios en vídeo que generan confianza y venden.',
    bloques: [
      {t: 'dato', items: [{v: '20–40 s', l: 'dura un buen testimonio'}, {v: '3–5', l: 'preguntas, no más'}, {v: '1 min', l: 'le cuesta al cliente'}, {v: '6', l: 'sitios donde usarlo'}]},
      {t: 'cap', n: '01', titulo: 'Por qué funciona', sub: 'Lo que dice un cliente vale más que lo que dices tú.'},
      {t: 'p', x: 'Cuando el negocio habla de sí mismo, es publicidad. Cuando lo cuenta un cliente de verdad, con su cara y sus palabras, es confianza. Un testimonio bien grabado sirve durante meses: en redes, en Google, en la web y en los anuncios.'},
      {t: 'tabla', cab: ['Tipo de prueba social', 'Ejemplo'], filas: [['Testimonio en vídeo', 'Un cliente contando su experiencia en 30 segundos'], ['Reseñas', 'Una captura de una reseña de 5★ en Google'], ['Contenido de clientes', 'Repost de la foto que un cliente subió de su plato'], ['El local lleno', 'Un sábado a tope, en un vídeo de pocos segundos'], ['Cifras', '«Más de 500 reseñas con un 4,7»']]},

      {t: 'cap', n: '02', titulo: 'Preparación antes de grabar', sub: 'Cinco minutos de preparación, un testimonio que sirve meses.'},
      {t: 'check', titulo: 'Antes de grabar', items: ['Elige clientes que estén contentos y relajados', 'Busca un lugar con buena luz y poco ruido', 'Graba en vertical (Reels, TikTok, Shorts)', 'Móvil a la altura de los ojos', 'Pide permiso para usar el vídeo en redes y web', 'Explica que será rápido y sencillo (1 minuto)']},
      {t: 'frases', titulo: 'Cómo pedirlo sin incomodar', items: ['«Nos encanta que os haya gustado. ¿Os importaría contarlo en un vídeo de un minuto para nuestras redes? Son tres preguntas y lo hacemos aquí mismo.»']},
      {t: 'regla', x: 'El permiso, por escrito: un mensaje o una firma que diga que acepta que el vídeo se use en redes, web y anuncios. Y nunca menores sin autorización de sus padres.'},

      {t: 'cap', n: '03', titulo: 'Estructura del testimonio', sub: 'Genera más confianza que un «todo muy rico».'},
      {t: 'pasos', items: [
        {t: 'Quién soy', d: '', e: ''},
        {t: 'Qué buscaba / qué problema tenía', d: '', e: ''},
        {t: 'Qué encontré en el restaurante', d: '', e: ''},
        {t: 'Qué me sorprendió / qué me encantó', d: '', e: ''},
        {t: 'Por qué volvería / por qué lo recomiendo', d: '', e: ''},
        {t: 'Resumen final en una frase', d: '', e: ''},
      ]},

      {t: 'cap', n: '04', titulo: 'Guion de entrevista', sub: 'Preguntas exactas. Haz 3–5, no más.'},
      {t: 'p', x: 'El cliente debe hablar en frases cortas y naturales. Se le pide que repita la pregunta en su respuesta («Lo que más me ha gustado es…»), así el vídeo se entiende sin oír al que pregunta.'},
      {t: 'frases', titulo: 'Frases para usar', items: ['«¿Cómo te llamas y qué te trajo hoy al restaurante?»', '«¿Qué estabas buscando o qué esperabas encontrar?»', '«¿Qué es lo que más te ha gustado de la comida o del ambiente?»', '«¿Qué dirías que nos hace diferentes a otros sitios de la zona?»', '«Si tuvieras que recomendarlo a un amigo, ¿qué le dirías?»', '«Resume tu experiencia en una frase corta y contundente.»']},
      {t: 'h', x: 'Guion largo: 7 preguntas'},
      {t: 'p', x: 'Para un testimonio más completo, con un cliente habitual o después de una celebración o un evento. Se graba con calma, y del vídeo largo salen varios cortos.'},
      {t: 'frases', titulo: 'Plantilla de guion para grabar testimoniales', items: ['1 · «Bueno, [NOMBRE], cuéntame un poquito sobre ti: de dónde eres, a qué te dedicas y desde cuándo vienes por aquí.»', '2 · «¿Qué buscabas antes de venir? ¿Qué te faltaba en otros sitios?»', '3 · «¿Por qué elegiste venir a [restaurante] con respecto a otros?»', '4 · «¿Qué cosa en particular te ha gustado en especial? ¿Por qué piensas que te gustó eso?»', '5 · «¿Qué te llevas de la experiencia? ¿Qué conseguiste: la celebración, la comida, el rato con los tuyos?»', '6 · «¿Cómo te imaginas la próxima vez que vuelvas?»', '7 · «¿Qué le dirías a la gente que aún está pensando si venir a [restaurante], para que se animen a hacerlo?»']},

      {t: 'cap', n: '05', titulo: 'Checklist de calidad del testimonio', sub: 'Antes de publicarlo, que cumpla todo.'},
      {t: 'check', titulo: 'Calidad', items: ['Cliente cómodo y sonriente', 'Audio claro', 'Vídeo vertical', 'Duración 20–40 segundos', 'Menciona al menos 1 beneficio (comida, servicio, ambiente)', 'Menciona por qué volvería', 'Fondo limpio y luz frontal']},
      {t: 'p', x: 'Al editar: se cortan los silencios, se deja lo mejor en los primeros segundos y se ponen subtítulos, porque mucha gente ve los vídeos sin sonido. Apps como CapCut o Edits los ponen solos.'},

      {t: 'cap', n: '06', titulo: 'Dónde usar estos testimonios', sub: 'Un vídeo, seis usos.'},
      {t: 'tabla', cab: ['Dónde', 'Cómo'], filas: [['Reels / TikTok', 'Tal cual, con subtítulos'], ['Stories destacadas', 'Un destacado de «Clientes» en el perfil'], ['Google Maps', 'Subir como vídeo al perfil'], ['Web', 'Sección de testimonios'], ['WhatsApp Business', 'En el mensaje de bienvenida'], ['Anuncios de Meta Ads', 'Prueba social = conversión alta']]},
      {t: 'campos', items: [
        {id: 'resp-testimonios', label: 'Quién graba', ayuda: 'Nombre'},
        {id: 'objetivo-testimonios', label: 'Nuestro objetivo', ayuda: 'Por ejemplo, 2 testimonios al mes'},
      ]},
      {t: 'campo', id: 'nota-coach', label: 'Nota de tu coach', ayuda: 'Qué clientes grabar primero en este negocio', grande: true},
    ],
  },
  'fidelizacion-clientes': {
    eyebrow: 'Guía · Marketing',
    titulo: 'Fidelización y clientes',
    sub: 'Captar un cliente nuevo cuesta mucho más que hacer volver a uno que ya vino. Cómo cuidar la base de clientes con la app, WhatsApp y email.',
    bloques: [
      {t: 'dato', items: [{v: '1', l: 'ficha por cliente, con sus visitas y su gasto'}, {v: '60 días', l: 'sin venir: el aviso para escribirle'}, {v: '15 días', l: 'entre difusiones de WhatsApp como mucho'}, {v: '0', l: 'mensajes a quien no ha dado permiso'}]},
      {t: 'cap', n: '01', titulo: 'Por qué fidelizar', sub: 'El cliente que repite es el que sostiene el negocio.'},
      {t: 'p', x: 'Un restaurante vive de los que vuelven. Si 200 clientes habituales vienen una vez más al año, con un ticket medio de 25 € por persona y en mesas de dos, son 10.000 € de ventas sin gastar un euro en publicidad. Y el que vuelve recomienda, deja reseña y perdona un mal día.'},
      {t: 'regla', x: 'Primero cuidar a los que ya vienen. Después, buscar nuevos.'},

      {t: 'cap', n: '02', titulo: 'La base de clientes', sub: 'Lo que no se apunta, no se puede usar.'},
      {t: 'p', x: 'En la app, cada cliente tiene su ficha en Clientes: contacto, cumpleaños, visitas, última visita, ticket medio, alergias, notas y si ha dado permiso para recibir comunicaciones. Cuanto antes se crea la ficha de un cliente, antes se le puede cuidar.'},
      {t: 'lista', titulo: 'Cómo hacer crecer la base', items: ['Al reservar por teléfono: pedir nombre y móvil, y preguntar si quiere recibir novedades.', 'Al reservar por la web: con el nombre y el teléfono de la reserva se crea su ficha.', 'Con una excusa que valga la pena: el menú del mes, los eventos, la carta de temporada.', 'Anotando lo que se sabe: su mesa favorita, su vino, su celebración.']},
      {t: 'regla', x: 'Solo se escribe a quien ha dado su permiso para recibir comunicaciones. Es la ley (RGPD), y además un mensaje no pedido se lee como spam.'},

      {t: 'cap', n: '03', titulo: 'A quién escribir y qué decirle', sub: 'Un mensaje para todos no le habla a nadie.'},
      {t: 'tabla', cab: ['Grupo (filtro en Clientes)', 'Qué necesita', 'Mensaje'], filas: [
        ['Nuevos (primera visita hace menos de 30 días)', 'Una razón para volver pronto', '«Gracias por venir, Laura. La próxima vez, pregunta por el arroz del domingo.»'],
        ['Inactivos (60+ días)', 'Que se acuerden de ti', '«Hace tiempo que no te vemos. Ha entrado la carta de otoño; te guardamos mesa cuando quieras.»'],
        ['En riesgo de fuga', 'Saber qué ha pasado', 'Una llamada o un mensaje personal del responsable, no una difusión'],
        ['VIP (7+ puntos)', 'Sentirse de la casa', 'Enterarse antes que nadie: la cena especial, el plato nuevo'],
        ['Con alergias', 'Seguridad', 'Avisar cuando haya platos nuevos aptos para ellos']]},
      {t: 'campo', id: 'grupos', label: 'Nuestros grupos de clientes', ayuda: 'Qué mensaje recibe cada uno y cada cuánto'},

      {t: 'cap', n: '04', titulo: 'WhatsApp y email', sub: 'Poco, útil y personal.'},
      {t: 'tabla', cab: ['Canal', 'Ritmo', 'Qué funciona'], filas: [['WhatsApp', '1 difusión cada 15 días', 'El plato nuevo, el menú de la semana, un evento. Corto, con foto y cómo reservar'], ['Email', '1 al mes', 'Un dato curioso del restaurante, la carta de temporada, las fechas señaladas']]},
      {t: 'lista', titulo: 'Reglas de oro de los mensajes', items: ['Con el nombre del cliente y desde el nombre del restaurante.', 'Una sola idea por mensaje, con foto y el enlace de reservas.', 'Nada de mensajes diarios: cansan y se bloquean.', 'Siempre una forma fácil de darse de baja.', 'Las listas de difusión de WhatsApp solo llegan a quien tiene guardado el número del restaurante: pídele que lo guarde.']},
      {t: 'frases', titulo: 'Mensajes modelo', items: ['«Hola, Laura 👋 Esta semana entra la carta de otoño: setas, caza y el arroz de boletus. ¿Te guardamos mesa? Reserva aquí: [enlace]»', '«Hola, Jordi. Te echamos de menos por aquí. Este jueves hacemos cena de maridaje con vinos de la zona; quedan 8 plazas: [enlace]»']},

      {t: 'cap', n: '05', titulo: 'Premiar la fidelidad', sub: 'Que volver tenga su recompensa.'},
      {t: 'lista', titulo: 'Ideas que funcionan', items: ['Puntos de fidelidad: se suman en la ficha de cada cliente, y los VIP (7 puntos o más) se ven con un filtro.', 'Un detalle en la visita número 5 o 10: un postre, una copa.', 'Vales regalo: la app los emite desde Clientes, y son un regalo que trae clientes nuevos.', 'El cumpleaños o el aniversario: un mensaje y un detalle si celebran aquí.', 'Reconocer al habitual por su nombre: no cuesta nada y es lo que más se recuerda.']},
      {t: 'regla', x: 'Mejor un detalle inesperado que un descuento: el descuento enseña a venir solo cuando lo hay.'},
      {t: 'campo', id: 'programa', label: 'Nuestro programa de fidelidad', ayuda: 'Qué se premia y cómo'},

      {t: 'cap', n: '06', titulo: 'Escuchar', sub: 'Enterarse de lo que falla antes de que el cliente se vaya.'},
      {t: 'p', x: 'La encuesta de satisfacción privada se envía desde Promoción → Clientes, con su plantilla de mensaje y el enlace, justo después de la visita. Quien pone un 6 o menos se lo cuenta al negocio y no a Google: es la oportunidad de llamarle, pedir disculpas y arreglarlo. En esa misma pantalla hay plantillas listas para felicitar el cumpleaños, pedir una reseña con el enlace de Google o invitar a volver.'},
      {t: 'check', titulo: 'Cada semana', items: ['Leer las respuestas de la encuesta', 'Llamar o escribir a quien puntuó bajo', 'Revisar el filtro «En riesgo de fuga»', 'Anotar en la ficha lo que se ha hablado']},
      {t: 'campos', items: [
        {id: 'resp-clientes', label: 'Quién lleva la relación con los clientes', ayuda: 'Nombre'},
        {id: 'dia-difusion', label: 'Días de difusión', ayuda: 'WhatsApp y email'},
      ]},
      {t: 'campo', id: 'nota-coach', label: 'Nota de tu coach', ayuda: 'Lo primero que hay que hacer con los clientes de este negocio', grande: true},

  },
  'guia-app': {

    bloques: [

      {t: 'cap', n: '01', titulo: 'El orden lo es todo', sub: 'La app funciona como una pirámide.'},

      {t: 'tabla', cab: ['Paso', 'Qué es', 'En la app'], filas: [

      {t: 'p', x: 'Listo cuando… los datos de tu local aparecen correctos y no sale ningún aviso de campo vacío.'},

# Avisos gratuitos de dependencias con fallos conocidos (solo de desarrollo y pruebas:
# la app que se entrega no lleva dependencias de npm).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

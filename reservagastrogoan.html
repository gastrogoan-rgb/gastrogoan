// Coste de envío a domicilio, con posibilidad de que el negocio lo haga
// gratis a partir de un importe mínimo de pedido (p.freeDeliveryFrom, 0 o
// sin definir = no hay umbral, siempre se cobra el envío fijo).
function getDeliveryFee(p, subtotal, isDelivery){
  if(!isDelivery) return 0;
  const fee = p.deliveryFee || 0;
  const freeFrom = p.freeDeliveryFrom || 0;
  if(freeFrom > 0 && subtotal >= freeFrom) return 0;
  return fee;
}

// Importe de propina a partir del % elegido (o el importe fijo si se
// escribió uno "otro importe") sobre el subtotal de platos — nunca sobre
// el gasto de envío, igual que se calcularía a mano.
function computeTipAmount(subtotal){
  if(cartTipPct === 'custom') return Math.max(0, cartTipCustom || 0);
  return Math.round(subtotal * (cartTipPct||0) / 100 * 100) / 100;
}
function setTip(pct){
  cartTipPct = pct;
  cartTipCustom = 0;
  renderCartSummary();
}
function setTipCustom(val){
  cartTipPct = 'custom';
  cartTipCustom = Math.max(0, parseFloat(val) || 0);
  renderCartSummary();
}
function tipSelectorHtml(){
  const opts = [0, 5, 10, 15];
  return `
    <div class="field" style="margin-top:14px;margin-bottom:0">
      <label>${t('cart.tip.label')}</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${opts.map(pct => `<button type="button" class="btn btn-sm" style="flex:1;min-width:56px;padding:9px 6px;min-height:38px;font-size:13px;${cartTipPct===pct?'background:var(--ink);color:#fff':''}" onclick="setTip(${pct})">${pct===0?t('cart.tip.none'):pct+'%'}</button>`).join('')}
        <button type="button" class="btn btn-sm" style="flex:1;min-width:56px;padding:9px 6px;min-height:38px;font-size:13px;${cartTipPct==='custom'?'background:var(--ink);color:#fff':''}" onclick="document.getElementById('tip-custom-input').focus()">${t('cart.tip.other')}</button>
      </div>
      ${cartTipPct==='custom' ? `<input type="number" id="tip-custom-input" min="0" step="0.5" value="${cartTipCustom||''}" placeholder="${t('cart.tip.otherPlaceholder')}" style="margin-top:8px" oninput="setTipCustom(this.value)">` : ''}
    </div>
  `;
}
function renderCartSummary(){
  const box = document.getElementById('cart-summary');
  if(!box) return;
  const submitBtn = document.getElementById('o-submit');
  if(!cart.length){
    box.innerHTML = `<div class="empty">${t('cart.empty')}</div>`;
    if(submitBtn) submitBtn.disabled = true;
    return;
  }
  const p = (DB.business||{}).pedidos || {};
  const subtotal = cart.reduce((s,l)=>s+l.price*l.qty,0);
  const deliveryFee = getDeliveryFee(p, subtotal, currentTab === 'delivery');
  const freeFrom = p.freeDeliveryFrom || 0;
  const missingForFreeDelivery = currentTab === 'delivery' && freeFrom > 0 && subtotal < freeFrom ? freeFrom - subtotal : 0;
  const tip = computeTipAmount(subtotal);
  const total = subtotal + deliveryFee + tip;
  const pedidoMinimo = currentTab !== 'mesa' ? (p.pedidoMinimo || 0) : 0;
  const bajoMinimo = pedidoMinimo > 0 && subtotal < pedidoMinimo;
  if(submitBtn) submitBtn.disabled = bajoMinimo;
  box.innerHTML = `
    <h2>${t('cart.title')}</h2>
    ${cart.map(l => {
      const modsText = (l.modificadores||[]).length ? `<div style="font-size:11.5px;color:var(--muted);margin-top:1px">${l.modificadores.map(m=>escapeHtml(trItem(m))).join(', ')}</div>` : '';
      // Las líneas con extras llevan su propio +/- aquí (en el listado de la
      // carta solo tienen el botón "Añadir", ver buildMenuHtml) — así se
      // puede ajustar la cantidad de "pizza con extra queso" sin afectar a
      // "pizza sin nada", que es una línea distinta del carrito.
      const hasMods = (l.modificadores||[]).length > 0;
      return `
      <div class="cart-line" style="align-items:flex-start;padding:8px 0">
        <div style="flex:1">
          <div>${hasMods ? '' : (l.qty+'× ')}${escapeHtml(l.name)}</div>
          ${modsText}
        </div>
        ${hasMods
          ? `<div class="qty-ctl" style="gap:6px">
               <button onclick="changeCartLineQty('${escapeHtml(l.key)}', -1)" aria-label="${escapeHtml(t('aria.removeItem').replace('%s', l.name))}" style="width:26px;height:26px;font-size:14px">−</button>
               <span class="mono" style="min-width:14px;text-align:center">${l.qty}</span>
               <button onclick="changeCartLineQty('${escapeHtml(l.key)}', 1)" aria-label="${escapeHtml(t('aria.addItem').replace('%s', l.name))}" style="width:26px;height:26px;font-size:14px">+</button>
             </div>`
          : ''}
        <span style="white-space:nowrap;margin-left:8px">${fmtMoney(l.price*l.qty)}</span>
      </div>`;
    }).join('')}
    ${currentTab === 'delivery' && freeFrom > 0 && deliveryFee === 0 && subtotal > 0 ? `<div class="cart-line"><span>${t('cart.shipping')}</span><span style="color:var(--olive);font-weight:600">${t('cart.shipping.free')}</span></div>` : (deliveryFee > 0 ? `<div class="cart-line"><span>${t('cart.shipping')}</span><span>${fmtMoney(deliveryFee)}</span></div>` : '')}
    ${tip > 0 ? `<div class="cart-line"><span>${t('cart.tip.line')}</span><span>${fmtMoney(tip)}</span></div>` : ''}
    ${missingForFreeDelivery > 0 ? `<p style="font-size:12.5px;color:var(--muted);margin:4px 0 0"><i class="ti ti-truck"></i> ${t('cart.shipping.freeHint').replace('%s', fmtMoney(missingForFreeDelivery))}</p>` : ''}
    <div class="cart-total bump" aria-live="polite"><span>${t('cart.total')}</span><span>${fmtMoney(total)}</span></div>
    ${bajoMinimo ? `<p style="font-size:13px;color:var(--red);margin-top:8px">${t('cart.min').replace('%s', fmtMoney(pedidoMinimo)).replace('%s', fmtMoney(pedidoMinimo - subtotal))}</p>` : ''}
    ${currentTab !== 'mesa' && (document.getElementById('o-date')?.value||todayStr()) === todayStr() ? etaHintHtml() : ''}
    ${tipSelectorHtml()}
  `;
}

// Estimación de "tu pedido debería estar listo en X min" a partir de la
// carga real de cocina ahora mismo (cocinaCargaActiva, sincronizado en
// vivo) — no un tiempo fijo que sea mentira en hora punta o exagerado en
// horas tranquilas. Formula configurable desde Mi Negocio → Pedidos:
// tiempo base + minutos extra por cada pedido que cocina tiene aún sin
// terminar, con un tope máximo para no anunciar esperas disparatadas.
function etaHintHtml(){
  const p = (DB.business||{}).pedidos || {};
  const base = p.tiempoBasePrep != null ? p.tiempoBasePrep : 15;
  const extra = p.extraPorPedidoEnCola != null ? p.extraPorPedidoEnCola : 3;
  const max = p.tiempoMaxEstimado != null ? p.tiempoMaxEstimado : 60;
  const carga = DB.cocinaCargaActiva || 0;
  const eta = Math.min(base + carga * extra, max || (base + carga * extra));
  const label = currentTab === 'delivery' ? t('cart.etaDelivery') : t('cart.etaTakeaway');
  return `<p style="font-size:13px;color:var(--muted);margin-top:8px">🕐 ${label.replace('%d', eta)}</p>`;
}

async function submitOrder(){
  if(!cart.length){ showInlineError(t('error.carrito.vacio')); return; }
  if((DB.business||{}).pedidosOnlineActivos === false){ showInlineError(t('error.pedidosPausados.body')); return; }
  if(submittingRequest) return;
  submittingRequest = true;
  setBtnLoading('o-submit', true);
  const clienteNombre = document.getElementById('o-name').value.trim();
  const clienteTelefono = document.getElementById('o-phone').value.trim();
  const clienteEmail = document.getElementById('o-email').value.trim();
  const date = document.getElementById('o-date').value;
  const time = document.getElementById('o-time').value;
  const isDelivery = currentTab === 'delivery';
  const clienteDireccion = isDelivery ? document.getElementById('o-address').value.trim() : '';
  const notas = document.getElementById('o-notes').value.trim();
  const p = (DB.business||{}).pedidos || {};
  const zoneRestricted = isDelivery && ((p.cpList||[]).length || p.radiusKm > 0);
  const codigoPostal = zoneRestricted ? document.getElementById('o-cp').value.trim() : '';

  clearFieldInvalid(['o-name','o-phone','o-date','o-time','o-address','o-cp','o-email']);
  if(!clienteNombre || !clienteTelefono || !date || !time || (isDelivery && !clienteDireccion) || (zoneRestricted && !codigoPostal)){
    if(!clienteNombre) markFieldInvalid('o-name');
    if(!clienteTelefono) markFieldInvalid('o-phone');
    if(!date) markFieldInvalid('o-date');
    if(!time) markFieldInvalid('o-time');
    if(isDelivery && !clienteDireccion) markFieldInvalid('o-address');
    if(zoneRestricted && !codigoPostal) markFieldInvalid('o-cp');
    showInlineError(t('error.campos'));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  if(clienteEmail && !isValidEmail(clienteEmail)){
    markFieldInvalid('o-email');
    showInlineError(t('error.email.invalido'));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }

  const subtotal = cart.reduce((s,l)=>s+l.price*l.qty,0);
  const pedidoMinimo = p.pedidoMinimo || 0;
  if(pedidoMinimo > 0 && subtotal < pedidoMinimo){
    showInlineError(t('error.pedido.min').replace('%s', fmtMoney(pedidoMinimo)));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }

  const turnos = getTurnosForDate(date);
  if(turnos !== null && !turnos.length){
    showInlineError(t('error.cerrado').replace('%s', nombreDia(date).toLowerCase()));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  if(turnos !== null && turnos.length && !isTimeAllowed(date, time)){
    showInlineError(t('error.horario').replace('%s', t('error.horario.pedidos')).replace('%s', nombreDia(date).toLowerCase()).replace('%s', formatTurnos(turnos)));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  // Además de estar dentro del horario de apertura, la cocina puede
  // necesitar dejar de aceptar pedidos un rato antes del cierre real (para
  // dar tiempo a prepararlos y no quedarse con un pedido a medias a la hora
  // de cerrar). Se aplica solo a pedidos, no a reservas de mesa.
  if(turnos !== null && turnos.length){
    const cutoffTime = pedidosCutoffTimeForTurno(date, time, p);
    if(cutoffTime && time > cutoffTime.limite){
      showInlineError(t('error.cierrePedidos').replace('%s', cutoffTime.limite));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
  }

  const leadTimeMin = getLeadTimeMin('pedido');
  if(leadTimeMin && date === todayStr()){
    const now = new Date(Date.now() + leadTimeMin * 60000);
    const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    if(time < minTime){
      showInlineError(t('error.antelacion').replace('%d', leadTimeMin).replace('%s', minTime));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
  }

  const maxPorFranja = p.maxPorFranja || 0;
  if(maxPorFranja > 0){
    const slot = roundToPedidoSlot(time);
    const baseline = ((DB.pedidosResumen||{})[date]||{})[slot] || 0;
    // Comprobación final ATÓMICA justo antes de enviar, igual que con el
    // aforo de reservas: cierra la ventana de carrera entre dos pedidos
    // casi simultáneos para la misma franja.
    const result = await reservePedidoSlotAtomic(date, slot, maxPorFranja, baseline);
    if(!result.committed){
      showInlineError(t('error.pedidos.completo'));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
  }

  let pendienteVerificarZona = false;
  if(zoneRestricted){
    const zoneCheck = await checkDeliveryZone(p, codigoPostal, clienteDireccion);
    if(!zoneCheck.ok){
      showInlineError(t('error.zona'));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
    pendienteVerificarZona = !!zoneCheck.pendienteVerificar;
  }

  const deliveryFee = getDeliveryFee(p, subtotal, isDelivery);
  const tip = computeTipAmount(subtotal);
  const total = subtotal + deliveryFee + tip;

  // Método de pago elegido entre las opciones que el negocio acepta
  // (efectivo / tarjeta al recibir / TPV virtual). Si es DOMICILIO y elige
  // efectivo, pedimos con qué billete va a pagar — así el repartidor sabe
  // de antemano cuánto cambio llevar, en vez de descubrirlo al llegar.
  // Para recoger en el local no se pregunta: el cliente paga en persona en
  // el mostrador, no hace falta que nadie lleve cambio a ningún sitio.
  const metodoPago = document.querySelector('input[name="o-pago-metodo"]:checked')?.value || 'efectivo';
  let metodoPagoLocal = null, pagaCon = null;
  if(metodoPago !== 'tpv'){
    metodoPagoLocal = metodoPago === 'tarjeta_local' ? 'tarjeta' : 'efectivo';
    if(isDelivery && metodoPagoLocal === 'efectivo'){
      const pagaConEl = document.getElementById('o-paga-con');
      pagaCon = pagaConEl ? parseFloat(pagaConEl.value) : NaN;
      if(isNaN(pagaCon) || pagaCon < total){
        showInlineError(t('error.pagaCon').replace('%s', fmtMoney(total)));
        submittingRequest = false;
        setBtnLoading('o-submit', false);
        return;
      }
    }
  }

  const req = {
    type:'pedido', tipo: isDelivery ? 'delivery' : 'takeaway',
    clienteNombre, clienteTelefono, clienteEmail, clienteDireccion, codigoPostal, notas, date, time,
    costeEnvio: deliveryFee, propina: tip,
    items: cart.map(l => ({name:l.name, price:l.price, qty:l.qty, modificadores:l.modificadores||undefined})),
    createdAt: new Date().toISOString(),
    // Token para poder seguir el estado del pedido después de enviarlo (ver
    // trackOrderStatus más abajo) — antes solo se generaba si se pagaba con
    // tarjeta (dentro de payWithCard), así que un pedido pagado en efectivo
    // no tenía ninguna forma de que el cliente comprobara su estado.
    clientRef: genClientRef()
  };
  if(pendienteVerificarZona) req.pendienteVerificarZona = true;
  if(metodoPagoLocal) req.metodoPagoLocal = metodoPagoLocal;
  if(pagaCon != null) req.pagaCon = pagaCon;

  req.total = total;

  const submitBtn = document.getElementById('o-submit');
  if(submitBtn) submitBtn.disabled = true;

  if(metodoPago === 'tpv'){
    setPaySubmitEnabled(false);
    payWithCard(req, total, isDelivery ? t('order.delivery.title') : t('order.takeaway.title'));
    return;
  }

  sendRequest(req, t('order.ok'));
}

/* ============ PAGO CON TARJETA (TPV virtual / Redsys) ============
   1) Firmamos el pago con el Worker ANTES de registrar el pedido en el
      negocio (antes se hacía al revés: se registraba el pedido en Firebase
      y LUEGO se pedía la firma — si el Worker fallaba o el fetch se caía a
      medio camino, quedaba un pedido huérfano en el TPV sin ningún estado
      de pago, indistinguible de uno a pagar en el local). Así, si la firma
      falla, no llega a crearse ningún pedido en el negocio.
   2) Solo si la firma tiene éxito, registramos el pedido (con su
      clientRef) y redirigimos al cliente al TPV de Redsys.
   3) Cuando el banco confirme el pago, el Worker avisará automáticamente
      al restaurante (evento pago_confirmado). */
// refField: qué campo de `req` identifica el pago al volver del banco
// (clientRef para pedidos, resToken para la señal de una reserva — ver
// pago_confirmado en initPublicRequestsListener, js/core.js, que busca por
// ambos). submitBtnId: qué botón reactivar si algo falla.
function payWithCard(req, amount, description, refField, submitBtnId){
  refField = refField || 'clientRef';
  submitBtnId = submitBtnId || 'o-submit';
  const ref = req[refField] || genClientRef();
  req[refField] = ref;

  const base = location.href.split('?')[0] + '?neg=' + encodeURIComponent(publicId);
  fetch(`${REDSYS_WORKER_URL}/sign`, {
    method: 'POST',
    headers: {'content-type':'application/json'},
    body: JSON.stringify({
      publicId, orderRef: ref, amount, description,
      urlOk: base + '&pago=ok',
      urlKo: base + '&pago=ko'
    })
  }).then(r => r.json()).then(data => {
    if(!data || !data.url || data.error){
      showInlineError(t('error.pago') + (data && data.error ? ' ' + data.error : ''));
      setPaySubmitEnabled(true, submitBtnId);
      return;
    }
    return db.ref('gastrogoan/public/' + publicId + '/requests').push(req).then(() => {
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = data.url;
      Object.entries(data.fields).forEach(([k,v]) => {
        const input = document.createElement('input');
        input.type = 'hidden'; input.name = k; input.value = v;
        form.appendChild(input);
      });
      document.body.appendChild(form);
      form.submit();
    });
  }).catch(e => {
    console.error(e);
    showInlineError(t('error.pago.conexion'));
    setPaySubmitEnabled(true, submitBtnId);
  });
}
function setPaySubmitEnabled(enabled, submitBtnId){
  submitBtnId = submitBtnId || 'o-submit';
  if(enabled){
    submittingRequest = false;
    setBtnLoading(submitBtnId, false);
  }else{
    const btn = document.getElementById(submitBtnId);
    if(btn) btn.disabled = true;
  }
}

/* ============ PEDIDO EN MESA (auto-pedido) ============ */
function renderMesaOrderForm(){
  const box = document.getElementById('tab-content');
  const cartas = getActiveCartasConPlatos();

  if(!cartas.length && !getActiveMenusPublic().length){
    box.innerHTML = `<div class="card"><div class="empty">${t('carta.empty.mesa')}</div></div>`;
    return;
  }

  const tables = DB.tables || [];
  const currentTable = tableIdFromUrl ? tables.find(tb => String(tb.id) === String(tableIdFromUrl)) : null;

  const menuHtml = buildMenuHtml(cartas);

  box.innerHTML = `
    <div class="card">
      <h2>${t('order.mesa.title')}</h2>
      ${currentTable
        ? `<p style="font-size:13px;color:var(--muted);margin-top:-6px">${t('order.mesa.info').replace('%s', escapeHtml(currentTable.name))}</p>`
        : tableIdFromUrl
          ? `<p style="font-size:13px;color:var(--red);margin-top:-6px">${t('order.mesa.unknown')}</p>
             <div class="field"><label>${t('order.mesa.select')}</label><input type="text" id="m-table-manual"></div>`
          : `<div class="field">
               <label>${t('order.mesa.select')}</label>
               <select id="m-table">
                 <option value="">${t('order.mesa.select.placeholder')}</option>
                 ${tables.map(tb => `<option value="${tb.id}">${escapeHtml(tb.name)}</option>`).join('')}
               </select>
             </div>`}
      ${menuHtml}
    </div>
    <div class="card" id="cart-summary"></div>
    <div class="card">
      <div class="field">
        <label>${t('order.nombre')}</label>
        <input type="text" id="m-name">
      </div>
      <div class="field">
        <label>${t('order.notas')}</label>
        <textarea id="m-notes" placeholder="${t('order.notas.placeholder')}"></textarea>
      </div>
      ${redsysConfigured ? `
      <div class="field">
        <label>${t('order.mesa.payWhen')}</label>
        <label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;margin-bottom:6px;cursor:pointer">
          <input type="radio" name="m-pago-cuando" value="despues" checked style="width:auto;margin-top:3px">
          <span><strong>${t('order.mesa.payLater')}</strong><br><small style="color:var(--muted)">${t('order.mesa.payLaterDesc')}</small></span>
        </label>
        <label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;cursor:pointer">
          <input type="radio" name="m-pago-cuando" value="ahora" style="width:auto;margin-top:3px">
          <span><strong>${t('order.mesa.payNow')}</strong><br><small style="color:var(--muted)">${t('order.mesa.payNowDesc')}</small></span>
        </label>
      </div>
      ` : ''}
      <button class="btn btn-primary" id="o-submit" onclick="submitMesaOrder()">${t('order.submit.mesa')}</button>

  `;
  renderCartSummary();
}

function submitMesaOrder(){
  if(!cart.length){ showInlineError(t('error.carrito.vacio')); return; }
  if(submittingRequest) return;
  submittingRequest = true;
  setBtnLoading('o-submit', true);

  const tables = DB.tables || [];
  let tableId = null;
  if(tableIdFromUrl){
    const currentTable = tables.find(tb => String(tb.id) === String(tableIdFromUrl));
    if(currentTable){
      tableId = currentTable.id;
    }else{
      const manual = document.getElementById('m-table-manual');
      if(!manual || !manual.value.trim()){ showInlineError(t('error.mesa.manual')); submittingRequest = false; setBtnLoading('o-submit', false); return; }
      tableId = manual.value.trim();
    }
  }else{
    const sel = document.getElementById('m-table');
    if(!sel || !sel.value){ showInlineError(t('error.mesa.select')); submittingRequest = false; setBtnLoading('o-submit', false); return; }
    tableId = tables.find(tb => String(tb.id) === sel.value).id;
  }

  const clienteNombre = document.getElementById('m-name').value.trim();
  const notas = document.getElementById('m-notes').value.trim();
  const subtotalMesa = cart.reduce((s,l)=>s+l.price*l.qty,0);
  const tipMesa = computeTipAmount(subtotalMesa);
  // Solo se pregunta si se ofrece pagar ahora (redsysConfigured); si no
  // existe el radio, es que la opción no está disponible y se añade a la
  // cuenta de la mesa como siempre.
  const pagarAhora = redsysConfigured && document.querySelector('input[name="m-pago-cuando"]:checked')?.value === 'ahora';

  const req = {
    type:'pedido', tipo:'mesa', tableId,
    clienteNombre, notas, propina: tipMesa,
    items: cart.map(l => ({name:l.name, price:l.price, qty:l.qty, modificadores:l.modificadores||undefined})),
    total: subtotalMesa + tipMesa,
    createdAt: new Date().toISOString()
  };
  if(pagarAhora) req.pagarAhora = true;
  const submitBtn = document.getElementById('o-submit');
  if(submitBtn) submitBtn.disabled = true;
  if(pagarAhora){
    // A diferencia del pedido normal, este SÍ se fusiona con la comanda
    // abierta de la mesa (ver initPublicRequestsListener, js/core.js) — solo
    // que sus líneas quedan marcadas como ya pagadas por este cliente, para
    // que al cobrar la mesa se descuenten del importe pendiente.
    payWithCard(req, req.total, t('order.mesa.title'), 'clientRef', 'o-submit');
    return;
  }
  sendRequest(req, t('order.ok.mesa'));
}

/* ============ ENVÍO ============ */
function sendRequest(req, successMsg){
  db.ref('gastrogoan/public/' + publicId + '/requests').push(req).then(() => {
    const phone = (DB.business||{}).phone;
    // Pedidos: enlace de seguimiento en vivo (ver renderOrderTrackingView).
    // Reservas: enlace para poder cancelarla más adelante sin llamar (ver
    // renderReservationManageView) — los dos usan el mismo patrón de token,
    // cada uno en su propia ruta (orderStatus / reservationStatus).
    const trackUrl = (req.type === 'pedido' && req.clientRef)
      ? location.href.split('?')[0] + '?neg=' + encodeURIComponent(publicId) + '&track=' + encodeURIComponent(req.clientRef)
      : (req.type === 'reserva' && req.resToken)
      ? location.href.split('?')[0] + '?neg=' + encodeURIComponent(publicId) + '&res=' + encodeURIComponent(req.resToken)
      : null;
    document.getElementById('app').innerHTML = `
      <div class="success">
        <div class="icon">✅</div>
        <h2>${escapeHtml(successMsg)}</h2>
        ${phone ? `<p style="font-size:13px;color:var(--muted);margin-top:8px">${t('success.callToChange').replace('%s', `<a href="tel:${escapeHtml(phone.replace(/\s+/g,''))}" style="color:var(--ink);font-weight:600">${escapeHtml(phone)}</a>`)}</p>` : ''}
        ${trackUrl ? `<a class="btn btn-primary" style="margin-top:16px;text-decoration:none" href="${escapeHtml(trackUrl)}">${t(req.type === 'reserva' ? 'success.manageReservation' : 'success.trackOrder')}</a>` : ''}
        <button class="btn" style="margin-top:${trackUrl?'8':'16'}px" onclick="location.reload()">${t(req.type === 'reserva' ? 'success.otraReserva' : 'success.otraPedido')}</button>
      </div>
    `;
  }).catch(e => {
    console.error(e);
    showInlineError(t('error.envio'));
    submittingRequest = false;
    setBtnLoading(req.type === 'reserva' ? 'r-submit' : 'o-submit', false);
  });
}

/* ============ SEGUIMIENTO DE PEDIDO (?track=token) ============
   Pantalla aparte con su propio listener en vivo sobre
   orderStatus/{token} (ver syncOrderStatusForPublic en la app principal):
   el cliente puede volver a este enlace en cualquier momento y ver en qué
   punto va su pedido sin tener que llamar a preguntar. */
const TRACK_STEPS = ['pendiente','aceptado','preparando','listo','entregado'];
function renderOrderTrackingView(){
  const app = document.getElementById('app');
  if(trackListenerAttached) return;
  trackListenerAttached = true;
  app.innerHTML = `<div class="empty"><div class="spinner"></div>${t('track.loading')}</div>`;
  db.ref('gastrogoan/public/' + publicId + '/orderStatus/' + trackToken).on('value', snap => {
    renderTrackStatus(snap.val());
  }, () => {
    renderTrackStatus(null);
  });
}
function renderTrackStatus(data){
  const app = document.getElementById('app');
  if(!data){
    app.innerHTML = `
      <div class="error-box">
        <div class="icon">🔎</div>
        <h2>${t('track.notFound.title')}</h2>
        <p style="font-size:13px;color:var(--muted)">${t('track.notFound.msg')}</p>
      </div>`;
    return;
  }
  const status = data.status || 'pendiente';
  if(status === 'rechazado'){
    const phone = (DB.business||{}).phone;
    app.innerHTML = `
      <div class="error-box">
        <div class="icon">⚠️</div>
        <h2>${t('track.rejected.title')}</h2>
        <p style="font-size:13px;color:var(--muted)">${t('track.rejected.msg')}${phone ? ' ' + t('success.callToChange').replace('%s', `<a href="tel:${escapeHtml(phone.replace(/\s+/g,''))}" style="color:var(--ink);font-weight:600">${escapeHtml(phone)}</a>`) : ''}</p>
      </div>`;
    return;
  }
  const idx = Math.max(0, TRACK_STEPS.indexOf(status));
  const steps = [
    {key:'pendiente', icon:'📥', label:t('track.step.pendiente')},
    {key:'aceptado', icon:'✅', label:t('track.step.aceptado')},
    {key:'preparando', icon:'👨‍🍳', label:t('track.step.preparando')},
    {key:'listo', icon:'🍽️', label:t('track.step.listo')},
    {key:'entregado', icon:'🎉', label:t('track.step.entregado')},
  ];
  app.innerHTML = `
    <div class="card fade-in-play">
      <h2>${t('track.title')}</h2>
      <div style="margin-top:14px">
        ${steps.map((s,i) => `
          <div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);${i<=idx?'':'opacity:.35'}">
            <div style="font-size:22px;line-height:1">${s.icon}</div>
            <div style="font-weight:${i===idx?'700':'500'};font-size:14px;flex:1">${s.label}</div>
            ${i===idx ? `<div class="mono" style="font-size:10.5px;color:var(--olive);text-transform:uppercase;letter-spacing:.06em">${t('track.current')}</div>` : (i<idx ? `<div style="color:var(--olive)">✓</div>` : '')}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

/* ============ GESTIONAR MI RESERVA (?res=token) ============
   Mismo patrón que el seguimiento de pedido, pero además de leer permite
   una acción: cancelar. La cancelación NUNCA toca la reserva directamente
   desde aquí (el cliente no tiene ni debería tener escritura sobre
   DB.reservations) — se manda como una solicitud más a la cola de
   "requests" (tipo 'reserva_cancelar', con el token) y es la app del
   negocio quien la aplica de verdad al procesarla, igual que ya hace con
   una reserva nueva. */
let cancellingReservation = false;
function renderReservationManageView(){
  const app = document.getElementById('app');
  if(resListenerAttached) return;
  resListenerAttached = true;
  app.innerHTML = `<div class="empty"><div class="spinner"></div>${t('resManage.loading')}</div>`;
  db.ref('gastrogoan/public/' + publicId + '/reservationStatus/' + resToken).on('value', snap => {
    renderReservationStatus(snap.val());
  }, () => {
    renderReservationStatus(null);
  });
}
function renderReservationStatus(data){
  lastResStatusData = data;
  const app = document.getElementById('app');
  if(!data){
    app.innerHTML = `
      <div class="error-box">
        <div class="icon">🔎</div>
        <h2>${t('resManage.notFound.title')}</h2>
        <p style="font-size:13px;color:var(--muted)">${t('resManage.notFound.msg')}</p>
      </div>`;
    return;
  }
  const phone = (DB.business||{}).phone;
  const phoneLink = phone ? `<a href="tel:${escapeHtml(phone.replace(/\s+/g,''))}" style="color:var(--ink);font-weight:600">${escapeHtml(phone)}</a>` : '';
  if(data.status === 'cancelada'){
    app.innerHTML = `
      <div class="card fade-in-play" style="text-align:center;padding:32px 18px">
        <div style="font-size:40px">🚫</div>
        <h2 style="margin-top:10px">${t('resManage.cancelled.title')}</h2>
        <p style="font-size:13px;color:var(--muted)">${t('resManage.cancelled.msg')}</p>
      </div>`;
    return;
  }
  // 'completada' = el cliente ya llegó y está sentado. Antes esta ruta no
  // se distinguía de una reserva normal, así que el enlace seguía
  // ofreciendo Editar/Cancelar sobre una visita que ya ha pasado.
  if(data.status === 'completada'){
    app.innerHTML = `
      <div class="card fade-in-play" style="text-align:center;padding:32px 18px">
        <div style="font-size:40px">✅</div>
        <h2 style="margin-top:10px">${t('resManage.completed.title')}</h2>
        <p style="font-size:13px;color:var(--muted)">${t('resManage.completed.msg')}</p>
      </div>`;
    return;
  }
  const statusLabel = data.status === 'confirmada' ? t('resManage.status.confirmada') : t('resManage.status.pendiente');
  const statusClass = data.status === 'confirmada' ? 'var(--olive)' : 'var(--muted)';
  app.innerHTML = `
    <div class="card fade-in-play">
      <h2>${t('resManage.title')}</h2>
      <div style="margin-top:6px;font-size:13px;font-weight:700;color:${statusClass}">${statusLabel}</div>
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:var(--muted)">${t('resManage.date')}</span><strong>${escapeHtml(data.date||'')} · ${escapeHtml(data.time||'')}</strong></div>
        <div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:var(--muted)">${t('resManage.people')}</span><strong>${data.people||''}</strong></div>
      </div>
      ${resEditing ? `
        <div class="field-row" style="margin-top:16px">
          <div class="field">
            <label>${t('fecha')}</label>
            <input type="date" id="res-edit-date" value="${escapeHtml(data.date||'')}" min="${todayStr()}" onchange="updateTimeInputRange('res-edit-date','res-edit-time','res-edit-hint'); applyLeadTime('res-edit-date','res-edit-time','res-edit-hint','reserva')">
          </div>
          <div class="field">
            <label>${t('hora')}</label>
            <input type="time" id="res-edit-time" value="${escapeHtml(data.time||'')}">
          </div>
        </div>
        <div id="res-edit-hint"></div>
        <div class="field">
          <label>${t('personas')}</label>
          <input type="number" id="res-edit-people" value="${data.people||1}" min="1" max="50">
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn" id="res-edit-cancel-btn" onclick="toggleResEdit(false)">${t('common.close')}</button>
          <button class="btn btn-primary" id="res-edit-save-btn" onclick="submitReservationChange()" style="flex:1">${t('resManage.saveBtn')}</button>
        </div>
      ` : `
        ${phoneLink ? `<p style="font-size:12.5px;color:var(--muted);margin-top:14px">${t('success.callToChange').replace('%s', phoneLink)}</p>` : ''}
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn" id="res-edit-btn" onclick="toggleResEdit(true)" style="flex:1">${t('resManage.editBtn')}</button>
          <button class="btn" style="flex:1;color:var(--red);border-color:var(--red)" id="res-cancel-btn" onclick="cancelMyReservation()">${t('resManage.cancelBtn')}</button>
        </div>
      `}
    </div>
  `;
  if(resEditing){
    updateTimeInputRange('res-edit-date','res-edit-time','res-edit-hint');
    applyLeadTime('res-edit-date','res-edit-time','res-edit-hint','reserva');
  }
}
let resEditing = false;
let lastResStatusData = null;
function toggleResEdit(on){
  resEditing = on;
  renderReservationStatus(lastResStatusData);
}
let submittingReservationChange = false;
function submitReservationChange(){
  if(submittingReservationChange) return;
  const date = document.getElementById('res-edit-date')?.value;
  const time = document.getElementById('res-edit-time')?.value;
  const people = parseInt(document.getElementById('res-edit-people')?.value) || 0;
  if(!date || !time || !people){
    showInlineError(t('error.campos'));
    return;
  }
  submittingReservationChange = true;
  const btn = document.getElementById('res-edit-save-btn');
  if(btn){ btn.disabled = true; btn.textContent = t('resManage.savingChanges'); }
  db.ref('gastrogoan/public/' + publicId + '/requests').push({
    type: 'reserva_modificar', token: resToken, date, time, people, createdAt: new Date().toISOString()
  }).then(() => {
    submittingReservationChange = false;
    resEditing = false;
  }).catch(e => {
    console.error(e);
    submittingReservationChange = false;
    if(btn){ btn.disabled = false; btn.textContent = t('resManage.saveBtn'); }
    showInlineError(t('error.envio'));
  });
}
async function cancelMyReservation(){
  if(cancellingReservation) return;
  if(!(await confirmModal(t('resManage.confirmCancel'), {danger:true}))) return;
  cancellingReservation = true;
  const btn = document.getElementById('res-cancel-btn');
  // No hace falta un mensaje de éxito aparte: el propio listener en vivo de
  // reservationStatus (renderReservationManageView) repinta la pantalla
  // sola en cuanto el negocio procese la cancelación — normalmente
  // al instante si tiene la app abierta, como con cualquier solicitud
  // nueva. Mientras tanto, el botón deja claro que ya se ha enviado.
  if(btn){ btn.disabled = true; btn.textContent = t('resManage.cancelSending'); }
  db.ref('gastrogoan/public/' + publicId + '/requests').push({
    type: 'reserva_cancelar', token: resToken, createdAt: new Date().toISOString()
  }).then(() => {
    cancellingReservation = false;
  }).catch(e => {
    console.error(e);
    cancellingReservation = false;
    if(btn){ btn.disabled = false; btn.textContent = t('resManage.cancelBtn'); }
    showInlineError(t('error.envio'));
  });
}

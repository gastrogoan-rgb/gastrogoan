<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas y Pedidos</title>
<style>
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/schibsted-grotesk-400-normal.woff2") format("woff2");}@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/schibsted-grotesk-500-normal.woff2") format("woff2");}@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/schibsted-grotesk-600-normal.woff2") format("woff2");}@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/schibsted-grotesk-700-normal.woff2") format("woff2");}@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/ibm-plex-mono-400-normal.woff2") format("woff2");}@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/ibm-plex-mono-500-normal.woff2") format("woff2");}
  :root{
    --ink:#1C1A17; --olive:#4A5D4E; --olive-l:#7E9B84;
    --paper:#FAF8F4; --surface:#FFFFFF; --border:#E7E2D9;
    --body:#3D3A34; --muted:#8A857C;
    --green:#4A5D4E; --green-l:#EDF1EC;
    --red:#8A4A3B; --red-l:#F5EBE7;
  }
  *{box-sizing:border-box;}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--olive);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  body{
    margin:0;font-family:'Schibsted Grotesk',system-ui,-apple-system,sans-serif;
    background:var(--paper);color:var(--body);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  ::selection{background:var(--ink);color:var(--paper)}
  header{
    background:var(--ink);color:#fff;padding:20px 16px;text-align:center;
    border-bottom:1px solid var(--ink);
  }
  header img{max-height:56px;border-radius:0;margin-bottom:6px;}
  header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;}
  header .sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;color:#C9C2B6;margin-top:6px;}
  #lang-switcher{display:flex;justify-content:center;gap:6px;margin-top:10px;}
  #lang-switcher button{
    padding:4px 10px;border-radius:0;border:1px solid rgba(255,255,255,.3);
    background:transparent;color:rgba(255,255,255,.7);font-size:11.5px;font-weight:600;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;transition:border-color .15s,color .15s,background-color .15s;
  }
  #lang-switcher button:hover{border-color:var(--olive-l);color:#fff;}
  #lang-switcher button.active{background:var(--olive);color:#fff;border-color:var(--olive);}
  .wrap{max-width:560px;margin:0 auto;padding:16px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:0;
    padding:18px;margin-bottom:14px;
  }
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .tab-btn{
    flex:1;min-width:100px;padding:13px 12px;min-height:48px;border-radius:0;border:1px solid var(--border);
    background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer;text-align:center;color:var(--ink);
    font-family:inherit;transition:border-color .15s,background-color .15s,color .15s,transform .1s;
  }
  .tab-btn:hover{border-color:var(--ink);}
  .tab-btn:active{transform:translateY(1px);}
  .tab-btn.active{border-color:var(--ink);background:var(--ink);color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin-bottom:6px;color:var(--muted);}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 14px;min-height:48px;border:1px solid var(--border);border-radius:0;
    font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink);
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--ink);}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:14px 18px;min-height:50px;border-radius:0;border:1px solid var(--ink);
    background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;
    cursor:pointer;width:100%;font-family:inherit;
    transition:background-color .15s,color .15s,transform .1s;
  }
  .btn:hover:not(:disabled){background:var(--paper);}
  .btn:active:not(:disabled){transform:translateY(1px);}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--olive);border-color:var(--olive);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  #inline-alert{
    position:fixed;left:16px;right:16px;bottom:16px;z-index:999;
    background:var(--red-l);color:var(--red);border:1px solid var(--red);
    padding:14px 16px;font-size:14px;font-weight:600;display:flex;align-items:flex-start;gap:10px;
    box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:480px;margin:0 auto;
    animation:fade-up .25s ease;
  }
  #inline-alert button{background:none;border:none;color:var(--red);font-size:18px;font-weight:700;cursor:pointer;line-height:1;padding:6px;margin:-6px -6px -6px auto;min-width:32px;min-height:32px;}
  /* Modal genérico (aviso de privacidad y cualquier otro texto largo): antes
     solo existía un alert() nativo del navegador para esto, sin scroll
     cómodo ni formato ni forma de estilizarlo con la marca del negocio. */
  #modal-overlay{
    position:fixed;inset:0;z-index:1000;background:rgba(28,26,23,.55);
    display:flex;align-items:center;justify-content:center;padding:16px;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  #modal-overlay.active{opacity:1;pointer-events:auto}
  #modal-box{
    background:var(--surface);border:1px solid var(--border);max-width:480px;width:100%;
    max-height:calc(100vh - 32px);overflow-y:auto;padding:22px;position:relative;
  }
  #modal-box h2{padding-right:28px}
  #modal-box .modal-close{
    position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;
    font-weight:700;cursor:pointer;color:var(--muted);line-height:1;padding:6px;min-width:32px;min-height:32px;
  }
  #modal-box p{font-size:13.5px;line-height:1.65;color:var(--body)}
  /* Campo marcado como inválido tras un intento de envío fallido — antes el
     único indicio de qué campo fallaba era un alert() genérico sin decir
     cuál; ahora el campo en sí se resalta y se hace scroll hasta él. */
  .field.invalid input, .field.invalid select, .field.invalid textarea{
    border-color:var(--red);background:var(--red-l);
  }
  .field.invalid label{color:var(--red)}
  .btn .btn-spinner{
    width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
    border-radius:50%;animation:spin .7s linear infinite;
  }
  .btn:not(.btn-primary) .btn-spinner{border-color:var(--border);border-top-color:var(--ink)}
  @media (prefers-reduced-motion: reduce){
    #inline-alert{animation:none}
    .btn-spinner{animation:none}
  }
  h2{font-size:17px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em;}
  h3{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;margin:16px 0 8px;}
  .menu-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 0;border-bottom:1px solid var(--border);transition:background-color .15s;
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item .name{font-weight:600;font-size:15px;color:var(--ink);}
  .menu-item .price{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);}
  .qty-ctl{display:flex;align-items:center;gap:10px;}
  .qty-ctl button{
    width:34px;height:34px;border-radius:0;border:1px solid var(--border);
    background:var(--surface);font-size:17px;font-weight:600;cursor:pointer;color:var(--ink);
    transition:border-color .15s,background-color .15s,transform .1s;
  }
  .qty-ctl button:hover{border-color:var(--ink);}
  .qty-ctl button:active{transform:scale(.92);}
  .qty-ctl span{min-width:20px;text-align:center;font-weight:600;font-size:15px;font-family:'IBM Plex Mono',monospace;transition:transform .15s;}
  .qty-ctl span.bump{transform:scale(1.35);color:var(--olive);}
  .cart-line{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;font-family:'IBM Plex Mono',monospace;}
  .cart-total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding-top:10px;border-top:1px solid var(--ink);margin-top:8px;font-family:'IBM Plex Mono',monospace;}
  .cart-total.bump{animation:total-bump .3s ease;}
  @keyframes total-bump{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  .empty{text-align:center;color:var(--muted);padding:22px;font-size:13.5px;}
  .success{
    text-align:center;padding:44px 16px;animation:fade-up .35s ease;
  }
  .success .icon{font-size:48px;color:var(--green);}
  .success h2{margin-top:12px;}
  .error-box{
    text-align:center;padding:40px 16px;color:var(--red);
  }
  .fade-in-play{animation:fade-up .25s ease;}
  @keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){
    .fade-in-play,.success{animation:none;}
    .btn,.tab-btn,.qty-ctl button,#lang-switcher button{transition:none;}
    .cart-total.bump{animation:none;}
    .qty-ctl span.bump{transform:none;}
  }

  /* Responsive */
  @media (max-width: 380px){
    .wrap{padding:10px;}
    .card{padding:12px;}
    header{padding:14px 12px;}
    header h1{font-size:18px;}
    .field-row{flex-direction:column;gap:0;}
    .tab-btn{min-width:80px;font-size:12px;padding:9px 8px;}
    .menu-item .name{font-size:13.5px;}
  }
</style>
</head>

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
// Para insertar texto dentro de un literal JS '...' embebido en un atributo
// onclick="...": el navegador decodifica las entidades HTML del atributo
// ANTES de interpretarlo como JS, así que un nombre con apóstrofo (p.ej.
// "Chef's special") escapado solo con escapeHtml (' -> &#39;) se decodifica
// de vuelta a ' dentro del onclick y cierra la cadena JS a mitad, rompiendo
// el botón sin ningún error visible (el "+" simplemente deja de añadir al
// carrito). Escapa primero la barra invertida y la comilla simple para JS,
// y luego para HTML.
function escapeJsAttr(str){
  return escapeHtml(String(str==null?'':str).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
}

// Modal genérico para textos largos (antes solo había alert() nativo, sin
// scroll cómodo ni estilo propio) — se crea una sola vez y se reutiliza.
function ensureModalChrome(){
  if(document.getElementById('modal-overlay')) return;
  const overlay = document.createElement('div');
  overlay.id = 'modal-overlay';
  overlay.innerHTML = `<div id="modal-box" role="dialog" aria-modal="true"></div>`;
  overlay.addEventListener('click', e => { if(e.target === overlay) closeInfoModal(); });
  document.body.appendChild(overlay);
}
function openInfoModal(title, bodyText){
  ensureModalChrome();
  document.getElementById('modal-box').innerHTML = `
    <button class="modal-close" onclick="closeInfoModal()" aria-label="${escapeHtml(t('common.close')||'Cerrar')}">&times;</button>
    <h2>${escapeHtml(title)}</h2>
    <p style="white-space:pre-line">${escapeHtml(bodyText)}</p>
  `;
  document.getElementById('modal-overlay').classList.add('active');
}
function closeInfoModal(){
  const overlay = document.getElementById('modal-overlay');
  if(overlay) overlay.classList.remove('active');
}

// Sustituto de confirm() con el mismo diseño que el resto de la app (antes
// era el cuadro nativo del navegador, sin estilo propio). Misma forma de
// uso: se espera la Promise y se sigue solo si resuelve a true.
let pendingConfirmModalResolve = null;
function confirmModal(message, opts){
  opts = opts || {};
  ensureModalChrome();
  return new Promise(resolve => {
    pendingConfirmModalResolve = resolve;
    document.getElementById('modal-box').innerHTML = `
      <button class="modal-close" onclick="resolveConfirmModal(false)" aria-label="${escapeHtml(t('common.close')||'Cerrar')}">&times;</button>
      <p style="font-size:14px;line-height:1.6;color:var(--body);margin:4px 0 18px">${escapeHtml(message)}</p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="resolveConfirmModal(false)">${escapeHtml(t('common.cancel')||'Cancelar')}</button>
        <button class="btn btn-primary" style="${opts.danger?'background:var(--red);border-color:var(--red)':''}" onclick="resolveConfirmModal(true)">${escapeHtml(opts.confirmLabel||t('common.confirm')||'Confirmar')}</button>
      </div>
    `;
    document.getElementById('modal-overlay').classList.add('active');
  });
}
function resolveConfirmModal(value){
  closeInfoModal();
  if(pendingConfirmModalResolve){ pendingConfirmModalResolve(value); pendingConfirmModalResolve = null; }
}

// Un único regex de email compartido por los dos formularios (reserva y
// pedido) — antes estaba duplicado literalmente en los dos sitios.
function isValidEmail(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

// Identificador único para poder seguir el estado del pedido después de
// enviarlo (ver trackOrderStatus) — antes solo se generaba dentro de
// payWithCard, así que un pedido pagado en efectivo nunca tenía uno.
function genClientRef(){
  return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// Resalta un campo inválido tras un intento de envío fallido y hace scroll
// hasta él — antes el único indicio de qué campo fallaba era un alert()
// genérico ("completa los campos obligatorios") sin decir cuál.
function markFieldInvalid(fieldId){
  const input = document.getElementById(fieldId);
  if(!input) return;
  const field = input.closest('.field') || input;
  field.classList.add('invalid');
  if(!markFieldInvalid._scrolled){
    field.scrollIntoView({behavior:'smooth', block:'center'});
    input.focus({preventScroll:true});
    markFieldInvalid._scrolled = true;
  }
}
function setBtnLoading(btnId, loading){
  const btn = document.getElementById(btnId);
  if(!btn) return;
  if(loading){
    if(!btn.dataset.origHtml) btn.dataset.origHtml = btn.innerHTML;
    btn.innerHTML = `<span class="btn-spinner"></span> ${escapeHtml(t('common.sending')||'')}`;
    btn.disabled = true;
  } else if(btn.dataset.origHtml){
    btn.innerHTML = btn.dataset.origHtml;
    btn.disabled = false;
  }
}
function clearFieldInvalid(fieldIds){
  markFieldInvalid._scrolled = false;
  fieldIds.forEach(id => {
    const input = document.getElementById(id);
    if(!input) return;
    (input.closest('.field') || input).classList.remove('invalid');
  });
}

function showInlineError(msg){
  let box = document.getElementById('inline-alert');
  if(box) box.remove();
  box = document.createElement('div');
  box.id = 'inline-alert';
  box.setAttribute('role', 'alert');
  box.innerHTML = `<span>⚠️ ${escapeHtml(msg)}</span><button onclick="this.parentElement.remove()" aria-label="${escapeHtml(t('common.close')||'Cerrar')}">&times;</button>`;

function init(){
  publicId = getPublicIdFromUrl();
  const slug = getSlugFromUrl();
  tableIdFromUrl = getTableIdFromUrl();
  trackToken = getTrackTokenFromUrl();
  resToken = getResTokenFromUrl();
  if(!publicId && !slug){ showError('error.enlace'); return; }

  // Vuelta desde el TPV virtual (Redsys) tras pagar con tarjeta.
  const pago = new URLSearchParams(location.search).get('pago');
  // Tras el redirect de Redsys, la URL se queda con "?...&pago=ok/ko" — si el
  // cliente no sabe que puede quitarlo a mano, esta pantalla era un callejón
  // sin salida real (ni el botón atrás del navegador ayuda, porque la página
  // anterior en el historial es el propio formulario ya enviado a Redsys).
  // El botón vuelve a la MISMA página pero sin ese parámetro, para poder
  // seguir navegando con normalidad.
  const backToSiteUrl = location.href.split('?')[0] + (publicId ? `?neg=${encodeURIComponent(publicId)}` : (slug ? `?n=${encodeURIComponent(slug)}` : ''));
  if(pago === 'ok'){
    document.getElementById('app').innerHTML = `
      <div class="success">
        <div class="icon">✅</div>
        <h2>${t('pago.ok.title')}</h2>
        <p style="font-size:13px;color:var(--muted)">${t('pago.ok.msg')}</p>
        <button class="btn" style="margin-top:16px" onclick="location.href='${escapeHtml(backToSiteUrl)}'">${t('success.otraPedido')}</button>
      </div>
    `;
    return;
  }
  if(pago === 'ko'){
    document.getElementById('app').innerHTML = `
      <div class="error-box">
        <div class="icon">⚠️</div>
        <h2>${t('pago.ko.title')}</h2>
        <p style="font-size:13px;color:var(--muted)">${t('pago.ko.msg')}</p>
        <button class="btn" style="margin-top:16px" onclick="location.href='${escapeHtml(backToSiteUrl)}'">${t('success.otraPedido')}</button>
      </div>
    `;
    return;
  }

  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    // Autenticación anónima: las reglas de la nube exigen auth != null
    // para poder leer/escribir, así evitamos el acceso directo sin pasar
    // por el SDK de Firebase.
    firebase.auth().signInAnonymously().then(() => {
      // Enlace con nombre elegido por el negocio (?n=...): primero hay que
      // resolverlo contra la plataforma para saber su código real antes de
      // poder cargar sus datos.
      if(slug && !publicId){
        return db.ref('gastrogoan/publicSlugs/' + slug).once('value').then(snap => {
          const resolved = snap.val();
          if(!resolved){ showError('error.enlace'); return; }
          publicId = resolved;
          loadBusinessInfo();
        });
      }
      loadBusinessInfo();
    }).catch(e => {
      console.error(e);
      showError('error.conexion');
    });
  }catch(e){
    console.error(e);
    showError('error.conexion');
  }
}

let businessInfoLoadedOnce = false;
let lastRenderSignature = null;
// Guarda y restaura lo que el cliente ya había escrito (nombre, teléfono,
// dirección, notas...) alrededor de un re-render forzado por el listener en
// vivo, para no perder el formulario a medio rellenar.
function renderTabContentPreservingForm(){
  const box = document.getElementById('tab-content');
  const saved = {};
  if(box){
    box.querySelectorAll('input[id], textarea[id], select[id]').forEach(el => { saved[el.id] = el.value; });
  }
  renderTabContent();
  Object.keys(saved).forEach(id => {
    const el = document.getElementById(id);
    if(el && el.value !== saved[id]) el.value = saved[id];
  });
}
function loadBusinessInfo(){
  // Antes esto era un once('value') de una sola vez: si el dueño cambiaba un
  // precio o quitaba un plato de la carta mientras un cliente tenía la
  // página abierta, el cliente seguía viendo datos obsoletos hasta recargar.
  // Con on() los cambios de carta/precios/disponibilidad llegan en vivo. En
  // las actualizaciones DESPUÉS de la primera no se llama a renderApp() (que
  // vacía el carrito): solo se refresca el contenido de la pestaña actual, y
  // solo si de verdad cambió algo relevante para lo que se ve — el nodo
  // 'info' incluye reservasResumen (aforo), que se reescribe cada vez que
  // CUALQUIER cliente reserva, y eso NO debe forzar un re-render (la
  // disponibilidad ya se revalida en vivo al enviar, vía getAforoInfo /
  // reserveAforoAtomic), o el formulario de otros clientes se vaciaría
  // constantemente por reservas ajenas sin ningún cambio real de carta.
  db.ref('gastrogoan/public/' + publicId + '/info').on('value', snap => {
    const val = snap.val();
    if(!val){ if(!businessInfoLoadedOnce) showError('error.carga'); return; }

    if(val.sucursales && Array.isArray(val.sucursales) && val.sucursales.length > 1 && !new URLSearchParams(location.search).get('local')){
      renderBranchSelector(val.business || {}, val.sucursales);
      return;
    }

    DB = {
      business: val.business || {},
      cartas: val.cartas || [],
      activeCartaIds: val.activeCartaIds || (val.activeCartaId ? [val.activeCartaId] : []),
      menus: val.menus || [],
      activeMenuIds: val.activeMenuIds || [],
      reservasResumen: val.reservasResumen || {},
      // Antes faltaba "pedidosResumen" aquí: el límite de pedidos por franja
      // (submitOrder → reservePedidoSlotAtomic) siempre veía un baseline de 0
      // aunque ya hubiera pedidos aceptados en esa franja, así que en la
      // práctica solo detectaba choques entre pedidos casi simultáneos, no
      // el límite acumulado real de la franja.
      pedidosResumen: val.pedidosResumen || {},
      cocinaCargaActiva: val.cocinaCargaActiva || 0,
      tables: val.tables || [],
      promos: val.promos || [],
      allergens: val.allergens || {}
    };
    renderHeader();
    if(!businessInfoLoadedOnce){
      businessInfoLoadedOnce = true;
      lastRenderSignature = JSON.stringify({business: DB.business, cartas: DB.cartas, activeCartaIds: DB.activeCartaIds, menus: DB.menus, activeMenuIds: DB.activeMenuIds, tables: DB.tables, promos: DB.promos, allergens: DB.allergens});
      renderApp();
      checkRedsysConfigured();
    }else if(currentTab && document.getElementById('tab-content')){
      const newSignature = JSON.stringify({business: DB.business, cartas: DB.cartas, activeCartaIds: DB.activeCartaIds, menus: DB.menus, activeMenuIds: DB.activeMenuIds, tables: DB.tables, promos: DB.promos, allergens: DB.allergens});
      if(newSignature !== lastRenderSignature){
        lastRenderSignature = newSignature;
        renderTabContentPreservingForm();
      }
    }
  }, e => {
    console.error(e);
    if(!businessInfoLoadedOnce) showError('error.conexion');
  });
}

function checkRedsysConfigured(){
  fetch(`${REDSYS_WORKER_URL}/config?publicId=${encodeURIComponent(publicId)}`)

    .then(data => {

      if(redsysConfigured && (currentTab === 'takeaway' || currentTab === 'delivery' || currentTab === 'mesa')) renderTabContentPreservingForm();

    .catch(() => {});

// Mismo criterio que ya usa el TPV interno (isBebidaCarta, js/tpv.js): las
// cartas de bebidas (área "sala") siempre se muestran antes que las de
// comida, sea cual sea el orden en que se crearon.
function isBebidaCarta(c){
  if(c && c.area) return c.area === 'sala';
  return /bebida/i.test(c.nombre||'');
}
function getActiveCartas(){
  const ids = DB.activeCartaIds || [];
  const active = (DB.cartas || []).filter(c => ids.includes(c.id));
  const bebidaCartas = active.filter(isBebidaCarta);
  const comidaCartas = active.filter(c => !isBebidaCarta(c));
  return [...bebidaCartas, ...comidaCartas];
}

// Promo con descuento activa AHORA MISMO (día + franja horaria) para un
// plato, si la hay — espejo simplificado de getActivePromoForDish/
// promoTimeActiveNow (js/app.js): aquí no hace falta comprobar el límite de
// usos porque el mirror público (getActivePromosForSync, js/core.js) ya
// deja de publicar la promo en cuanto se agota el cupo del día.
function getActivePromoForPlatoPublic(platoId){
  const promo = (DB.promos||[]).find(p => p.menuItemPlatoId === platoId);
  if(!promo) return null;
  if(!promo.horaInicio || !promo.horaFin) return promo;
  const toMin = hhmm => { const [h,m] = (hhmm||'').split(':').map(Number); return (h||0)*60+(m||0); };
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  const start = toMin(promo.horaInicio), end = toMin(promo.horaFin);
  const active = end > start ? (nowMin >= start && nowMin < end) : (nowMin >= start || nowMin < end);
  return active ? promo : null;
}
function promoDiscountedPrice(precio, promo){
  return Math.round(precio * (1 - promo.discountPct/100) * 100) / 100;
}

function renderApp(){
  // Encuesta de satisfacción privada (NPS): enlace aparte (?nps=1) que el
  // negocio manda tras la visita, distinto del enlace de reseña pública de
  // Google — sirve para detectar a alguien insatisfecho ANTES de que dejara
  // una mala reseña pública, y solo el negocio ve la nota y el comentario.
  if(new URLSearchParams(location.search).get('nps') === '1'){
    renderNpsSurvey();
    return;
  }
  // Seguimiento de un pedido ya enviado (?track=token): pantalla aparte,
  // con su propio listener en vivo — no pasa por las pestañas normales.
  if(trackToken){
    renderOrderTrackingView();
    return;
  }
  // Gestión de una reserva ya enviada (?res=token): misma idea, pantalla
  // aparte con su propio listener.
  if(resToken){
    renderReservationManageView();
    return;
  }
  const tabs = computeTabs();

  if(!tabs.length){
    document.getElementById('app').innerHTML = `<div class="empty">${t('no.services')}</div>`;
    return;
  }

  if(!currentTab || !tabs.some(t=>t.id===currentTab)){
    currentTab = (tableIdFromUrl && tabs.some(t=>t.id==='mesa')) ? 'mesa' : tabs[0].id;
  }
  cart = [];
  cartTipPct = 0; cartTipCustom = 0;

  document.getElementById('app').innerHTML = `
    <div class="tabs" role="tablist">
      ${renderTabButtonsHtml(tabs)}
    </div>
    <div id="tab-content" role="tabpanel"></div>
  `;
  renderTabContent();
}

// Pedido en mesa SOLO se ofrece llegando desde el QR de la mesa (que ya

/* ============ HORARIOS ============ */
const DIAS_SEMANA_I18N = {
  es:['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],
  en:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],
  ca:['Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte','Diumenge']
};
function getDiasSemana(){ return DIAS_SEMANA_I18N[currentLang] || DIAS_SEMANA_I18N.es; }

// Devuelve los turnos (franjas horarias) del día de la semana correspondiente
// a dateStr, o null si el negocio no ha configurado horario (sin restricción).
function getTurnosForDate(dateStr){
  const horario = (DB.business || {}).horario;
  if(!horario || horario.length !== 7) return null;
  const jsDay = new Date(dateStr + 'T00:00:00').getDay(); // 0=domingo..6=sábado
  const d = horario[(jsDay + 6) % 7]; // 0=lunes..6=domingo
  if(!d || d.abierto === false) return [];
  const turnos = [];
  const add = (ini, fin) => { if(ini && fin && fin > ini) turnos.push({abre:ini, cierra:fin}); };
  // Formato nuevo: {modo:'seguido'|'turnos', seguido:{ini,fin}, turnos:[{ini,fin}]}
  if(d.modo === 'seguido' && d.seguido){
    add(d.seguido.ini, d.seguido.fin);
  } else if(Array.isArray(d.turnos)){
    d.turnos.forEach(t => t && add(t.ini, t.fin));
  } else {
    // Formato antiguo: {t1i,t1f,t2i,t2f}
    add(d.t1i, d.t1f);
    add(d.t2i, d.t2f);
  }
  // Un día marcado como abierto pero sin ninguna franja horaria rellenada
  // (el estado de fábrica: defaultHorario() deja ini/fin en blanco) no
  // significa "cerrado" — significa que el negocio aún no ha configurado
  // Horario de apertura en Mi Negocio. Sin esto, esta página bloqueaba
  // CUALQUIER reserva/pedido (isTimeAllowed devuelve false para un array
  // vacío) hasta que alguien rellenara el horario — mismo fix que ya tenía
  // el panel interno (js/menu.js), que aquí no se había aplicado.
  if(!turnos.length && d.abierto !== false) return null;
  return turnos;
}

function isTimeAllowed(dateStr, time){
  const turnos = getTurnosForDate(dateStr);
  if(turnos === null) return true;
  return turnos.some(t => time >= t.abre && time <= t.cierra);
}

// Hora límite real para hacer un PEDIDO (no una reserva) dentro del turno al
// que pertenece `time`: el cierre del turno menos los minutos que el
// negocio haya configurado en "Dejar de aceptar pedidos X min antes del
// cierre" (mn.pedidos.cierreAntes). Devuelve null si no hay cutoff
// configurado o `time` no cae dentro de ningún turno (ese caso ya lo separa
// isTimeAllowed).
function pedidosCutoffTimeForTurno(dateStr, time, p){
  const cutoffMin = parseInt(p.cierrePedidosAntesMin) || 0;
  if(!cutoffMin) return null;
  const turnos = getTurnosForDate(dateStr);
  if(!turnos) return null;
  const turno = turnos.find(t => time >= t.abre && time <= t.cierra);
  if(!turno) return null;
  const [ch, cm] = turno.cierra.split(':').map(Number);
  let limiteMin = ch * 60 + cm - cutoffMin;
  if(limiteMin < 0) limiteMin = 0; // cutoff mayor que la duración del turno: no se acepta ningún pedido en él
  const limite = String(Math.floor(limiteMin/60)).padStart(2,'0') + ':' + String(limiteMin%60).padStart(2,'0');
  return {limite, turno};
}

// Índice del turno al que pertenece `time` en `dateStr`, o null si no hay
// horario configurado o la hora no encaja en ninguno. Cierre EXCLUSIVO salvo
// en el último turno del día (inclusivo) — mismo criterio que
// getTurnoIndexForTime() en el panel interno (js/menu.js): antes aquí todos
// los cierres eran inclusivos, así que justo en el minuto de cambio de turno
// (p.ej. las 16:00 entre un turno 13-16 y otro 16-19) esta página podía
// calcular un turnoIdx distinto al que usa el panel interno.
function getTurnoIndexForTime(dateStr, time){
  const turnos = getTurnosForDate(dateStr);
  if(!turnos || !turnos.length) return null;
  const idx = turnos.findIndex((t, i) => time >= t.abre && (i === turnos.length - 1 ? time <= t.cierra : time < t.cierra));
  return idx === -1 ? null : idx;
}
// Devuelve {aforo, turnoIdx, reservados, disponible} o null si no hay aforo
// configurado o la hora no encaja en ningún turno. reservados es el último
// recuento SINCRONIZADO desde el panel interno (puede llevar algo de retraso
// respecto a reservas que otros clientes están completando ahora mismo) —
// la comprobación final de verdad es la transacción atómica al enviar.
function getAforoInfo(dateStr, time){
  const aforo = parseInt((DB.business||{}).aforo) || 0;
  if(!aforo) return null;
  const turnoIdx = getTurnoIndexForTime(dateStr, time);
  if(turnoIdx === null) return null;
  const resumen = (DB.reservasResumen||{})[dateStr] || {};
  const reservados = resumen[turnoIdx] || 0;
  return {aforo, turnoIdx, reservados, disponible: Math.max(0, aforo - reservados)};
}
// Reserva de forma ATÓMICA `people` plazas del turno, usando una transacción
// de Firebase sobre un contador de "holds" independiente del resumen ya
// sincronizado. Esto evita que dos clientes reservando casi a la vez (antes
// de que el panel interno vuelva a sincronizar el resumen) puedan juntos
// superar el aforo sin que ninguno de los dos lo viera en su momento. Si la
// transacción no se puede completar sin pasarse del aforo, se aborta
// (result.committed === false) y no se ha reservado nada.
function reserveAforoAtomic(dateStr, turnoIdx, people, aforo, baseline){
  const ref = db.ref('gastrogoan/public/' + publicId + '/aforoHold/' + dateStr + '/' + turnoIdx);
  return ref.transaction(current => {
    const held = current || 0;
    if(baseline + held + people > aforo) return; // abort: se pasaría del aforo
    return held + people;
  });
}
// Margen de tolerancia: una mesa admite hasta 1 persona más de su capacidad
// configurada (mesa de 2 acepta grupos de 3, de 4 acepta grupos de 5) — así
// no se rechazan reservas que en la práctica caben perfectamente.
const RESERVATION_TABLE_MARGIN = 1;

// Cuánto tiempo ocupa una reserva la mesa antes de poder volver a
// reservarse — configurable en Mi Negocio (mn-reserva-duracion), 90 min por
// defecto. Mismo valor y mismo concepto que reservaVentanaMin() en el panel
// interno (js/app.js), pero es un archivo aparte sin acceso a ese código.
function getReservaDuracionMin(){
  return parseInt((DB.business||{}).reservaDuracionMin) || 90;
}
// Franjas de 30 min que ocupa una reserva de `time` a `time + duración`
// (p.ej. 14:00 con 90 min -> ["14:00","14:30","15:00"], libre desde las
// 15:30). Misma rejilla de 30 min que ya usa getReservationTimeSlots() en
// el panel interno.
function slotsForReservation(time, durationMin){
  const [h, m] = time.split(':').map(Number);
  let cur = h * 60 + m;
  const end = cur + durationMin;
  const slots = [];
  while(cur < end){
    slots.push(String(Math.floor(cur / 60)).padStart(2, '0') + ':' + String(cur % 60).padStart(2, '0'));
    cur += 30;
  }
  return slots;
}
// Mayor capacidad entre las mesas dadas de alta (con plazas configuradas).
// Si un grupo no cabe ni en la mesa más grande ni con margen, es que hace
// falta juntar mesas — algo que ya no puede decidir la web sola.
function getMaxTableCapacity(){
  return Math.max(0, ...(DB.tables || []).filter(tb => tb.plazas).map(tb => tb.plazas));
}
// Franjas ya ocupadas de una mesa concreta ese día, según el espejo
// sincronizado (DB.mesasOcupadas, sin ningún dato de cliente — solo qué
// mesa y qué franjas).
function getOccupiedSlotsForTable(dateStr, tableId){
  return ((DB.mesasOcupadas || {})[dateStr] || {})[tableId] || {};
}
function tableFreeForSlots(dateStr, tableId, slots){
  const occupied = getOccupiedSlotsForTable(dateStr, tableId);
  return slots.every(s => !occupied[s]);
}
// Mejor mesa libre para un grupo de `people` personas en esas franjas: la
// más pequeña que cumple people <= plazas + margen y no choca con ninguna
// reserva ya existente en esa mesa. Solo se consideran mesas con capacidad
// configurada — una sin plazas no se puede juzgar.
function getBestFitTable(dateStr, time, people, slots){
  const candidates = (DB.tables || [])
    .filter(tb => tb.plazas && tb.plazas + RESERVATION_TABLE_MARGIN >= people && tableFreeForSlots(dateStr, tb.id, slots))
    .sort((a, b) => a.plazas - b.plazas);
  return candidates[0] || null;
}
// Reserva de forma ATÓMICA una mesa concreta para esas franjas, usando una
// transacción de Firebase sobre un "candado" independiente del resumen ya
// sincronizado. Esto evita que dos clientes casi a la vez (antes de que el
// panel interno vuelva a sincronizar mesasOcupadas) se lleven la misma
// franja de la misma mesa sin que ninguno de los dos lo viera en su
// momento. Si alguna franja ya estaba cogida, se aborta (result.committed
// === false) y no se reserva nada — la transacción entera es sobre el
// mismo nodo (todas las franjas de esa mesa ese día), así que dos
// solicitudes que choquen SIEMPRE se serializan entre sí.
function reserveTableAtomic(dateStr, tableId, slots){
  const ref = db.ref('gastrogoan/public/' + publicId + '/mesaHold/' + dateStr + '/' + tableId);
  return ref.transaction(current => {
    const held = current || {};
    for(const s of slots){ if(held[s]) return; } // abort: alguna franja ya está cogida
    const merged = Object.assign({}, held);
    slots.forEach(s => { merged[s] = true; });
    return merged;
  });
}
// Deshace una reserva de aforo ya confirmada, si después la mesa no se pudo
// reservar (dos pasos no atómicos entre sí: aforo primero, mesa después —
// si el segundo falla, hay que devolver el hueco del primero). El resumen
// sincronizado del panel interno recalcula este contador desde cero en
// cada sync de todos modos, así que un desajuste puntual aquí se autocorrige.
function releaseAforoHold(dateStr, turnoIdx, people){
  const ref = db.ref('gastrogoan/public/' + publicId + '/aforoHold/' + dateStr + '/' + turnoIdx);
  return ref.transaction(current => Math.max(0, (current || 0) - people));
}

// Mismo mecanismo que reserveAforoAtomic pero para el límite de pedidos por
// franja de 30 min (mn.pedidos.maxPorFranja): evita que dos pedidos casi
// simultáneos para la misma franja superen juntos el límite que el negocio
// ha configurado, antes de que el resumen sincronizado se actualice.
function roundToPedidoSlot(time){
  const parts = (time||'').split(':');
  const h = parseInt(parts[0], 10) || 0;
  const m = parseInt(parts[1], 10) || 0;
  return String(h).padStart(2,'0') + ':' + (m < 30 ? '00' : '30');
}
function reservePedidoSlotAtomic(dateStr, slot, max, baseline){
  const ref = db.ref('gastrogoan/public/' + publicId + '/pedidosHold/' + dateStr + '/' + slot);
  return ref.transaction(current => {
    const held = current || 0;
    if(baseline + held + 1 > max) return; // abort: se pasaría del límite
    return held + 1;
  });
}

/* ============ TIEMPO DE ANTELACIÓN / ZONA DE REPARTO ============ */
// Si el pedido/reserva es para hoy, no se puede elegir una hora anterior a
// "ahora + tiempo de antelación configurado por el restaurante". Reservas y
// pedidos tienen cada uno su propio ajuste (Mi Negocio → Operativa); si un
// negocio antiguo aún no tiene los campos nuevos, ambos caen al ajuste
// único que había antes de separarlos.
function getLeadTimeMin(kind){
  const b = DB.business || {};
  const specific = kind === 'reserva' ? b.leadTimeMinReservas : b.leadTimeMinPedidos;
  if(specific != null) return parseInt(specific) || 0;
  if(b.leadTimeMin != null) return parseInt(b.leadTimeMin) || 0;
  return parseInt((b.pedidos||{}).leadTimeMin) || 0;
}
function applyLeadTime(dateInputId, timeInputId, hintBoxId, kind){
  const leadTimeMin = getLeadTimeMin(kind);
  const date = document.getElementById(dateInputId).value;
  const timeInput = document.getElementById(timeInputId);
  const hintBox = document.getElementById(hintBoxId);
  if(!leadTimeMin || date !== todayStr()) return;

  const now = new Date(Date.now() + leadTimeMin * 60000);
  const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  if(!timeInput.min || minTime > timeInput.min) timeInput.min = minTime;
  if(timeInput.value && timeInput.value < timeInput.min) timeInput.value = timeInput.min;

  const hint = `<p style="font-size:13px;color:var(--muted);margin-top:-8px">${t('hint.antelacion').replace('%s', minTime).replace('%d', leadTimeMin)}</p>`;
  hintBox.innerHTML = (hintBox.innerHTML || '') + hint;
}

// Distancia en km entre dos puntos (fórmula de Haversine).
function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Comprueba si una dirección/código postal de entrega está dentro de la
// zona de reparto configurada (código postal aceptado o dentro del radio).
// Devuelve {ok, pendienteVerificar}: si el geocodificador falla dos veces
// (red caída, timeout de Nominatim...) no bloqueamos un pedido potencialmente
// válido; lo dejamos pasar marcado para que el negocio revise la dirección
// manualmente antes de aceptarlo.
async function checkDeliveryZone(p, codigoPostal, direccion){
  const cpList = p.cpList || [];
  if(cpList.length && cpList.includes(codigoPostal)) return {ok:true};

  if(p.radiusKm > 0 && p.lat != null && p.lng != null){
    const geocode = async () => {
      const q = encodeURIComponent(direccion + ', ' + codigoPostal);
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + q);
      const data = await res.json();
      return (data && data[0]) ? data[0] : null;
    };
    let point = null;
    try{ point = await geocode(); }catch(e){ console.error(e); point = null; }
    if(!point){
      // Un único reintento tras una breve espera antes de darnos por vencidos.
      await new Promise(r => setTimeout(r, 1200));
      try{ point = await geocode(); }catch(e){ console.error(e); point = null; }
    }
    if(point){
      const dist = haversineKm(p.lat, p.lng, parseFloat(point.lat), parseFloat(point.lon));
      return {ok: dist <= p.radiusKm};
    }
    if(!cpList.length) return {ok:true, pendienteVerificar:true};
  }

  // Si no hay ninguna zona configurada, no se restringe.
  if(!cpList.length && !(p.radiusKm > 0)) return {ok:true};
  return {ok:false};
}

        ${(DB.business.depositInstructions||'').trim() ? `<div style="font-size:12.5px;margin-top:6px;color:var(--muted)">${escapeHtml(DB.business.depositInstructions)}</div>` : ''}
      </div>` : ''}
      <label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;font-size:12.5px;margin:10px 0;cursor:pointer">
        <input type="checkbox" id="r-privacy-consent" style="width:auto;margin-top:2px">
        <span>${t('privacy.consentLabel')} <a href="#" onclick="showPrivacyNotice();return false">${t('privacy.linkText')}</a></span>
      </label>
      <button class="btn btn-primary" id="r-submit" onclick="submitReserva()">${(DB.business||{}).requireDeposit ? t('reserva.submitWithDeposit') : t('reserva.submit')}</button>
    </div>
  `;
  updateTimeInputRange('r-date','r-time','r-hour-hint');
  applyLeadTime('r-date','r-time','r-hour-hint','reserva');
}

// Calcula el importe de la señal para la reserva actual (según el tipo
// configurado: fijo, o por persona multiplicado por los comensales del
// formulario en este momento).
function reservaDepositAmount(){
  const b = DB.business || {};
  const amount = parseFloat(b.depositAmount) || 0;
  if(b.depositType === 'perPerson'){
    const people = parseInt(document.getElementById('r-people')?.value) || 1;
    return (amount * people).toFixed(2);
  }
  return amount.toFixed(2);
}

// Punto único de envío de una reserva: si pide señal (y el TPV virtual está
// disponible), va a pagar antes de crearse; si no, se manda tal cual, como
// siempre. Reemplaza los 3 sendRequest(req, ...) que había sueltos en
// submitReserva (uno por cada camino: sin mesas configuradas, éxito de la
// reserva atómica, y fallback si la transacción atómica falla por red).
function sendReservaRequest(req, successMsg){
  if(req.depositRequired){
    payWithCard(req, req.depositAmount, t('deposit.paymentDescription'), 'resToken', 'r-submit');
    return;
  }
  sendRequest(req, successMsg);
}

function submitReserva(){
  if(submittingRequest) return;
  submittingRequest = true;
  setBtnLoading('r-submit', true);
  const clientName = document.getElementById('r-name').value.trim();
  const clientPhone = document.getElementById('r-phone').value.trim();
  const clientEmail = document.getElementById('r-email').value.trim();
  const date = document.getElementById('r-date').value;
  const time = document.getElementById('r-time').value;
  // El "max" del input es solo una pista visual del navegador — se puede
  // teclear/pegar cualquier número saltándosela, así que se acota aquí
  // también (evita reservas de miles de comensales cuando el negocio aún
  // no tiene aforo/mesas configurados, que es cuando no hay más validación).
  const people = Math.min(50, Math.max(1, parseInt(document.getElementById('r-people').value) || 1));
  const notes = document.getElementById('r-notes').value.trim();
  const referral = document.getElementById('r-referral')?.value || '';

  clearFieldInvalid(['r-name','r-phone','r-email','r-date','r-time']);
  if(!clientName || !clientPhone || !clientEmail || !date || !time){
    if(!clientName) markFieldInvalid('r-name');
    if(!clientPhone) markFieldInvalid('r-phone');
    if(!clientEmail) markFieldInvalid('r-email');
    if(!date) markFieldInvalid('r-date');
    if(!time) markFieldInvalid('r-time');
    showInlineError(t('error.campos.reserva'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  // El "min" del &lt;input type=date&gt; también es solo una pista del navegador
  // (editable a mano, o con el reloj del dispositivo cambiado) — se revalida
  // aquí que no sea una fecha ya pasada respecto a "hoy" en el propio envío.
  if(date < todayStr()){
    markFieldInvalid('r-date');
    showInlineError(t('error.campos.reserva'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  // Validación básica de formato: sin esto, un email mal escrito por prisa
  // ("laura@gmial.con") pasaría como válido y la reserva se auto-confirmaría
  // sin que el cliente llegase a enterarse nunca por ningún sitio.
  if(!isValidEmail(clientEmail)){
    markFieldInvalid('r-email');
    showInlineError(t('error.email.invalido'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  if(!document.getElementById('r-privacy-consent').checked){
    showInlineError(t('privacy.mustAccept'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }

  const turnos = getTurnosForDate(date);
  if(turnos !== null && !turnos.length){
    showInlineError(t('error.cerrado').replace('%s', nombreDia(date).toLowerCase()));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  if(turnos !== null && turnos.length && !isTimeAllowed(date, time)){
    showInlineError(t('error.horario').replace('%s', t('error.horario.reservas')).replace('%s', nombreDia(date).toLowerCase()).replace('%s', formatTurnos(turnos)));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }

  const leadTimeMin = getLeadTimeMin('reserva');
  if(leadTimeMin && date === todayStr()){
    const now = new Date(Date.now() + leadTimeMin * 60000);
    const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    if(time < minTime){
      showInlineError(t('error.antelacion').replace('%d', leadTimeMin).replace('%s', minTime));
      submittingRequest = false;
      setBtnLoading('r-submit', false);
      return;
    }
  }

  // Disponibilidad real: hace falta UNA mesa que le quepa al grupo (con
  // margen) Y que no se pase del aforo total del turno — las dos cosas a
  // la vez, igual que decidiría el negocio a mano.
  const turnoIdx = getTurnoIndexForTime(date, time);
  const hasConfiguredTables = (DB.tables||[]).some(tb => tb.plazas);
  const maxCapacity = getMaxTableCapacity();
  const aforoInfo = getAforoInfo(date, time);

  let matchedTable = null, slots = null;
  // Ninguna mesa individual (ni con margen) llegaría al tamaño del grupo:
  // puede que el negocio sea capaz de juntar varias mesas, pero eso ya no
  // lo puede decidir la web sola — queda pendiente de que lo revisen a mano,
  // en vez de rechazar sin más una reserva que quizás sí se pueda hacer.
  const needsManualReview = hasConfiguredTables && people > maxCapacity + RESERVATION_TABLE_MARGIN;

  if(hasConfiguredTables && !needsManualReview){
    slots = slotsForReservation(time, getReservaDuracionMin());
    matchedTable = getBestFitTable(date, time, people, slots);
    if(!matchedTable){
      // Sí existe una mesa de ese tamaño, pero está ocupada a esa hora —
      // esto sí es "no hay disponibilidad" de verdad, se dice en el momento.
      showInlineError(t('error.mesa.nodisponible'));
      submittingRequest = false;
      setBtnLoading('r-submit', false);
      return;
    }
    if(aforoInfo && people > aforoInfo.disponible){
      showInlineError(t('error.mesa.nodisponible'));
      submittingRequest = false;
      setBtnLoading('r-submit', false);
      return;
    }
  }

  // Si el negocio pide señal Y tiene el TPV virtual conectado, enviar la
  // reserva no la manda directa a la cola: primero lleva al cliente a pagar
  // la señal con tarjeta (payWithCard), y la reserva solo se crea si la
  // firma del pago tiene éxito (ver payWithCard más abajo). Si el negocio
  // marcó "pedir señal" pero el TPV virtual no está disponible ahora mismo
  // (mn.ops.requireDeposit ya lo impide al guardar, pero por si un negocio
  // antiguo quedó con datos inconsistentes), se cae al envío normal sin
  // señal en vez de dejar al cliente sin poder reservar.
  const depositRequired = !!(DB.business||{}).requireDeposit && redsysConfigured;
  const req = {
    type:'reserva', clientName, clientPhone, clientEmail, date, time, people, notes, referral,
    depositRequired, depositAmount: depositRequired ? reservaDepositAmount() : '',
    createdAt: new Date().toISOString(),
    // Token para poder volver más tarde a "Gestionar mi reserva" (ver
    // renderReservationManageView) sin tener que llamar por teléfono.
    resToken: genClientRef()
  };
  if(matchedTable) req.tableId = matchedTable.id;

  const btn = document.getElementById('r-submit');
  if(btn) btn.disabled = true;

  if(!matchedTable){
    // Sin mesas configuradas todavía, grupo que necesita juntar mesas, o sin
    // horario para saber el turno: no hay nada que comprobar automáticamente,
    // se manda tal cual y el negocio la revisa a mano.
    sendReservaRequest(req, t('reserva.ok') + (clientEmail ? t('reserva.ok.emailHint') : ''));
    return;
  }

  // Comprobación final ATÓMICA justo antes de enviar: cierra la ventana de
  // carrera en la que dos clientes reservan casi a la vez y se llevarían
  // entre los dos el mismo aforo o la misma mesa antes de que el resumen
  // sincronizado reflejase la del otro. Primero el aforo (más barato de
  // deshacer si falla lo segundo), luego la mesa; si la mesa falla, se
  // devuelve el hueco de aforo ya reservado.
  (async () => {
    try{
      if(aforoInfo){
        const aforoResult = await reserveAforoAtomic(date, aforoInfo.turnoIdx, people, aforoInfo.aforo, aforoInfo.reservados);
        if(!aforoResult.committed){
          if(btn) btn.disabled = false;
          submittingRequest = false;
          setBtnLoading('r-submit', false);
          showInlineError(t('error.mesa.nodisponible'));
          return;
        }
      }
      const tableResult = await reserveTableAtomic(date, matchedTable.id, slots);
      if(!tableResult.committed){
        if(aforoInfo) releaseAforoHold(date, aforoInfo.turnoIdx, people).catch(()=>{});
        if(btn) btn.disabled = false;
        submittingRequest = false;
        setBtnLoading('r-submit', false);
        showInlineError(t('error.mesa.nodisponible'));
        return;
      }
      sendReservaRequest(req, t('reserva.ok') + (clientEmail ? t('reserva.ok.emailHint') : ''));
    }catch(e){
      console.error(e);
      if(btn) btn.disabled = false;
      // Si la transacción falla por un problema de conexión, dejamos seguir
      // con el envío normal en vez de bloquear al cliente por completo: es
      // preferible el pequeño riesgo de carrera a que no pueda reservar.
      sendReservaRequest(req, t('reserva.ok') + (clientEmail ? t('reserva.ok.emailHint') : ''));
    }
  })();
}

/* ============ MENÚ (carrito compartido) ============ */
function getActiveCartasConPlatos(){
  return getActiveCartas().filter(c => (c.secciones||[]).some(sec => (sec.platos||[]).some(p=>p.disponible!==false)));
}

// Igual que allergenLabel() en la app principal: el valor guardado es
// siempre el nombre en español (clave estable), se traduce solo al mostrar.
function allergenLabel(name){
  const dict = t('allergens.map');
  return (dict && dict[name]) || name;
}
function dishAllergensHtml(platoId){
  const list = (DB.allergens||{})[platoId];
  if(!list || !list.length) return '';
  return `<div style="font-size:11px;color:var(--muted);margin-top:2px" title="${escapeHtml(t('allergens.title'))}">⚠️ ${list.map(a=>escapeHtml(allergenLabel(a))).join(', ')}</div>`;
}
// Qué familias (secciones de la carta) están desplegadas — ver toda la
// carta de golpe obligaba a un scroll larguísimo en cartas con muchos
// platos; ahora se ven las familias primero y solo se despliega la que se
// toca, como las carpetas de categorías del resto de la app.
let expandedMenuSections = new Set();
let lastMenuCartas = null;
function toggleMenuSection(key){
  if(expandedMenuSections.has(key)) expandedMenuSections.delete(key);
  else expandedMenuSections.add(key);
  const box = document.getElementById('menu-folders');
  if(box && lastMenuCartas) box.innerHTML = buildMenuHtmlInner(lastMenuCartas);
}
function buildMenuHtml(cartas){
  lastMenuCartas = cartas;
  return `<div id="menu-folders">${buildMenusHtml()}${buildMenuHtmlInner(cartas)}</div>`;
}
function buildMenuHtmlInner(cartas){
  return cartas.map(carta => `
    ${cartas.length > 1 ? `<h2>${escapeHtml(trItem(carta))}</h2>` : ''}
    ${(()=>{ const seccionesVisibles = (carta.secciones||[]).filter(sec => (sec.platos||[]).some(p=>p.disponible!==false)); return seccionesVisibles.map(sec => {
      const key = String(carta.id) + ':' + String(sec.id);
      // Una sola familia, o platos sin sección (nombre vacío/"OTROS
      // PLATOS"): no tiene sentido plegarla, se muestra siempre abierta.
      const foldable = !!(sec.nombre && sec.nombre !== 'OTROS PLATOS') && seccionesVisibles.length > 1;
      const isOpen = !foldable || expandedMenuSections.has(key);
      return `
      ${sec.nombre && sec.nombre !== 'OTROS PLATOS' ? (foldable ? `
        <button type="button" class="menu-folder-header" onclick="toggleMenuSection('${key}')" aria-expanded="${isOpen}" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:none;border-bottom:1px solid var(--border);padding:14px 2px;font:inherit;text-align:left;cursor:pointer">
          <h3 style="margin:0">${escapeHtml(trSection(sec))}</h3>
          <span style="color:var(--muted);transition:transform .15s;transform:rotate(${isOpen?'180deg':'0deg'})">▾</span>
        </button>
      ` : `<h3>${escapeHtml(trSection(sec))}</h3>`) : ''}
      <div style="${isOpen ? '' : 'display:none'}">
      ${sec.platos.filter(p=>p.disponible!==false).map(p => {
        const promo = getActivePromoForPlatoPublic(p.id);
        const finalPrice = promo ? promoDiscountedPrice(p.precio, promo) : p.precio;
        const hasMods = (p.modificadores||[]).length > 0;
        // Cuántas unidades de este plato hay YA en el carrito, sumando
        // TODAS sus variantes de extras (la línea sin extras + cada
        // combinación elegida) — para que el cliente vea de un vistazo que
        // ya tiene algo añadido aunque esté repartido en varias líneas.
        const totalInCart = cart.filter(l => l.recipeId === p.id).reduce((s,l)=>s+l.qty, 0);
        return `
        <div class="menu-item">
          <div>
            <div class="name">${escapeHtml(trPlato(p))}${promo ? ` <span class="promo-badge" style="font-size:11px;color:#fff;background:var(--olive);border-radius:0;padding:1px 6px;margin-left:4px;font-family:'IBM Plex Mono',monospace">-${promo.discountPct}%</span>` : ''}</div>
            <div class="price">${promo ? `<span style="text-decoration:line-through;color:var(--muted);font-weight:400;margin-right:6px">${fmtMoney(p.precio)}</span>${fmtMoney(finalPrice)}` : fmtMoney(p.precio)}${hasMods ? ` <span style="color:var(--muted)">${t('modifiers.fromPrice')}</span>` : ''}</div>
            ${dishAllergensHtml(p.id)}
          </div>
          ${hasMods ? `
          <button class="btn btn-sm" style="width:auto;min-height:38px;padding:8px 14px;white-space:nowrap;position:relative" onclick="openModifierModal(${p.id})">
            ${t('modifiers.addBtn')}${totalInCart ? ` <span class="mono" style="margin-left:4px">(${totalInCart})</span>` : ''}
          </button>
          ` : `
          <div class="qty-ctl" role="group" aria-label="${escapeHtml(trPlato(p))}">
            <button onclick="changeCartQty(${p.id}, '${escapeJsAttr(sec.id)}', -1)" aria-label="${escapeHtml(t('aria.removeItem').replace('%s', trPlato(p)))}">−</button>
            <span id="qty-${p.id}" aria-live="polite">${getCartQty(p.id)}</span>
            <button onclick="changeCartQty(${p.id}, '${escapeJsAttr(sec.id)}', 1, '${escapeJsAttr(p.nombre)}', ${finalPrice})" aria-label="${escapeHtml(t('aria.addItem').replace('%s', trPlato(p)))}">+</button>
          </div>
          `}
        </div>
      `;}).join('')}
      </div>
    `;}).join(''); })()}
  `).join('');
}

// Aviso de la hora límite real para pedir (cierre del turno menos el
// margen configurado), independiente del aviso general de horario — solo
// aplica a pedidos, así que va en su propio hint en vez de reutilizar
// horarioHintHtml (compartido con el formulario de reservas).
function updateCierreHint(){
  const box = document.getElementById('o-cierre-hint');
  if(!box) return;
  const dateEl = document.getElementById('o-date');
  const timeEl = document.getElementById('o-time');
  if(!dateEl || !timeEl){ box.innerHTML = ''; return; }
  const p = (DB.business||{}).pedidos || {};
  const info = pedidosCutoffTimeForTurno(dateEl.value, timeEl.value, p);
  box.innerHTML = info ? `<p style="font-size:13px;color:var(--muted);margin-top:-8px">${t('hint.cierrePedidos').replace('%s', info.limite)}</p>` : '';
}

// Un único grupo de opciones con las 3 formas de pago posibles (en vez del
// antiguo esquema de dos niveles "online vs en persona" + "efectivo vs
// tarjeta"): efectivo, tarjeta al entregar/recoger, y TPV virtual (pagar ya
// online con tarjeta, si el negocio lo tiene configurado). Respeta lo que
// el negocio haya marcado en Mi Negocio → Pedidos; si solo hay una
// disponible, se fija sin preguntar.
function renderPaymentMethodRadiosHtml(p){
  // Compatibilidad con negocios que ya tenían el antiguo interruptor
  // "permitirPagoLocal: false" (pago online obligatorio) puesto de antes de
  // que existieran estas 3 casillas independientes: si nunca han tocado el
  // nuevo ajuste (aceptaEfectivo/aceptaTarjetaLocal siguen "undefined", no
  // "false" explícito), se respeta la preferencia antigua. En cuanto el
  // dueño guarda el nuevo ajuste una vez, savePedidosConfig fija
  // permitirPagoLocal=true y ya no vuelve a aplicar este fallback.
  const legacyForceOnline = p.permitirPagoLocal === false && p.aceptaEfectivo === undefined && p.aceptaTarjetaLocal === undefined;
  const opts = [];
  if(redsysConfigured && p.aceptaTpvVirtual !== false) opts.push({value:'tpv', label:t('pago.tarjeta')});
  if(!legacyForceOnline && p.aceptaEfectivo !== false) opts.push({value:'efectivo', label: t('pago.efectivo')});
  if(!legacyForceOnline && p.aceptaTarjetaLocal !== false) opts.push({value:'tarjeta_local', label: t('pago.tarjetaLocal')});
  if(!opts.length) opts.push({value:'efectivo', label: t('pago.efectivo')}); // salvaguarda: nunca dejar el formulario sin ninguna opción
  if(opts.length === 1){
    return `<input type="radio" name="o-pago-metodo" value="${opts[0].value}" checked style="display:none"><p style="font-size:13px;color:var(--muted)">${t('pago.metodoFijado').replace('%s', opts[0].label)}</p>`;
  }
  return `
    <label>${t('pago')}</label>
    ${opts.map((o,i) => `<label style="display:flex;align-items:center;gap:10px;font-weight:400;margin-bottom:6px;padding:6px 0"><input type="radio" name="o-pago-metodo" value="${o.value}" ${i===0?'checked':''} onchange="updateCashAmountVisibility()" style="width:20px;height:20px;flex-shrink:0"> ${o.label}</label>`).join('')}
  `;
}
// El importe del billete con el que se va a pagar solo tiene sentido si
// eligen efectivo Y es un pedido a domicilio (para recoger en el local no
// hace falta preparar cambio, el cliente paga en persona en el mostrador).
function updateCashAmountVisibility(){
  const sel = document.querySelector('input[name="o-pago-metodo"]:checked');
  const wrap = document.getElementById('o-cash-amount-wrap');
  if(wrap) wrap.style.display = (currentTab === 'delivery' && sel && sel.value === 'efectivo') ? '' : 'none';
}

// Identificador único de una línea del carrito: por plato solo para los
// platos SIN extras (se pueden agrupar en un único contador +/-), y por
// plato+combinación exacta de extras elegidos para los que sí tienen —
// así "1 pizza con extra queso" y "1 pizza sin nada" son líneas distintas
// del carrito, cada una con su propia cantidad, en vez de mezclarse en un
// solo contador que no podría representar la diferencia.
function cartLineKey(platoId, modIds){
  return (modIds && modIds.length) ? (platoId + ':' + [...modIds].sort((a,b)=>a-b).join(',')) : String(platoId);
}
// Busca el plato (con su lista de extras) dentro de las cartas activas —
// hace falta al confirmar el modal de extras, donde solo tenemos el id.
function findPlatoById(platoId){
  for(const c of (DB.cartas||[])){
    for(const sec of (c.secciones||[])){
      const p = (sec.platos||[]).find(x => x.id === platoId);
      if(p) return {plato: p, sectionId: sec.id};
    }
  }
  return null;
}

function getCartQty(recipeId){
  // Solo cuenta la línea SIN extras (la del contador +/- de la lista) —
  // las líneas con extras elegidos tienen su propio contador en el
  // resumen del carrito, ver renderCartSummary/tipSelectorHtml.
  const line = cart.find(l => l.recipeId === recipeId && (!l.modificadores || !l.modificadores.length));
  return line ? line.qty : 0;
}

function changeCartQty(recipeId, sectionId, delta, name, price){
  let line = cart.find(l => l.recipeId === recipeId && (!l.modificadores || !l.modificadores.length));
  if(!line){
    if(delta <= 0) return;
    line = {key: cartLineKey(recipeId, []), recipeId, sectionId, name, price, qty:0, modificadores:[]};
    cart.push(line);
  }
  line.qty += delta;
  if(line.qty <= 0) cart = cart.filter(l => l !== line);

  const span = document.getElementById('qty-'+recipeId);
  if(span){
    span.textContent = getCartQty(recipeId);
    span.classList.remove('bump'); void span.offsetWidth; span.classList.add('bump');
  }
  renderCartSummary();
}

// Ajusta la cantidad de una línea YA en el carrito por su clave exacta —
// se usa desde el resumen del carrito para las líneas con extras (que no
// tienen un contador +/- propio en el listado de la carta, porque ahí solo
// cabe "Añadir", ver openModifierModal).
function changeCartLineQty(key, delta){
  const line = cart.find(l => l.key === key);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0) cart = cart.filter(l => l !== line);
  renderCartSummary();
}

/* ============ EXTRAS / MODIFICADORES por plato ============
   Un plato con extras configurados (p.modificadores, cada uno {id,nombre,
   precio}) no usa el contador +/- directo: se abre un modal para elegir
   cuáles quiere (checkboxes, sin restricción de cardinalidad — así está
   modelado en la app principal, ver js/menu.js) y SOLO entonces se añade
   al carrito, con el precio final ya calculado. */
let modModalContext = null;
function openModifierModal(platoId){
  const found = findPlatoById(platoId);
  if(!found) return;
  const { plato } = found;
  const promo = getActivePromoForPlatoPublic(platoId);
  const basePrice = promo ? promoDiscountedPrice(plato.precio, promo) : plato.precio;
  modModalContext = { platoId, basePrice };
  ensureModalChrome();
  document.getElementById('modal-box').innerHTML = `
    <button class="modal-close" onclick="closeInfoModal()" aria-label="${escapeHtml(t('common.close')||'Cerrar')}">&times;</button>
    <h2>${escapeHtml(trPlato(plato))}</h2>
    <p style="font-size:13px;color:var(--muted);margin-top:-4px">${t('modifiers.hint')}</p>
    <div style="margin:14px 0">
      ${(plato.modificadores||[]).map(m => `
        <label style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer">
          <input type="checkbox" class="mod-check" value="${m.id}" style="width:20px;height:20px;flex:none">
          <span style="flex:1;font-size:14px">${escapeHtml(trItem(m))}</span>
          ${m.precio ? `<span class="mono" style="font-size:12.5px;color:var(--muted)">+${fmtMoney(m.precio)}</span>` : ''}
        </label>
      `).join('')}
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="confirmAddWithModifiers()">${t('modifiers.add')}</button>
  `;
  document.getElementById('modal-overlay').classList.add('active');
}
function confirmAddWithModifiers(){
  if(!modModalContext) return;
  const found = findPlatoById(modModalContext.platoId);
  if(!found){ closeInfoModal(); return; }
  const { plato, sectionId } = found;
  const checkedIds = [...document.querySelectorAll('.mod-check:checked')].map(el => parseInt(el.value));
  const selected = (plato.modificadores||[]).filter(m => checkedIds.includes(m.id));
  const finalPrice = modModalContext.basePrice + selected.reduce((s,m)=>s+(m.precio||0),0);
  const key = cartLineKey(plato.id, selected.map(m=>m.id));
  let line = cart.find(l => l.key === key);
  if(!line){
    line = {key, recipeId: plato.id, sectionId, name: plato.nombre, price: finalPrice, qty:0, modificadores: selected};
    cart.push(line);
  }
  line.qty += 1;
  modModalContext = null;
  closeInfoModal();
  renderCartSummary();
}

// Menús combo (ej. "Menú del día"): antes no se publicaban al espejo

function confirmAddMenuFromModal(){
  if(!menuModalContext) return;
  const m = (DB.menus||[]).find(x=>x.id===menuModalContext.menuId);
  if(!m){ closeInfoModal(); return; }
  let extra = 0;
  const selections = (m.grupos||[]).map(g => {
    const selId = parseInt(document.querySelector(`input[name="menu-grupo-${g.id}"]:checked`)?.value);
    const o = (g.opciones||[]).find(x=>x.id===selId) || (g.opciones||[]).find(x=>x.disponible!==false);
    if(!o) return null;
    extra += o.suplemento||0;
    return { nombre: `${trItem(g)}: ${trItem(o)}`, precio: o.suplemento||0 };
  }).filter(Boolean);
  const finalPrice = (m.precio||0) + extra;
  const key = 'menu:' + m.id + ':' + selections.map(s=>s.nombre).join('|');
  let line = cart.find(l => l.key === key);
  if(!line){
    line = { key, recipeId: null, sectionId: null, name: m.nombre, price: finalPrice, qty: 0, modificadores: selections };
    cart.push(line);
  }
  line.qty += 1;
  menuModalContext = null;
  closeInfoModal();
  renderCartSummary();
}

  :root{
    --ink:#1C1A17; --olive:#4A5D4E; --olive-l:#7E9B84;
    --paper:#FAF8F4; --surface:#FFFFFF; --border:#E7E2D9;
    --body:#3D3A34; --muted:#8A857C;
    --green:#4A5D4E; --green-l:#EDF1EC;
    --red:#8A4A3B; --red-l:#F5EBE7;
  }
  *{box-sizing:border-box;}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--olive);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  body{
    margin:0;font-family:'Schibsted Grotesk',system-ui,-apple-system,sans-serif;
    background:var(--paper);color:var(--body);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  ::selection{background:var(--ink);color:var(--paper)}
  header{
    background:var(--ink);color:#fff;padding:20px 16px;text-align:center;
    border-bottom:1px solid var(--ink);
  }
  header img{max-height:56px;border-radius:0;margin-bottom:6px;}
  header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;}
  header .sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;color:#C9C2B6;margin-top:6px;}
  #lang-switcher{display:flex;justify-content:center;gap:6px;margin-top:10px;}
  #lang-switcher button{
    padding:4px 10px;border-radius:0;border:1px solid rgba(255,255,255,.3);
    background:transparent;color:rgba(255,255,255,.7);font-size:11.5px;font-weight:600;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;transition:border-color .15s,color .15s,background-color .15s;
  }
  #lang-switcher button:hover{border-color:var(--olive-l);color:#fff;}
  #lang-switcher button.active{background:var(--olive);color:#fff;border-color:var(--olive);}
  .wrap{max-width:560px;margin:0 auto;padding:16px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:0;
    padding:18px;margin-bottom:14px;
  }
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .tab-btn{
    flex:1;min-width:100px;padding:13px 12px;min-height:48px;border-radius:0;border:1px solid var(--border);
    background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer;text-align:center;color:var(--ink);
    font-family:inherit;transition:border-color .15s,background-color .15s,color .15s,transform .1s;
  }
  .tab-btn:hover{border-color:var(--ink);}
  .tab-btn:active{transform:translateY(1px);}
  .tab-btn.active{border-color:var(--ink);background:var(--ink);color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin-bottom:6px;color:var(--muted);}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 14px;min-height:48px;border:1px solid var(--border);border-radius:0;
    font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink);
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--ink);}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:14px 18px;min-height:50px;border-radius:0;border:1px solid var(--ink);
    background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;
    cursor:pointer;width:100%;font-family:inherit;
    transition:background-color .15s,color .15s,transform .1s;
  }
  .btn:hover:not(:disabled){background:var(--paper);}
  .btn:active:not(:disabled){transform:translateY(1px);}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--olive);border-color:var(--olive);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  #inline-alert{
    position:fixed;left:16px;right:16px;bottom:16px;z-index:999;
    background:var(--red-l);color:var(--red);border:1px solid var(--red);
    padding:14px 16px;font-size:14px;font-weight:600;display:flex;align-items:flex-start;gap:10px;
    box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:480px;margin:0 auto;
  }
  #inline-alert button{background:none;border:none;color:var(--red);font-size:18px;font-weight:700;cursor:pointer;line-height:1;padding:0;margin-left:auto;}
  h2{font-size:17px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em;}
  h3{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;margin:16px 0 8px;}
  .menu-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 0;border-bottom:1px solid var(--border);transition:background-color .15s;
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item .name{font-weight:600;font-size:15px;color:var(--ink);}
  .menu-item .price{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);}
  .qty-ctl{display:flex;align-items:center;gap:10px;}
  .qty-ctl button{
    width:34px;height:34px;border-radius:0;border:1px solid var(--border);
    background:var(--surface);font-size:17px;font-weight:600;cursor:pointer;color:var(--ink);
    transition:border-color .15s,background-color .15s,transform .1s;
  }
  .qty-ctl button:hover{border-color:var(--ink);}
  .qty-ctl button:active{transform:scale(.92);}
  .qty-ctl span{min-width:20px;text-align:center;font-weight:600;font-size:15px;font-family:'IBM Plex Mono',monospace;transition:transform .15s;}
  .qty-ctl span.bump{transform:scale(1.35);color:var(--olive);}
  .cart-line{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;font-family:'IBM Plex Mono',monospace;}
  .cart-total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding-top:10px;border-top:1px solid var(--ink);margin-top:8px;font-family:'IBM Plex Mono',monospace;}
  .cart-total.bump{animation:total-bump .3s ease;}
  @keyframes total-bump{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  .empty{text-align:center;color:var(--muted);padding:22px;font-size:13.5px;}
  .success{
    text-align:center;padding:44px 16px;animation:fade-up .35s ease;
  }
  .success .icon{font-size:48px;color:var(--green);}
  .success h2{margin-top:12px;}
  .error-box{
    text-align:center;padding:40px 16px;color:var(--red);
  }
  .fade-in-play{animation:fade-up .25s ease;}
  @keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){
    .fade-in-play,.success{animation:none;}
    .btn,.tab-btn,.qty-ctl button,#lang-switcher button{transition:none;}
    .cart-total.bump{animation:none;}
    .qty-ctl span.bump{transform:none;}
  }

  /* Responsive */
  @media (max-width: 380px){
    .wrap{padding:10px;}
    .card{padding:12px;}
    header{padding:14px 12px;}
    header h1{font-size:18px;}
    .field-row{flex-direction:column;gap:0;}
    .tab-btn{min-width:80px;font-size:12px;padding:9px 8px;}
    .menu-item .name{font-size:13.5px;}
  }
</style>
</head>

function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.es[key] || key; }

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('gastrogoan_lang', lang);
  renderLangSwitcher();
  if(!bizNameLoaded) document.getElementById('biz-name').textContent = t('app.title');
  if(document.title === 'Reservas y Pedidos' || Object.values(I18N).some(d=>d['app.title']===document.title)) document.title = t('app.title');
  const loadingEl = document.getElementById('app-loading');
  if(loadingEl) loadingEl.textContent = t('app.loading');
  if(currentTab) renderTabContent();
  else if(lastErrorKey) showError(lastErrorKey);
}

function renderLangSwitcher(){
  const box = document.getElementById('lang-switcher');
  if(!box) return;
  box.innerHTML = Object.keys(LANGS).map(l =>
    `<button class="${l===currentLang?'active':''}" onclick="setLang('${l}')">${LANGS[l]}</button>`
  ).join('');
}

// Devuelve el nombre de una sección/plato de la carta traducido al idioma
// elegido por el cliente, o el original (en el idioma en que se escribió) si
// no hay traducción disponible para ese idioma.
function trItem(item){
  const srcLang = item.nombreLang || 'es';
  if(currentLang === srcLang) return item.nombre;
  return (item.i18n && item.i18n[currentLang]) || item.nombre;
}
function trSection(sec){ return trItem(sec); }
function trPlato(p){ return trItem(p); }
function fmtMoney(v){
  return (Number(v)||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
// Aviso de privacidad básico (RGPD): qué datos se piden, para qué se usan
// y cómo ejercer los derechos de acceso/rectificación/supresión. El
// negocio puede ampliarlo/personalizarlo más adelante; esto es la base
// mínima para no pedir datos personales (incluida una alergia, que es un
// dato de salud) sin informar de nada.
function showPrivacyNotice(){
  const bizName = (DB && DB.business && DB.business.name) || t('reserva.title');
  alert(t('privacy.noticeText').replace('${business}', bizName));
}

function getPublicIdFromUrl(){
  try{
    const p = new URLSearchParams(location.search);
    const v = p.get('neg');
    if(v) return v;
  }catch(e){}
  return null;
}

// Enlace "bonito" con el nombre elegido por el negocio (?n=mi-restaurante)
// en vez del código automático (?neg=xxxxx) — ver savePublicSlug() en la
// app principal. Hace falta resolverlo contra la plataforma antes de poder
// cargar los datos del negocio (ver init()).
function getSlugFromUrl(){
  try{
    const p = new URLSearchParams(location.search);
    const v = p.get('n');
    if(v) return v;
  }catch(e){}
  return null;
}

function getTableIdFromUrl(){
  try{
    const p = new URLSearchParams(location.search);
    const v = p.get('mesa');
    if(v) return v;
  }catch(e){}
  return null;
}

// Aviso no bloqueante (sustituye a alert() nativo) para errores que ocurren
// tras una acción del cliente (p.ej. fallo de pago) sin perder lo que había
// escrito en el formulario.
function showInlineError(msg){
  let box = document.getElementById('inline-alert');
  if(box) box.remove();
  box = document.createElement('div');
  box.id = 'inline-alert';
  box.innerHTML = `<span>⚠️ ${escapeHtml(msg)}</span><button onclick="this.parentElement.remove()">&times;</button>`;
  document.body.appendChild(box);
  clearTimeout(showInlineError._t);
  showInlineError._t = setTimeout(()=>{ box.remove(); }, 8000);
}

let lastErrorKey = null;
function showError(key){
  lastErrorKey = key;
  document.getElementById('app').innerHTML = `
    <div class="error-box">
      <div class="icon">⚠️</div>
      <h2>${escapeHtml(t(key))}</h2>
      <p style="font-size:13px;color:#888">${t('error.enlace.sub')}</p>
    </div>
  `;
}

function init(){
  publicId = getPublicIdFromUrl();
  const slug = getSlugFromUrl();
  tableIdFromUrl = getTableIdFromUrl();
  if(!publicId && !slug){ showError('error.enlace'); return; }

  // Vuelta desde el TPV virtual (Redsys) tras pagar con tarjeta.
  const pago = new URLSearchParams(location.search).get('pago');
  if(pago === 'ok'){
    document.getElementById('app').innerHTML = `
      <div class="success">
        <div class="icon">✅</div>
        <h2>${t('pago.ok.title')}</h2>
        <p style="font-size:13px;color:#888">${t('pago.ok.msg')}</p>
      </div>
    `;
    return;
  }
  if(pago === 'ko'){
    document.getElementById('app').innerHTML = `
      <div class="error-box">
        <div class="icon">⚠️</div>
        <h2>${t('pago.ko.title')}</h2>
        <p style="font-size:13px;color:#888">${t('pago.ko.msg')}</p>
      </div>
    `;
    return;
  }

  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    // Autenticación anónima: las reglas de la nube exigen auth != null
    // para poder leer/escribir, así evitamos el acceso directo sin pasar
    // por el SDK de Firebase.
    firebase.auth().signInAnonymously().then(() => {
      // Enlace con nombre elegido por el negocio (?n=...): primero hay que
      // resolverlo contra la plataforma para saber su código real antes de
      // poder cargar sus datos.
      if(slug && !publicId){
        return db.ref('gastrogoan/publicSlugs/' + slug).once('value').then(snap => {
          const resolved = snap.val();
          if(!resolved){ showError('error.enlace'); return; }
          publicId = resolved;
          loadBusinessInfo();
        });
      }
      loadBusinessInfo();
    }).catch(e => {
      console.error(e);
      showError('error.conexion');
    });
  }catch(e){
    console.error(e);
    showError('error.conexion');
  }
}

let businessInfoLoadedOnce = false;
let lastRenderSignature = null;
// Guarda y restaura lo que el cliente ya había escrito (nombre, teléfono,
// dirección, notas...) alrededor de un re-render forzado por el listener en
// vivo, para no perder el formulario a medio rellenar.
function renderTabContentPreservingForm(){
  const box = document.getElementById('tab-content');
  const saved = {};
  if(box){
    box.querySelectorAll('input[id], textarea[id], select[id]').forEach(el => { saved[el.id] = el.value; });
  }
  renderTabContent();
  Object.keys(saved).forEach(id => {
    const el = document.getElementById(id);
    if(el && el.value !== saved[id]) el.value = saved[id];
  });
}
function loadBusinessInfo(){
  // Antes esto era un once('value') de una sola vez: si el dueño cambiaba un
  // precio o quitaba un plato de la carta mientras un cliente tenía la
  // página abierta, el cliente seguía viendo datos obsoletos hasta recargar.
  // Con on() los cambios de carta/precios/disponibilidad llegan en vivo. En
  // las actualizaciones DESPUÉS de la primera no se llama a renderApp() (que
  // vacía el carrito): solo se refresca el contenido de la pestaña actual, y
  // solo si de verdad cambió algo relevante para lo que se ve — el nodo
  // 'info' incluye reservasResumen (aforo), que se reescribe cada vez que
  // CUALQUIER cliente reserva, y eso NO debe forzar un re-render (la
  // disponibilidad ya se revalida en vivo al enviar, vía getAforoInfo /
  // reserveAforoAtomic), o el formulario de otros clientes se vaciaría
  // constantemente por reservas ajenas sin ningún cambio real de carta.
  db.ref('gastrogoan/public/' + publicId + '/info').on('value', snap => {
    const val = snap.val();
    if(!val){ if(!businessInfoLoadedOnce) showError('error.carga'); return; }

    if(val.sucursales && Array.isArray(val.sucursales) && val.sucursales.length > 1 && !new URLSearchParams(location.search).get('local')){
      renderBranchSelector(val.business || {}, val.sucursales);
      return;
    }

    DB = {
      business: val.business || {},
      cartas: val.cartas || [],
      activeCartaIds: val.activeCartaIds || (val.activeCartaId ? [val.activeCartaId] : []),
      reservasResumen: val.reservasResumen || {},
      tables: val.tables || []
    };
    renderHeader();
    if(!businessInfoLoadedOnce){
      businessInfoLoadedOnce = true;
      lastRenderSignature = JSON.stringify({business: DB.business, cartas: DB.cartas, activeCartaIds: DB.activeCartaIds, tables: DB.tables});
      renderApp();
      checkRedsysConfigured();
    }else if(currentTab && document.getElementById('tab-content')){
      const newSignature = JSON.stringify({business: DB.business, cartas: DB.cartas, activeCartaIds: DB.activeCartaIds, tables: DB.tables});
      if(newSignature !== lastRenderSignature){
        lastRenderSignature = newSignature;
        renderTabContentPreservingForm();
      }
    }
  }, e => {
    console.error(e);
    if(!businessInfoLoadedOnce) showError('error.conexion');
  });
}

/* ============ HORARIOS ============ */
const DIAS_SEMANA_I18N = {
  es:['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],
  en:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],
  ca:['Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte','Diumenge']
};
function getDiasSemana(){ return DIAS_SEMANA_I18N[currentLang] || DIAS_SEMANA_I18N.es; }

// Devuelve los turnos (franjas horarias) del día de la semana correspondiente
// a dateStr, o null si el negocio no ha configurado horario (sin restricción).
function getTurnosForDate(dateStr){
  const horario = (DB.business || {}).horario;
  if(!horario || horario.length !== 7) return null;
  const jsDay = new Date(dateStr + 'T00:00:00').getDay(); // 0=domingo..6=sábado
  const d = horario[(jsDay + 6) % 7]; // 0=lunes..6=domingo
  if(!d || d.abierto === false) return [];
  const turnos = [];
  const add = (ini, fin) => { if(ini && fin && fin > ini) turnos.push({abre:ini, cierra:fin}); };
  // Formato nuevo: {modo:'seguido'|'turnos', seguido:{ini,fin}, turnos:[{ini,fin}]}
  if(d.modo === 'seguido' && d.seguido){
    add(d.seguido.ini, d.seguido.fin);
  } else if(Array.isArray(d.turnos)){
    d.turnos.forEach(t => t && add(t.ini, t.fin));
  } else {
    // Formato antiguo: {t1i,t1f,t2i,t2f}
    add(d.t1i, d.t1f);
    add(d.t2i, d.t2f);
  }
  return turnos;
}

function isTimeAllowed(dateStr, time){
  const turnos = getTurnosForDate(dateStr);
  if(turnos === null) return true;
  return turnos.some(t => time >= t.abre && time <= t.cierra);
}

// Devuelve {aforo, turnoIdx, reservados, disponible} o null si no hay aforo
// configurado o la hora no encaja en ningún turno. reservados es el último
// recuento SINCRONIZADO desde el panel interno (puede llevar algo de retraso
// respecto a reservas que otros clientes están completando ahora mismo).
function getAforoInfo(dateStr, time){
  const aforo = parseInt((DB.business||{}).aforo) || 0;
  if(!aforo) return null;
  const turnos = getTurnosForDate(dateStr);
  if(!turnos || !turnos.length) return null;
  const turnoIdx = turnos.findIndex(t => time >= t.abre && time <= t.cierra);
  if(turnoIdx === -1) return null;
  const resumen = (DB.reservasResumen||{})[dateStr] || {};
  const reservados = resumen[turnoIdx] || 0;
  return {aforo, turnoIdx, reservados, disponible: Math.max(0, aforo - reservados)};
}
// Devuelve las plazas disponibles para el turno al que pertenece `time` en `dateStr`,
// o null si no hay aforo configurado o la hora no encaja en ningún turno.
function getAforoDisponible(dateStr, time){
  const info = getAforoInfo(dateStr, time);
  return info ? info.disponible : null;
}
// Reserva de forma ATÓMICA `people` plazas del turno, usando una transacción
// de Firebase sobre un contador de "holds" independiente del resumen ya
// sincronizado. Esto evita que dos clientes reservando casi a la vez (antes
// de que el panel interno vuelva a sincronizar el resumen) puedan juntos
// superar el aforo sin que ninguno de los dos lo viera en su momento. Si la
// transacción no se puede completar sin pasarse del aforo, se aborta
// (result.committed === false) y no se ha reservado nada.
function reserveAforoAtomic(dateStr, turnoIdx, people, aforo, baseline){
  const ref = db.ref('gastrogoan/public/' + publicId + '/aforoHold/' + dateStr + '/' + turnoIdx);
  return ref.transaction(current => {
    const held = current || 0;
    if(baseline + held + people > aforo) return; // abort: se pasaría del aforo
    return held + people;
  });
}

function formatTurnos(turnos){
  return turnos.map(t => `${t.abre}–${t.cierra}`).join(' y ');
}

function nombreDia(dateStr){
  const jsDay = new Date(dateStr + 'T00:00:00').getDay();
  return getDiasSemana()[(jsDay + 6) % 7];
}

function horarioHintHtml(dateStr){
  const turnos = getTurnosForDate(dateStr);
  if(turnos === null) return '';
  if(!turnos.length) return `<p style="font-size:13px;color:#c0392b;margin-top:-8px">${t('hint.cerrado').replace('%s', nombreDia(dateStr).toLowerCase())}</p>`;
  return `<p style="font-size:13px;color:#888;margin-top:-8px">${t('hint.horario').replace('%s', nombreDia(dateStr).toLowerCase()).replace('%s', formatTurnos(turnos))}</p>`;
}

function updateTimeInputRange(dateInputId, timeInputId, hintBoxId){
  const date = document.getElementById(dateInputId).value;
  const turnos = getTurnosForDate(date);
  const timeInput = document.getElementById(timeInputId);
  const hintBox = document.getElementById(hintBoxId);
  hintBox.innerHTML = horarioHintHtml(date);
  if(turnos && turnos.length){
    timeInput.min = turnos[0].abre;
    timeInput.max = turnos[turnos.length - 1].cierra;
  }else{
    timeInput.removeAttribute('min');
    timeInput.removeAttribute('max');
  }
}

/* ============ TIEMPO DE ANTELACIÓN / ZONA DE REPARTO ============ */
// Si el pedido es para hoy, no se puede elegir una hora anterior a
// "ahora + tiempo de antelación configurado por el restaurante".
// Antelación mínima (minutos) que vale tanto para reservas como para pedidos.
// Se configura en Mi Negocio → Operativa. Mantiene compatibilidad con el ajuste antiguo.
function getLeadTimeMin(){
  const b = DB.business || {};
  if(b.leadTimeMin != null) return parseInt(b.leadTimeMin) || 0;
  return parseInt((b.pedidos||{}).leadTimeMin) || 0;
}
function applyLeadTime(dateInputId, timeInputId, hintBoxId){
  const leadTimeMin = getLeadTimeMin();
  const date = document.getElementById(dateInputId).value;
  const timeInput = document.getElementById(timeInputId);
  const hintBox = document.getElementById(hintBoxId);
  if(!leadTimeMin || date !== todayStr()) return;

  const now = new Date(Date.now() + leadTimeMin * 60000);
  const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  if(!timeInput.min || minTime > timeInput.min) timeInput.min = minTime;
  if(timeInput.value && timeInput.value < timeInput.min) timeInput.value = timeInput.min;

  const hint = `<p style="font-size:13px;color:#888;margin-top:-8px">${t('hint.antelacion').replace('%s', minTime).replace('%d', leadTimeMin)}</p>`;
  hintBox.innerHTML = (hintBox.innerHTML || '') + hint;
}

// Distancia en km entre dos puntos (fórmula de Haversine).
function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Comprueba si una dirección/código postal de entrega está dentro de la
// zona de reparto configurada (código postal aceptado o dentro del radio).
// Devuelve {ok, pendienteVerificar}: si el geocodificador falla dos veces
// (red caída, timeout de Nominatim...) no bloqueamos un pedido potencialmente
// válido; lo dejamos pasar marcado para que el negocio revise la dirección
// manualmente antes de aceptarlo.
async function checkDeliveryZone(p, codigoPostal, direccion){
  const cpList = p.cpList || [];
  if(cpList.length && cpList.includes(codigoPostal)) return {ok:true};

  if(p.radiusKm > 0 && p.lat != null && p.lng != null){
    const geocode = async () => {
      const q = encodeURIComponent(direccion + ', ' + codigoPostal);
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + q);
      const data = await res.json();
      return (data && data[0]) ? data[0] : null;
    };
    let point = null;
    try{ point = await geocode(); }catch(e){ console.error(e); point = null; }
    if(!point){
      // Un único reintento tras una breve espera antes de darnos por vencidos.
      await new Promise(r => setTimeout(r, 1200));
      try{ point = await geocode(); }catch(e){ console.error(e); point = null; }
    }
    if(point){
      const dist = haversineKm(p.lat, p.lng, parseFloat(point.lat), parseFloat(point.lon));
      return {ok: dist <= p.radiusKm};
    }
    if(!cpList.length) return {ok:true, pendienteVerificar:true};
  }

  // Si no hay ninguna zona configurada, no se restringe.
  if(!cpList.length && !(p.radiusKm > 0)) return {ok:true};
  return {ok:false};
}

// Calcula el importe de la señal para la reserva actual (según el tipo
// configurado: fijo, o por persona multiplicado por los comensales del
// formulario en este momento).
function reservaDepositAmount(){
  const b = DB.business || {};
  const amount = parseFloat(b.depositAmount) || 0;
  if(b.depositType === 'perPerson'){
    const people = parseInt(document.getElementById('r-people')?.value) || 1;
    return (amount * people).toFixed(2);
  }
  return amount.toFixed(2);
}

function submitReserva(){
  const clientName = document.getElementById('r-name').value.trim();
  const clientPhone = document.getElementById('r-phone').value.trim();

  const time = document.getElementById('r-time').value;

  if(!clientName || !clientPhone || !date || !time){
    alert(t('error.campos.reserva'));
    return;
  }
  if(!document.getElementById('r-privacy-consent').checked){
    alert(t('privacy.mustAccept'));
    return;
  }

  const turnos = getTurnosForDate(date);
  if(turnos !== null && !turnos.length){
    alert(t('error.cerrado').replace('%s', nombreDia(date).toLowerCase()));
    return;
  }
  if(turnos !== null && turnos.length && !isTimeAllowed(date, time)){
    alert(t('error.horario').replace('%s', t('error.horario.reservas')).replace('%s', nombreDia(date).toLowerCase()).replace('%s', formatTurnos(turnos)));
    return;
  }

  const leadTimeMin = getLeadTimeMin();
  if(leadTimeMin && date === todayStr()){
    const now = new Date(Date.now() + leadTimeMin * 60000);
    const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    if(time < minTime){
      alert(t('error.antelacion').replace('%d', leadTimeMin).replace('%s', minTime));
      return;
    }
  }

  const aforoInfo = getAforoInfo(date, time);
  if(aforoInfo && people > aforoInfo.disponible){
    if(aforoInfo.disponible <= 0){
      alert(t('error.aforo.completo'));
    }else{
      alert(t('error.aforo.parcial').replace('%d', aforoInfo.disponible));
    }
    return;
  }

  const depositRequired = !!(DB.business||{}).requireDeposit;
  const req = {
    type:'reserva', clientName, clientPhone, date, time, people, notes, referral,
    depositRequired, depositAmount: depositRequired ? reservaDepositAmount() : '',
    createdAt: new Date().toISOString()
  };

  const btn = document.getElementById('r-submit');
  if(btn) btn.disabled = true;

  if(!aforoInfo){
    sendRequest(req, t('reserva.ok'));
    return;
  }

  // Comprobación final ATÓMICA justo antes de enviar: cierra la ventana de
  // carrera en la que dos clientes reservan casi a la vez y el resumen
  // sincronizado todavía no refleja la reserva del otro.
  reserveAforoAtomic(date, aforoInfo.turnoIdx, people, aforoInfo.aforo, aforoInfo.reservados).then(result => {
    if(!result.committed){
      if(btn) btn.disabled = false;
      alert(t('error.aforo.completo'));
      return;
    }
    sendRequest(req, t('reserva.ok'));
  }).catch(e => {
    console.error(e);
    if(btn) btn.disabled = false;
    // Si la transacción falla por un problema de conexión, dejamos seguir
    // con el envío normal en vez de bloquear al cliente por completo: es
    // preferible el pequeño riesgo de carrera a que no pueda reservar.
    sendRequest(req, t('reserva.ok'));
  });
}

/* ============ MENÚ (carrito compartido) ============ */
function getActiveCartasConPlatos(){
  return getActiveCartas().filter(c => (c.secciones||[]).some(sec => (sec.platos||[]).some(p=>p.disponible!==false)));
}

function buildMenuHtml(cartas){
  return cartas.map(carta => `
    ${cartas.length > 1 ? `<h2>${escapeHtml(trItem(carta))}</h2>` : ''}
    ${(carta.secciones||[]).filter(sec => (sec.platos||[]).some(p=>p.disponible!==false)).map(sec => `
      ${sec.nombre && sec.nombre !== 'OTROS PLATOS' ? `<h3>${escapeHtml(trSection(sec))}</h3>` : ''}
      ${sec.platos.filter(p=>p.disponible!==false).map(p => `
        <div class="menu-item">
          <div>
            <div class="name">${escapeHtml(trPlato(p))}</div>
            <div class="price">${fmtMoney(p.precio)}</div>
          </div>
          <div class="qty-ctl">
            <button onclick="changeCartQty(${p.id}, '${escapeHtml(sec.id)}', -1)">−</button>
            <span id="qty-${p.id}">${getCartQty(p.id)}</span>
            <button onclick="changeCartQty(${p.id}, '${escapeHtml(sec.id)}', 1, '${escapeHtml(p.nombre)}', ${p.precio})">+</button>
          </div>
        </div>
      `).join('')}
    `).join('')}
  `).join('');
}

function getCartQty(recipeId){
  const line = cart.find(l => l.recipeId === recipeId);
  return line ? line.qty : 0;
}

function changeCartQty(recipeId, sectionId, delta, name, price){
  let line = cart.find(l => l.recipeId === recipeId);
  if(!line){
    if(delta <= 0) return;
    line = {recipeId, sectionId, name, price, qty:0};
    cart.push(line);
  }
  line.qty += delta;
  if(line.qty <= 0) cart = cart.filter(l => l !== line);

  const span = document.getElementById('qty-'+recipeId);
  if(span){
    span.textContent = getCartQty(recipeId);
    span.classList.remove('bump'); void span.offsetWidth; span.classList.add('bump');
  }
  renderCartSummary();
}

// Cupón aplicado en esta sesión (código + % de descuento validados contra
// DB.coupons, sincronizado desde el negocio en el mismo espejo público que
// la carta/mesas). Se revalida otra vez al recibir el pedido en el negocio
// por si acaso se agotó justo entre medias.
let appliedCoupon = null;
let couponHintMessage = null; // {text, color} — renderCartSummary() reconstruye el div del cupón entero, así que el mensaje se guarda aquí para sobrevivir a ese re-render en vez de perderse al escribirlo directamente en el DOM.
function applyPublicCoupon(){
  const input = document.getElementById('o-coupon-code');
  const code = (input.value||'').trim().toUpperCase();
  if(!code){ appliedCoupon = null; couponHintMessage = null; renderCartSummary(); return; }
  const match = (DB.coupons||[]).find(c => c.code === code);
  if(!match){
    appliedCoupon = null;
    couponHintMessage = {text: t('coupon.notFoundPublic'), color: 'var(--red, #c0392b)'};
  }else{
    appliedCoupon = match;
    couponHintMessage = {text: t('coupon.appliedPublic').replace('%d', match.discountPct), color: 'green'};
  }
  renderCartSummary();
}
function renderCartSummary(){
  const box = document.getElementById('cart-summary');
  if(!box) return;
  const submitBtn = document.getElementById('o-submit');
  if(!cart.length){
    box.innerHTML = `<div class="empty">${t('cart.empty')}</div>`;
    if(submitBtn) submitBtn.disabled = true;
    return;
  }
  const p = (DB.business||{}).pedidos || {};
  const deliveryFee = currentTab === 'delivery' ? (p.deliveryFee || 0) : 0;
  const subtotal = cart.reduce((s,l)=>s+l.price*l.qty,0);
  const discountAmount = appliedCoupon ? subtotal * appliedCoupon.discountPct / 100 : 0;
  const total = subtotal - discountAmount + deliveryFee;
  const pedidoMinimo = currentTab !== 'mesa' ? (p.pedidoMinimo || 0) : 0;
  const bajoMinimo = pedidoMinimo > 0 && subtotal < pedidoMinimo;
  if(submitBtn) submitBtn.disabled = bajoMinimo;
  const hasCoupons = (DB.coupons||[]).length > 0;
  box.innerHTML = `
    <h2>${t('cart.title')}</h2>
    ${cart.map(l => `<div class="cart-line"><span>${l.qty}× ${escapeHtml(l.name)}</span><span>${fmtMoney(l.price*l.qty)}</span></div>`).join('')}
    ${deliveryFee > 0 ? `<div class="cart-line"><span>${t('cart.shipping')}</span><span>${fmtMoney(deliveryFee)}</span></div>` : ''}
    ${discountAmount > 0 ? `<div class="cart-line"><span>${t('coupon.discountLine').replace('%d', appliedCoupon.discountPct)}</span><span>-${fmtMoney(discountAmount)}</span></div>` : ''}
    <div class="cart-total bump"><span>${t('cart.total')}</span><span>${fmtMoney(total)}</span></div>
    ${bajoMinimo ? `<p style="font-size:13px;color:var(--red);margin-top:8px">${t('cart.min').replace('%s', fmtMoney(pedidoMinimo)).replace('%s', fmtMoney(pedidoMinimo - subtotal))}</p>` : ''}
    ${hasCoupons ? `
    <div style="display:flex;gap:6px;margin-top:10px">
      <input type="text" id="o-coupon-code" placeholder="${t('coupon.codePlaceholderPublic')}" style="flex:1;text-transform:uppercase;padding:8px;border-radius:8px;border:1px solid #ddd" value="${appliedCoupon?appliedCoupon.code:''}">
      <button type="button" class="btn" onclick="applyPublicCoupon()">${t('coupon.applyBtn')}</button>
    </div>
    <div id="o-coupon-hint" style="font-size:12px;margin-top:4px;color:${couponHintMessage?couponHintMessage.color:'inherit'}">${couponHintMessage?escapeHtml(couponHintMessage.text):''}</div>
    ` : ''}
  `;
}

async function submitOrder(){
  if(!cart.length){ alert(t('error.carrito.vacio')); return; }
  const clienteNombre = document.getElementById('o-name').value.trim();
  const clienteTelefono = document.getElementById('o-phone').value.trim();
  const date = document.getElementById('o-date').value;
  const time = document.getElementById('o-time').value;
  const isDelivery = currentTab === 'delivery';
  const clienteDireccion = isDelivery ? document.getElementById('o-address').value.trim() : '';
  const notas = document.getElementById('o-notes').value.trim();
  const p = (DB.business||{}).pedidos || {};
  const zoneRestricted = isDelivery && ((p.cpList||[]).length || p.radiusKm > 0);
  const codigoPostal = zoneRestricted ? document.getElementById('o-cp').value.trim() : '';

  if(!clienteNombre || !clienteTelefono || !date || !time || (isDelivery && !clienteDireccion) || (zoneRestricted && !codigoPostal)){
    alert(t('error.campos'));
    return;
  }

  const subtotal = cart.reduce((s,l)=>s+l.price*l.qty,0);
  const pedidoMinimo = p.pedidoMinimo || 0;
  if(pedidoMinimo > 0 && subtotal < pedidoMinimo){
    alert(t('error.pedido.min').replace('%s', fmtMoney(pedidoMinimo)));
    return;
  }

  const turnos = getTurnosForDate(date);
  if(turnos !== null && !turnos.length){
    alert(t('error.cerrado').replace('%s', nombreDia(date).toLowerCase()));
    return;
  }
  if(turnos !== null && turnos.length && !isTimeAllowed(date, time)){
    alert(t('error.horario').replace('%s', t('error.horario.pedidos')).replace('%s', nombreDia(date).toLowerCase()).replace('%s', formatTurnos(turnos)));
    return;
  }

  const leadTimeMin = getLeadTimeMin();
  if(leadTimeMin && date === todayStr()){
    const now = new Date(Date.now() + leadTimeMin * 60000);
    const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    if(time < minTime){
      alert(t('error.antelacion').replace('%d', leadTimeMin).replace('%s', minTime));
      return;
    }
  }

  let pendienteVerificarZona = false;
  if(zoneRestricted){
    const zoneCheck = await checkDeliveryZone(p, codigoPostal, clienteDireccion);
    if(!zoneCheck.ok){
      alert(t('error.zona'));
      return;
    }
    pendienteVerificarZona = !!zoneCheck.pendienteVerificar;
  }

  const deliveryFee = isDelivery ? (p.deliveryFee || 0) : 0;
  const discountAmount = appliedCoupon ? subtotal * appliedCoupon.discountPct / 100 : 0;
  const total = subtotal - discountAmount + deliveryFee;

  const req = {
    type:'pedido', tipo: isDelivery ? 'delivery' : 'takeaway',
    clienteNombre, clienteTelefono, clienteDireccion, codigoPostal, notas, date, time,
    costeEnvio: deliveryFee,
    items: cart.map(l => ({name:l.name, price:l.price, qty:l.qty})),
    createdAt: new Date().toISOString()
  };
  if(appliedCoupon) req.promoCode = appliedCoupon.code;
  if(pendienteVerificarZona) req.pendienteVerificarZona = true;

  req.total = total;

  const pagoTarjeta = redsysConfigured && document.querySelector('input[name="o-pago"]:checked')?.value === 'tarjeta';
  if(pagoTarjeta){
    setPaySubmitEnabled(false);
    payWithCard(req, total, isDelivery ? t('order.delivery.title') : t('order.takeaway.title'));
    return;
  }

  sendRequest(req, t('order.ok'));
}

/* ============ PAGO CON TARJETA (TPV virtual / Redsys) ============
   1) Enviamos el pedido como siempre (con una referencia propia).
   2) Pedimos al Worker que firme el pago con esa referencia.
   3) Redirigimos al cliente al TPV de Redsys. Cuando el banco confirme el
      pago, el Worker avisará automáticamente al restaurante. */
function payWithCard(req, amount, description){
  const clientRef = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2);
  req.clientRef = clientRef;

  db.ref('gastrogoan/public/' + publicId + '/requests').push(req).then(() => {
    const base = location.href.split('?')[0] + '?neg=' + encodeURIComponent(publicId);
    return fetch(`${REDSYS_WORKER_URL}/sign`, {
      method: 'POST',
      headers: {'content-type':'application/json'},
      body: JSON.stringify({
        publicId, orderRef: clientRef, amount, description,
        urlOk: base + '&pago=ok',
        urlKo: base + '&pago=ko'
      })
    });
  }).then(r => r.json()).then(data => {
    if(!data || !data.url || data.error){
      showInlineError(t('error.pago') + (data && data.error ? ' ' + data.error : ''));
      setPaySubmitEnabled(true);
      return;
    }
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = data.url;
    Object.entries(data.fields).forEach(([k,v]) => {
      const input = document.createElement('input');
      input.type = 'hidden'; input.name = k; input.value = v;
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
  }).catch(e => {
    console.error(e);
    showInlineError(t('error.pago.conexion'));
    setPaySubmitEnabled(true);
  });
}
function setPaySubmitEnabled(enabled){
  const btn = document.getElementById('o-submit');
  if(btn) btn.disabled = !enabled;
}

function renderMesaOrderForm(){

  if(!cartas.length){
    box.innerHTML = `<div class="card"><div class="empty">${t('carta.empty.mesa')}</div></div>`;
    return;
  }

  const tables = DB.tables || [];
  const currentTable = tableIdFromUrl ? tables.find(tb => String(tb.id) === String(tableIdFromUrl)) : null;

  const menuHtml = buildMenuHtml(cartas);

  box.innerHTML = `
    <div class="card">
      <h2>${t('order.mesa.title')}</h2>
      ${currentTable
        ? `<p style="font-size:13px;color:#888;margin-top:-6px">${t('order.mesa.info').replace('%s', escapeHtml(currentTable.name))}</p>`

          ? `<p style="font-size:13px;color:var(--red);margin-top:-6px">${t('order.mesa.unknown')}</p>

                 ${tables.map(tb => `<option value="${tb.id}">${escapeHtml(tb.name)}</option>`).join('')}
               </select>
             </div>`}
      ${menuHtml}
    </div>
    <div class="card" id="cart-summary"></div>
    <div class="card">
      <div class="field">
        <label>${t('order.nombre')}</label>
        <input type="text" id="m-name">
      </div>
      <div class="field">
        <label>${t('order.notas')}</label>
        <textarea id="m-notes" placeholder="${t('order.notas.placeholder')}"></textarea>
      </div>
      <button class="btn btn-primary" id="o-submit" onclick="submitMesaOrder()">${t('order.submit.mesa')}</button>
    </div>
  `;
  renderCartSummary();
}

function submitMesaOrder(){
  if(!cart.length){ alert(t('error.carrito.vacio')); return; }

  const tables = DB.tables || [];
  let tableId = null;
  if(tableIdFromUrl){
    const currentTable = tables.find(tb => String(tb.id) === String(tableIdFromUrl));
    if(currentTable){
      tableId = currentTable.id;
    }else{
      const manual = document.getElementById('m-table-manual');
      if(!manual || !manual.value.trim()){ alert(t('error.mesa.manual')); return; }
      tableId = manual.value.trim();
    }
  }else{
    const sel = document.getElementById('m-table');
    if(!sel || !sel.value){ alert(t('error.mesa.select')); return; }
    tableId = tables.find(tb => String(tb.id) === sel.value).id;
  }

  const clienteNombre = document.getElementById('m-name').value.trim();
  const notas = document.getElementById('m-notes').value.trim();

  const req = {
    type:'pedido', tipo:'mesa', tableId,
    clienteNombre, notas,
    items: cart.map(l => ({name:l.name, price:l.price, qty:l.qty})),
    total: cart.reduce((s,l)=>s+l.price*l.qty,0),
    createdAt: new Date().toISOString()
  };
  sendRequest(req, t('order.ok.mesa'));
}

/* ============ ENVÍO ============ */
function sendRequest(req, successMsg){
  db.ref('gastrogoan/public/' + publicId + '/requests').push(req).then(() => {
    document.getElementById('app').innerHTML = `
      <div class="success">
        <div class="icon">✅</div>
        <h2>${escapeHtml(successMsg)}</h2>
        <button class="btn" style="margin-top:16px" onclick="location.reload()">${t('success.otra')}</button>
      </div>
    `;
  }).catch(e => {
    console.error(e);
    alert(t('error.envio'));
  });
}

init();

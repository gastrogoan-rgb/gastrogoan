// Un único grupo de opciones con las 3 formas de pago posibles (en vez del
// antiguo esquema de dos niveles "online vs en persona" + "efectivo vs
// tarjeta"): efectivo, tarjeta al entregar/recoger, y TPV virtual (pagar ya
// online con tarjeta, si el negocio lo tiene configurado). Respeta lo que
// el negocio haya marcado en Mi Negocio → Pedidos; si solo hay una
// disponible, se fija sin preguntar.
function renderPaymentMethodRadiosHtml(p){
  // Compatibilidad con negocios que ya tenían el antiguo interruptor
  // "permitirPagoLocal: false" (pago online obligatorio) puesto de antes de
  // que existieran estas 3 casillas independientes: si nunca han tocado el
  // nuevo ajuste (aceptaEfectivo/aceptaTarjetaLocal siguen "undefined", no
  // "false" explícito), se respeta la preferencia antigua. En cuanto el
  // dueño guarda el nuevo ajuste una vez, savePedidosConfig fija
  // permitirPagoLocal=true y ya no vuelve a aplicar este fallback.
  const legacyForceOnline = p.permitirPagoLocal === false && p.aceptaEfectivo === undefined && p.aceptaTarjetaLocal === undefined;
  const opts = [];
  if(pagoOnlineActivo && p.aceptaTpvVirtual !== false) opts.push({value:'tpv', label:t('pago.tarjeta')});
  if(!legacyForceOnline && p.aceptaEfectivo !== false) opts.push({value:'efectivo', label: t('pago.efectivo')});
  if(!legacyForceOnline && p.aceptaTarjetaLocal !== false) opts.push({value:'tarjeta_local', label: t('pago.tarjetaLocal')});
  if(!opts.length) opts.push({value:'efectivo', label: t('pago.efectivo')}); // salvaguarda: nunca dejar el formulario sin ninguna opción
  if(opts.length === 1){
    return `<input type="radio" name="o-pago-metodo" value="${opts[0].value}" checked style="display:none"><p style="font-size:13px;color:var(--muted)">${t('pago.metodoFijado').replace('%s', opts[0].label)}</p>`;
  }
  return `
    <label>${t('pago')}</label>
    ${opts.map((o,i) => `<label style="display:flex;align-items:center;gap:10px;font-weight:400;margin-bottom:6px;padding:6px 0"><input type="radio" name="o-pago-metodo" value="${o.value}" ${i===0?'checked':''} onchange="updateCashAmountVisibility()" style="width:20px;height:20px;flex-shrink:0"> ${o.label}</label>`).join('')}
  `;
}
// El importe del billete con el que se va a pagar solo tiene sentido si
// eligen efectivo Y es un pedido a domicilio (para recoger en el local no
// hace falta preparar cambio, el cliente paga en persona en el mostrador).
function updateCashAmountVisibility(){
  const sel = document.querySelector('input[name="o-pago-metodo"]:checked');
  const wrap = document.getElementById('o-cash-amount-wrap');
  if(wrap) wrap.style.display = (currentTab === 'delivery' && sel && sel.value === 'efectivo') ? '' : 'none';
}

// Identificador único de una línea del carrito: por plato solo para los
// platos SIN extras (se pueden agrupar en un único contador +/-), y por
// plato+combinación exacta de extras elegidos para los que sí tienen —
// así "1 pizza con extra queso" y "1 pizza sin nada" son líneas distintas
// del carrito, cada una con su propia cantidad, en vez de mezclarse en un
// solo contador que no podría representar la diferencia.
function cartLineKey(platoId, modIds){
  return (modIds && modIds.length) ? (platoId + ':' + [...modIds].sort((a,b)=>a-b).join(',')) : String(platoId);
}
// Busca el plato (con su lista de extras) dentro de las cartas activas —
// hace falta al confirmar el modal de extras, donde solo tenemos el id.
function findPlatoById(platoId){
  for(const c of (DB.cartas||[])){
    for(const sec of (c.secciones||[])){
      const p = (sec.platos||[]).find(x => x.id === platoId);
      if(p) return {plato: p, sectionId: sec.id};
    }
  }
  return null;
}

function getCartQty(recipeId){
  // Solo cuenta la línea SIN extras (la del contador +/- de la lista) —
  // las líneas con extras elegidos tienen su propio contador en el
  // resumen del carrito, ver renderCartSummary/tipSelectorHtml.
  const line = cart.find(l => l.recipeId === recipeId && (!l.modificadores || !l.modificadores.length));
  return line ? line.qty : 0;
}

function changeCartQty(recipeId, sectionId, delta, name, price){
  let line = cart.find(l => l.recipeId === recipeId && (!l.modificadores || !l.modificadores.length));
  if(!line){
    if(delta <= 0) return;
    line = {key: cartLineKey(recipeId, []), recipeId, sectionId, name, price, qty:0, modificadores:[]};
    cart.push(line);
  }
  line.qty += delta;
  if(line.qty <= 0) cart = cart.filter(l => l !== line);

  const span = document.getElementById('qty-'+recipeId);
  if(span){
    span.textContent = getCartQty(recipeId);
    span.classList.remove('bump'); void span.offsetWidth; span.classList.add('bump');
  }
  renderCartSummary();
}

// Ajusta la cantidad de una línea YA en el carrito por su clave exacta —
// se usa desde el resumen del carrito para las líneas con extras (que no
// tienen un contador +/- propio en el listado de la carta, porque ahí solo
// cabe "Añadir", ver openModifierModal).
function changeCartLineQty(key, delta){
  const line = cart.find(l => l.key === key);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0) cart = cart.filter(l => l !== line);
  renderCartSummary();
}

/* ============ EXTRAS / MODIFICADORES por plato ============
   Un plato con extras configurados (p.modificadores, cada uno {id,nombre,
   precio}) no usa el contador +/- directo: se abre un modal para elegir
   cuáles quiere (checkboxes, sin restricción de cardinalidad — así está
   modelado en la app principal, ver js/menu.js) y SOLO entonces se añade
   al carrito, con el precio final ya calculado. */
let modModalContext = null;
function openModifierModal(platoId){
  const found = findPlatoById(platoId);
  if(!found) return;
  const { plato } = found;
  const promo = getActivePromoForPlatoPublic(platoId);
  const basePrice = promo ? promoDiscountedPrice(publicPlatoPrice(plato), promo) : publicPlatoPrice(plato);
  modModalContext = { platoId, basePrice };
  ensureModalChrome();
  document.getElementById('modal-box').innerHTML = `
    <button class="modal-close" onclick="closeInfoModal()" aria-label="${escapeHtml(t('common.close')||'Cerrar')}">&times;</button>
    <h2>${escapeHtml(trPlato(plato))}</h2>
    <p style="font-size:13px;color:var(--muted);margin-top:-4px">${t('modifiers.hint')}</p>
    <div style="margin:14px 0">
      ${(plato.modificadores||[]).map(m => `
        <label style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer">
          <input type="checkbox" class="mod-check" value="${m.id}" style="width:20px;height:20px;flex:none">
          <span style="flex:1;font-size:14px">${escapeHtml(trItem(m))}</span>
          ${m.precio ? `<span class="mono" style="font-size:12.5px;color:var(--muted)">+${fmtMoney(m.precio)}</span>` : ''}
        </label>
      `).join('')}
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="confirmAddWithModifiers()">${t('modifiers.add')}</button>
  `;
  document.getElementById('modal-overlay').classList.add('active');
}
function confirmAddWithModifiers(){
  if(!modModalContext) return;
  const found = findPlatoById(modModalContext.platoId);
  if(!found){ closeInfoModal(); return; }
  const { plato, sectionId } = found;
  const checkedIds = [...document.querySelectorAll('.mod-check:checked')].map(el => parseInt(el.value));
  const selected = (plato.modificadores||[]).filter(m => checkedIds.includes(m.id));
  const finalPrice = modModalContext.basePrice + selected.reduce((s,m)=>s+(m.precio||0),0);
  const key = cartLineKey(plato.id, selected.map(m=>m.id));
  let line = cart.find(l => l.key === key);
  if(!line){
    line = {key, recipeId: plato.id, sectionId, name: plato.nombre, price: finalPrice, qty:0, modificadores: selected};
    cart.push(line);
  }
  line.qty += 1;
  modModalContext = null;
  closeInfoModal();
  renderCartSummary();
}

// Menús combo (ej. "Menú del día"): antes no se publicaban al espejo
// público en absoluto (ver syncPublicMirror, js/core.js), así que un
// cliente nunca podía pedir un menú desde el móvil, solo platos sueltos.
function getActiveMenusPublic(){
  const ids = DB.activeMenuIds || [];
  return (DB.menus||[]).filter(m => ids.includes(m.id) && m.disponible !== false && (m.grupos||[]).length);
}
let menuModalContext = null;
function openMenuModal(menuId){
  const m = (DB.menus||[]).find(x=>x.id===menuId);
  if(!m) return;
  menuModalContext = { menuId };
  ensureModalChrome();
  document.getElementById('modal-box').innerHTML = `
    <button class="modal-close" onclick="closeInfoModal()" aria-label="${escapeHtml(t('common.close')||'Cerrar')}">&times;</button>
    <h2>${escapeHtml(trItem(m))} · ${fmtMoney(m.precio)}</h2>
    ${(m.grupos||[]).map(g => `
      <div class="field">
        <label>${escapeHtml(trItem(g))}</label>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${(()=>{
            const opcionesDisponibles = (g.opciones||[]);
            const primeraLibre = opcionesDisponibles.findIndex(o => o.disponible !== false);
            return opcionesDisponibles.map((o,i) => `
              <label style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);${o.disponible===false?'opacity:.5;cursor:not-allowed':'cursor:pointer'}">
                <input type="radio" name="menu-grupo-${g.id}" value="${o.id}" ${i===primeraLibre?'checked':''} ${o.disponible===false?'disabled':''} style="width:20px;height:20px;flex:none">
                <span style="flex:1;font-size:14px">${escapeHtml(trItem(o))}${dishAllergensHtml(o.id)}</span>
                ${o.suplemento ? `<span class="mono" style="font-size:12.5px;color:var(--muted)">+${fmtMoney(o.suplemento)}</span>` : ''}
                ${o.disponible===false ? `<span style="font-size:11px;color:var(--red)">${t('common.unavailable')}</span>` : ''}
              </label>
            `).join('');
          })()}
        </div>
      </div>
    `).join('')}
    <button class="btn btn-primary" style="width:100%" onclick="confirmAddMenuFromModal()">${t('modifiers.add')}</button>
  `;
  document.getElementById('modal-overlay').classList.add('active');
}
function confirmAddMenuFromModal(){
  if(!menuModalContext) return;
  const m = (DB.menus||[]).find(x=>x.id===menuModalContext.menuId);
  if(!m){ closeInfoModal(); return; }
  let extra = 0;
  const selections = (m.grupos||[]).map(g => {
    const selId = parseInt(document.querySelector(`input[name="menu-grupo-${g.id}"]:checked`)?.value);
    const o = (g.opciones||[]).find(x=>x.id===selId) || (g.opciones||[]).find(x=>x.disponible!==false);
    if(!o) return null;
    extra += o.suplemento||0;
    // Nombre crudo, sin traducir: esto viaja a DB.tpvOrders y se queda ahí
    // para siempre (comanda, historial de ventas) — trItem() es solo para
    // pintar el modal, no para lo que se guarda (ver principio de i18n:
    // "un dato guardado no se traduce; se traduce al mostrarlo").
    return { nombre: `${g.nombre}: ${o.nombre}`, precio: o.suplemento||0 };
  }).filter(Boolean);
  const finalPrice = (m.precio||0) + extra;
  const key = 'menu:' + m.id + ':' + selections.map(s=>s.nombre).join('|');
  let line = cart.find(l => l.key === key);
  if(!line){
    line = { key, recipeId: null, sectionId: null, name: m.nombre, price: finalPrice, qty: 0, modificadores: selections };
    cart.push(line);
  }
  line.qty += 1;
  menuModalContext = null;
  closeInfoModal();
  renderCartSummary();
}
function buildMenusHtml(){
  const menus = getActiveMenusPublic();
  if(!menus.length) return '';
  return `
    <h2>${escapeHtml(t('menus.title'))}</h2>
    ${menus.map(m => {
      const totalInCart = cart.filter(l => l.key.startsWith('menu:'+m.id+':')).reduce((s,l)=>s+l.qty,0);
      return `
      <div class="menu-item">
        <div>
          <div class="name">${escapeHtml(trItem(m))}</div>
          <div class="price">${fmtMoney(m.precio)} <span style="color:var(--muted)">${t('modifiers.fromPrice')}</span></div>
        </div>
        <button class="btn btn-sm" style="width:auto;min-height:38px;padding:8px 14px;white-space:nowrap;position:relative" onclick="openMenuModal(${m.id})">
          ${t('modifiers.addBtn')}${totalInCart ? ` <span class="mono" style="margin-left:4px">(${totalInCart})</span>` : ''}
        </button>
      </div>
    `;}).join('')}
  `;
}

// Coste de envío a domicilio, con posibilidad de que el negocio lo haga
// gratis a partir de un importe mínimo de pedido (p.freeDeliveryFrom, 0 o
// sin definir = no hay umbral, siempre se cobra el envío fijo).
function getDeliveryFee(p, subtotal, isDelivery){
  if(!isDelivery) return 0;
  const fee = p.deliveryFee || 0;
  const freeFrom = p.freeDeliveryFrom || 0;
  if(freeFrom > 0 && subtotal >= freeFrom) return 0;
  return fee;
}

// Importe de propina a partir del % elegido (o el importe fijo si se
// escribió uno "otro importe") sobre el subtotal de platos — nunca sobre
// el gasto de envío, igual que se calcularía a mano.
function computeTipAmount(subtotal){
  if(cartTipPct === 'custom') return Math.max(0, cartTipCustom || 0);
  return Math.round(subtotal * (cartTipPct||0) / 100 * 100) / 100;
}
function setTip(pct){
  cartTipPct = pct;
  cartTipCustom = 0;
  renderCartSummary();
}
/* "Otro" hacía focus() sobre el campo del importe... que solo se pinta
   CUANDO ya está elegido "Otro". Así que el botón no hacía absolutamente
   nada: el cliente lo pulsaba, no pasaba nada y se iba sin dejar propina
   (lo vio el dueño el 12/09). Primero se marca la opción, y el foco se
   pone después, ya con el campo en pantalla. */
function activarPropinaOtra(){
  cartTipPct = 'custom';
  cartTipCustom = 0;
  renderCartSummary();
  const el = document.getElementById('tip-custom-input');
  if(el) el.focus();
}
function setTipCustom(val){
  cartTipPct = 'custom';
  cartTipCustom = Math.max(0, parseFloat(val) || 0);
  renderCartSummary();
}
function tipSelectorHtml(){
  const opts = [0, 5, 10, 15];
  return `
    <div class="field" style="margin-top:14px;margin-bottom:0">
      <label>${t('cart.tip.label')}</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${opts.map(pct => `<button type="button" class="btn btn-sm" style="flex:1;min-width:56px;padding:9px 6px;min-height:38px;font-size:13px;${cartTipPct===pct?'background:var(--ink);color:#fff':''}" onclick="setTip(${pct})">${pct===0?t('cart.tip.none'):pct+'%'}</button>`).join('')}
        <button type="button" class="btn btn-sm" style="flex:1;min-width:56px;padding:9px 6px;min-height:38px;font-size:13px;${cartTipPct==='custom'?'background:var(--ink);color:#fff':''}" onclick="activarPropinaOtra()">${t('cart.tip.other')}</button>
      </div>
      ${cartTipPct==='custom' ? `<input type="number" id="tip-custom-input" min="0" step="0.5" value="${cartTipCustom||''}" placeholder="${t('cart.tip.otherPlaceholder')}" style="margin-top:8px" oninput="setTipCustom(this.value)">` : ''}
    </div>
  `;
}
function renderCartSummary(){
  const box = document.getElementById('cart-summary');
  if(!box) return;
  const submitBtn = document.getElementById('o-submit');
  if(!cart.length){
    box.innerHTML = `<div class="empty">${t('cart.empty')}</div>`;
    if(submitBtn) submitBtn.disabled = true;
    return;
  }
  const p = (DB.business||{}).pedidos || {};
  const subtotal = cart.reduce((s,l)=>s+l.price*l.qty,0);
  const deliveryFee = getDeliveryFee(p, subtotal, currentTab === 'delivery');
  const freeFrom = p.freeDeliveryFrom || 0;
  const missingForFreeDelivery = currentTab === 'delivery' && freeFrom > 0 && subtotal < freeFrom ? freeFrom - subtotal : 0;
  const tip = computeTipAmount(subtotal);
  const total = subtotal + deliveryFee + tip;
  const pedidoMinimo = currentTab !== 'mesa' ? (p.pedidoMinimo || 0) : 0;
  const bajoMinimo = pedidoMinimo > 0 && subtotal < pedidoMinimo;
  if(submitBtn) submitBtn.disabled = bajoMinimo;
  box.innerHTML = `
    <h2>${t('cart.title')}</h2>
    ${cart.map(l => {
      const modsText = (l.modificadores||[]).length ? `<div style="font-size:11.5px;color:var(--muted);margin-top:1px">${l.modificadores.map(m=>escapeHtml(trItem(m))).join(', ')}</div>` : '';
      // Las líneas con extras llevan su propio +/- aquí (en el listado de la
      // carta solo tienen el botón "Añadir", ver buildMenuHtml) — así se
      // puede ajustar la cantidad de "pizza con extra queso" sin afectar a
      // "pizza sin nada", que es una línea distinta del carrito.
      // También los menús combo (recipeId null): no se pueden ajustar desde
      // el listado de la carta, así que sin sus propios +/- aquí una línea
      // de menú cuyos grupos se quedaran sin opciones disponibles (y por
      // tanto sin extras) no había forma humana de quitarla del carrito.
      const hasMods = (l.modificadores||[]).length > 0 || l.recipeId == null;
      return `
      <div class="cart-line" style="align-items:flex-start;padding:8px 0">
        <div style="flex:1">
          <div>${hasMods ? '' : (l.qty+'× ')}${escapeHtml(l.name)}</div>
          ${modsText}
        </div>
        ${hasMods
          ? `<div class="qty-ctl" style="gap:6px">
               <button onclick="changeCartLineQty('${escapeJsAttr(l.key)}', -1)" aria-label="${escapeHtml(t('aria.removeItem').replace('%s', l.name))}" style="width:26px;height:26px;font-size:14px">−</button>
               <span class="mono" style="min-width:14px;text-align:center">${l.qty}</span>
               <button onclick="changeCartLineQty('${escapeJsAttr(l.key)}', 1)" aria-label="${escapeHtml(t('aria.addItem').replace('%s', l.name))}" style="width:26px;height:26px;font-size:14px">+</button>
             </div>`
          : ''}
        <span style="white-space:nowrap;margin-left:8px">${fmtMoney(l.price*l.qty)}</span>
      </div>`;
    }).join('')}
    ${currentTab === 'delivery' && freeFrom > 0 && deliveryFee === 0 && subtotal > 0 ? `<div class="cart-line"><span>${t('cart.shipping')}</span><span style="color:var(--olive);font-weight:600">${t('cart.shipping.free')}</span></div>` : (deliveryFee > 0 ? `<div class="cart-line"><span>${t('cart.shipping')}</span><span>${fmtMoney(deliveryFee)}</span></div>` : '')}
    ${tip > 0 ? `<div class="cart-line"><span>${t('cart.tip.line')}</span><span>${fmtMoney(tip)}</span></div>` : ''}
    ${missingForFreeDelivery > 0 ? `<p style="font-size:12.5px;color:var(--muted);margin:4px 0 0">🚚 ${t('cart.shipping.freeHint').replace('%s', fmtMoney(missingForFreeDelivery))}</p>` : ''}
    <div class="cart-total bump" aria-live="polite"><span>${t('cart.total')}</span><span>${fmtMoney(total)}</span></div>
    ${bajoMinimo ? `<p style="font-size:13px;color:var(--red);margin-top:8px">${t('cart.min').replace('%s', fmtMoney(pedidoMinimo)).replace('%s', fmtMoney(pedidoMinimo - subtotal))}</p>` : ''}
    ${currentTab !== 'mesa' && (document.getElementById('o-date')?.value||todayStr()) === todayStr() ? etaHintHtml() : ''}
    ${qrMesaToken && currentTab === 'mesa' ? '' : tipSelectorHtml()}
  `;
}

// Estimación de "tu pedido debería estar listo en X min" a partir de la
// carga real de cocina ahora mismo (cocinaCargaActiva, sincronizado en
// vivo) — no un tiempo fijo que sea mentira en hora punta o exagerado en
// horas tranquilas. Formula configurable desde Mi Negocio → Pedidos:
// tiempo base + minutos extra por cada pedido que cocina tiene aún sin
// terminar, con un tope máximo para no anunciar esperas disparatadas.
function etaHintHtml(){
  const p = (DB.business||{}).pedidos || {};
  const base = p.tiempoBasePrep != null ? p.tiempoBasePrep : 15;
  const extra = p.extraPorPedidoEnCola != null ? p.extraPorPedidoEnCola : 3;
  const max = p.tiempoMaxEstimado != null ? p.tiempoMaxEstimado : 60;
  const carga = DB.cocinaCargaActiva || 0;
  const eta = Math.min(base + carga * extra, max || (base + carga * extra));
  const label = currentTab === 'delivery' ? t('cart.etaDelivery') : t('cart.etaTakeaway');
  return `<p class="hi hi-clock" style="font-size:13px;color:var(--muted);margin-top:8px">${label.replace('%d', eta)}</p>`;
}

async function submitOrder(){
  if(!cart.length){ showInlineError(t('error.carrito.vacio')); return; }
  if((DB.business||{}).pedidosOnlineActivos === false){ showInlineError(t('error.pedidosPausados.body')); return; }
  if(submittingRequest) return;
  submittingRequest = true;
  setBtnLoading('o-submit', true);
  const clienteNombre = document.getElementById('o-name').value.trim();
  const clienteTelefono = document.getElementById('o-phone').value.trim();
  const clienteEmail = document.getElementById('o-email').value.trim();
  const date = document.getElementById('o-date').value;
  const time = document.getElementById('o-time').value;
  const isDelivery = currentTab === 'delivery';
  const clienteDireccion = isDelivery ? document.getElementById('o-address').value.trim() : '';
  const notas = document.getElementById('o-notes').value.trim();
  const p = (DB.business||{}).pedidos || {};
  const zoneRestricted = isDelivery && ((p.cpList||[]).length || p.radiusKm > 0);
  // El código postal se pide SIEMPRE en domicilio, no solo cuando hay zona
  // configurada: una sola línea de "dirección" a mano es demasiado ambigua
  // para un repartidor (o para geocodificar bien contra el radio, si lo
  // hay) — con el CP aparte no hay duda de a qué zona pertenece.
  const codigoPostal = isDelivery ? document.getElementById('o-cp').value.trim() : '';

  clearFieldInvalid(['o-name','o-phone','o-date','o-time','o-address','o-cp','o-email']);
  if(!clienteNombre || !clienteTelefono || !date || !time || (isDelivery && !clienteDireccion) || (isDelivery && !codigoPostal)){
    if(!clienteNombre) markFieldInvalid('o-name');
    if(!clienteTelefono) markFieldInvalid('o-phone');
    if(!date) markFieldInvalid('o-date');
    if(!time) markFieldInvalid('o-time');
    if(isDelivery && !clienteDireccion) markFieldInvalid('o-address');
    if(isDelivery && !codigoPostal) markFieldInvalid('o-cp');
    showInlineError(t('error.campos'));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  // Igual que en la reserva: el "min" del <input type=date> es solo una
  // pista del navegador, editable a mano o con el reloj del dispositivo
  // cambiado — se revalida aquí que no sea una fecha ya pasada.
  if(date < todayStr()){
    markFieldInvalid('o-date');
    showInlineError(t('error.campos'));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  if(clienteEmail && !isValidEmail(clienteEmail)){
    markFieldInvalid('o-email');
    showInlineError(t('error.email.invalido'));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  if(!document.getElementById('o-privacy-consent').checked){
    showInlineError(t('privacy.mustAccept'));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }

  const subtotal = cart.reduce((s,l)=>s+l.price*l.qty,0);
  const pedidoMinimo = p.pedidoMinimo || 0;
  if(pedidoMinimo > 0 && subtotal < pedidoMinimo){
    showInlineError(t('error.pedido.min').replace('%s', fmtMoney(pedidoMinimo)));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }

  const turnos = getTurnosForDate(date);
  if(turnos !== null && !turnos.length){
    showInlineError(t('error.cerrado').replace('%s', nombreDia(date).toLowerCase()));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  if(turnos !== null && turnos.length && !isTimeAllowed(date, time)){
    showInlineError(t('error.horario').replace('%s', t('error.horario.pedidos')).replace('%s', nombreDia(date).toLowerCase()).replace('%s', formatTurnos(turnos)));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  // Además de estar dentro del horario de apertura, la cocina puede
  // necesitar dejar de aceptar pedidos un rato antes del cierre real (para
  // dar tiempo a prepararlos y no quedarse con un pedido a medias a la hora
  // de cerrar). Se aplica solo a pedidos, no a reservas de mesa.
  if(turnos !== null && turnos.length){
    const cutoffTime = pedidosCutoffTimeForTurno(date, time, p);
    if(cutoffTime && time > cutoffTime.limite){
      showInlineError(t('error.cierrePedidos').replace('%s', cutoffTime.limite));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
  }

  const leadTimeMin = getLeadTimeMin('pedido');
  if(leadTimeMin && date === todayStr()){
    const now = new Date(Date.now() + leadTimeMin * 60000);
    const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    if(time < minTime){
      showInlineError(t('error.antelacion').replace('%d', leadTimeMin).replace('%s', minTime));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
  }

  const maxPorFranja = p.maxPorFranja || 0;
  let pedidoSlotReservado = null;
  if(maxPorFranja > 0){
    const slot = roundToPedidoSlot(time);
    const baseline = ((DB.pedidosResumen||{})[date]||{})[slot] || 0;
    // Comprobación final ATÓMICA justo antes de enviar, igual que con el
    // aforo de reservas: cierra la ventana de carrera entre dos pedidos
    // casi simultáneos para la misma franja.
    // Hallazgo real de auditoría: sin este try/catch, un rechazo de verdad
    // de Firebase (permisos, sin red a mitad de la transacción) no vuelve
    // como result.committed:false — lanza una excepción que aquí escapaba
    // sin capturar, dejando submittingRequest en true y el botón clavado en
    // "Enviando…" para siempre, sin aviso, hasta recargar la página.
    let result;
    try{
      result = await reservePedidoSlotAtomic(date, slot, maxPorFranja, baseline);
    }catch(e){
      console.error('Error reservando la franja del pedido', e);
      showInlineError(t('error.envio'));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
    if(!result.committed){
      showInlineError(t('error.pedidos.completo'));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
    pedidoSlotReservado = {date, slot};
  }

  let pendienteVerificarZona = false;
  if(zoneRestricted){
    const zoneCheck = await checkDeliveryZone(p, codigoPostal, clienteDireccion);
    if(!zoneCheck.ok){
      // Si ya se había reservado franja y el pedido no sigue adelante, hay
      // que liberarla: si no, ese hueco se queda ocupado sin ningún pedido
      // real detrás (ver releasePedidoSlot).
      if(pedidoSlotReservado) releasePedidoSlot(pedidoSlotReservado.date, pedidoSlotReservado.slot);
      showInlineError(t('error.zona'));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
    pendienteVerificarZona = !!zoneCheck.pendienteVerificar;
  }

  const deliveryFee = getDeliveryFee(p, subtotal, isDelivery);
  const tip = computeTipAmount(subtotal);
  const total = subtotal + deliveryFee + tip;

  // Método de pago elegido entre las opciones que el negocio acepta
  // (efectivo / tarjeta al recibir / TPV virtual). Si es DOMICILIO y elige
  // efectivo, pedimos con qué billete va a pagar — así el repartidor sabe
  // de antemano cuánto cambio llevar, en vez de descubrirlo al llegar.
  // Para recoger en el local no se pregunta: el cliente paga en persona en
  // el mostrador, no hace falta que nadie lleve cambio a ningún sitio.
  const metodoPago = document.querySelector('input[name="o-pago-metodo"]:checked')?.value || 'efectivo';
  let metodoPagoLocal = null, pagaCon = null;
  if(metodoPago !== 'tpv'){
    metodoPagoLocal = metodoPago === 'tarjeta_local' ? 'tarjeta' : 'efectivo';
    if(isDelivery && metodoPagoLocal === 'efectivo'){
      const pagaConEl = document.getElementById('o-paga-con');
      pagaCon = pagaConEl ? parseFloat(pagaConEl.value) : NaN;
      if(isNaN(pagaCon) || pagaCon < total){
        if(pedidoSlotReservado) releasePedidoSlot(pedidoSlotReservado.date, pedidoSlotReservado.slot);
        showInlineError(t('error.pagaCon').replace('%s', fmtMoney(total)));
        submittingRequest = false;
        setBtnLoading('o-submit', false);
        return;
      }
    }
  }

  const req = {
    type:'pedido', tipo: isDelivery ? 'delivery' : 'takeaway',
    clienteNombre, clienteTelefono, clienteEmail, clienteDireccion, codigoPostal, notas, date, time,
    costeEnvio: deliveryFee, propina: tip,
    // platoId: con él la app del negocio vuelve a poner el precio con SU
    // carta (ver revisarPreciosPedidoPublico, js/core.js) — el `price` de
    // aquí es solo lo que el cliente vio, no lo que se cobra.
    items: cart.map(l => ({platoId: l.recipeId, name:l.name, price:l.price, qty:l.qty, modificadores:l.modificadores||undefined})),
    createdAt: new Date().toISOString(),
    // Token para poder seguir el estado del pedido después de enviarlo (ver
    // trackOrderStatus más abajo) — antes solo se generaba si se pagaba con
    // tarjeta (dentro de payWithCard), así que un pedido pagado en efectivo
    // no tenía ninguna forma de que el cliente comprobara su estado.
    clientRef: genClientRef()
  };
  if(pendienteVerificarZona) req.pendienteVerificarZona = true;
  if(metodoPagoLocal) req.metodoPagoLocal = metodoPagoLocal;
  if(pagaCon != null) req.pagaCon = pagaCon;

  req.total = total;
  guardarResumenPedido(req);

  const submitBtn = document.getElementById('o-submit');
  if(submitBtn) submitBtn.disabled = true;

  if(metodoPago === 'tpv'){
    setPaySubmitEnabled(false);
    payWithCard(req, total, isDelivery ? t('order.delivery.title') : t('order.takeaway.title'));
    return;
  }

  sendRequest(req, t('order.ok'));
}

/* ============ PAGO CON TARJETA (Stripe) ============
   1) Se pide al Worker el pago ANTES de registrar el pedido en el negocio:
      si el Worker falla, no llega a crearse ningún pedido huérfano, sin
      estado de pago e indistinguible de uno a pagar en el local.
   2) Solo si Stripe acepta crear el pago, se registra el pedido (con su
      clientRef) y se manda al cliente a la página de pago de Stripe.
   3) Cuando el cliente paga, Stripe avisa al Worker (con su firma) y la app
      del negocio lo recoge preguntando (ver comprobarPagosTarjeta, js/core.js). */
// refField: qué campo de `req` identifica el pago al volver del banco
// (clientRef para pedidos, resToken para la señal de una reserva — ver
// pago_confirmado en initPublicRequestsListener, js/core.js, que busca por
// ambos). submitBtnId: qué botón reactivar si algo falla.
function payWithCard(req, amount, description, refField, submitBtnId){
  refField = refField || 'clientRef';
  submitBtnId = submitBtnId || 'o-submit';
  const ref = req[refField] || genClientRef();
  req[refField] = ref;

  const base = location.href.split('?')[0] + '?neg=' + encodeURIComponent(publicId) + (req.mesaToken ? '&mesa=' + encodeURIComponent(req.mesaToken) : '');
  // Al volver del banco, el cliente entra DIRECTO en el seguimiento de su
  // pedido o en «Gestionar mi reserva», igual que si hubiera pagado en
  // efectivo. Antes caía en una pantalla fija sin enlace a nada que decía
  // «el restaurante lo confirmará», aunque el negocio acepte los pedidos solo.
  // El autopedido de mesa no tiene seguimiento propio: ese sí va a la
  // pantalla de siempre.
  const seguimiento = refField === 'resToken' ? '&res=' + encodeURIComponent(ref)
    : (req.type === 'pedido' && req.tipo !== 'mesa') ? '&track=' + encodeURIComponent(ref) : '';
  fetch(`${PAGOS_WORKER_URL}/stripe/pagar`, {
    method: 'POST',
    headers: {'content-type':'application/json'},
    body: JSON.stringify({
      publicId, orderRef: ref, amount, description,
      urlOk: base + seguimiento + '&pago=ok',
      urlKo: base + '&pago=ko'
    })
  }).then(r => r.json()).then(data => {
    if(!data || !data.url || data.error){
      showInlineError(t('error.pago') + (data && data.error ? ' ' + data.error : ''));
      setPaySubmitEnabled(true, submitBtnId);
      return;
    }
    return db.ref('gastrogoan/public/' + publicId + '/requests').push(req).then(() => {
      location.href = data.url;   // la página de pago de Stripe
    });
  }).catch(e => {
    console.error(e);
    showInlineError(t('error.pago.conexion'));
    setPaySubmitEnabled(true, submitBtnId);
  });
}
/* «Lo que has pedido» en el seguimiento (1/10). El estado público del pedido
   solo lleva el estado, a propósito: con el enlace no se puede ver lo que ha
   pedido nadie. El detalle se guarda en ESTE navegador al enviarlo, y el
   seguimiento lo enseña si es el mismo móvil (lo normal). Los 20 últimos. */
const RESUMENES_LS = 'gastrogoan_mis_pedidos';
function guardarResumenPedido(req){
  try{
    if(!req || !req.clientRef) return;
    const todos = JSON.parse(localStorage.getItem(RESUMENES_LS) || '{}');
    todos[req.clientRef] = {
      items: (req.items || []).map(l => ({n: String(l.name || ''), q: Number(l.qty) || 1, p: Number(l.price) || 0,
        m: Array.isArray(l.modificadores) ? l.modificadores.map(x => x && x.nombre).filter(Boolean) : []})),
      envio: Number(req.costeEnvio) || 0, propina: Number(req.propina) || 0, total: Number(req.total) || 0,
      date: req.date || '', time: req.time || '', dir: req.clienteDireccion || '', ts: Date.now()
    };
    const claves = Object.keys(todos).sort((a, b) => (todos[b].ts || 0) - (todos[a].ts || 0));
    claves.slice(20).forEach(k => delete todos[k]);
    localStorage.setItem(RESUMENES_LS, JSON.stringify(todos));
  }catch(e){ /* sin almacenamiento (modo privado): el seguimiento funciona igual */ }
}
function resumenPedidoHtml(token){
  let r = null;
  try{ r = (JSON.parse(localStorage.getItem(RESUMENES_LS) || '{}'))[token] || null; }catch(e){}
  if(!r || !Array.isArray(r.items) || !r.items.length) return '';
  const fila = (izq, der, fuerte) => `<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);${fuerte ? 'font-weight:700;color:var(--ink)' : ''}"><span>${izq}</span><span class="mono" style="white-space:nowrap">${der}</span></div>`;
  let dia = r.date || '';
  try{
    if(/^\d{4}-\d{2}-\d{2}$/.test(dia)){
      const [y, m, d] = dia.split('-').map(Number);
      const f = new Date(y, m - 1, d).toLocaleDateString(currentLang === 'ca' ? 'ca-ES' : (currentLang === 'en' ? 'en-GB' : 'es-ES'), {weekday: 'long', day: 'numeric', month: 'long'});
      dia = f.charAt(0).toUpperCase() + f.slice(1);
    }
  }catch(e){}
  const cuando = [dia, r.time].filter(Boolean).join(' · ');
  return `
    <div class="trk-block">
      <div class="trk-label">${t('track.summaryTitle')}</div>
      ${cuando || r.dir ? `<p style="margin:0 0 8px;font-size:14px">${escapeHtml(cuando)}${cuando && r.dir ? '<br>' : ''}${escapeHtml(r.dir)}</p>` : ''}
      ${r.items.map(l => fila(`${l.q} × ${escapeHtml(l.n)}${l.m && l.m.length ? `<br><span style="color:var(--muted);font-size:13px">${l.m.map(escapeHtml).join(', ')}</span>` : ''}`, fmtMoney(l.p * l.q))).join('')}
      ${r.envio > 0 ? fila(t('cart.shipping'), fmtMoney(r.envio)) : ''}
      ${r.propina > 0 ? fila(t('track.tip'), fmtMoney(r.propina)) : ''}
      ${fila(t('track.total'), fmtMoney(r.total), true)}
    </div>`;
}

/* ============ CARTA POR QR EN LA MESA (7/10) ============
   La mesa llega por su token. Se lee SOLO el nodo de esa mesa
   (mesaQr/{token}): su nombre y su cuenta, sin datos de nadie. El pedido
   sale como 'pedido_mesa' y los precios los vuelve a poner el negocio con
   su carta; el pago, como 'pago_mesa', y solo cuenta lo que confirme Stripe. */
function engancharCuentaMesaQr(){
  if(qrMesaListener || !qrMesaToken) return;
  qrMesaListener = true;
  db.ref('gastrogoan/public/' + publicId + '/mesaQr/' + qrMesaToken).on('value', snap => {
    const antes = qrMesaCuenta;
    qrMesaCuenta = snap.val() || null;
    // Primera respuesta (o QR que deja de valer o vuelve): se pinta todo.
    // Después, solo la cuenta, para no borrar lo que el comensal pide.
    if(antes === undefined || antes === null || !qrMesaCuenta){ if(currentTab === 'mesa') renderMesaQrForm(); }
    else pintarCuentaMesaQr();
  }, () => { qrMesaCuenta = null; if(currentTab === 'mesa') renderMesaQrForm(); });
}
function qrMesaActivo(){ return !!(DB.business && DB.business.qrMesa && DB.business.qrMesa.activo); }

function pintarCuentaMesaQr(){
  const box = document.getElementById('mesaqr-cuenta');
  if(!box || !qrMesaCuenta) return;
  const c = qrMesaCuenta;
  const lineas = Array.isArray(c.lineas) ? c.lineas : Object.values(c.lineas || {});
  if(!c.abierta || !lineas.length){
    box.innerHTML = `<h2>${t('mesaqr.cuenta')}</h2><div class="empty">${t('mesaqr.cuentaVacia')}</div>`;
    return;
  }
  const fila = (izq, der, fuerte) => `<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);${fuerte ? 'font-weight:700;color:var(--ink)' : ''}"><span>${izq}</span><span class="mono" style="white-space:nowrap">${der}</span></div>`;
  const pendiente = Number(c.pendiente) || 0;
  let pago = '';
  if(pendiente <= 0.009){
    pago = `<p style="margin:12px 0 0;font-weight:700">${t('mesaqr.pagada')}</p>`;
  }else if(!pagoOnlineActivo){
    pago = `<p style="margin:12px 0 0;font-size:13.5px;color:var(--muted)">${t('mesaqr.sinPago')}</p>`;
  }else{
    const parte = Math.max(0.5, Math.ceil(pendiente / 2 * 100) / 100);
    pago = `
      <button class="btn btn-primary" id="mq-pagar-todo" style="margin-top:12px" onclick="pagarCuentaMesaQr('todo')">${escapeHtml(t('mesaqr.pagarTodo').replace('%s', fmtMoney(pendiente)))}</button>
      <div class="field" style="margin-top:14px">
        <label for="mq-importe">${t('mesaqr.pagarParte')}</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
          <span style="font-size:13px;color:var(--muted)">${t('mesaqr.dividir')}</span>
          ${[2,3,4,5,6].map(n => `<button type="button" class="btn btn-sm" style="flex:1;min-width:44px;min-height:44px" onclick="dividirCuentaMesaQr(${n})">${n}</button>`).join('')}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input type="number" id="mq-importe" inputmode="decimal" min="0.5" step="0.01" max="${pendiente.toFixed(2)}" value="${parte.toFixed(2)}" style="flex:1;min-width:120px" aria-label="${escapeHtml(t('mesaqr.parteImporte'))}">
          <button class="btn" id="mq-pagar-parte" style="flex:1;min-width:120px;min-height:44px" onclick="pagarCuentaMesaQr('parte')">${t('mesaqr.pagarParteBtn')}</button>
        </div>
      </div>`;
  }
  box.innerHTML = `
    <h2>${t('mesaqr.cuenta')}</h2>
    ${lineas.map(l => fila(`${Number(l.q) || 0} × ${escapeHtml(l.n || '')}`, fmtMoney((Number(l.p) || 0) * (Number(l.q) || 0)))).join('')}
    ${fila(t('mesaqr.total'), fmtMoney(Number(c.total) || 0), true)}
    ${(Number(c.pagado) || 0) > 0 ? fila(t('mesaqr.pagado'), fmtMoney(Number(c.pagado) || 0)) : ''}
    ${fila(t('mesaqr.pendiente'), fmtMoney(pendiente), true)}
    ${(Number(c.enCurso) || 0) > 0 ? `<p style="font-size:13px;color:var(--muted);margin:8px 0 0">${escapeHtml(t('mesaqr.enCurso').replace('%s', fmtMoney(Number(c.enCurso))))}</p>` : ''}
    ${pago}`;
}
function dividirCuentaMesaQr(n){
  const el = document.getElementById('mq-importe');
  const pendiente = Number(qrMesaCuenta && qrMesaCuenta.pendiente) || 0;
  if(el && n > 0) el.value = Math.max(0.5, Math.ceil(pendiente / n * 100) / 100).toFixed(2);
}
function pagarCuentaMesaQr(modo){
  if(submittingRequest || !qrMesaCuenta) return;
  const pendiente = Math.round((Number(qrMesaCuenta.pendiente) || 0) * 100) / 100;
  let importe = pendiente;
  if(modo === 'parte'){
    const el = document.getElementById('mq-importe');
    importe = Math.round((parseFloat(el && el.value) || 0) * 100) / 100;
  }
  // Stripe no cobra menos de 0,50 €; y más de lo que queda no tiene sentido.
  if(!(importe >= 0.5) || importe > pendiente + 0.001){ showInlineError(t('mesaqr.importeMal')); return; }
  submittingRequest = true;
  const btnId = modo === 'parte' ? 'mq-pagar-parte' : 'mq-pagar-todo';
  setBtnLoading(btnId, true);
  const req = {type: 'pago_mesa', mesaToken: qrMesaToken, importe, createdAt: new Date().toISOString()};
  payWithCard(req, importe, t('mesaqr.descripcionPago').replace('%s', qrMesaCuenta.mesa || ''), 'clientRef', btnId);
}
function submitMesaQrOrder(){

    type: 'pedido_mesa', mesaToken: qrMesaToken,
    clienteNombre: document.getElementById('m-name').value.trim().slice(0, 60),
    notas: document.getElementById('m-notes').value.trim().slice(0, 300),

    items: cart.map(l => ({platoId: l.recipeId, name: l.name, price: l.price, qty: l.qty, modificadores: l.modificadores || undefined})),
    total: cart.reduce((s, l) => s + l.price * l.qty, 0),
    createdAt: new Date().toISOString()
  };
  // JSON ida y vuelta: Firebase rechaza un `undefined` en cualquier rincón.

function submitMesaOrder(){
  if(!cart.length){ showInlineError(t('error.carrito.vacio')); return; }
  if(submittingRequest) return;
  if(!document.getElementById('o-privacy-consent').checked){ showInlineError(t('privacy.mustAccept')); return; }
  submittingRequest = true;
  setBtnLoading('o-submit', true);

  const tables = DB.tables || [];
  let tableId = null;
  if(tableIdFromUrl){
    const currentTable = tables.find(tb => String(tb.id) === String(tableIdFromUrl));
    if(currentTable){
      tableId = currentTable.id;
    }else{
      const manual = document.getElementById('m-table-manual');
      if(!manual || !manual.value.trim()){ showInlineError(t('error.mesa.manual')); submittingRequest = false; setBtnLoading('o-submit', false); return; }
      tableId = manual.value.trim();
    }
  }else{
    const sel = document.getElementById('m-table');
    if(!sel || !sel.value){ showInlineError(t('error.mesa.select')); submittingRequest = false; setBtnLoading('o-submit', false); return; }
    tableId = tables.find(tb => String(tb.id) === sel.value).id;
  }

  const clienteNombre = document.getElementById('m-name').value.trim();
  const notas = document.getElementById('m-notes').value.trim();
  const subtotalMesa = cart.reduce((s,l)=>s+l.price*l.qty,0);
  const tipMesa = computeTipAmount(subtotalMesa);
  // Solo se pregunta si se ofrece pagar ahora (pagoOnlineActivo); si no
  // existe el radio, es que la opción no está disponible y se añade a la
  // cuenta de la mesa como siempre.
  const pagarAhora = pagoOnlineActivo && document.querySelector('input[name="m-pago-cuando"]:checked')?.value === 'ahora';

  const req = {
    type:'pedido', tipo:'mesa', tableId,
    clienteNombre, notas, propina: tipMesa,
    // platoId: con él la app del negocio vuelve a poner el precio con SU
    // carta (ver revisarPreciosPedidoPublico, js/core.js) — el `price` de
    // aquí es solo lo que el cliente vio, no lo que se cobra.
    items: cart.map(l => ({platoId: l.recipeId, name:l.name, price:l.price, qty:l.qty, modificadores:l.modificadores||undefined})),
    total: subtotalMesa + tipMesa,
    createdAt: new Date().toISOString()
  };
  if(pagarAhora) req.pagarAhora = true;
  const submitBtn = document.getElementById('o-submit');
  if(submitBtn) submitBtn.disabled = true;
  if(pagarAhora){
    // A diferencia del pedido normal, este SÍ se fusiona con la comanda
    // abierta de la mesa (ver initPublicRequestsListener, js/core.js) — solo
    // que sus líneas quedan marcadas como ya pagadas por este cliente, para
    // que al cobrar la mesa se descuenten del importe pendiente.
    payWithCard(req, req.total, t('order.mesa.title'), 'clientRef', 'o-submit');
    return;
  }
  sendRequest(req, t('order.ok.mesa'));
}

// El enlace de seguimiento/gestión es la confirmación real (no el email,
// que es opcional y puede no estar configurado): si el cliente cierra esta
// pantalla sin guardarlo, lo pierde. En vez de montar un canal nuevo
// (WhatsApp/SMS cobran por mensaje y exigen backend por el token — no
// encajan aquí), se le deja mandárselo él mismo por donde quiera con el
// panel nativo de compartir del móvil (WhatsApp, SMS, notas... aparecen
// solos, sin integrar nada). En escritorio, sin panel nativo, se copia al
// portapapeles.
function shareTrackUrl(url, isReserva, btnEl){
  const shareData = {
    title: (DB.business && DB.business.name) || '',
    text: t(isReserva ? 'success.shareTextReserva' : 'success.shareTextPedido'),
    url
  };
  if(navigator.share){
    navigator.share(shareData).catch(()=>{});
    return;
  }
  const avisarCopiado = () => {
    if(!btnEl) return;
    if(btnEl.dataset.originalText === undefined) btnEl.dataset.originalText = btnEl.textContent;
    btnEl.textContent = t('success.linkCopied');
    clearTimeout(btnEl._shareResetT);
    btnEl._shareResetT = setTimeout(()=>{ btnEl.textContent = btnEl.dataset.originalText; }, 2500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(avisarCopiado).catch(()=> prompt(t('success.copyManually'), url));
  } else {
    prompt(t('success.copyManually'), url);
  }
}

/* ============ ENVÍO ============ */
function sendRequest(req, successMsg){
  db.ref('gastrogoan/public/' + publicId + '/requests').push(req).then(() => {
    // En vez de una pantalla de éxito de un solo uso con un botón para IR a
    // ver el estado, se entra DIRECTAMENTE en la vista en vivo (seguimiento
    // de pedido / gestión de reserva) — es la misma pantalla a la que
    // volvería el cliente si guarda el enlace, así que más vale enseñársela
    // ya la primera vez que hacerle pasar por un paso intermedio que luego
    // desaparece para siempre.
    if(req.type === 'pedido' && req.clientRef){
      trackToken = req.clientRef;
      trackRecienEnviadoHasta = Date.now() + 15 * 60 * 1000;
      trackListenerAttached = false;
      renderOrderTrackingView();
      return;
    }
    if(req.type === 'reserva' && req.resToken){
      resToken = req.resToken;
      resRecienEnviada = {status: 'pendiente', date: req.date, time: req.time, people: req.people, hasta: Date.now() + 15 * 60 * 1000};
      resListenerAttached = false;
      renderReservationManageView();
      return;
    }
    // Sin token (autopedido de mesa: se fusiona con la comanda abierta, no
    // tiene seguimiento propio) — se mantiene la pantalla genérica de
    // siempre.
    const phone = (DB.business||{}).phone;
    document.getElementById('app').innerHTML = `
      <div class="success">
        <div class="icon ok-icon" aria-hidden="true"></div>
        <h2>${escapeHtml(successMsg)}</h2>
        ${phone ? `<p style="font-size:13px;color:var(--muted);margin-top:8px">${t('success.callToChange').replace('%s', `<a href="tel:${escapeHtml(phone.replace(/\s+/g,''))}" style="color:var(--ink);font-weight:600">${escapeHtml(phone)}</a>`)}</p>` : ''}
        <button class="btn" style="margin-top:16px" onclick="location.reload()">${t(req.type === 'reserva' ? 'success.otraReserva' : 'success.otraPedido')}</button>
      </div>
    `;
  }).catch(e => {
    console.error(e);
    showInlineError(t('error.envio'));
    submittingRequest = false;
    setBtnLoading(req.type === 'reserva' ? 'r-submit' : 'o-submit', false);
  });
}

/* ============ SEGUIMIENTO DE PEDIDO (?track=token) ============
   Pantalla aparte con su propio listener en vivo sobre
   orderStatus/{token} (ver syncOrderStatusForPublic en la app principal):
   el cliente puede volver a este enlace en cualquier momento y ver en qué
   punto va su pedido sin tener que llamar a preguntar. */
const TRACK_STEPS = ['pendiente','aceptado','preparando','listo','entregado'];
/* ⚠️ SIN ESTO, LAS PANTALLAS DE SEGUIMIENTO ERAN UN CALLEJÓN SIN SALIDA.

   "Seguir mi pedido" y "Gestionar mi reserva" navegan a una URL nueva
   (?track=... / ?res=...), y ninguna de sus pantallas —cargando, no
   encontrado, seguimiento, cancelada, completada— tenía ni un botón para
   volver. Un cliente que pulsaba el enlace no podía volver a la carta salvo
   cerrando la pestaña o borrando la URL a mano. Mismo patrón que los
   callejones sin salida de la app de gestión, aquí se nos había escapado
   por completo. */
function urlVolverALaCarta(){
  return location.href.split('?')[0] + '?neg=' + encodeURIComponent(publicId);
}
// En un pedido se vuelve «a la carta»; en una reserva no tiene sentido
// (el cliente no ha pedido nada de la carta): «Volver al inicio».
function botonVolverALaCarta(esReserva){
  return `<a class="btn" style="margin-top:16px;text-decoration:none" href="${escapeHtml(urlVolverALaCarta())}">${t(esReserva ? 'track.backHome' : 'track.backToMenu')}</a>`;
}

function renderOrderTrackingView(){
  const app = document.getElementById('app');
  if(trackListenerAttached) return;
  trackListenerAttached = true;
  app.innerHTML = `<div class="empty"><div class="spinner"></div>${t('track.loading')}<div style="margin-top:14px">${botonVolverALaCarta()}</div></div>`;
  db.ref('gastrogoan/public/' + publicId + '/orderStatus/' + trackToken).on('value', snap => {
    renderTrackStatus(snap.val());
  }, () => {
    renderTrackStatus(null);
  });
}
// Contacto para anular/cambiar un pedido: NUNCA se autogestiona desde aquí
// (a diferencia de una reserva) — a propósito, ver la conversación que
// decidió este alcance. Solo se ofrece teléfono/email para que el cliente
// hable con el negocio.
function contactoParaCambiosHtml(){
  const b = DB.business || {};
  const phone = b.phone;
  const email = b.email || '';
  if(!phone && !email) return '';
  return `
    <div class="trk-block">
      <div class="trk-label">${t('track.contactTitle')}</div>
      ${phone ? `<a class="trk-link" href="tel:${escapeHtml(phone.replace(/\s+/g,''))}">${escapeHtml(phone)}<span>${t('track.call')}</span></a>` : ''}
      ${email ? `<a class="trk-link" href="mailto:${escapeHtml(email)}">${escapeHtml(email)}<span>${t('track.write')}</span></a>` : ''}
    </div>`;
}
// Bloque "guarda este enlace" — el mismo mensaje y botón tanto si se acaba
// de crear el pedido/reserva como si el cliente vuelve más tarde a mirarlo;
// antes solo existía en la pantalla de éxito de un solo uso (sendRequest),
// así que al saltar directo aquí (ver sendRequest) se perdía del todo.
function guardaEnlaceHtml(token, esReserva){
  const url = location.href.split('?')[0] + '?neg=' + encodeURIComponent(publicId) + (esReserva ? '&res=' : '&track=') + encodeURIComponent(token);
  return `
    <div class="trk-block">
      <div class="trk-label">${t('track.saveLinkTitle')}</div>
      <p style="margin:0 0 10px;font-size:14px">${t(esReserva ? 'resManage.saveLinkHint' : 'track.saveLinkHint')}</p>
      ${esReserva ? `<p style="margin:0 0 10px;font-size:13px;color:var(--muted)">${t('resManage.lookupAlso')}</p>` : ''}
      <button class="btn" type="button" onclick="shareTrackUrl('${escapeHtml(url).replace(/'/g,"\\'")}', ${!!esReserva}, this)">${t('success.shareLink')}</button>
    </div>`;
}
// El pedido se acaba de mandar (o se acaba de pagar): durante un rato su
// estado puede no estar publicado todavía — la app del negocio tiene que
// recibirlo primero. Eso no es «no encontramos tu pedido».
let trackRecienEnviadoHasta = 0;
function renderTrackStatus(data){
  const app = document.getElementById('app');
  if(!data && Date.now() < trackRecienEnviadoHasta) data = {status: 'pendiente'};
  lastTrackStatusData = data;
  const aparte = (titulo, texto) => `
    <div class="trk trk-alone">
      <div class="trk-meta">${trackToken ? `${t('track.orderNumber')} <strong>${escapeHtml(shortCode(trackToken))}</strong>` : ''}</div>
      <h2 class="trk-h">${titulo}</h2>
      <p class="trk-desc">${texto}</p>
      ${botonVolverALaCarta()}
    </div>`;
  if(!data){
    app.innerHTML = aparte(t('track.notFound.title'), t('track.notFound.msg'));
    return;
  }
  let status = data.status || 'pendiente';
  const codigo = shortCode(trackToken);
  if(status === 'rechazado'){
    const phone = (DB.business||{}).phone;
    app.innerHTML = aparte(t('track.rejected.title'), t('track.rejected.msg') + (phone ? ' ' + t('success.callToChange').replace('%s', `<a href="tel:${escapeHtml(phone.replace(/\s+/g,''))}" style="color:var(--ink);font-weight:600">${escapeHtml(phone)}</a>`) : '')) + contactoParaCambiosHtml();
    return;
  }
  const esDelivery = data.tipo === 'delivery';
  // Para llevar, «listo para recoger» es el ÚLTIMO paso (1/10): «recogido»
  // no aportaba nada al cliente —ya lo tiene en la mano— y no se distinguía
  // del anterior. Un pedido ya cerrado se sigue viendo como listo.
  if(!esDelivery && status === 'entregado') status = 'listo';
  const idx = Math.max(0, TRACK_STEPS.indexOf(status));
  const tipoTxt = data.tipo ? t(esDelivery ? 'track.type.delivery' : 'track.type.takeaway') : '';
  // Lo que le importa al cliente: qué está pasando AHORA, dicho en una frase.
  const k = (status === 'listo' || status === 'entregado') ? status + (esDelivery ? '.delivery' : '.takeaway') : status;
  const steps = [
    t('track.step.pendiente'), t('track.step.aceptado'), t('track.step.preparando'),
    t(esDelivery ? 'track.step.listo.delivery' : 'track.step.listo.takeaway'),
    ...(esDelivery ? [t('track.step.entregado.delivery')] : []),
  ];
  const clase = i => i < idx ? 'hecho' : (i === idx ? (idx === steps.length - 1 ? 'hecho ahora' : 'ahora') : '');
  app.innerHTML = `
    <div class="trk">
      <div class="trk-head">
        <div class="trk-meta">
          <span>${t('track.orderNumber')} <strong>${escapeHtml(codigo)}</strong></span>
          ${tipoTxt ? `<span>${tipoTxt}</span>` : ''}
        </div>
        <h2 class="trk-h">${t('track.head.' + k)}</h2>
        <p class="trk-desc">${t('track.desc.' + k)}</p>
        <div class="trk-bar" aria-hidden="true">${steps.map((_, i) => `<span class="${i < idx ? 'hecho' : (i === idx ? 'ahora' : '')}"></span>`).join('')}</div>
      </div>
      <ol class="trk-steps">
        ${steps.map((label, i) => `
          <li class="trk-step ${clase(i)}">
            <span class="trk-dot"></span><span>${label}</span>
            ${i === idx ? `<span class="trk-now">${t('track.current')}</span>` : ''}
          </li>`).join('')}
      </ol>
    </div>
    ${resumenPedidoHtml(trackToken)}
    ${contactoParaCambiosHtml()}
    ${guardaEnlaceHtml(trackToken, false)}
    ${botonVolverALaCarta()}
  `;
}

/* ============ GESTIONAR MI RESERVA (?res=token) ============
   Mismo patrón que el seguimiento de pedido, pero además de leer permite
   una acción: cancelar. La cancelación NUNCA toca la reserva directamente
   desde aquí (el cliente no tiene ni debería tener escritura sobre
   DB.reservations) — se manda como una solicitud más a la cola de
   "requests" (tipo 'reserva_cancelar', con el token) y es la app del
   negocio quien la aplica de verdad al procesarla, igual que ya hace con
   una reserva nueva. */
let cancellingReservation = false;
function renderReservationManageView(){
  const app = document.getElementById('app');
  if(resListenerAttached) return;
  resListenerAttached = true;
  app.innerHTML = `<div class="empty"><div class="spinner"></div>${t('resManage.loading')}<div style="margin-top:14px">${botonVolverALaCarta(true)}</div></div>`;
  db.ref('gastrogoan/public/' + publicId + '/reservationStatus/' + resToken).on('value', snap => {
    renderReservationStatus(snap.val());
  }, () => {
    renderReservationStatus(null);
  });
}
let resRecienEnviada = null;
function renderReservationStatus(data){
  // Recién enviada: hasta que la app del negocio la recibe (segundos, si
  // está abierta) no hay estado publicado. Eso no es «no encontramos tu reserva».
  if(!data && resRecienEnviada && Date.now() < resRecienEnviada.hasta) data = resRecienEnviada;
  lastResStatusData = data;
  const app = document.getElementById('app');
  const aparte = (titulo, texto) => `
    <div class="trk trk-alone">
      <div class="trk-meta">${resToken ? `${t('resManage.number')} <strong>${escapeHtml(shortCode(resToken))}</strong>` : ''}</div>
      <h2 class="trk-h">${titulo}</h2>
      <p class="trk-desc">${texto}</p>
      ${botonVolverALaCarta(true)}
    </div>`;
  if(!data){
    app.innerHTML = aparte(t('resManage.notFound.title'), t('resManage.notFound.msg'));
    return;
  }
  const phone = (DB.business||{}).phone;
  const phoneLink = phone ? `<a href="tel:${escapeHtml(phone.replace(/\s+/g,''))}" style="color:var(--ink);font-weight:600">${escapeHtml(phone)}</a>` : '';
  if(data.status === 'cancelada'){
    app.innerHTML = aparte(t('resManage.cancelled.title'), t('resManage.cancelled.msg'));
    return;
  }
  // 'completada' = el cliente ya llegó y está sentado. Antes esta ruta no
  // se distinguía de una reserva normal, así que el enlace seguía
  // ofreciendo Editar/Cancelar sobre una visita que ya ha pasado.
  if(data.status === 'completada'){
    app.innerHTML = aparte(t('resManage.completed.title'), t('resManage.completed.msg'));
    return;
  }
  const confirmada = data.status === 'confirmada';
  // La fecha como la dice una persona («sábado, 4 de octubre»), no «2026-10-04».
  let fechaTxt = data.date || '';
  try{
    if(/^\d{4}-\d{2}-\d{2}$/.test(fechaTxt)){
      const [y, m, d] = fechaTxt.split('-').map(Number);
      const loc = currentLang === 'ca' ? 'ca-ES' : (currentLang === 'en' ? 'en-GB' : 'es-ES');
      const f = new Date(y, m - 1, d).toLocaleDateString(loc, {weekday: 'long', day: 'numeric', month: 'long'});
      fechaTxt = f.charAt(0).toUpperCase() + f.slice(1);
    }
  }catch(e){}
  app.innerHTML = `
    <div class="trk">
      <div class="trk-head">
        <div class="trk-meta">
          <span>${t('resManage.number')} <strong>${escapeHtml(shortCode(resToken))}</strong></span>
          <span style="color:${confirmada ? 'var(--olive)' : 'var(--muted)'}">${confirmada ? t('resManage.status.confirmada') : t('resManage.status.pendiente')}</span>
        </div>
        <h2 class="trk-h">${t(confirmada ? 'resManage.head.confirmada' : 'resManage.head.pendiente')}</h2>
        <p class="trk-desc">${t(confirmada ? 'resManage.desc.confirmada' : 'resManage.desc.pendiente')}</p>
      </div>
      <div style="padding:6px 20px 18px">
        <div class="trk-link" style="cursor:default">${escapeHtml(fechaTxt)}<span>${t('resManage.day')}</span></div>
        <div class="trk-link" style="cursor:default">${escapeHtml(data.time||'')}<span>${t('resManage.hour')}</span></div>
        <div class="trk-link" style="cursor:default">${escapeHtml(String(data.people||''))}<span>${t('resManage.people')}</span></div>
      ${resEditing ? `
        <div class="field-row" style="margin-top:16px">
          <div class="field">
            <label>${t('fecha')}</label>
            <input type="date" id="res-edit-date" value="${escapeHtml(data.date||'')}" min="${todayStr()}" onchange="updateTimeInputRange('res-edit-date','res-edit-time','res-edit-hint'); applyLeadTime('res-edit-date','res-edit-time','res-edit-hint','reserva')">
          </div>
          <div class="field">
            <label>${t('hora')}</label>
            <input type="time" id="res-edit-time" value="${escapeHtml(data.time||'')}">
          </div>
        </div>
        <div id="res-edit-hint"></div>
        <div class="field">
          <label>${t('personas')}</label>
          <input type="number" id="res-edit-people" value="${escapeHtml(data.people||1)}" min="1" max="50">
        </div>
        <div id="res-edit-grupo"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn" id="res-edit-cancel-btn" onclick="toggleResEdit(false)">${t('common.close')}</button>
          <button class="btn btn-primary" id="res-edit-save-btn" onclick="submitReservationChange()" style="flex:1">${t('resManage.saveBtn')}</button>
        </div>
      ` : `
        ${phoneLink ? `<p style="font-size:13px;color:var(--muted);margin:14px 0 0">${t('success.callToChange').replace('%s', phoneLink)}</p>` : ''}
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn" id="res-edit-btn" onclick="toggleResEdit(true)" style="flex:1">${t('resManage.editBtn')}</button>
          <button class="btn" style="flex:1;color:var(--red);border-color:var(--red)" id="res-cancel-btn" onclick="cancelMyReservation()">${t('resManage.cancelBtn')}</button>
        </div>
      `}
      </div>
    </div>
    ${resEditing ? '' : guardaEnlaceHtml(resToken, true)}
    ${resEditing ? '' : botonVolverALaCarta(true)}
  `;
  if(resEditing){
    updateTimeInputRange('res-edit-date','res-edit-time','res-edit-hint');
    applyLeadTime('res-edit-date','res-edit-time','res-edit-hint','reserva');
  }
}
let resEditing = false;
let lastResStatusData = null;
function toggleResEdit(on){
  resEditing = on;
  renderReservationStatus(lastResStatusData);
}
let submittingReservationChange = false;
function submitReservationChange(){
  if(submittingReservationChange) return;
  const date = document.getElementById('res-edit-date')?.value;
  const time = document.getElementById('res-edit-time')?.value;
  const people = parseInt(document.getElementById('res-edit-people')?.value) || 0;
  if(!date || !time || !people){
    showInlineError(t('error.campos'));
    return;
  }
  // Mismas reglas que al reservar: un grupo grande, o sin mesa de su
  // tamaño, se gestiona hablando con el negocio.
  const motivoGrupo = motivoSinReservaOnline(people);
  if(motivoGrupo){
    const box = document.getElementById('res-edit-grupo');
    if(box) box.innerHTML = avisoGrupoHtml(people, motivoGrupo);
    else showInlineError(t('grupo.sinMesa').replace('%d', people));
    return;
  }
  submittingReservationChange = true;
  const btn = document.getElementById('res-edit-save-btn');
  if(btn){ btn.disabled = true; btn.textContent = t('resManage.savingChanges'); }
  db.ref('gastrogoan/public/' + publicId + '/requests').push({
    type: 'reserva_modificar', token: resToken, date, time, people, createdAt: new Date().toISOString()
  }).then(() => {
    submittingReservationChange = false;
    resEditing = false;
  }).catch(e => {
    console.error(e);
    submittingReservationChange = false;
    if(btn){ btn.disabled = false; btn.textContent = t('resManage.saveBtn'); }
    showInlineError(t('error.envio'));
  });
}
async function cancelMyReservation(){
  if(cancellingReservation) return;
  if(!(await confirmModal(t('resManage.confirmCancel'), {danger:true}))) return;
  cancellingReservation = true;
  const btn = document.getElementById('res-cancel-btn');
  // No hace falta un mensaje de éxito aparte: el propio listener en vivo de
  // reservationStatus (renderReservationManageView) repinta la pantalla
  // sola en cuanto el negocio procese la cancelación — normalmente
  // al instante si tiene la app abierta, como con cualquier solicitud
  // nueva. Mientras tanto, el botón deja claro que ya se ha enviado.
  if(btn){ btn.disabled = true; btn.textContent = t('resManage.cancelSending'); }
  db.ref('gastrogoan/public/' + publicId + '/requests').push({
    type: 'reserva_cancelar', token: resToken, createdAt: new Date().toISOString()
  }).then(() => {
    cancellingReservation = false;
  }).catch(e => {
    console.error(e);
    cancellingReservation = false;
    if(btn){ btn.disabled = false; btn.textContent = t('resManage.cancelBtn'); }
    showInlineError(t('error.envio'));
  });
}

init();
</script>

</body>
</html>

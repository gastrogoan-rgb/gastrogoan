// Mismo criterio que ya usa el TPV interno (isBebidaCarta, js/tpv.js): las
// cartas de bebidas (área "sala") siempre se muestran antes que las de
// comida, sea cual sea el orden en que se crearon.
function isBebidaCarta(c){
  if(c && c.area) return c.area === 'sala';
  return /bebida/i.test(c.nombre||'');
}
function getActiveCartas(){
  const ids = DB.activeCartaIds || [];
  const active = (DB.cartas || []).filter(c => ids.includes(c.id));
  const bebidaCartas = active.filter(isBebidaCarta);
  const comidaCartas = active.filter(c => !isBebidaCarta(c));
  return [...bebidaCartas, ...comidaCartas];
}

// Promo con descuento activa AHORA MISMO (día + franja horaria) para un
// plato, si la hay — espejo simplificado de getActivePromoForDish/
// promoTimeActiveNow (js/app.js): aquí no hace falta comprobar el límite de
// usos porque el mirror público (getActivePromosForSync, js/core.js) ya
// deja de publicar la promo en cuanto se agota el cupo del día.
function getActivePromoForPlatoPublic(platoId){
  const promo = (DB.promos||[]).find(p => p.menuItemPlatoId === platoId);
  if(!promo) return null;
  if(!promo.horaInicio || !promo.horaFin) return promo;
  const toMin = hhmm => { const [h,m] = (hhmm||'').split(':').map(Number); return (h||0)*60+(m||0); };
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  const start = toMin(promo.horaInicio), end = toMin(promo.horaFin);
  const active = end > start ? (nowMin >= start && nowMin < end) : (nowMin >= start || nowMin < end);
  return active ? promo : null;
}
function promoDiscountedPrice(precio, promo){
  return Math.round(precio * (1 - promo.discountPct/100) * 100) / 100;
}

function renderApp(){
  // Encuesta de satisfacción privada (NPS): enlace aparte (?nps=1) que el
  // negocio manda tras la visita, distinto del enlace de reseña pública de
  // Google — sirve para detectar a alguien insatisfecho ANTES de que dejara
  // una mala reseña pública, y solo el negocio ve la nota y el comentario.
  if(new URLSearchParams(location.search).get('nps') === '1'){
    renderNpsSurvey();
    return;
  }
  // Seguimiento de un pedido ya enviado (?track=token): pantalla aparte,
  // con su propio listener en vivo — no pasa por las pestañas normales.
  if(trackToken){
    renderOrderTrackingView();
    return;
  }
  // Gestión de una reserva ya enviada (?res=token): misma idea, pantalla
  // aparte con su propio listener.
  if(resToken){
    renderReservationManageView();
    return;
  }
  const tabs = computeTabs();

  if(!tabs.length){
    document.getElementById('app').innerHTML = `<div class="empty">${t('no.services')}</div>`;
    return;
  }

  if(!currentTab || !tabs.some(t=>t.id===currentTab)){
    currentTab = (tableIdFromUrl && tabs.some(t=>t.id==='mesa')) ? 'mesa' : tabs[0].id;
  }
  cart = [];
  cartTipPct = 0; cartTipCustom = 0;

  document.getElementById('app').innerHTML = `
    <div class="tabs" role="tablist">
      ${renderTabButtonsHtml(tabs)}
    </div>
    <div id="tab-content" role="tabpanel"></div>
  `;
  renderTabContent();
}

// Pedido en mesa SOLO se ofrece llegando desde el QR de la mesa (que ya
// trae el número de mesa en la URL) — antes también aparecía como pestaña
// normal con un desplegable para elegir mesa a mano, redundante con lo que
// ya hacen los QR de cada mesa y una vía más para que un pedido llegara sin
// que quedara claro a qué mesa.
function computeTabs(){
  const tiposServicio = (DB.business && DB.business.tiposServicio) || {mesa:true, takeaway:true, delivery:true};
  const tabs = [];
  if(tiposServicio.mesa !== false) tabs.push({id:'reserva', label: t('tab.reserva')});
  if(tiposServicio.mesa !== false && tableIdFromUrl && (DB.tables||[]).length) tabs.push({id:'mesa', label: t('tab.mesa.qr')});
  if(tiposServicio.takeaway !== false) tabs.push({id:'takeaway', label: t('tab.takeaway')});
  if(tiposServicio.delivery !== false) tabs.push({id:'delivery', label: t('tab.delivery')});
  return tabs;
}
function renderTabButtonsHtml(tabs){
  return tabs.map(t2 => `<button class="tab-btn tab-${String(t2.id).replace(/[^a-z]/gi,'-')} ${currentTab===t2.id?'active':''}" role="tab" aria-selected="${currentTab===t2.id}" onclick="setTab('${t2.id}')">${String(t2.label).replace(/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+/u,'')}</button>`).join('');
}
// Cambiar de idioma repintaba el contenido de la pestaña activa pero no los
// propios títulos de las pestañas — se quedaban congelados en el idioma
// con el que se cargó la página la primera vez.
function renderTabBar(){
  const box = document.querySelector('.tabs');
  if(!box) return;
  box.innerHTML = renderTabButtonsHtml(computeTabs());
}

async function setTab(tab){
  if(tab === currentTab) return;
  // Cambiar de pestaña vacía el carrito (son pedidos distintos: para llevar,
  // delivery, en mesa...) — antes se perdía sin más ni un aviso, así que un
  // toque sin querer en otra pestaña tiraba todo lo que el cliente llevaba
  // añadido sin poder deshacerlo.
  if(cart.length && !(await confirmModal(t('confirm.loseCart')))) return;
  currentTab = tab;
  cart = [];
  cartTipPct = 0; cartTipCustom = 0;
  // Volver también al índice de carpetas de la carta: si no, al cambiar de
  // Take Away a Delivery el cliente seguía "dentro" de la última familia que
  // había abierto (p.ej. solo Entrantes), dando la impresión de que en esa
  // otra pestaña hay muchos menos platos.
  menuOpenSection = null;
  renderApp();
}

function renderTabContent(){
  if(currentTab === 'reserva') renderReservaForm();
  else if(currentTab === 'mesa') renderMesaOrderForm();
  else renderOrderForm();
  const box = document.getElementById('tab-content');
  if(box){ box.classList.remove('fade-in-play'); void box.offsetWidth; box.classList.add('fade-in-play'); }
}

/* ============ HORARIOS ============ */
const DIAS_SEMANA_I18N = {
  es:['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],
  en:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],
  ca:['Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte','Diumenge']
};
function getDiasSemana(){ return DIAS_SEMANA_I18N[currentLang] || DIAS_SEMANA_I18N.es; }

// Devuelve los turnos (franjas horarias) del día de la semana correspondiente
// a dateStr, o null si el negocio no ha configurado horario (sin restricción).
function getTurnosForDate(dateStr){
  const horario = (DB.business || {}).horario;
  if(!horario || horario.length !== 7) return null;
  const jsDay = new Date(dateStr + 'T00:00:00').getDay(); // 0=domingo..6=sábado
  const d = horario[(jsDay + 6) % 7]; // 0=lunes..6=domingo
  if(!d || d.abierto === false) return [];
  const turnos = [];
  const add = (ini, fin) => { if(ini && fin && fin > ini) turnos.push({abre:ini, cierra:fin}); };
  // Formato nuevo: {modo:'seguido'|'turnos', seguido:{ini,fin}, turnos:[{ini,fin}]}
  if(d.modo === 'seguido' && d.seguido){
    add(d.seguido.ini, d.seguido.fin);
  } else if(Array.isArray(d.turnos)){
    d.turnos.forEach(t => t && add(t.ini, t.fin));
  } else {
    // Formato antiguo: {t1i,t1f,t2i,t2f}
    add(d.t1i, d.t1f);
    add(d.t2i, d.t2f);
  }
  // Un día marcado como abierto pero sin ninguna franja horaria rellenada
  // (el estado de fábrica: defaultHorario() deja ini/fin en blanco) no
  // significa "cerrado" — significa que el negocio aún no ha configurado
  // Horario de apertura en Mi Negocio. Sin esto, esta página bloqueaba
  // CUALQUIER reserva/pedido (isTimeAllowed devuelve false para un array
  // vacío) hasta que alguien rellenara el horario — mismo fix que ya tenía
  // el panel interno (js/menu.js), que aquí no se había aplicado.
  if(!turnos.length && d.abierto !== false) return null;
  return turnos;
}

function isTimeAllowed(dateStr, time){
  const turnos = getTurnosForDate(dateStr);
  if(turnos === null) return true;
  return turnos.some(t => time >= t.abre && time <= t.cierra);
}

// Hora límite real para hacer un PEDIDO (no una reserva) dentro del turno al
// que pertenece `time`: el cierre del turno menos los minutos que el
// negocio haya configurado en "Dejar de aceptar pedidos X min antes del
// cierre" (mn.pedidos.cierreAntes). Devuelve null si no hay cutoff
// configurado o `time` no cae dentro de ningún turno (ese caso ya lo separa
// isTimeAllowed).
function pedidosCutoffTimeForTurno(dateStr, time, p){
  const cutoffMin = parseInt(p.cierrePedidosAntesMin) || 0;
  if(!cutoffMin) return null;
  const turnos = getTurnosForDate(dateStr);
  if(!turnos) return null;
  const turno = turnos.find(t => time >= t.abre && time <= t.cierra);
  if(!turno) return null;
  const [ch, cm] = turno.cierra.split(':').map(Number);
  let limiteMin = ch * 60 + cm - cutoffMin;
  if(limiteMin < 0) limiteMin = 0; // cutoff mayor que la duración del turno: no se acepta ningún pedido en él
  const limite = String(Math.floor(limiteMin/60)).padStart(2,'0') + ':' + String(limiteMin%60).padStart(2,'0');
  return {limite, turno};
}

// Índice del turno al que pertenece `time` en `dateStr`, o null si no hay
// horario configurado o la hora no encaja en ninguno. Cierre EXCLUSIVO salvo
// en el último turno del día (inclusivo) — mismo criterio que
// getTurnoIndexForTime() en el panel interno (js/menu.js): antes aquí todos
// los cierres eran inclusivos, así que justo en el minuto de cambio de turno
// (p.ej. las 16:00 entre un turno 13-16 y otro 16-19) esta página podía
// calcular un turnoIdx distinto al que usa el panel interno.
function getTurnoIndexForTime(dateStr, time){
  const turnos = getTurnosForDate(dateStr);
  if(!turnos || !turnos.length) return null;
  const idx = turnos.findIndex((t, i) => time >= t.abre && (i === turnos.length - 1 ? time <= t.cierra : time < t.cierra));
  return idx === -1 ? null : idx;
}
// Devuelve {aforo, turnoIdx, reservados, disponible} o null si no hay aforo
// configurado o la hora no encaja en ningún turno. reservados es el último
// recuento SINCRONIZADO desde el panel interno (puede llevar algo de retraso
// respecto a reservas que otros clientes están completando ahora mismo) —
// la comprobación final de verdad es la transacción atómica al enviar.
function getAforoInfo(dateStr, time){
  const aforo = parseInt((DB.business||{}).aforo) || 0;
  if(!aforo) return null;
  const turnoIdx = getTurnoIndexForTime(dateStr, time);
  if(turnoIdx === null) return null;
  const resumen = (DB.reservasResumen||{})[dateStr] || {};
  const reservados = resumen[turnoIdx] || 0;
  return {aforo, turnoIdx, reservados, disponible: Math.max(0, aforo - reservados)};
}
// Reserva de forma ATÓMICA `people` plazas del turno, usando una transacción
// de Firebase sobre un contador de "holds" independiente del resumen ya
// sincronizado. Esto evita que dos clientes reservando casi a la vez (antes
// de que el panel interno vuelva a sincronizar el resumen) puedan juntos
// superar el aforo sin que ninguno de los dos lo viera en su momento. Si la
// transacción no se puede completar sin pasarse del aforo, se aborta
// (result.committed === false) y no se ha reservado nada.
function reserveAforoAtomic(dateStr, turnoIdx, people, aforo, baseline){
  const ref = db.ref('gastrogoan/public/' + publicId + '/aforoHold/' + dateStr + '/' + turnoIdx);
  return ref.transaction(current => {
    const held = current || 0;
    if(baseline + held + people > aforo) return; // abort: se pasaría del aforo
    return held + people;
  });
}
// Antes había un margen que dejaba emparejar una mesa MÁS PEQUEÑA que el
// grupo (mesa de 4 aceptando un grupo de 5) — decisión del dueño: una mesa
// nunca puede ser más pequeña que el grupo que se sienta en ella, así que
// esto se quitó. El único margen que queda es por ARRIBA, y no decide si
// cabe o no (eso ahora es estricto): decide si la reserva se autoconfirma
// sola o si el personal la revisa a mano por no querer bloquear en
// automático una mesa grande para un grupo pequeño (ver AUTO_CONFIRM_MARGIN
// en js/core.js, que es quien de verdad decide el estado de la reserva).

// Cuánto tiempo ocupa una reserva la mesa antes de poder volver a
// reservarse — configurable en Mi Negocio (mn-reserva-duracion), 90 min por
// defecto. Mismo valor y mismo concepto que reservaVentanaMin() en el panel
// interno (js/app.js), pero es un archivo aparte sin acceso a ese código.
function getReservaDuracionMin(){
  return parseInt((DB.business||{}).reservaDuracionMin) || 90;
}
// Franjas de 30 min que ocupa una reserva de `time` a `time + duración`
// (p.ej. 14:00 con 90 min -> ["14:00","14:30","15:00"], libre desde las
// 15:30). Misma rejilla de 30 min que ya usa getReservationTimeSlots() en
// el panel interno.
function slotsForReservation(time, durationMin){
  const [h, m] = time.split(':').map(Number);
  const start = h * 60 + m;
  const end = start + durationMin;
  // Hallazgo real de auditoría: al arrancar la rejilla desde la hora EXACTA
  // de cada reserva (14:00 → 14:00/14:30/15:00; 14:15 → 14:15/14:45/15:15),
  // dos reservas que se solapan de verdad no comparten ninguna franja y el
  // candado atómico de la mesa no detecta el choque. Al encajar el inicio
  // en la misma rejilla fija de 15 min que usa el calendario (nunca la hora
  // exacta que haya escrito el cliente), cualquier solape real de al menos
  // 15 minutos comparte siempre al menos una franja.
  let cur = start - (start % 15);
  const slots = [];
  while(cur < end){
    slots.push(String(Math.floor(cur / 60)).padStart(2, '0') + ':' + String(cur % 60).padStart(2, '0'));
    cur += 15;
  }
  return slots;
}
// Mayor capacidad entre las mesas dadas de alta (con plazas configuradas).
// Si un grupo no cabe ni en la mesa más grande ni con margen, es que hace
// falta juntar mesas — algo que ya no puede decidir la web sola.
function getMaxTableCapacity(){
  return Math.max(0, ...(DB.tables || []).filter(tb => tb.plazas).map(tb => tb.plazas));
}
// Franjas ya ocupadas de una mesa concreta ese día, según el espejo
// sincronizado (DB.mesasOcupadas, sin ningún dato de cliente — solo qué
// mesa y qué franjas).
function getOccupiedSlotsForTable(dateStr, tableId){
  return ((DB.mesasOcupadas || {})[dateStr] || {})[tableId] || {};
}
function tableFreeForSlots(dateStr, tableId, slots){
  const occupied = getOccupiedSlotsForTable(dateStr, tableId);
  return slots.every(s => !occupied[s]);
}
// Mejor mesa libre para un grupo de `people` personas en esas franjas: la
// más pequeña que cumple people <= plazas + margen y no choca con ninguna
// reserva ya existente en esa mesa. Solo se consideran mesas con capacidad
// configurada — una sin plazas no se puede juzgar.
// ⚠️ Decisión del dueño (1/10): una mesa vale si le caben todos y no le
// sobran más de dos sillas (3 personas → mesas de 3 a 5). La app aplica la
// MISMA regla al recibir la reserva (mesaEncajaGrupo, js/core.js): si no
// coincidieran, la web ofrecería mesas que la app luego deja pendientes.
const MESA_MARGEN_PLAZAS = 2;
function mesaEncajaGrupo(tb, people){
  const plazas = parseInt(tb && tb.plazas) || 0;
  return plazas >= people && plazas <= people + MESA_MARGEN_PLAZAS;
}
function getEligibleTables(dateStr, people, slots){
  return (DB.tables || [])
    .filter(tb => mesaEncajaGrupo(tb, people) && tableFreeForSlots(dateStr, tb.id, slots))
    .sort((a, b) => a.plazas - b.plazas);
}
function getBestFitTable(dateStr, time, people, slots){
  return getEligibleTables(dateStr, people, slots)[0] || null;
}
// ¿Existe en el local ALGUNA mesa de ese tamaño, libre o no? Si no, ninguna
// hora va a salir en verde y no tiene sentido enseñar un calendario todo en
// rojo: se le dice que llame, igual que a un grupo grande.
function hayMesaDeEseTamano(people){
  return (DB.tables || []).some(tb => mesaEncajaGrupo(tb, people));
}
// Grupos: a partir de X personas (Mi Negocio) no se reserva por la web.
function esGrupoPorTelefono(people){
  const desde = parseInt((DB.business || {}).reservaConfirmManualDesde) || 0;
  return desde > 0 && people >= desde;
}
// Motivo por el que este número de personas no puede reservar online, o null.
function motivoSinReservaOnline(people){
  if(esGrupoPorTelefono(people)) return 'grupo';
  if((DB.tables||[]).some(tb => tb.plazas) && !hayMesaDeEseTamano(people)) return 'sinMesa';
  return null;
}
function avisoGrupoHtml(people, motivo){
  const b = DB.business || {};
  const phone = (b.phone || '').trim(), email = (b.email || '').trim();
  const desde = parseInt(b.reservaConfirmManualDesde) || people;
  const titulo = motivo === 'grupo' ? t('grupo.titulo').replace('%d', desde) : '';
  const texto = motivo === 'grupo' ? t('grupo.texto') : t('grupo.sinMesa').replace('%d', people);
  const asunto = encodeURIComponent(t('grupo.asunto').replace('%d', people));
  return `<div class="grp-aviso">
    ${titulo ? `<div class="grp-titulo">${escapeHtml(titulo)}</div>` : ''}
    <p>${escapeHtml(texto)}</p>
    <div class="grp-acciones">
      ${phone ? `<a class="btn btn-primary grp-btn" href="tel:${escapeHtml(phone.replace(/\s+/g,''))}">${t('grupo.llamar')} · ${escapeHtml(phone)}</a>` : ''}
      ${email ? `<a class="btn grp-btn" href="mailto:${escapeHtml(email)}?subject=${asunto}">${t('grupo.escribir')}</a>` : ''}
    </div>
  </div>`;
}
// Reserva de forma ATÓMICA una mesa concreta para esas franjas, usando una
// transacción de Firebase sobre un "candado" independiente del resumen ya
// sincronizado. Esto evita que dos clientes casi a la vez (antes de que el
// panel interno vuelva a sincronizar mesasOcupadas) se lleven la misma
// franja de la misma mesa sin que ninguno de los dos lo viera en su
// momento. Si alguna franja ya estaba cogida, se aborta (result.committed
// === false) y no se reserva nada — la transacción entera es sobre el
// mismo nodo (todas las franjas de esa mesa ese día), así que dos
// solicitudes que choquen SIEMPRE se serializan entre sí.
function reserveTableAtomic(dateStr, tableId, slots){
  const ref = db.ref('gastrogoan/public/' + publicId + '/mesaHold/' + dateStr + '/' + tableId);
  return ref.transaction(current => {
    const held = current || {};
    for(const s of slots){ if(held[s]) return; } // abort: alguna franja ya está cogida
    const merged = Object.assign({}, held);
    slots.forEach(s => { merged[s] = true; });
    return merged;
  });
}
// Deshace una reserva de aforo ya confirmada, si después la mesa no se pudo
// reservar (dos pasos no atómicos entre sí: aforo primero, mesa después —
// si el segundo falla, hay que devolver el hueco del primero). El resumen
// sincronizado del panel interno recalcula este contador desde cero en
// cada sync de todos modos, así que un desajuste puntual aquí se autocorrige.
function releaseAforoHold(dateStr, turnoIdx, people){
  const ref = db.ref('gastrogoan/public/' + publicId + '/aforoHold/' + dateStr + '/' + turnoIdx);
  return ref.transaction(current => Math.max(0, (current || 0) - people));
}

// Mismo mecanismo que reserveAforoAtomic pero para el límite de pedidos por
// franja de 30 min (mn.pedidos.maxPorFranja): evita que dos pedidos casi
// simultáneos para la misma franja superen juntos el límite que el negocio
// ha configurado, antes de que el resumen sincronizado se actualice.
function roundToPedidoSlot(time){
  const parts = (time||'').split(':');
  const h = parseInt(parts[0], 10) || 0;
  const m = parseInt(parts[1], 10) || 0;
  return String(h).padStart(2,'0') + ':' + (m < 30 ? '00' : '30');
}
function reservePedidoSlotAtomic(dateStr, slot, max, baseline){
  const ref = db.ref('gastrogoan/public/' + publicId + '/pedidosHold/' + dateStr + '/' + slot);
  return ref.transaction(current => {
    const held = current || 0;
    if(baseline + held + 1 > max) return; // abort: se pasaría del límite
    return held + 1;
  });
}
// Hallazgo de una auditoría externa: la franja se reservaba aquí, pero si
// una comprobación POSTERIOR (zona de reparto fuera de cobertura) rechazaba
// el pedido, el hold se quedaba ocupado sin ningún pedido real detrás — el
// negocio limpia estos holds en cada sincronización de su propio panel
// (limpiarHolds, js/core.js), así que no queda bloqueado para siempre, pero
// sí puede tapar un hueco real durante el resto del servicio si el negocio
// no vuelve a sincronizar hasta el día siguiente. Se libera explícitamente
// en el momento del fallo en vez de esperar a que otro dispositivo lo limpie.
function releasePedidoSlot(dateStr, slot){
  const ref = db.ref('gastrogoan/public/' + publicId + '/pedidosHold/' + dateStr + '/' + slot);
  ref.transaction(current => Math.max(0, (current || 0) - 1)).catch(()=>{});
}

function formatTurnos(turnos){
  return turnos.map(t => `${t.abre}–${t.cierra}`).join(' y ');
}

function nombreDia(dateStr){
  const jsDay = new Date(dateStr + 'T00:00:00').getDay();
  return getDiasSemana()[(jsDay + 6) % 7];
}

function horarioHintHtml(dateStr){
  const turnos = getTurnosForDate(dateStr);
  if(turnos === null) return '';
  if(!turnos.length) return `<p style="font-size:13px;color:var(--red);margin-top:-8px">${t('hint.cerrado').replace('%s', nombreDia(dateStr).toLowerCase())}</p>`;
  return `<p style="font-size:13px;color:var(--muted);margin-top:-8px">${t('hint.horario').replace('%s', nombreDia(dateStr).toLowerCase()).replace('%s', formatTurnos(turnos))}</p>`;
}

function updateTimeInputRange(dateInputId, timeInputId, hintBoxId){
  const date = document.getElementById(dateInputId).value;
  const turnos = getTurnosForDate(date);
  const timeInput = document.getElementById(timeInputId);
  const hintBox = document.getElementById(hintBoxId);
  hintBox.innerHTML = horarioHintHtml(date);
  if(turnos && turnos.length){
    timeInput.min = turnos[0].abre;
    timeInput.max = turnos[turnos.length - 1].cierra;
  }else{
    timeInput.removeAttribute('min');
    timeInput.removeAttribute('max');
  }
}
// Primer turno que empieza EN O DESPUÉS de minTime (hoy con antelación
// mínima) — o, si ya estamos dentro de un turno, ese mismo turno. Hallazgo
// real de auditoría: applyLeadTime() solo miraba el primer turno del día y
// el último cierre, así que con un horario partido (13-16 y 20-23) y
// "ahora + antelación" cayendo en el descanso (17:30), sugería esa hora
// como mínima aunque el negocio estuviera cerrado — el envío final sí lo
// rechazaba, pero el aviso llevaba al cliente a un hueco que no existe.
function primerTurnoDesde(turnos, minTime){
  for(const tn of turnos){
    if(minTime <= tn.cierra) return tn.abre > minTime ? tn.abre : minTime;
  }
  return null; // no queda ningún turno hoy a partir de esa hora
}

/* ============ TIEMPO DE ANTELACIÓN / ZONA DE REPARTO ============ */
// Si el pedido/reserva es para hoy, no se puede elegir una hora anterior a
// "ahora + tiempo de antelación configurado por el restaurante". Reservas y
// pedidos tienen cada uno su propio ajuste (Mi Negocio → Operativa); si un
// negocio antiguo aún no tiene los campos nuevos, ambos caen al ajuste
// único que había antes de separarlos.
function getLeadTimeMin(kind){
  const b = DB.business || {};
  const specific = kind === 'reserva' ? b.leadTimeMinReservas : b.leadTimeMinPedidos;
  if(specific != null) return parseInt(specific) || 0;
  if(b.leadTimeMin != null) return parseInt(b.leadTimeMin) || 0;
  return parseInt((b.pedidos||{}).leadTimeMin) || 0;
}
function applyLeadTime(dateInputId, timeInputId, hintBoxId, kind){
  const leadTimeMin = getLeadTimeMin(kind);
  const date = document.getElementById(dateInputId).value;
  const timeInput = document.getElementById(timeInputId);
  const hintBox = document.getElementById(hintBoxId);
  if(!leadTimeMin || date !== todayStr()) return;

  const now = new Date(Date.now() + leadTimeMin * 60000);
  let minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  // Antes solo se comparaba contra timeInput.min (apertura del PRIMER turno
  // / último cierre, puestos por updateTimeInputRange) — con un horario
  // partido, "ahora + antelación" podía caer en el descanso entre turnos y
  // el aviso ofrecía esa hora igualmente, aunque el negocio estuviera
  // cerrado hasta el turno siguiente. Aquí se salta ese hueco de verdad.
  const turnos = getTurnosForDate(date);
  if(turnos && turnos.length){
    const siguiente = primerTurnoDesde(turnos, minTime);
    minTime = siguiente || turnos[turnos.length - 1].cierra; // sin más turnos hoy: no queda hora válida
  }

  if(!timeInput.min || minTime > timeInput.min) timeInput.min = minTime;
  if(timeInput.value && timeInput.value < timeInput.min) timeInput.value = timeInput.min;

  // El aviso tiene que decir la hora mínima REAL, ya acotada por el horario
  // del negocio y por el próximo turno (ver arriba) — antes mostraba
  // siempre "ahora + antelación" a secas, contradiciendo el horario que se
  // acaba de mostrar encima.
  const minTimeReal = timeInput.min || minTime;
  const hint = `<p style="font-size:13px;color:var(--muted);margin-top:-8px">${t('hint.antelacion').replace('%s', minTimeReal).replace('%d', leadTimeMin)}</p>`;
  hintBox.innerHTML = (hintBox.innerHTML || '') + hint;
}

// Distancia en km entre dos puntos (fórmula de Haversine).
function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Aviso al momento, tecla a tecla, de si ese código postal entra en zona —
// para no hacer esperar al cliente a rellenar toda la dirección y darle al
// botón para enterarse. Solo cuando la zona se define por lista de códigos
// postales: con radio (p.radiusKm) haría falta geocodificar en cada tecla,
// que es lento y consume la cuota gratuita de Nominatim sin necesidad — ahí
// se sigue comprobando solo al enviar (checkDeliveryZone).
function checkCpLive(){
  const el = document.getElementById('o-cp');
  const hint = document.getElementById('o-cp-hint');
  if(!el || !hint) return;
  const cp = el.value.trim();
  const p = (DB.business||{}).pedidos || {};
  const cpList = p.cpList || [];
  if(!cpList.length || !cp){ hint.textContent = ''; return; }
  if(cpList.includes(cp)){
    hint.style.color = 'var(--green)';
    hint.textContent = t('cp.enZona');
  } else {
    hint.style.color = 'var(--red)';
    hint.textContent = t('cp.fueraDeZona').replace('${lista}', cpList.join(', '));
  }
}

// Comprueba si una dirección/código postal de entrega está dentro de la
// zona de reparto configurada (código postal aceptado o dentro del radio).
// Devuelve {ok, pendienteVerificar}: si el geocodificador falla dos veces
// (red caída, timeout de Nominatim...) no bloqueamos un pedido potencialmente
// válido; lo dejamos pasar marcado para que el negocio revise la dirección
// manualmente antes de aceptarlo.
async function checkDeliveryZone(p, codigoPostal, direccion){
  const cpList = p.cpList || [];
  if(cpList.length && cpList.includes(codigoPostal)) return {ok:true};

  if(p.radiusKm > 0 && p.lat != null && p.lng != null){
    const geocode = async () => {
      const q = encodeURIComponent(direccion + ', ' + codigoPostal);
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + q);
      const data = await res.json();
      return (data && data[0]) ? data[0] : null;
    };
    let point = null;
    try{ point = await geocode(); }catch(e){ console.error(e); point = null; }
    if(!point){
      // Un único reintento tras una breve espera antes de darnos por vencidos.
      await new Promise(r => setTimeout(r, 1200));
      try{ point = await geocode(); }catch(e){ console.error(e); point = null; }
    }
    if(point){
      const dist = haversineKm(p.lat, p.lng, parseFloat(point.lat), parseFloat(point.lon));
      return {ok: dist <= p.radiusKm};
    }
    if(!cpList.length) return {ok:true, pendienteVerificar:true};
  }

  // Si no hay ninguna zona configurada, no se restringe.
  if(!cpList.length && !(p.radiusKm > 0)) return {ok:true};
  return {ok:false};
}

/* ============ CALENDARIO INTERACTIVO DE DISPONIBILIDAD ============
   Antes había que rellenar fecha y hora a ciegas y enterarte de si había
   sitio solo al enviar el formulario entero. Ahora se ve de un vistazo,
   por día/semana/mes, y en verde/rojo según los comensales que ya se
   hayan puesto arriba — la misma comprobación que hace submitReserva al
   enviar, solo que aquí se repite muchas veces (una por franja) para
   pintar el calendario, así que se separa en checkSlotFree() para no
   duplicar la lógica de mesas/aforo en dos sitios que puedan desincronizarse. */
let calView = 'dia'; // 'dia' | 'semana' | 'mes'
let calDate = null;  // fecha (YYYY-MM-DD) que se está mirando ahora mismo
let calSelectedTime = null;
let calSelectedTable = null; // id de la mesa que ha elegido el cliente

function currentPeopleValue(){
  return Math.min(50, Math.max(1, parseInt(document.getElementById('r-people')?.value) || 1));
}

// Huecos de 30 en 30 min dentro de los turnos configurados ese día. Si el
// negocio no tiene horario configurado (getTurnosForDate devuelve null),
// no hay ninguna franja que ofrecer aquí — ese caso ya se trata aparte en
// computeDayStatus como "sin restricción" (cualquier hora vale).
// Huecos de 15 en 15 min. El último posible se queda a un margen de 30 min
// ANTES del cierre (no en el cierre mismo): una reserva necesita algo de
// tiempo para servirse, y "reservar mesa a la hora exacta de cerrar" no
// tiene sentido para ningún restaurante — antes se ofrecía hueco hasta el
// propio minuto de cierre.
const RESERVA_MARGEN_CIERRE_MIN = 30;
function slotsDelDia(dateStr){
  const turnos = getTurnosForDate(dateStr);
  if(!turnos || !turnos.length) return [];
  const out = [];
  turnos.forEach(t => {
    const [ih, im] = t.abre.split(':').map(Number);
    const [fh, fm] = t.cierra.split(':').map(Number);
    let cur = ih * 60 + im;
    const fin = (fh * 60 + fm) - RESERVA_MARGEN_CIERRE_MIN;
    while(cur <= fin){
      out.push(String(Math.floor(cur/60)).padStart(2,'0') + ':' + String(cur%60).padStart(2,'0'));
      cur += 15;
    }
  });
  return out;
}
// Hora mínima reservable HOY según la antelación configurada — mismo
// cálculo que applyLeadTime, pero sin depender de un &lt;input&gt; del DOM.
function reservaMinTimeHoy(){
  const leadTimeMin = getLeadTimeMin('reserva');
  if(!leadTimeMin) return null;
  const now = new Date(Date.now() + leadTimeMin * 60000);
  return String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}
// Misma comprobación que hace submitReserva al enviar de verdad (mesas +
// aforo), extraída aparte para poder repetirla franja a franja al pintar
// el calendario sin que las dos copias puedan desincronizarse con el
// tiempo. Un grupo más grande que la mesa más grande (needsManualReview)
// se pinta como disponible: la app ya deja pasar esos casos para que el
// negocio los revise a mano, en vez de rechazarlos sin más.
function checkSlotFree(dateStr, time, people){
  if(motivoSinReservaOnline(people)) return false;
  const hasConfiguredTables = (DB.tables||[]).some(tb => tb.plazas);
  if(hasConfiguredTables){
    const slots = slotsForReservation(time, getReservaDuracionMin());
    if(!getBestFitTable(dateStr, time, people, slots)) return false;
  }
  const aforoInfo = getAforoInfo(dateStr, time);
  if(aforoInfo && people > aforoInfo.disponible) return false;
  return true;
}
// Estado de un día entero para pintar semana/mes de un vistazo:
// 'cerrado' | 'lleno' | 'libre'. Un día sin horario configurado se pinta
// como 'libre' (la app no restringe nada en ese caso, igual que hoy).
function computeDayStatus(dateStr, people){
  if(dateStr < todayStr()) return 'pasado';
  const turnos = getTurnosForDate(dateStr);
  if(turnos === null) return 'libre';
  if(!turnos.length) return 'cerrado';
  const minHoy = dateStr === todayStr() ? reservaMinTimeHoy() : null;
  const slots = slotsDelDia(dateStr).filter(s => !minHoy || s >= minHoy);
  if(!slots.length) return 'cerrado';
  const hayLibre = slots.some(s => checkSlotFree(dateStr, s, people));
  return hayLibre ? 'libre' : 'lleno';
}
// ⚠️ NUNCA toISOString() aquí: convierte a UTC, y en cualquier huso por
// delante de UTC (España incluida, todo el año) la medianoche local cae en
// el día UTC ANTERIOR — "31 de agosto + 0 días" devolvía "30 de agosto".
// Eso desplazaba TODO un día: la cuadrícula del mes salía descuadrada
// (el 7 de septiembre aparecía en la columna del miércoles en vez de la
// del lunes) y las flechas de ir adelante/atrás parecían fallar a ratos,
// porque el desplazamiento cambiaba según la hora del día. Mismo criterio
// que ya usa todayStr(): año/mes/día en LOCAL, nunca ISO/UTC.
function addDaysStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addMonthsStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function renderReservaCalendar(){
  const box = document.getElementById('r-cal');
  if(!box) return;
  const people = currentPeopleValue();
  const motivo = motivoSinReservaOnline(people);
  const btnEnviar = document.getElementById('r-submit');
  if(btnEnviar) btnEnviar.disabled = !!motivo;
  if(motivo){
    calSelectedTime = null; calSelectedTable = null;
    document.getElementById('r-time').value = '';
    box.innerHTML = avisoGrupoHtml(people, motivo);
    return;
  }
  if(document.getElementById('r-date').value && document.getElementById('r-date').value !== calDate) calSelectedTime = null;
  // Si al cambiar de personas la hora elegida deja de tener mesa, se suelta.
  if(calSelectedTime && !checkSlotFree(calDate, calSelectedTime, people)){
    calSelectedTime = null; calSelectedTable = null;
    document.getElementById('r-time').value = '';
  }
  const tabs = `
    <div style="display:flex;gap:6px;margin-bottom:10px">
      ${['dia','semana','mes'].map(v => `<button type="button" class="btn btn-sm" style="flex:1;${calView===v?'background:var(--ink);color:#fff':''}" onclick="calSetView('${v}')">${t('cal.'+v)}</button>`).join('')}
    </div>`;
  let body = '';
  if(calView === 'dia'){
    const status = computeDayStatus(calDate, people);
    const minHoy = calDate === todayStr() ? reservaMinTimeHoy() : null;
    const slots = slotsDelDia(calDate).filter(s => !minHoy || s >= minHoy);
    body = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
        <button type="button" class="btn btn-sm" style="flex:0 0 44px;width:44px;padding:8px" ${calDate<=todayStr()?'disabled':''} onclick="calNav(-1)">‹</button>
        <strong style="font-size:13.5px;flex:1;text-align:center">${escapeHtml(fechaLegible(calDate))}</strong>
        <button type="button" class="btn btn-sm" style="flex:0 0 44px;width:44px;padding:8px" onclick="calNav(1)">›</button>
      </div>
      ${status === 'cerrado' ? `<p style="font-size:13px;color:var(--muted);text-align:center;padding:10px 0">${t('cal.cerrado')}</p>` :
        !slots.length ? `<p style="font-size:13px;color:var(--muted);text-align:center;padding:10px 0">${t('cal.sinHuecos')}</p>` : `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px">
        ${slots.map(s => {
          const libre = checkSlotFree(calDate, s, people);
          const selected = calSelectedTime === s;
          // El color de "elegido" NO puede ser --olive: es el color de marca
          // del negocio (personalizable), así que en un negocio con marca
          // naranja/roja se confundía visualmente con "no disponible". El
          // negro de aquí es el mismo que ya usan las pestañas Día/Semana/Mes
          // para "esto es lo activo" — no depende de ninguna marca y nunca
          // se puede confundir con el verde/rojo de disponibilidad.
          const estilo = selected
            ? 'background:var(--ink);color:#fff;border-color:var(--ink)'
            : libre
              ? 'background:var(--green-l);border-color:var(--green);color:var(--ink)'
              : 'background:var(--red-l);border-color:var(--red);color:var(--red);text-decoration:line-through';
          return `<button type="button" class="btn btn-sm" ${libre?'':'disabled'} style="min-height:40px;${estilo}" onclick="calPickSlot('${calDate}','${s}')">${s}</button>`;
        }).join('')}
      </div>
      ${selectorMesasHtml(people)}`}
    `;
  } else if(calView === 'semana'){
    const jsDay = new Date(calDate + 'T00:00:00').getDay();
    const monday = addDaysStr(calDate, -((jsDay + 6) % 7));
    const dias = Array.from({length:7}, (_, i) => addDaysStr(monday, i));
    body = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
        <button type="button" class="btn btn-sm" style="flex:0 0 44px;width:44px;padding:8px" ${addDaysStr(monday,-7)<todayStr() && monday<=todayStr() ?'disabled':''} onclick="calNav(-7)">‹</button>
        <strong style="font-size:12.5px;flex:1;text-align:center">${escapeHtml(fechaLegibleCorta(monday))} – ${escapeHtml(fechaLegibleCorta(dias[6]))}</strong>
        <button type="button" class="btn btn-sm" style="flex:0 0 44px;width:44px;padding:8px" onclick="calNav(7)">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
        ${dias.map(d => {
          const status = computeDayStatus(d, people);
          const numDia = new Date(d+'T00:00:00').getDate();
          return `<button type="button" class="btn btn-sm" style="flex-direction:column;min-height:52px;padding:4px 2px;${d===todayStr()?'border-color:var(--ink)':''}" ${status==='pasado'?'disabled':''} onclick="calGoToDay('${d}')">
            <span style="font-size:9.5px;color:var(--muted)">${getDiasSemana()[(new Date(d+'T00:00:00').getDay()+6)%7].slice(0,3)}</span>
            <span style="font-size:13px;font-weight:700">${numDia}</span>
            <span style="width:7px;height:7px;border-radius:50%;background:${CAL_DOT[status]};margin-top:2px"></span>
          </button>`;
        }).join('')}
      </div>
    `;
  } else { // mes
    const first = calDate.slice(0,8) + '01';
    const jsDay = new Date(first + 'T00:00:00').getDay();
    const startGrid = addDaysStr(first, -((jsDay + 6) % 7));
    const mesActual = calDate.slice(0,7);
    const celdas = Array.from({length:42}, (_, i) => addDaysStr(startGrid, i));
    body = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
        <button type="button" class="btn btn-sm" style="flex:0 0 44px;width:44px;padding:8px" onclick="calDate=addMonthsStr(calDate,-1);renderReservaCalendar()">‹</button>
        <strong style="font-size:13.5px;flex:1;text-align:center">${escapeHtml(nombreMes(calDate))}</strong>
        <button type="button" class="btn btn-sm" style="flex:0 0 44px;width:44px;padding:8px" onclick="calDate=addMonthsStr(calDate,1);renderReservaCalendar()">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:9.5px;color:var(--muted);text-align:center;margin-bottom:2px">
        ${getDiasSemana().map(d => `<div>${d.slice(0,1)}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">
        ${celdas.map(d => {
          const fueraDeMes = d.slice(0,7) !== mesActual;
          const status = computeDayStatus(d, people);
          const numDia = new Date(d+'T00:00:00').getDate();
          return `<button type="button" class="btn btn-sm" style="min-height:36px;padding:2px;flex-direction:column;opacity:${fueraDeMes?'.3':'1'};${d===todayStr()?'border-color:var(--ink)':''}" ${status==='pasado'?'disabled':''} onclick="calGoToDay('${d}')">
            <span style="font-size:11.5px">${numDia}</span>
            <span style="width:6px;height:6px;border-radius:50%;background:${CAL_DOT[status]}"></span>
          </button>`;
        }).join('')}
      </div>
    `;
  }
  box.innerHTML = tabs + body + `
    <div style="display:flex;gap:12px;margin-top:10px;font-size:11px;color:var(--muted)">
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CAL_DOT.libre};margin-right:4px"></span>${t('cal.leyendaLibre')}</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CAL_DOT.lleno};margin-right:4px"></span>${t('cal.leyendaLleno')}</span>
    </div>
  `;
}
function fechaLegible(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return getDiasSemana()[(d.getDay()+6)%7] + ' ' + d.getDate() + ' ' + nombreMes(dateStr).split(' ')[0];
}
function fechaLegibleCorta(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.getDate() + '/' + (d.getMonth()+1);
}
const MESES_I18N = {
  es: ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],
  ca: ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'],
  en: ['January','February','March','April','May','June','July','August','September','October','November','December'],
};
function nombreMes(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const nombres = MESES_I18N[currentLang] || MESES_I18N.es;
  return nombres[d.getMonth()] + ' ' + d.getFullYear();
}

// La señal puede pedirse SIEMPRE (depositMinPeople en 0 o sin poner) o solo
// a partir de un número de comensales (p.ej. "solo grupos de 8 o más") — un
// grupo de 2 no tiene por qué pagar señal si lo que preocupa al negocio son
// las mesas grandes que se quedan vacías si no se presentan.
function depositAppliesForPeople(people){
  const b = DB.business || {};
  if(!b.requireDeposit) return false;
  const minPeople = parseInt(b.depositMinPeople) || 0;
  return minPeople <= 0 || (parseInt(people) || 0) >= minPeople;
}

// Repinta SOLO el aviso de señal y el texto del botón cuando cambia el
// número de personas — sin esto, un negocio con "señal a partir de 8" le
// seguía pidiendo tarjeta a un grupo de 2, o al revés, nunca se la pedía a
// un grupo de 10 hasta recargar la página.
function updateDepositNoticeUi(){
  const box = document.getElementById('r-deposit-notice');
  const btn = document.getElementById('r-submit');
  if(!box || !btn) return;
  const people = document.getElementById('r-people')?.value;
  const applies = depositAppliesForPeople(people);
  box.innerHTML = applies ? `<div class="card" style="background:var(--bg-soft, #fff7ed);margin:10px 0;padding:10px 12px">
    <div style="font-size:13px;font-weight:600">💳 ${t('deposit.notice.title')}</div>
    <div style="font-size:12.5px;margin-top:4px">${t('deposit.notice.body').replace('${amount}', reservaDepositAmount())}</div>
    ${(DB.business.depositInstructions||'').trim() ? `<div style="font-size:12.5px;margin-top:6px;color:var(--muted)">${escapeHtml(DB.business.depositInstructions)}</div>` : ''}
  </div>` : '';
  btn.textContent = applies ? t('reserva.submitWithDeposit') : t('reserva.submit');
}

// Calcula el importe de la señal para la reserva actual (según el tipo
// configurado: fijo, o por persona multiplicado por los comensales del
// formulario en este momento).
function reservaDepositAmount(){
  const b = DB.business || {};
  const amount = parseFloat(b.depositAmount) || 0;
  if(b.depositType === 'perPerson'){
    const people = parseInt(document.getElementById('r-people')?.value) || 1;
    return (amount * people).toFixed(2);
  }
  return amount.toFixed(2);
}

// Punto único de envío de una reserva: si pide señal (y el TPV virtual está
// disponible), va a pagar antes de crearse; si no, se manda tal cual, como
// siempre. Reemplaza los 3 sendRequest(req, ...) que había sueltos en
// submitReserva (uno por cada camino: sin mesas configuradas, éxito de la
// reserva atómica, y fallback si la transacción atómica falla por red).
function sendReservaRequest(req, successMsg){
  if(req.depositRequired){
    payWithCard(req, req.depositAmount, t('deposit.paymentDescription'), 'resToken', 'r-submit');
    return;
  }
  sendRequest(req, successMsg);
}

function submitReserva(){
  if(submittingRequest) return;
  submittingRequest = true;
  setBtnLoading('r-submit', true);
  const clientName = document.getElementById('r-name').value.trim();
  const clientPhone = document.getElementById('r-phone').value.trim();
  const clientEmail = document.getElementById('r-email').value.trim();
  const date = document.getElementById('r-date').value;
  const time = document.getElementById('r-time').value;
  // El "max" del input es solo una pista visual del navegador — se puede
  // teclear/pegar cualquier número saltándosela, así que se acota aquí
  // también (evita reservas de miles de comensales cuando el negocio aún
  // no tiene aforo/mesas configurados, que es cuando no hay más validación).
  const people = Math.min(50, Math.max(1, parseInt(document.getElementById('r-people').value) || 1));
  const notes = document.getElementById('r-notes').value.trim();
  const referral = document.getElementById('r-referral')?.value || '';

  clearFieldInvalid(['r-name','r-phone','r-email','r-date','r-time']);
  if(!clientName || !clientPhone || !clientEmail || !date || !time){
    if(!clientName) markFieldInvalid('r-name');
    if(!clientPhone) markFieldInvalid('r-phone');
    if(!clientEmail) markFieldInvalid('r-email');
    if(!date) markFieldInvalid('r-date');
    if(!time) markFieldInvalid('r-time');
    showInlineError(t('error.campos.reserva'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  // El "min" del &lt;input type=date&gt; también es solo una pista del navegador
  // (editable a mano, o con el reloj del dispositivo cambiado) — se revalida
  // aquí que no sea una fecha ya pasada respecto a "hoy" en el propio envío.
  if(date < todayStr()){
    markFieldInvalid('r-date');
    showInlineError(t('error.campos.reserva'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  // Validación básica de formato: sin esto, un email mal escrito por prisa
  // ("laura@gmial.con") pasaría como válido y la reserva se auto-confirmaría
  // sin que el cliente llegase a enterarse nunca por ningún sitio.
  if(!isValidEmail(clientEmail)){
    markFieldInvalid('r-email');
    showInlineError(t('error.email.invalido'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  if(!document.getElementById('r-privacy-consent').checked){
    showInlineError(t('privacy.mustAccept'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }

  const turnos = getTurnosForDate(date);
  if(turnos !== null && !turnos.length){
    showInlineError(t('error.cerrado').replace('%s', nombreDia(date).toLowerCase()));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  if(turnos !== null && turnos.length && !isTimeAllowed(date, time)){
    showInlineError(t('error.horario').replace('%s', t('error.horario.reservas')).replace('%s', nombreDia(date).toLowerCase()).replace('%s', formatTurnos(turnos)));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }

  const leadTimeMin = getLeadTimeMin('reserva');
  if(leadTimeMin && date === todayStr()){
    const now = new Date(Date.now() + leadTimeMin * 60000);
    const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    if(time < minTime){
      showInlineError(t('error.antelacion').replace('%d', leadTimeMin).replace('%s', minTime));
      submittingRequest = false;
      setBtnLoading('r-submit', false);
      return;
    }
  }

  // Disponibilidad real: hace falta UNA mesa que le quepa al grupo (con
  // margen) Y que no se pase del aforo total del turno — las dos cosas a
  // la vez, igual que decidiría el negocio a mano.
  const turnoIdx = getTurnoIndexForTime(date, time);
  const hasConfiguredTables = (DB.tables||[]).some(tb => tb.plazas);
  const aforoInfo = getAforoInfo(date, time);

  let matchedTable = null, slots = null;
  // Grupos grandes o sin mesa de su tamaño: no se reserva por la web (el
  // calendario ya lo dice; esto es por si se salta la pantalla).
  if(motivoSinReservaOnline(people)){
    renderReservaCalendar();
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }

  if(hasConfiguredTables){
    slots = slotsForReservation(time, getReservaDuracionMin());
    const elegibles = getEligibleTables(date, people, slots);
    matchedTable = elegibles.find(tb => tb.id === calSelectedTable) || elegibles[0] || null;
    if(!matchedTable){
      // Sí existe una mesa de ese tamaño, pero está ocupada a esa hora —
      // esto sí es "no hay disponibilidad" de verdad, se dice en el momento.
      showInlineError(t('error.mesa.nodisponible'));
      submittingRequest = false;
      setBtnLoading('r-submit', false);
      return;
    }
    if(aforoInfo && people > aforoInfo.disponible){
      showInlineError(t('error.mesa.nodisponible'));
      submittingRequest = false;
      setBtnLoading('r-submit', false);
      return;
    }
  }

  // Si el negocio pide señal Y tiene el TPV virtual conectado, enviar la
  // reserva no la manda directa a la cola: primero lleva al cliente a pagar
  // la señal con tarjeta (payWithCard), y la reserva solo se crea si la
  // firma del pago tiene éxito (ver payWithCard más abajo). Si el negocio
  // marcó "pedir señal" pero el TPV virtual no está disponible ahora mismo
  // (mn.ops.requireDeposit ya lo impide al guardar, pero por si un negocio
  // antiguo quedó con datos inconsistentes), se cae al envío normal sin
  // señal en vez de dejar al cliente sin poder reservar.
  const depositRequired = depositAppliesForPeople(people) && pagoOnlineActivo;
  const req = {
    type:'reserva', clientName, clientPhone, clientEmail, date, time, people, notes, referral,
    depositRequired, depositAmount: depositRequired ? reservaDepositAmount() : '',
    createdAt: new Date().toISOString(),
    // Token para poder volver más tarde a "Gestionar mi reserva" (ver
    // renderReservationManageView) sin tener que llamar por teléfono.
    resToken: genClientRef()
  };
  if(matchedTable) req.tableId = matchedTable.id;

  const btn = document.getElementById('r-submit');
  if(btn) btn.disabled = true;

  if(!matchedTable){
    // Sin mesas configuradas todavía, grupo que necesita juntar mesas, o sin
    // horario para saber el turno: no hay nada que comprobar automáticamente,
    // se manda tal cual y el negocio la revisa a mano.
    sendReservaRequest(req, t('reserva.ok') + (clientEmail ? t('reserva.ok.emailHint') : ''));
    return;
  }

  // Comprobación final ATÓMICA justo antes de enviar: cierra la ventana de
  // carrera en la que dos clientes reservan casi a la vez y se llevarían
  // entre los dos el mismo aforo o la misma mesa antes de que el resumen
  // sincronizado reflejase la del otro. Primero el aforo (más barato de
  // deshacer si falla lo segundo), luego la mesa; si la mesa falla, se
  // devuelve el hueco de aforo ya reservado.
  (async () => {
    try{
      if(aforoInfo){
        const aforoResult = await reserveAforoAtomic(date, aforoInfo.turnoIdx, people, aforoInfo.aforo, aforoInfo.reservados);
        if(!aforoResult.committed){
          if(btn) btn.disabled = false;
          submittingRequest = false;
          setBtnLoading('r-submit', false);
          showInlineError(t('error.mesa.nodisponible'));
          return;
        }
      }
      const tableResult = await reserveTableAtomic(date, matchedTable.id, slots);
      if(!tableResult.committed){
        if(aforoInfo) releaseAforoHold(date, aforoInfo.turnoIdx, people).catch(()=>{});
        if(btn) btn.disabled = false;
        submittingRequest = false;
        setBtnLoading('r-submit', false);
        showInlineError(t('error.mesa.nodisponible'));
        return;
      }
      sendReservaRequest(req, t('reserva.ok') + (clientEmail ? t('reserva.ok.emailHint') : ''));
    }catch(e){
      console.error(e);
      if(btn) btn.disabled = false;
      // Si la transacción falla por un problema de conexión, dejamos seguir
      // con el envío normal en vez de bloquear al cliente por completo: es
      // preferible el pequeño riesgo de carrera a que no pueda reservar.
      sendReservaRequest(req, t('reserva.ok') + (clientEmail ? t('reserva.ok.emailHint') : ''));
    }
  })();
}

function iconoNombreNormal(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
// Las palabras de tres letras o menos ('ou', 'pa', 'vi', 'te') solo valen si son la palabra entera: buscadas por
// dentro, «Pasta» y «Paella» salían con un pan, y «Mousses» con un huevo.
function iconoPalabraCoincide(n, w){
  const k = iconoNombreNormal(w);
  if(k.length > 3) return n.includes(k);
  return new RegExp('(^|[^a-z0-9])' + k + '([^a-z0-9]|$)').test(n);
}
function iconoComidaPorNombre(nombre){
  const n = iconoNombreNormal(nombre);
  for(const [palabras, clave] of ICONOS_PALABRAS){ if(palabras.some(w => iconoPalabraCoincide(n, w))) return clave; }
  return 'cubiertos-cruz';   // un nombre que no reconocemos: cubiertos, neutro y siempre correcto
}
// Qué icono (clave del catálogo, o '' si ninguno) corresponde a lo guardado en una sección.
function iconoComidaClave(valor, nombre){
  if(valor === 'ic:none') return '';
  if(typeof valor === 'string' && valor.startsWith('ic:') && ICONOS_COMIDA[valor.slice(3)]) return valor.slice(3);
  if(valor && EMOJI_A_ICONO[valor] && ICONOS_COMIDA[EMOJI_A_ICONO[valor]]) return EMOJI_A_ICONO[valor];
  return iconoComidaPorNombre(nombre);
}
function iconoComidaSvg(clave, tam){
  const ic = ICONOS_COMIDA[clave];
  if(!ic) return '';
  return `<svg class="ic-comida" viewBox="0 0 24 24" width="${tam||24}" height="${tam||24}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[0]}</svg>`;
}
// HTML del icono de una sección, listo para meter en una página (nada que escapar: sale del catálogo).
function iconoSeccionHtml(valor, nombre, tam){
  return iconoComidaSvg(iconoComidaClave(valor, nombre), tam);
}
function iconoComidaNombre(clave, lang){
  const ic = ICONOS_COMIDA[clave]; if(!ic) return '';
  return ic[lang === 'ca' ? 2 : lang === 'en' ? 3 : 1];
}

// El icono de cada carpeta es el que el hostelero eligió en su carta (catálogo de iconos de trazo de arriba, el
// MISMO código que la app) o, si no eligió, el que corresponde a su nombre. «Sin icono» (ic:none) no pinta nada.
function menuFolderIcon(sec, name){
  return iconoSeccionHtml(sec && sec.icono, name, 22);
}
// Repinta el bloque entero de la carta. Tiene que pasar SIEMPRE por aquí (y
// no escribir buildMenuHtmlInner suelto) porque los menús combo del día se
// pintan aparte, encima de las carpetas: al entrar en una carpeta se
// reescribía el contenedor sin ellos y ya no volvían ni pulsando "Volver",
// así que el cliente perdía de vista el menú del día en cuanto tocaba la
// carta — y entrar en una carpeta es ahora la única forma de verla.
// Dentro de una carpeta sí se ocultan a propósito: ahí se está mirando una
// familia concreta, y el menú del día sería ruido.
function repaintMenu(){
  const box = document.getElementById('menu-folders');
  if(!box || !lastMenuCartas) return;
  box.innerHTML = (menuOpenSection ? '' : buildMenusHtml()) + buildMenuHtmlInner(lastMenuCartas);
}
function openMenuFolder(key){
  menuOpenSection = key;
  repaintMenu();
  const box = document.getElementById('menu-folders');
  box && box.scrollIntoView({block:'start', behavior:'smooth'});
}
function closeMenuFolder(){
  menuOpenSection = null;
  repaintMenu();
}
function buildMenuHtml(cartas){
  lastMenuCartas = cartas;
  return `<div id="menu-folders">${menuOpenSection ? '' : buildMenusHtml()}${buildMenuHtmlInner(cartas)}</div>`;
}
// Suplemento delivery (Escandallo): importe fijo que se suma al precio de
// sala para pedidos a domicilio con el reparto del propio negocio, para
// compensar no cobrar el servicio de mesa. Solo aplica a la pestaña
// "Delivery" — "Para llevar" sigue con el precio de sala, y sin suplemento
// configurado también se usa el de sala, igual que siempre.
function publicPlatoPrice(p){
  if(currentTab === 'delivery' && p.deliverySupplement) return Math.round((p.precio + p.deliverySupplement) * 100) / 100;
  return p.precio;
}
function renderMenuDishesHtml(sec){
  return sec.platos.filter(p=>p.disponible!==false).map(p => {
    const promo = getActivePromoForPlatoPublic(p.id);
    const basePrice = publicPlatoPrice(p);
    const finalPrice = promo ? promoDiscountedPrice(basePrice, promo) : basePrice;
    const hasMods = (p.modificadores||[]).length > 0;
    // Cuántas unidades de este plato hay YA en el carrito, sumando TODAS
    // sus variantes de extras (la línea sin extras + cada combinación
    // elegida) — para que el cliente vea de un vistazo que ya tiene algo
    // añadido aunque esté repartido en varias líneas.
    const totalInCart = cart.filter(l => l.recipeId === p.id).reduce((s,l)=>s+l.qty, 0);
    return `
    <div class="menu-item">
      <div>
        <div class="name">${escapeHtml(trPlato(p))}${promo ? ` <span class="promo-badge" style="font-size:11px;color:#fff;background:var(--olive);border-radius:0;padding:1px 6px;margin-left:4px;font-family:'IBM Plex Mono',monospace">-${promo.discountPct}%</span>` : ''}</div>
        <div class="price">${promo ? `<span style="text-decoration:line-through;color:var(--muted);font-weight:400;margin-right:6px">${fmtMoney(basePrice)}</span>${fmtMoney(finalPrice)}` : fmtMoney(basePrice)}${hasMods ? ` <span style="color:var(--muted)">${t('modifiers.fromPrice')}</span>` : ''}</div>
        ${dishAllergensHtml(p.id)}
      </div>
      ${hasMods ? `
      <button class="btn btn-sm" style="width:auto;min-height:38px;padding:8px 14px;white-space:nowrap;position:relative" onclick="openModifierModal(${p.id})">
        ${t('modifiers.addBtn')}${totalInCart ? ` <span class="mono" style="margin-left:4px">(${totalInCart})</span>` : ''}
      </button>
      ` : `
      <div class="qty-ctl" role="group" aria-label="${escapeHtml(trPlato(p))}">
        <button onclick="changeCartQty(${p.id}, '${escapeJsAttr(sec.id)}', -1)" aria-label="${escapeHtml(t('aria.removeItem').replace('%s', trPlato(p)))}">−</button>
        <span id="qty-${p.id}" aria-live="polite">${getCartQty(p.id)}</span>
        <button onclick="changeCartQty(${p.id}, '${escapeJsAttr(sec.id)}', 1, '${escapeJsAttr(p.nombre)}', ${finalPrice})" aria-label="${escapeHtml(t('aria.addItem').replace('%s', trPlato(p)))}">+</button>
      </div>
      `}
    </div>
  `;}).join('');
}
function buildMenuHtmlInner(cartas){
  // Todas las secciones visibles de todas las cartas activas, en una sola
  // lista de carpetas — si hay más de una carta (comida + bebidas, p.ej.)
  // el nombre de la carta se antepone al de la sección para distinguirlas.
  const allSections = [];
  cartas.forEach(carta => {
    (carta.secciones||[]).filter(sec => (sec.platos||[]).some(p=>p.disponible!==false)).forEach(sec => {
      allSections.push({carta, sec, key: String(carta.id)+':'+String(sec.id)});
    });
  });

  if(menuOpenSection){
    const found = allSections.find(x => x.key === menuOpenSection);
    if(!found){ menuOpenSection = null; }
    else{
      const {sec} = found;
      return `
        <button type="button" class="menu-back-btn" onclick="closeMenuFolder()">← ${t('common.back')}</button>
        <h2 style="margin-top:0">${escapeHtml(trSection(sec) || t('label.dishes'))}</h2>
        ${renderMenuDishesHtml(sec)}
      `;
    }
  }

  // Solo una sección en total (o platos sueltos sin nombre de familia):
  // no tiene sentido un índice de carpetas de una sola carpeta — se
  // muestra directamente, como antes.
  if(allSections.length <= 1){
    return allSections.map(({sec}) => `
      ${sec.nombre && sec.nombre !== 'OTROS PLATOS' ? `<h3>${escapeHtml(trSection(sec))}</h3>` : ''}
      ${renderMenuDishesHtml(sec)}
    `).join('');
  }

  // Una carta detrás de otra, cada una con su propio título y sus propias
  // carpetas debajo. Antes iban todas las secciones de todas las cartas
  // revueltas en una sola rejilla, distinguidas solo por un prefijo
  // "Carta · Sección" dentro de cada botón: con dos o tres cartas activas
  // (comida, bebidas, vinos) el cliente veía doce carpetas seguidas sin
  // saber dónde acababa una carta y empezaba la siguiente.
  return cartas.map(carta => {
    const secciones = allSections.filter(x => x.carta === carta);
    if(!secciones.length) return '';
    // El nombre de la carta puede venir vacío; entonces se usa el título
    // genérico ("Carta"), que es lo que hace falta para separarla de los
    // menús de arriba.
    const titulo = trItem(carta) || t('carta.sectionTitle');
    return `
      <h2 style="margin-top:22px">${escapeHtml(titulo)}</h2>
      <div class="menu-folder-grid">
        ${secciones.map(({sec, key}) => {
          // El nombre de sección puede venir vacío (o ser "OTROS PLATOS").
          const secName = trSection(sec) || t('label.dishes');
          return `
          <button type="button" class="menu-folder-card" onclick="openMenuFolder('${key}')">
            <span class="icon">${menuFolderIcon(sec, secName)}</span>
            <span class="name">${escapeHtml(secName)}</span>
          </button>
        `;}).join('')}
      </div>
    `;
  }).join('');
}

// Aviso de la hora límite real para pedir (cierre del turno menos el
// margen configurado), independiente del aviso general de horario — solo
// aplica a pedidos, así que va en su propio hint en vez de reutilizar

function updateCierreHint(){
  const box = document.getElementById('o-cierre-hint');
  if(!box) return;

  const timeEl = document.getElementById('o-time');

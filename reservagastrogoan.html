<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas y Pedidos</title>
<style>
  :root{
    --brand-orange:#DF7039;
    --brand-yellow:#FFFF00;
    --brand-cream:#F6EDD5;
    --brand-black:#000000;
    --muted:#8a8a8a;
    --border:#e8e0d0;
    --green:#1f9d55;
    --green-l:rgba(31,157,85,.12);
    --red:#e0432f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--brand-cream);color:#222;font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--brand-black);color:#fff;padding:18px 16px;text-align:center;
  }
  header img{max-height:56px;border-radius:8px;margin-bottom:6px;}
  header h1{margin:0;font-size:22px;}
  header .sub{font-size:13px;color:rgba(255,255,255,.7);margin-top:4px;}
  #lang-switcher{display:flex;justify-content:center;gap:6px;margin-top:8px;}
  #lang-switcher button{
    padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.3);
    background:transparent;color:rgba(255,255,255,.7);font-size:12px;font-weight:700;cursor:pointer;
  }
  #lang-switcher button.active{background:var(--brand-orange);color:#fff;border-color:var(--brand-orange);}
  .wrap{max-width:560px;margin:0 auto;padding:14px;}
  .card{
    background:#fff;border:1px solid var(--border);border-radius:14px;
    padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .tab-btn{
    flex:1;min-width:100px;padding:13px 12px;min-height:48px;border-radius:10px;border:2px solid var(--border);
    background:#fff;font-weight:700;font-size:14px;cursor:pointer;text-align:center;color:#222;
  }
  .tab-btn.active{border-color:var(--brand-orange);background:var(--brand-orange);color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px;color:#555;}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 14px;min-height:48px;border:1.5px solid var(--border);border-radius:10px;
    font-size:16px;font-family:inherit;background:#fff;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:14px 18px;min-height:50px;border-radius:10px;border:2px solid var(--brand-orange);
    background:#fff;color:var(--brand-orange);font-weight:700;font-size:15px;
    cursor:pointer;width:100%;
  }
  .btn-primary{background:var(--brand-orange);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  h2{font-size:17px;margin:0 0 10px;}
  h3{font-size:13.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 8px;}
  .menu-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--border);
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item .name{font-weight:600;font-size:15px;}
  .menu-item .price{font-size:13px;color:var(--muted);}
  .qty-ctl{display:flex;align-items:center;gap:8px;}

    width:36px;height:36px;border-radius:8px;border:1px solid var(--border);

<script>

let tableIdFromUrl = null;
let db = null;

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============ IDIOMA DE LA CARTA ============ */
const LANGS = {es:'ES', en:'EN', ca:'CA'};
let currentLang = localStorage.getItem('gastrogoan_lang') || 'es';

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('gastrogoan_lang', lang);
  renderLangSwitcher();
  if(currentTab) renderTabContent();
}

function renderLangSwitcher(){
  const box = document.getElementById('lang-switcher');
  if(!box) return;
  box.innerHTML = Object.keys(LANGS).map(l =>
    `<button class="${l===currentLang?'active':''}" onclick="setLang('${l}')">${LANGS[l]}</button>`
  ).join('');
}

// Devuelve el nombre de una sección/plato de la carta traducido al idioma
// elegido por el cliente, o el original (en el idioma en que se escribió) si
// no hay traducción disponible para ese idioma.
function trItem(item){
  const srcLang = item.nombreLang || 'es';
  if(currentLang === srcLang) return item.nombre;
  return (item.i18n && item.i18n[currentLang]) || item.nombre;
}
function trSection(sec){ return trItem(sec); }
function trPlato(p){ return trItem(p); }
function fmtMoney(v){
  return (Number(v)||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getPublicIdFromUrl(){
  try{
    const p = new URLSearchParams(location.search);
    const v = p.get('neg');
    if(v) return v;
  }catch(e){}
  return null;
}

function getTableIdFromUrl(){
  try{
    const p = new URLSearchParams(location.search);
    const v = p.get('mesa');
    if(v) return v;
  }catch(e){}
  return null;
}

function showError(msg){
  document.getElementById('app').innerHTML = `
    <div class="error-box">
      <div class="icon">⚠️</div>
      <h2>${escapeHtml(msg)}</h2>
      <p style="font-size:13px;color:#888">Pide al restaurante que te envíe un enlace válido.</p>
    </div>
  `;
}

function init(){
  publicId = getPublicIdFromUrl();
  tableIdFromUrl = getTableIdFromUrl();
  if(!publicId){ showError('Enlace no válido o incompleto'); return; }

  // Vuelta desde el TPV virtual (Redsys) tras pagar con tarjeta.
  const pago = new URLSearchParams(location.search).get('pago');
  if(pago === 'ok'){
    document.getElementById('app').innerHTML = `
      <div class="success">
        <div class="icon">✅</div>
        <h2>¡Pago realizado! Tu pedido se está preparando.</h2>
      </div>
    `;
    return;
  }
  if(pago === 'ko'){
    document.getElementById('app').innerHTML = `
      <div class="error-box">
        <div class="icon">⚠️</div>
        <h2>El pago no se ha completado</h2>
        <p style="font-size:13px;color:#888">Tu pedido no se ha enviado. Vuelve atrás e inténtalo de nuevo.</p>
      </div>
    `;
    return;
  }

  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    // Autenticación anónima: las reglas de la nube exigen auth != null
    // para poder leer/escribir, así evitamos el acceso directo sin pasar
    // por el SDK de Firebase.
    firebase.auth().signInAnonymously().then(() => loadBusinessInfo()).catch(e => {
      console.error(e);
      showError('No se ha podido conectar con el restaurante');
    });
  }catch(e){
    console.error(e);
    showError('No se ha podido conectar con el restaurante');
  }
}

function loadBusinessInfo(){
  db.ref('gastrogoan/public/' + publicId + '/info').once('value').then(snap => {
    const val = snap.val();
    if(!val){ showError('No se ha podido cargar la información del restaurante'); return; }
    DB = {
      business: val.business || {},
      cartas: val.cartas || [],
      activeCartaIds: val.activeCartaIds || (val.activeCartaId ? [val.activeCartaId] : []),
      reservasResumen: val.reservasResumen || {},
      tables: val.tables || []
    };
    renderHeader();
    renderApp();
    checkRedsysConfigured();
  }).catch(e => {
    console.error(e);
    showError('No se ha podido conectar con el restaurante');
  });
}

// Comprueba si el restaurante acepta pago con tarjeta online (TPV virtual).
// Si la comprobación llega después del primer render, se vuelve a pintar el
// formulario de pedido para mostrar la opción de pago.
function checkRedsysConfigured(){
  fetch(`${REDSYS_WORKER_URL}/config?publicId=${encodeURIComponent(publicId)}`)
    .then(r => r.json())
    .then(data => {
      redsysConfigured = !!(data && data.configured);
      if(redsysConfigured && (currentTab === 'takeaway' || currentTab === 'delivery')) renderTabContent();
    })
    .catch(() => {});
}

function renderHeader(){
  const b = DB.business || {};
  if(b.logo) document.getElementById('biz-logo').innerHTML = `<img src="${b.logo}" alt="Logo">`;
  if(b.name) document.getElementById('biz-name').textContent = b.name;
  const parts = [];
  if(b.address) parts.push('📍 ' + b.address);
  if(b.schedule) parts.push('🕐 ' + b.schedule);
  if(b.phone) parts.push('📞 ' + b.phone);
  document.getElementById('biz-info').textContent = parts.join('  ·  ');
  renderLangSwitcher();
}

function getActiveCartas(){
  const ids = DB.activeCartaIds || [];
  return (DB.cartas || []).filter(c => ids.includes(c.id));
}

function renderApp(){
  const tiposServicio = (DB.business && DB.business.tiposServicio) || {mesa:true, takeaway:true, delivery:true};
  const tabs = [];
  if(tiposServicio.mesa !== false && (DB.tables||[]).length) tabs.push({id:'mesa', label: tableIdFromUrl ? '📱 Tu pedido' : '📱 Pedir en mesa'});
  if(tiposServicio.mesa !== false) tabs.push({id:'reserva', label:'🍽️ Reservar mesa'});
  if(tiposServicio.takeaway !== false) tabs.push({id:'takeaway', label:'🥡 Take Away'});

  if(!tabs.length){
    document.getElementById('app').innerHTML = `<div class="empty">Este negocio no tiene servicios disponibles online en este momento.</div>`;
    return;
  }

  if(!currentTab || !tabs.some(t=>t.id===currentTab)){
    currentTab = (tableIdFromUrl && tabs.some(t=>t.id==='mesa')) ? 'mesa' : tabs[0].id;
  }
  cart = [];

  document.getElementById('app').innerHTML = `
    <div class="tabs">
      ${tabs.map(t => `<button class="tab-btn ${currentTab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('')}
    </div>
    <div id="tab-content"></div>
  `;
  renderTabContent();
}

function setTab(tab){
  currentTab = tab;
  cart = [];
  renderApp();
}

function renderTabContent(){
  if(currentTab === 'reserva') renderReservaForm();
  else if(currentTab === 'mesa') renderMesaOrderForm();
  else renderOrderForm();
}

/* ============ HORARIOS ============ */
const DIAS_SEMANA = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

// Devuelve los turnos (franjas horarias) del día de la semana correspondiente
// a dateStr, o null si el negocio no ha configurado horario (sin restricción).
function getTurnosForDate(dateStr){
  const horario = (DB.business || {}).horario;
  if(!horario || horario.length !== 7) return null;
  const jsDay = new Date(dateStr + 'T00:00:00').getDay(); // 0=domingo..6=sábado
  const d = horario[(jsDay + 6) % 7]; // 0=lunes..6=domingo
  if(!d || d.abierto === false) return [];
  const turnos = [];
  if(d.t1i && d.t1f && d.t1f > d.t1i) turnos.push({abre:d.t1i, cierra:d.t1f});
  if(d.t2i && d.t2f && d.t2f > d.t2i) turnos.push({abre:d.t2i, cierra:d.t2f});
  return turnos;
}

function isTimeAllowed(dateStr, time){
  const turnos = getTurnosForDate(dateStr);
  if(turnos === null) return true;
  return turnos.some(t => time >= t.abre && time <= t.cierra);
}

// Devuelve las plazas disponibles para el turno al que pertenece `time` en `dateStr`,
// o null si no hay aforo configurado o la hora no encaja en ningún turno.
function getAforoDisponible(dateStr, time){
  const aforo = parseInt((DB.business||{}).aforo) || 0;
  if(!aforo) return null;
  const turnos = getTurnosForDate(dateStr);
  if(!turnos || !turnos.length) return null;
  const turnoIdx = turnos.findIndex(t => time >= t.abre && time <= t.cierra);
  if(turnoIdx === -1) return null;
  const resumen = (DB.reservasResumen||{})[dateStr] || {};
  const reservados = resumen[turnoIdx] || 0;
  return Math.max(0, aforo - reservados);
}

function formatTurnos(turnos){
  return turnos.map(t => `${t.abre}–${t.cierra}`).join(' y ');
}

function nombreDia(dateStr){
  const jsDay = new Date(dateStr + 'T00:00:00').getDay();
  return DIAS_SEMANA[(jsDay + 6) % 7];
}

function horarioHintHtml(dateStr){
  const turnos = getTurnosForDate(dateStr);
  if(turnos === null) return '';
  if(!turnos.length) return `<p style="font-size:13px;color:#c0392b;margin-top:-8px">El restaurante está cerrado el ${nombreDia(dateStr).toLowerCase()}. Elige otra fecha.</p>`;
  return `<p style="font-size:13px;color:#888;margin-top:-8px">Horario el ${nombreDia(dateStr).toLowerCase()}: ${formatTurnos(turnos)}.</p>`;
}

function updateTimeInputRange(dateInputId, timeInputId, hintBoxId){
  const date = document.getElementById(dateInputId).value;
  const turnos = getTurnosForDate(date);
  const timeInput = document.getElementById(timeInputId);
  const hintBox = document.getElementById(hintBoxId);
  hintBox.innerHTML = horarioHintHtml(date);
  if(turnos && turnos.length){
    timeInput.min = turnos[0].abre;
    timeInput.max = turnos[turnos.length - 1].cierra;
  }else{
    timeInput.removeAttribute('min');
    timeInput.removeAttribute('max');
  }
}

/* ============ TIEMPO DE ANTELACIÓN / ZONA DE REPARTO ============ */
// Si el pedido es para hoy, no se puede elegir una hora anterior a
// "ahora + tiempo de antelación configurado por el restaurante".
function applyLeadTime(dateInputId, timeInputId, hintBoxId){
  const p = (DB.business||{}).pedidos || {};
  const leadTimeMin = parseInt(p.leadTimeMin) || 0;
  const date = document.getElementById(dateInputId).value;
  const timeInput = document.getElementById(timeInputId);
  const hintBox = document.getElementById(hintBoxId);
  if(!leadTimeMin || date !== todayStr()) return;

  const now = new Date(Date.now() + leadTimeMin * 60000);
  const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  if(!timeInput.min || minTime > timeInput.min) timeInput.min = minTime;
  if(timeInput.value && timeInput.value < timeInput.min) timeInput.value = timeInput.min;

  const hint = `<p style="font-size:13px;color:#888;margin-top:-8px">Para hoy, lo antes que puedes elegir es a las ${minTime} (antelación mínima de ${leadTimeMin} min).</p>`;
  hintBox.innerHTML = (hintBox.innerHTML || '') + hint;
}

// Distancia en km entre dos puntos (fórmula de Haversine).
function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Comprueba si una dirección/código postal de entrega está dentro de la
// zona de reparto configurada (código postal aceptado o dentro del radio).
async function checkDeliveryZone(p, codigoPostal, direccion){
  const cpList = p.cpList || [];
  if(cpList.length && cpList.includes(codigoPostal)) return true;

  if(p.radiusKm > 0 && p.lat != null && p.lng != null){
    try{
      const q = encodeURIComponent(direccion + ', ' + codigoPostal);
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + q);
      const data = await res.json();
      if(data && data[0]){
        const dist = haversineKm(p.lat, p.lng, parseFloat(data[0].lat), parseFloat(data[0].lon));
        if(dist <= p.radiusKm) return true;
      }
    }catch(e){
      console.error(e);
    }
  }

  // Si no hay ninguna zona configurada, no se restringe.
  if(!cpList.length && !(p.radiusKm > 0)) return true;
  return false;
}

/* ============ RESERVA ============ */
function renderReservaForm(){
  const box = document.getElementById('tab-content');
  box.innerHTML = `
    <div class="card">
      <h2>Reservar mesa</h2>
      <div class="field">
        <label>Nombre *</label>
        <input type="text" id="r-name" placeholder="Tu nombre">
      </div>
      <div class="field">
        <label>Teléfono *</label>
        <input type="tel" id="r-phone" placeholder="600 000 000">
      </div>
      <div class="field-row">
        <div class="field">

          <input type="date" id="r-date" value="${todayStr()}" min="${todayStr()}" onchange="updateTimeInputRange('r-date','r-time','r-hour-hint')">
        </div>
        <div class="field">
          <label>Hora *</label>
          <input type="time" id="r-time" value="20:00">
        </div>
      </div>

        <input type="number" id="r-people" value="2" min="1" max="50">
      </div>

    </div>
  `;
  updateTimeInputRange('r-date','r-time','r-hour-hint');
}

function submitReserva(){
  const clientName = document.getElementById('r-name').value.trim();
  const clientPhone = document.getElementById('r-phone').value.trim();
  const date = document.getElementById('r-date').value;
  const time = document.getElementById('r-time').value;
  const people = parseInt(document.getElementById('r-people').value) || 1;
  const notes = document.getElementById('r-notes').value.trim();

  if(!clientName || !clientPhone || !date || !time){
    alert('Por favor completa los campos obligatorios (nombre, teléfono, fecha y hora).');
    return;
  }

  const turnos = getTurnosForDate(date);
  if(turnos !== null && !turnos.length){
    alert(`El restaurante está cerrado el ${nombreDia(date).toLowerCase()}. Por favor elige otra fecha.`);
    return;
  }
  if(turnos !== null && turnos.length && !isTimeAllowed(date, time)){
    alert(`El restaurante solo acepta reservas el ${nombreDia(date).toLowerCase()} en este horario: ${formatTurnos(turnos)}. Por favor elige otra hora.`);
    return;
  }

  const disponible = getAforoDisponible(date, time);
  if(disponible !== null && people > disponible){
    if(disponible <= 0){
      alert('Lo sentimos, ese turno ya está completo. Por favor elige otro horario o llama al restaurante para consultar disponibilidad.');
    }else{
      alert(`Lo sentimos, para ese turno solo quedan ${disponible} plaza${disponible===1?'':'s'} disponible${disponible===1?'':'s'}. Por favor reduce el número de personas, elige otro horario o llama al restaurante.`);
    }
    return;
  }

  const req = {
    type:'reserva', clientName, clientPhone, date, time, people, notes,
    createdAt: new Date().toISOString()
  };
  sendRequest(req, 'Solicitud de reserva enviada. El restaurante la confirmará lo antes posible.');
}

/* ============ MENÚ (carrito compartido) ============ */
function getActiveCartasConPlatos(){
  return getActiveCartas().filter(c => (c.secciones||[]).some(sec => (sec.platos||[]).some(p=>p.disponible!==false)));
}

function buildMenuHtml(cartas){
  return cartas.map(carta => `
    ${cartas.length > 1 ? `<h2>${escapeHtml(trItem(carta))}</h2>` : ''}
    ${(carta.secciones||[]).filter(sec => (sec.platos||[]).some(p=>p.disponible!==false)).map(sec => `
      ${sec.nombre && sec.nombre !== 'OTROS PLATOS' ? `<h3>${escapeHtml(trSection(sec))}</h3>` : ''}
      ${sec.platos.filter(p=>p.disponible!==false).map(p => `
        <div class="menu-item">
          <div>
            <div class="name">${escapeHtml(trPlato(p))}</div>
            <div class="price">${fmtMoney(p.precio)}</div>
          </div>
          <div class="qty-ctl">
            <button onclick="changeCartQty(${p.id}, '${escapeHtml(sec.id)}', -1)">−</button>
            <span id="qty-${p.id}">${getCartQty(p.id)}</span>
            <button onclick="changeCartQty(${p.id}, '${escapeHtml(sec.id)}', 1, '${escapeHtml(p.nombre)}', ${p.precio})">+</button>
          </div>
        </div>
      `).join('')}
    `).join('')}
  `).join('');
}

/* ============ PEDIDOS (TAKEAWAY / DELIVERY) ============ */
function renderOrderForm(){
  const box = document.getElementById('tab-content');
  const cartas = getActiveCartasConPlatos();

  if(!cartas.length){
    box.innerHTML = `<div class="card"><div class="empty">La carta no está disponible para pedidos online en este momento. Puedes llamar al restaurante o reservar mesa.</div></div>`;
    return;
  }

  const isDelivery = currentTab === 'delivery';
  const p = (DB.business||{}).pedidos || {};
  const zoneRestricted = isDelivery && ((p.cpList||[]).length || p.radiusKm > 0);

  const menuHtml = buildMenuHtml(cartas);

  box.innerHTML = `
    <div class="card">
      <h2>${isDelivery ? 'Pedido a domicilio' : 'Pedido para recoger'}</h2>
      ${menuHtml}
    </div>
    <div class="card" id="cart-summary"></div>
    <div class="card">
      <h2>Tus datos</h2>
      <div class="field">
        <label>Nombre *</label>
        <input type="text" id="o-name" placeholder="Tu nombre">
      </div>
      <div class="field">
        <label>Teléfono *</label>
        <input type="tel" id="o-phone" placeholder="600 000 000">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Fecha *</label>
          <input type="date" id="o-date" value="${todayStr()}" min="${todayStr()}" onchange="updateTimeInputRange('o-date','o-time','o-hour-hint'); applyLeadTime('o-date','o-time','o-hour-hint')">
        </div>
        <div class="field">
          <label>Hora *</label>
          <input type="time" id="o-time" value="20:00">
        </div>
      </div>
      <div id="o-hour-hint"></div>
      ${isDelivery ? `
      <div class="field">
        <label>Dirección de entrega *</label>
        <input type="text" id="o-address" placeholder="Calle, número, piso...">
      </div>` : ''}
      ${zoneRestricted ? `
      <div class="field">
        <label>Código postal *</label>
        <input type="text" id="o-cp" placeholder="28001">
      </div>` : ''}
      <div class="field">
        <label>Notas (alergias, observaciones...)</label>
        <textarea id="o-notes" placeholder="Opcional"></textarea>
      </div>
      ${redsysConfigured ? `
      <div class="field">
        <label>Forma de pago</label>
        ${p.permitirPagoLocal !== false ? `<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:4px"><input type="radio" name="o-pago" value="local" checked style="width:auto"> Pagar al ${isDelivery?'recibir':'recoger'}</label>` : ''}
        <label style="display:flex;align-items:center;gap:8px;font-weight:400"><input type="radio" name="o-pago" value="tarjeta" ${p.permitirPagoLocal === false ? 'checked' : ''} style="width:auto"> Pagar ahora con tarjeta</label>
      </div>` : ''}
      <button class="btn btn-primary" id="o-submit" onclick="submitOrder()">Enviar pedido</button>
    </div>
  `;
  renderCartSummary();
  updateTimeInputRange('o-date','o-time','o-hour-hint');
  applyLeadTime('o-date','o-time','o-hour-hint');
}

function getCartQty(recipeId){
  const line = cart.find(l => l.recipeId === recipeId);
  return line ? line.qty : 0;
}

function changeCartQty(recipeId, sectionId, delta, name, price){
  let line = cart.find(l => l.recipeId === recipeId);
  if(!line){
    if(delta <= 0) return;
    line = {recipeId, sectionId, name, price, qty:0};
    cart.push(line);
  }
  line.qty += delta;
  if(line.qty <= 0) cart = cart.filter(l => l !== line);

  const span = document.getElementById('qty-'+recipeId);
  if(span) span.textContent = getCartQty(recipeId);
  renderCartSummary();
}

function renderCartSummary(){
  const box = document.getElementById('cart-summary');
  if(!box) return;
  const submitBtn = document.getElementById('o-submit');
  if(!cart.length){
    box.innerHTML = `<div class="empty">Tu carrito está vacío. Añade platos arriba.</div>`;
    if(submitBtn) submitBtn.disabled = true;
    return;
  }
  const p = (DB.business||{}).pedidos || {};
  const deliveryFee = currentTab === 'delivery' ? (p.deliveryFee || 0) : 0;
  const subtotal = cart.reduce((s,l)=>s+l.price*l.qty,0);
  const total = subtotal + deliveryFee;
  const pedidoMinimo = currentTab !== 'mesa' ? (p.pedidoMinimo || 0) : 0;
  const bajoMinimo = pedidoMinimo > 0 && subtotal < pedidoMinimo;
  if(submitBtn) submitBtn.disabled = bajoMinimo;
  box.innerHTML = `
    <h2>Tu pedido</h2>
    ${cart.map(l => `<div class="cart-line"><span>${l.qty}× ${escapeHtml(l.name)}</span><span>${fmtMoney(l.price*l.qty)}</span></div>`).join('')}
    ${deliveryFee > 0 ? `<div class="cart-line"><span>Coste de envío</span><span>${fmtMoney(deliveryFee)}</span></div>` : ''}
    <div class="cart-total"><span>Total</span><span>${fmtMoney(total)}</span></div>
    ${bajoMinimo ? `<p style="font-size:13px;color:#c0392b;margin-top:8px">Pedido mínimo: ${fmtMoney(pedidoMinimo)}. Añade ${fmtMoney(pedidoMinimo - subtotal)} más para poder continuar.</p>` : ''}
  `;
}

async function submitOrder(){
  if(!cart.length){ alert('Añade al menos un plato a tu pedido.'); return; }
  const clienteNombre = document.getElementById('o-name').value.trim();
  const clienteTelefono = document.getElementById('o-phone').value.trim();
  const date = document.getElementById('o-date').value;
  const time = document.getElementById('o-time').value;
  const isDelivery = currentTab === 'delivery';
  const clienteDireccion = isDelivery ? document.getElementById('o-address').value.trim() : '';
  const notas = document.getElementById('o-notes').value.trim();
  const p = (DB.business||{}).pedidos || {};
  const zoneRestricted = isDelivery && ((p.cpList||[]).length || p.radiusKm > 0);
  const codigoPostal = zoneRestricted ? document.getElementById('o-cp').value.trim() : '';

  if(!clienteNombre || !clienteTelefono || !date || !time || (isDelivery && !clienteDireccion) || (zoneRestricted && !codigoPostal)){
    alert('Por favor completa los campos obligatorios.');
    return;
  }

  const subtotal = cart.reduce((s,l)=>s+l.price*l.qty,0);
  const pedidoMinimo = p.pedidoMinimo || 0;
  if(pedidoMinimo > 0 && subtotal < pedidoMinimo){
    alert(`El pedido mínimo es de ${fmtMoney(pedidoMinimo)}. Añade más platos para continuar.`);
    return;
  }

  const turnos = getTurnosForDate(date);
  if(turnos !== null && !turnos.length){
    alert(`El restaurante está cerrado el ${nombreDia(date).toLowerCase()}. Por favor elige otra fecha.`);
    return;
  }
  if(turnos !== null && turnos.length && !isTimeAllowed(date, time)){
    alert(`El restaurante solo acepta pedidos el ${nombreDia(date).toLowerCase()} en este horario: ${formatTurnos(turnos)}. Por favor elige otra hora.`);
    return;
  }

  const leadTimeMin = parseInt(p.leadTimeMin) || 0;
  if(leadTimeMin && date === todayStr()){
    const now = new Date(Date.now() + leadTimeMin * 60000);
    const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    if(time < minTime){
      alert(`Con la antelación mínima de ${leadTimeMin} minutos, lo antes que puedes elegir hoy es a las ${minTime}.`);
      return;
    }
  }

  if(zoneRestricted){
    const enZona = await checkDeliveryZone(p, codigoPostal, clienteDireccion);
    if(!enZona){
      alert('Lo sentimos, tu dirección está fuera de la zona de entrega del restaurante.');
      return;
    }
  }

  const deliveryFee = isDelivery ? (p.deliveryFee || 0) : 0;
  const total = subtotal + deliveryFee;

  const req = {
    type:'pedido', tipo: isDelivery ? 'delivery' : 'takeaway',
    clienteNombre, clienteTelefono, clienteDireccion, codigoPostal, notas, date, time,
    costeEnvio: deliveryFee,
    items: cart.map(l => ({name:l.name, price:l.price, qty:l.qty})),
    createdAt: new Date().toISOString()
  };

  const pagoTarjeta = redsysConfigured && document.querySelector('input[name="o-pago"]:checked')?.value === 'tarjeta';
  if(pagoTarjeta){
    payWithCard(req, total, isDelivery ? 'Pedido a domicilio' : 'Pedido para recoger');
    return;
  }

  sendRequest(req, 'Pedido enviado. El restaurante lo confirmará en breve.');
}

/* ============ PAGO CON TARJETA (TPV virtual / Redsys) ============
   1) Enviamos el pedido como siempre (con una referencia propia).
   2) Pedimos al Worker que firme el pago con esa referencia.
   3) Redirigimos al cliente al TPV de Redsys. Cuando el banco confirme el
      pago, el Worker avisará automáticamente al restaurante. */
function payWithCard(req, amount, description){
  const clientRef = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2);
  req.clientRef = clientRef;

  db.ref('gastrogoan/public/' + publicId + '/requests').push(req).then(() => {
    const base = location.href.split('?')[0] + '?neg=' + encodeURIComponent(publicId);
    return fetch(`${REDSYS_WORKER_URL}/sign`, {
      method: 'POST',
      headers: {'content-type':'application/json'},
      body: JSON.stringify({
        publicId, orderRef: clientRef, amount, description,
        urlOk: base + '&pago=ok',
        urlKo: base + '&pago=ko'
      })
    });
  }).then(r => r.json()).then(data => {
    if(!data || !data.url || data.error){
      alert('No se ha podido iniciar el pago con tarjeta. ' + (data && data.error ? data.error : ''));
      return;
    }
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = data.url;
    Object.entries(data.fields).forEach(([k,v]) => {
      const input = document.createElement('input');
      input.type = 'hidden'; input.name = k; input.value = v;
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
  }).catch(e => {
    console.error(e);
    alert('No se ha podido iniciar el pago con tarjeta. Comprueba tu conexión e inténtalo de nuevo.');
  });
}

/* ============ PEDIDO EN MESA (auto-pedido) ============ */
function renderMesaOrderForm(){
  const box = document.getElementById('tab-content');
  const cartas = getActiveCartasConPlatos();

  if(!cartas.length){
    box.innerHTML = `<div class="card"><div class="empty">La carta no está disponible para pedir desde la mesa en este momento. Llama al camarero.</div></div>`;
    return;
  }

  const tables = DB.tables || [];
  const currentTable = tableIdFromUrl ? tables.find(t => String(t.id) === String(tableIdFromUrl)) : null;

  const menuHtml = buildMenuHtml(cartas);

  box.innerHTML = `
    <div class="card">
      <h2>Pedir desde tu mesa</h2>
      ${currentTable
        ? `<p style="font-size:13px;color:#888;margin-top:-6px">Tu mesa: <strong>${escapeHtml(currentTable.name)}</strong>. Tu pedido se enviará directamente a cocina.</p>`
        : tableIdFromUrl
          ? `<p style="font-size:13px;color:var(--red);margin-top:-6px">No se ha reconocido tu mesa. Indica el número a continuación.</p>
             <div class="field"><label>¿En qué mesa estás? *</label><input type="text" id="m-table-manual" placeholder="Número de mesa"></div>`
          : `<div class="field">
               <label>¿En qué mesa estás? *</label>
               <select id="m-table">
                 <option value="">Selecciona tu mesa…</option>
                 ${tables.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}
               </select>
             </div>`}
      ${menuHtml}
    </div>
    <div class="card" id="cart-summary"></div>
    <div class="card">
      <div class="field">
        <label>Nombre (opcional)</label>
        <input type="text" id="m-name" placeholder="Tu nombre">
      </div>
      <div class="field">
        <label>Notas (alergias, observaciones...)</label>
        <textarea id="m-notes" placeholder="Opcional"></textarea>
      </div>
      <button class="btn btn-primary" id="o-submit" onclick="submitMesaOrder()">Enviar pedido a cocina</button>
    </div>
  `;
  renderCartSummary();
}

function submitMesaOrder(){
  if(!cart.length){ alert('Añade al menos un plato a tu pedido.'); return; }

  const tables = DB.tables || [];
  let tableId = null;
  if(tableIdFromUrl){
    const currentTable = tables.find(t => String(t.id) === String(tableIdFromUrl));
    if(currentTable){
      tableId = currentTable.id;
    }else{
      const manual = document.getElementById('m-table-manual');
      if(!manual || !manual.value.trim()){ alert('Indica el número de tu mesa.'); return; }
      tableId = manual.value.trim();
    }
  }else{
    const sel = document.getElementById('m-table');
    if(!sel || !sel.value){ alert('Selecciona tu mesa.'); return; }
    tableId = tables.find(t => String(t.id) === sel.value).id;
  }

  const clienteNombre = document.getElementById('m-name').value.trim();
  const notas = document.getElementById('m-notes').value.trim();

  const req = {
    type:'pedido', tipo:'mesa', tableId,
    clienteNombre, notas,
    items: cart.map(l => ({name:l.name, price:l.price, qty:l.qty})),
    createdAt: new Date().toISOString()
  };
  sendRequest(req, 'Pedido enviado a cocina. ¡Gracias!');
}

/* ============ ENVÍO ============ */
function sendRequest(req, successMsg){
  db.ref('gastrogoan/public/' + publicId + '/requests').push(req).then(() => {
    document.getElementById('app').innerHTML = `
      <div class="success">
        <div class="icon">✅</div>
        <h2>${escapeHtml(successMsg)}</h2>
        <button class="btn" style="margin-top:16px" onclick="location.reload()">Hacer otra solicitud</button>
      </div>
    `;
  }).catch(e => {
    console.error(e);
    alert('No se ha podido enviar. Comprueba tu conexión e inténtalo de nuevo.');
  });
}

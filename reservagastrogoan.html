  #wz-next::before{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);pointer-events:none;opacity:0}
  @media (prefers-reduced-motion:no-preference){
    #wz-next:not(:disabled)::before{animation:wzBrillo 3.2s 1s ease-in-out infinite}
    @keyframes wzBrillo{0%{left:-60%;opacity:0}8%{opacity:1}30%{left:130%;opacity:1}31%,100%{left:130%;opacity:0}}
    .hg{animation:hgFlota 9s ease-in-out infinite}
    .hg1{animation-duration:11s;animation-delay:-3s} .hg2{animation-duration:8s;animation-delay:-5s} .hg3{animation-duration:12s;animation-delay:-1s} .hg4{animation-duration:10s;animation-delay:-7s}
    @keyframes hgFlota{0%,100%{translate:0 0}50%{translate:0 -14px}}
    .hero-top{animation:wzRise .5s cubic-bezier(.2,.8,.2,1) both}
    .svc-hero .hero-h{animation-name:heroTitulo;animation-duration:.7s}
    @keyframes heroTitulo{from{opacity:0;transform:translateY(18px);letter-spacing:-.06em}to{opacity:1;transform:none;letter-spacing:-.035em}}
  }
  @media (max-width:759px){
    .svc-hero .hero-top{padding:24px 0 62px}
    .hg0{width:120px;height:120px;right:-4%} .hg1{width:90px;height:90px;right:30%} .hg2{display:none} .hg3{width:70px;height:70px} .hg4{display:none}
  }

  /* ═══ PASOS CON CARÁCTER (9/11, 3.ª pasada): indicador con círculos, datos del servicio en fichas que fluyen, horas y menús con vida ═══ */
  .wz-prog{gap:10px;margin-bottom:18px}
  .wz-prog button{display:flex;align-items:center;gap:9px;min-height:52px;padding:0 0 10px;border:0}
  .wz-prog button::before,.wz-prog button::after{top:auto;bottom:0;height:4px}
  .wz-prog .n{flex:none;display:grid;place-items:center;width:28px;height:28px;border:2px solid var(--border);border-radius:50%;background:var(--surface);font-size:12px;font-weight:700;letter-spacing:0;color:var(--muted);transition:background-color .3s,border-color .3s,color .3s,transform .3s cubic-bezier(.3,1.6,.5,1)}
  .wz-prog li.on .n{background:var(--olive);border-color:var(--olive);color:#fff;transform:scale(1.12)}
  .wz-prog li.done .n{background:var(--ink);border-color:var(--ink);color:transparent;position:relative}
  .wz-prog li.done .n::before{position:absolute;left:50%;top:50%;margin:0;width:13px;height:13px;transform:translate(-50%,-50%);background:#fff;vertical-align:baseline}
  .wz-prog .l{font-size:13px;line-height:1.2}
  @media (max-width:420px){ .wz-prog{gap:6px} .wz-prog button{gap:6px;align-items:flex-start;flex-direction:column;padding-top:2px} .wz-prog .l{font-size:12px} }
  .chips{display:flex;flex-wrap:wrap;gap:6px;background:none;border:0;margin:0 0 16px}
  .chip{display:inline-flex;min-height:34px;padding:6px 11px;border:1px solid var(--border);background:var(--surface);text-wrap:pretty}
  .chip:first-child{border-color:var(--olive);color:var(--olive);font-weight:600}
  .wz-nav{position:sticky}
  .wz-nav::before{content:'';position:absolute;left:0;right:0;top:-26px;height:26px;background:linear-gradient(to bottom,transparent,var(--paper));pointer-events:none}
  .slots button{position:relative;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background-color .15s,border-color .15s,color .15s}
  @media (hover:hover){ .slots button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(28,26,23,.12);border-color:var(--olive)} .slots button.on:hover{border-color:var(--ink)} }
  .slots button.on{background:var(--olive);border-color:var(--olive);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--olive) 35%,transparent)}
  .mn-card{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .15s}
  @media (hover:hover){ .mn-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(28,26,23,.12);border-color:var(--olive)} .mn-card:hover .mn-go{transform:translateX(5px);color:var(--olive)} }
  .wz-step .wz-h{font-size:clamp(26px,4.2vw,36px);letter-spacing:-.03em}
  .wz-step.card{border-top:4px solid var(--olive)}
  @media (prefers-reduced-motion:no-preference){
    .wz-prog li.on .n{animation:wzPop .45s cubic-bezier(.3,1.6,.5,1)}
    .wz-prog li.done .n{animation:wzPop .4s cubic-bezier(.3,1.6,.5,1)}
    .chip{animation:wzRise .4s cubic-bezier(.2,.8,.2,1) both}
    .chip:nth-child(2){animation-delay:.05s} .chip:nth-child(3){animation-delay:.1s} .chip:nth-child(4){animation-delay:.15s}
    .slots button{animation:wzRise .3s cubic-bezier(.2,.8,.2,1) both}
    .slots button:nth-child(n+2){animation-delay:.03s} .slots button:nth-child(n+5){animation-delay:.06s} .slots button:nth-child(n+9){animation-delay:.09s}
    .mn-list>*{animation:wzRise .4s cubic-bezier(.2,.8,.2,1) both} .mn-list>*:nth-child(2){animation-delay:.07s} .mn-list>*:nth-child(3){animation-delay:.14s}
  }

  /* ═══ SUBPANTALLAS CON CARÁCTER (9/11): cocina a tope, encuesta, confirmar, color de marca secundario ═══ */
  .aviso-pausa{text-align:center;padding:34px 22px 28px;border-top:4px solid var(--olive)}
  .aviso-pausa .ap-ic{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--green-l);position:relative}
  .aviso-pausa .ap-ic::before,.aviso-pausa .ap-ic::after{content:'';position:absolute;top:19px;width:7px;height:26px;border-radius:2px;background:var(--olive)}
  .aviso-pausa .ap-ic::before{left:20px} .aviso-pausa .ap-ic::after{right:20px}
  .aviso-pausa h2{margin:0 0 8px;font-size:clamp(24px,5vw,30px);letter-spacing:-.02em}
  .aviso-pausa p{margin:0 auto;max-width:38ch;font-size:15px;line-height:1.5;color:var(--muted)}
  .aviso-pausa .ap-tel{display:inline-flex;align-items:center;justify-content:center;margin-top:18px;text-decoration:none}
  #nps-scale{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:18px 0 6px}
  #nps-scale button{min-height:52px;font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:700;transition:transform .18s cubic-bezier(.3,1.5,.5,1),background-color .15s,border-color .15s,color .15s}
  @media (hover:hover){ #nps-scale button:hover{transform:translateY(-3px);border-color:var(--olive)} }
  #nps-scale button.btn-primary{background:var(--olive);border-color:var(--olive);color:#fff;transform:scale(1.1)}
  #nps-scale button[data-score="0"].btn-primary,#nps-scale button[data-score="1"].btn-primary,#nps-scale button[data-score="2"].btn-primary,#nps-scale button[data-score="3"].btn-primary,#nps-scale button[data-score="4"].btn-primary,#nps-scale button[data-score="5"].btn-primary,#nps-scale button[data-score="6"].btn-primary{background:var(--red);border-color:var(--red)}

  .card:has(#nps-scale){border-top:4px solid var(--olive)}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
// Para insertar texto dentro de un literal JS '...' embebido en un atributo
// onclick="...": el navegador decodifica las entidades HTML del atributo
// ANTES de interpretarlo como JS, así que un nombre con apóstrofo (p.ej.
// "Chef's special") escapado solo con escapeHtml (' -> &#39;) se decodifica
// de vuelta a ' dentro del onclick y cierra la cadena JS a mitad, rompiendo
// el botón sin ningún error visible (el "+" simplemente deja de añadir al
// carrito). Escapa primero la barra invertida y la comilla simple para JS,
// y luego para HTML.
function escapeJsAttr(str){
  return escapeHtml(String(str==null?'':str).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
}

// Copia exacta de la de js/core.js (archivo aparte, sin acceso a ese código)
// — tiene que dar la MISMA clave para los mismos datos, o "Accede a tu
// reserva" nunca encontraría nada.
function ggLicHash(str){
  let h = 0x811c9dc5 >>> 0;
  for(let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}
function reservaLookupKey(nombre, email, telefono){
  const n = String(nombre||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const e = String(email||'').trim().toLowerCase();
  const t = String(telefono||'').replace(/[^\d]/g,'');
  if(!n || !e || !t) return null;
  return ggLicHash(n + '·' + e + '·' + t + '·gastrogoan·reserva·lookup·v1').toString(36).padStart(7, '0');
}

// Número/código corto para que el cliente lo diga por teléfono, en vez del
// token largo que va en la URL (ese sí que hace falta entero para poder
// editar/cancelar, pero no se puede dictar cómodamente). Determinista: sale
// del mismo token siempre, no hace falta guardarlo aparte en ningún sitio.
function shortCode(token){
  return ggLicHash(String(token||'') + '·gastrogoan·shortcode·v1').toString(36).toUpperCase().padStart(6,'0').slice(0,6);
}

Object.keys(I18N_WZ).forEach(l => Object.assign(I18N[l], I18N_WZ[l]));
function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.es[key] || key; }

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('gastrogoan_lang', lang);
  renderLangSwitcher();
  if(!bizNameLoaded) document.getElementById('biz-name').textContent = t('app.title');
  if(document.title === 'Reservas y Pedidos' || Object.values(I18N).some(d=>d['app.title']===document.title)) document.title = t('app.title');
  const loadingEl = document.getElementById('app-loading');
  if(loadingEl) loadingEl.textContent = t('app.loading');
  // ⚠️ Las pantallas de seguimiento (?track=) y de gestionar reserva (?res=)
  // no pasan por currentTab/renderTabContent — cada una tiene su propio
  // listener y su propio render. Sin esto, tocar el selector de idioma AQUÍ
  // no hacía NADA: el botón cambiaba de color pero todo el texto de debajo
  // (la norma dice que la app entera es es/ca/en) se quedaba fijo en el
  // idioma con el que cargó la página la primera vez — justo las dos
  // pantallas a las que un cliente llega desde un enlace guardado o
  // compartido, sin haber pasado antes por el selector.
  if(trackToken) renderTrackStatus(lastTrackStatusData);
  else if(resToken) renderReservationStatus(lastResStatusData);
  else if(currentTab){ renderTabBar(); renderTabContentPreservingForm(); }   // sin vaciar lo que el cliente ya había escrito
  else if(businessInfoLoadedOnce && !lastErrorKey){ renderApp(); }   // pantalla de elegir servicio
  else if(lastErrorKey) showError(lastErrorKey);
}

function renderLangSwitcher(){
  const box = document.getElementById('lang-switcher');
  if(!box) return;
  const NOMBRES = {es:'Español', ca:'Català', en:'English'};
  box.innerHTML = `<div class="lang-dd"><button type="button" class="lang-trigger" aria-haspopup="listbox" aria-expanded="false" onclick="toggleLangDd(event)"><span class="lang-code">${String(currentLang).toUpperCase()}</span><span class="lang-chev" aria-hidden="true"></span></button>
    <div class="lang-panel" role="listbox">${Object.keys(LANGS).map(l => `<button type="button" role="option" class="${l===currentLang?'active':''}" onclick="setLang('${l}')"><span class="lang-code">${l.toUpperCase()}</span><span>${NOMBRES[l]||l}</span></button>`).join('')}</div></div>`;
}
function toggleLangDd(ev){
  ev.stopPropagation();
  const dd = ev.currentTarget.closest('.lang-dd'); const abierto = dd.classList.toggle('open');
  ev.currentTarget.setAttribute('aria-expanded', abierto);
  if(abierto) document.addEventListener('click', () => dd.classList.remove('open'), {once:true});
}

}

}

// Aviso de privacidad básico (RGPD): qué datos se piden, para qué se usan
// y cómo ejercer los derechos de acceso/rectificación/supresión. El
// negocio puede ampliarlo/personalizarlo más adelante; esto es la base
// mínima para no pedir datos personales (incluida una alergia, que es un
// dato de salud) sin informar de nada.
function showPrivacyNotice(){
  const bizName = (DB && DB.business && DB.business.name) || t('reserva.title');
  const fullText = t('privacy.noticeText').replace('${business}', bizName);
  const [title, ...rest] = fullText.split('\n\n');
  // Quién es el responsable (RGPD art. 13) y aviso legal (LSSI art. 10):
  // titular, NIF, domicilio y contacto, si el negocio los ha publicado.
  const b = (DB && DB.business) || {};
  const lp = b.legalPublico || {};
  const resp = [lp.titular || bizName, lp.nif ? 'NIF ' + lp.nif : '', b.address || '', b.email || b.phone || ''].filter(Boolean).join(' · ');
  openInfoModal(title, [t('privacy.responsable').replace('${datos}', resp), ...rest, t('privacy.extra')].join('\n\n'));
}

// Sustituto de confirm() con el mismo diseño que el resto de la app (antes
// era el cuadro nativo del navegador, sin estilo propio). Misma forma de
// uso: se espera la Promise y se sigue solo si resuelve a true.
let pendingConfirmModalResolve = null;
function confirmModal(message, opts){
  opts = opts || {};
  ensureModalChrome();
  return new Promise(resolve => {
    pendingConfirmModalResolve = resolve;
    document.getElementById('modal-box').innerHTML = `
      <button class="modal-close" onclick="resolveConfirmModal(false)" aria-label="${escapeHtml(t('common.close')||'Cerrar')}">&times;</button>
      <p style="font-size:14px;line-height:1.6;color:var(--body);margin:4px 0 18px">${escapeHtml(message)}</p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="resolveConfirmModal(false)">${escapeHtml(t('common.cancel')||'Cancelar')}</button>
        <button class="btn btn-primary" style="${opts.danger?'background:var(--red);border-color:var(--red)':''}" onclick="resolveConfirmModal(true)">${escapeHtml(opts.confirmLabel||t('common.confirm')||'Confirmar')}</button>
      </div>
    `;
    document.getElementById('modal-overlay').classList.add('active');
  });
}
function resolveConfirmModal(value){
  closeInfoModal();
  if(pendingConfirmModalResolve){ pendingConfirmModalResolve(value); pendingConfirmModalResolve = null; }
}

// Un único regex de email compartido por los dos formularios (reserva y
// pedido) — antes estaba duplicado literalmente en los dos sitios.
function isValidEmail(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

// Identificador único para poder seguir el estado del pedido después de
// enviarlo (ver trackOrderStatus) — antes solo se generaba dentro de
// payWithCard, así que un pedido pagado en efectivo nunca tenía uno.
/* El token es lo ÚNICO que protege el seguimiento de un pedido o una reserva:
   quien lo adivine ve ese pedido y puede tocar su estado. Math.random() no
   está pensado para eso y en algunos navegadores es predecible a partir de
   dos valores seguidos. crypto.getRandomValues sí. Se mantiene el prefijo y
   la marca de tiempo para que los tokens sigan ordenándose por fecha, y el
   respaldo antiguo por si algún navegador viejo no trae crypto. */
function genClientRef(){
  const azar = (() => {
    try{
      const b = new Uint8Array(12);
      crypto.getRandomValues(b);
      return Array.from(b, n => n.toString(36).padStart(2, '0')).join('').slice(0, 16);
    }catch{
      return Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    }
  })();
  return 'r' + Date.now().toString(36) + azar;
}

// Resalta un campo inválido tras un intento de envío fallido y hace scroll
// hasta él — antes el único indicio de qué campo fallaba era un alert()
// genérico ("completa los campos obligatorios") sin decir cuál.
function markFieldInvalid(fieldId){
  const input = document.getElementById(fieldId);
  if(!input) return;
  const field = input.closest('.field') || input;
  field.classList.add('invalid');
  if(typeof wzMostrarCampo === 'function') wzMostrarCampo(input);   // si vive en otro paso, se vuelve a él
  if(!markFieldInvalid._scrolled){
    field.scrollIntoView({behavior:'smooth', block:'center'});
    input.focus({preventScroll:true});
    markFieldInvalid._scrolled = true;
  }
}
function setBtnLoading(btnId, loading){
  const btn = document.getElementById(btnId);
  if(!btn) return;
  if(loading){
    if(!btn.dataset.origHtml) btn.dataset.origHtml = btn.innerHTML;
    btn.innerHTML = `<span class="btn-spinner"></span> ${escapeHtml(t('common.sending')||'')}`;
    btn.disabled = true;
  } else if(btn.dataset.origHtml){
    btn.innerHTML = btn.dataset.origHtml;
    btn.disabled = false;
  }
}
function clearFieldInvalid(fieldIds){
  markFieldInvalid._scrolled = false;
  fieldIds.forEach(id => {
    const input = document.getElementById(id);
    if(!input) return;
    (input.closest('.field') || input).classList.remove('invalid');
  });
}

// Enlace "bonito" con el nombre elegido por el negocio (?n=mi-restaurante)
// en vez del código automático (?neg=xxxxx) — ver savePublicSlug() en la
// app principal. Hace falta resolverlo contra la plataforma antes de poder
// cargar los datos del negocio (ver init()).
function getSlugFromUrl(){
  try{
    const p = new URLSearchParams(location.search);
    const v = p.get('n');
    if(v) return v;
  }catch(e){}
  // Red de seguridad para la dirección corta (reservas.gastrogoan.com/casapaco):
  // el hosting la reescribe por dentro añadiendo ?n=casapaco, pero si esa
  // regla faltara o se cambiara de hosting, el cliente se encontraría un
  // "enlace no válido" con un enlace que es perfectamente válido. Leyéndolo
  // también de la ruta, la dirección corta funciona sola.
  try{
    const seg = location.pathname.split('/').filter(Boolean);
    // Un solo tramo y sin extensión: es el nombre del negocio, no un archivo.
    if(seg.length === 1 && !seg[0].includes('.')) return decodeURIComponent(seg[0]);
  }catch(e){}
  return null;
}

// Aviso no bloqueante (sustituye a alert() nativo) para errores que ocurren
// tras una acción del cliente (p.ej. fallo de pago) sin perder lo que había
// escrito en el formulario.
function showInlineError(msg){
  let box = document.getElementById('inline-alert');
  if(box) box.remove();
  box = document.createElement('div');
  box.id = 'inline-alert';
  box.setAttribute('role', 'alert');
  box.innerHTML = `<span class="hi hi-warn">${escapeHtml(msg)}</span><button onclick="this.parentElement.remove()" aria-label="${escapeHtml(t('common.close')||'Cerrar')}">&times;</button>`;
  document.body.appendChild(box);
  clearTimeout(showInlineError._t);
  showInlineError._t = setTimeout(()=>{ box.remove(); }, 8000);
}

let lastErrorKey = null;
/* El detalle técnico va DENTRO de la pantalla de error, plegado.
   Al cliente del restaurante no le estorba —solo ve el aviso de siempre—,
   pero cuando algo falla y hay que diagnosticarlo por teléfono, es la
   diferencia entre resolverlo en cinco minutos o pasarse la noche adivinando.
   Lo aprendimos con el asistente de I+D. */
let detalleTecnico = [];
function apuntarDetalle(txt){
  detalleTecnico.push(new Date().toISOString().slice(11,19) + ' · ' + txt);
  if(detalleTecnico.length > 12) detalleTecnico.shift();
}
/* Pantalla de "hay mucha gente ahora mismo", distinta a propósito de
   showError(): esto NO es un fallo del restaurante ni del enlace (no lleva
   el icono de alerta ni el "pide un enlace válido"), es una cola. Se dispara
   cuando la carga inicial no llega en un tiempo razonable — Firebase no
   avisa con un error explícito de "límite de conexiones alcanzado", así que
   no se puede DISTINGUIR eso de una red lenta cualquiera; el mensaje es
   honesto para los dos casos y el botón de reintentar cubre ambos. */
function showSaturacion(){
  document.getElementById('app').innerHTML = `
    <div class="error-box">
      <div class="icon warn-icon" aria-hidden="true"></div>
      <h2>${escapeHtml(t('error.saturacion.title'))}</h2>
      <p style="font-size:14px;color:var(--muted);line-height:1.55">${t('error.saturacion.body')}</p>
      <button class="btn btn-primary" style="margin-top:18px" onclick="location.reload()">${t('common.retry')}</button>
    </div>
  `;
}
function showError(key, detalle){
  lastErrorKey = key;
  if(detalle) apuntarDetalle(detalle);
  const traza = detalleTecnico.length
    ? `<details style="margin-top:14px;text-align:left">
         <summary style="font-size:12px;color:var(--muted);cursor:pointer">Detalle técnico</summary>
         <div style="font-size:11px;color:var(--muted);word-break:break-word;margin-top:6px;line-height:1.5">
           ${detalleTecnico.map(x => escapeHtml(x)).join('<br>')}
           <br>${escapeHtml(location.href)}
         </div>
       </details>` : '';
  document.getElementById('app').innerHTML = `
    <div class="error-box">
      <div class="icon warn-icon" aria-hidden="true"></div>
      <h2>${escapeHtml(t(key))}</h2>
      <p style="font-size:13px;color:var(--muted)">${t('error.enlace.sub')}</p>
      ${traza}
    </div>
  `;
}

function init(){
  publicId = getPublicIdFromUrl();
  const slug = getSlugFromUrl();
  tableIdFromUrl = getTableIdFromUrl();
  // Un token lleva letras y mide 16+; un id de mesa es solo un número.
  qrMesaToken = (tableIdFromUrl && /^(?=.*[A-Za-z])[A-Za-z0-9]{16,64}$/.test(tableIdFromUrl)) ? tableIdFromUrl : null;
  trackToken = getTrackTokenFromUrl();
  resToken = getResTokenFromUrl();
  if(!publicId && !slug){ showError('error.enlace'); return; }

  // Vuelta desde Stripe tras pagar con tarjeta.
  const pago = new URLSearchParams(location.search).get('pago');
  // Tras volver de Stripe, la URL se queda con "?...&pago=ok/ko" — si el
  // cliente no sabe que puede quitarlo a mano, esta pantalla era un callejón
  // sin salida real (ni el botón atrás del navegador ayuda, porque la página
  // anterior en el historial es la página de pago de Stripe).
  // El botón vuelve a la MISMA página pero sin ese parámetro, para poder
  // seguir navegando con normalidad.
  const backToSiteUrl = location.href.split('?')[0] + (publicId ? `?neg=${encodeURIComponent(publicId)}` : (slug ? `?n=${encodeURIComponent(slug)}` : '')) + (qrMesaToken ? '&mesa=' + encodeURIComponent(qrMesaToken) : '');
  if(pago === 'ok' && (trackToken || resToken)){
    // Vuelta del banco con seguimiento: se quita «pago=ok» de la dirección
    // (si no, al recargar o compartir el enlace saldría siempre este aviso) y
    // se sigue el arranque normal, que abre el seguimiento o la reserva.
    try{ const u = new URL(location.href); u.searchParams.delete('pago'); history.replaceState(null, '', u.toString()); }catch(e){}
    avisoPagoHecho = t(resToken ? 'pago.ok.bannerRes' : 'pago.ok.banner');
    trackRecienEnviadoHasta = Date.now() + 15 * 60 * 1000;
    mostrarAvisoPagoHecho();
  }else if(pago === 'ok' && qrMesaToken){
    // Vuelta del banco tras pagar la cuenta de la mesa: se vuelve a la mesa,
    // donde la cuenta se actualiza sola en cuanto el banco lo confirma.
    try{ const u = new URL(location.href); u.searchParams.delete('pago'); history.replaceState(null, '', u.toString()); }catch(e){}
    qrMesaAviso = t('mesaqr.pagoOkPedido');
  }else if(pago === 'ok'){
    document.getElementById('app').innerHTML = `
      <div class="success">
        <div class="icon ok-icon" aria-hidden="true"></div>
        <h2>${t('pago.ok.title')}</h2>
        <p style="font-size:13px;color:var(--muted)">${t('pago.ok.msg')}</p>
        <button class="btn" style="margin-top:16px" onclick="location.href='${escapeHtml(backToSiteUrl)}'">${t('success.otraPedido')}</button>
      </div>
    `;
    return;
  }
  if(pago === 'ko'){
    document.getElementById('app').innerHTML = `
      <div class="error-box">
        <div class="icon warn-icon" aria-hidden="true"></div>
        <h2>${t('pago.ko.title')}</h2>
        <p style="font-size:13px;color:var(--muted)">${t('pago.ko.msg')}</p>
        <button class="btn" style="margin-top:16px" onclick="location.href='${escapeHtml(backToSiteUrl)}'">${t('success.otraPedido')}</button>
      </div>
    `;
    return;
  }

  arrancarConLaNubeDelNegocio(slug);
}

/* ── Dónde se conecta esta página ──
   Cada negocio tiene SU propio proyecto de Firebase, y ahí es donde vive su
   espejo público. Esta página no lo sabe de antemano —del enlace solo saca
   el publicId o el nombre corto—, así que primero pregunta a la plataforma
   compartida dónde está ese negocio, y luego se conecta allí.

   Esa primera pregunta se hace por REST (un simple fetch), NO con el SDK, y
   eso es lo importante: una petición HTTP no abre socket, así que no consume
   ninguna de las 100 conexiones simultáneas que da el plan gratuito de
   Firebase, ni crea una cuenta anónima. Si esta página se conectara con el
   SDK a la plataforma —como hacía antes—, cada cliente mirando la carta
   ocuparía una conexión DEL MISMO proyecto para todos los negocios: a partir
   de unos 50-100 restaurantes, la web de reservas empezaría a fallar para
   todos a la vez, un viernes por la noche.

   Si el negocio todavía no tiene su nube publicada (uno dado de alta antes
   de este cambio), se cae a la plataforma compartida como hasta ahora: nadie
   se queda sin servicio por una migración. */
const PLATAFORMA_REST = FIREBASE_CONFIG.databaseURL.replace(/\/$/, '');

/* Primero por REST, sin autenticar: es lo que no gasta conexiones. Si las
   reglas de la plataforma todavía no permiten esa lectura abierta —el caso
   mientras no se hayan actualizado en la consola de Firebase—, se cae al
   camino de siempre: SDK con sesión anónima. Más caro en conexiones, pero
   FUNCIONA, y un cliente intentando reservar no puede quedarse mirando un
   error porque a nosotros nos falte publicar unas reglas. */
let appPlataforma = null;
async function consultarPlataforma(ruta){
  try{
    const r = await fetch(`${PLATAFORMA_REST}/${ruta}.json`, {cache: 'no-store'});
    if(r.ok){
      const v = await r.json();
      if(v !== null){ apuntarDetalle('REST ' + ruta + ' → ok'); return v; }
      apuntarDetalle('REST ' + ruta + ' → vacío');
    } else {
      apuntarDetalle('REST ' + ruta + ' → HTTP ' + r.status);
    }
  }catch(e){ apuntarDetalle('REST ' + ruta + ' → ' + (e && e.message)); }
  return await consultarPlataformaConSdk(ruta);
}

async function consultarPlataformaConSdk(ruta){
  try{
    if(!appPlataforma){
      appPlataforma = firebase.initializeApp(FIREBASE_CONFIG, 'plataforma');
      await appPlataforma.auth().signInAnonymously();
    }
    const snap = await appPlataforma.database().ref(ruta).once('value');
    apuntarDetalle('SDK ' + ruta + ' → ' + (snap.val() ? 'ok' : 'vacío'));
    return snap.val();
  }catch(e){ apuntarDetalle('SDK ' + ruta + ' → ' + (e && (e.code || e.message))); return null; }
}

// ⚠️ El nombre corto se RECIBE por parámetro. `publicId` es global pero
// `slug` es local de init(), y al sacar este arranque a su propia función se
// quedó fuera de alcance: "slug is not defined". Solo fallaba con enlaces
// cortos —los que reparte el negocio en su QR—, así que el enlace largo
// seguía funcionando y no se notaba.
async function arrancarConLaNubeDelNegocio(slug){
  try{
    // 1) El nombre corto (?n=...) se resuelve antes: da el publicId.
    if(slug && !publicId){
      const resuelto = await consultarPlataforma('gastrogoan/publicSlugs/' + slug);
      // Compatibilidad: antes se guardaba el publicId a pelo; ahora puede
      // venir como objeto con más datos dentro.
      publicId = (resuelto && typeof resuelto === 'object') ? resuelto.publicId : resuelto;
      if(!publicId){ showError('error.enlace', 'no se pudo resolver el nombre corto "' + slug + '"'); return; }
    }
    if(!publicId){ showError('error.enlace', 'el enlace no trae ni negocio ni nombre corto'); return; }

    // 2) ¿En qué nube está este negocio?
    const donde = await consultarPlataforma('gastrogoan/publicLookup/' + publicId);
    const config = (donde && donde.apiKey && donde.databaseURL)
      ? {apiKey: donde.apiKey, databaseURL: donde.databaseURL}
      : FIREBASE_CONFIG;   // negocio anterior a la migración

    apuntarDetalle('nube del negocio: ' + (config === FIREBASE_CONFIG ? 'la compartida (sin migrar)' : config.databaseURL));
    firebase.initializeApp(config);
    db = firebase.database();
    // Autenticación anónima: las reglas exigen auth != null para leer y
    // escribir, así que no se puede tocar la base sin pasar por el SDK.
    await firebase.auth().signInAnonymously();
    apuntarDetalle('sesión anónima ok');
    loadBusinessInfo();
  }catch(e){
    console.error(e);
    showError('error.conexion', (e && (e.code || e.message)) || String(e));
  }
}

let businessInfoLoadedOnce = false;
let lastRenderSignature = null;
// Guarda y restaura lo que el cliente ya había escrito (nombre, teléfono,
// dirección, notas...) alrededor de un re-render forzado por el listener en
// vivo, para no perder el formulario a medio rellenar.
function renderTabContentPreservingForm(){
  const box = document.getElementById('tab-content');
  const saved = {};
  if(box){
    // En una casilla o un radio, .value es siempre "on" — lo que hay que
    // conservar es .checked. Sin esto, una actualización en vivo de la carta
    // (o la respuesta de la comprobación del pago online) desmarcaba el
    // consentimiento de privacidad que el cliente ya había marcado, y al
    // enviar le saltaba "tienes que aceptar el aviso" sobre una casilla que
    // él juraría haber marcado.
    box.querySelectorAll('input[id], textarea[id], select[id]').forEach(el => {
      saved[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? {checked: el.checked} : {value: el.value};
    });
  }
  renderTabContent();
  Object.keys(saved).forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const s = saved[id];
    if(s.checked !== undefined){ if(el.checked !== s.checked) el.checked = s.checked; }
    else if(el.value !== s.value) el.value = s.value;
  });
  if(typeof updateOrderSlots === 'function' && wzState.kind === 'pedido') updateOrderSlots();
  if(typeof wzAplicar === 'function' && wzState.kind) wzAplicar();
}
function loadBusinessInfo(){
  // Antes esto era un once('value') de una sola vez: si el dueño cambiaba un
  // precio o quitaba un plato de la carta mientras un cliente tenía la
  // página abierta, el cliente seguía viendo datos obsoletos hasta recargar.
  // Con on() los cambios de carta/precios/disponibilidad llegan en vivo. En
  // las actualizaciones DESPUÉS de la primera no se llama a renderApp() (que
  // vacía el carrito): solo se refresca el contenido de la pestaña actual, y
  // solo si de verdad cambió algo relevante para lo que se ve — el nodo
  // 'info' incluye reservasResumen (aforo), que se reescribe cada vez que
  // CUALQUIER cliente reserva, y eso NO debe forzar un re-render (la
  // disponibilidad ya se revalida en vivo al enviar, vía getAforoInfo /
  // reserveAforoAtomic), o el formulario de otros clientes se vaciaría
  // constantemente por reservas ajenas sin ningún cambio real de carta.
  /* ⚠️ Si la primera respuesta tarda demasiado, puede que este negocio
     tenga las 100 conexiones simultáneas de su Firebase gratuito agotadas
     (un pico real de gente mirando la carta a la vez). Firebase no da un
     error explícito para eso — el socket simplemente no llega a abrirse—,
     así que no se puede DISTINGUIR de una red lenta cualquiera. El aviso es
     honesto para los dos casos: "hay mucha gente ahora mismo, reintenta".
     Se cancela en cuanto llega la primera respuesta, sea la que sea. */
  infoLoadTimeout = setTimeout(() => {
    if(businessInfoLoadedOnce) return;
    apuntarDetalle('sin respuesta tras ' + (INFO_LOAD_TIMEOUT_MS/1000) + 's — posible saturación');
    showSaturacion();
    anotarPosibleSaturacion();
  }, INFO_LOAD_TIMEOUT_MS);
  infoListenerRef = db.ref('gastrogoan/public/' + publicId + '/info');
  infoListenerCallback = snap => {
    clearTimeout(infoLoadTimeout);
    const val = snap.val();
    if(!val){ if(!businessInfoLoadedOnce) showError('error.carga'); return; }

    if(val.sucursales && Array.isArray(val.sucursales) && val.sucursales.length > 1 && !new URLSearchParams(location.search).get('local')){
      renderBranchSelector(val.business || {}, val.sucursales);
      return;
    }

    DB = {
      business: val.business || {},
      cartas: val.cartas || [],
      activeCartaIds: val.activeCartaIds || (val.activeCartaId ? [val.activeCartaId] : []),
      menus: val.menus || [],
      activeMenuIds: val.activeMenuIds || [],
      reservasResumen: val.reservasResumen || {},
      // ⚠️ El negocio SÍ manda esto (syncPublicMirror, js/core.js) pero aquí
      // nunca se copiaba a DB — así que getOccupiedSlotsForTable() siempre
      // veía un objeto vacío y CUALQUIER mesa parecía libre a cualquier
      // hora, por muy reservada que estuviera de verdad. getBestFitTable()
      // (usado tanto al enviar la reserva como por el calendario) nunca
      // detectaba el choque por sí solo — lo único que de verdad lo evitaba
      // era la transacción atómica de mesaHold al enviar, ya en el último
      // paso, sin que el cliente lo viera venir antes en el calendario.
      mesasOcupadas: val.mesasOcupadas || {},
      // Antes faltaba "pedidosResumen" aquí: el límite de pedidos por franja
      // (submitOrder → reservePedidoSlotAtomic) siempre veía un baseline de 0
      // aunque ya hubiera pedidos aceptados en esa franja, así que en la
      // práctica solo detectaba choques entre pedidos casi simultáneos, no
      // el límite acumulado real de la franja.
      pedidosResumen: val.pedidosResumen || {},
      cocinaCargaActiva: val.cocinaCargaActiva || 0,
      tables: val.tables || [],
      promos: val.promos || [],
      allergens: val.allergens || {}
    };
    renderHeader();
    if(!businessInfoLoadedOnce){
      businessInfoLoadedOnce = true;
      lastRenderSignature = JSON.stringify({business: DB.business, cartas: DB.cartas, activeCartaIds: DB.activeCartaIds, menus: DB.menus, activeMenuIds: DB.activeMenuIds, tables: DB.tables, promos: DB.promos, allergens: DB.allergens});
      renderApp();
      comprobarPagoOnline();
    }else if(currentTab && document.getElementById('tab-content')){
      const newSignature = JSON.stringify({business: DB.business, cartas: DB.cartas, activeCartaIds: DB.activeCartaIds, menus: DB.menus, activeMenuIds: DB.activeMenuIds, tables: DB.tables, promos: DB.promos, allergens: DB.allergens});
      if(newSignature !== lastRenderSignature){
        lastRenderSignature = newSignature;
        renderTabContentPreservingForm();
      }
    }
  };
  infoListenerErrorCallback = e => {
    clearTimeout(infoLoadTimeout);
    console.error(e);
    if(!businessInfoLoadedOnce) showError('error.conexion');
  };
  infoListenerRef.on('value', infoListenerCallback, infoListenerErrorCallback);
}

/* Best-effort: si de verdad hubo saturación, se lo hacemos saber al dueño
   desde SU PROPIA app (Mi Negocio → nube), no aquí — este cliente que se
   quedó fuera no tiene forma de avisarle directamente. Se anota un evento
   con marca de tiempo en el propio Firebase del negocio; el SDK lo deja en
   cola local y lo envía en cuanto consiga abrir hueco (puede que no sea
   inmediato si de verdad las 100 conexiones están todas ocupadas, pero basta
   con que UNA de las tentativas de saturación de la noche llegue a escribir).
   Sin await ni then con acción: si nunca llega a enviarse, no pasa nada —
   es solo una señal para el dueño, nunca bloquea al cliente. */
function anotarPosibleSaturacion(){
  try{
    db.ref('gastrogoan/public/' + publicId + '/saturationEvents').push({ts: Date.now()});
  }catch(e){ /* sin conexión ni para encolar: no hay nada más que hacer aquí */ }
}

/* ⚠️ DESENGANCHE POR INACTIVIDAD (10 min).
   Cada pestaña abierta cuenta como UNA de las 100 conexiones simultáneas del
   Firebase gratuito del negocio, la esté mirando alguien o no — un cliente
   que dejó el móvil bloqueado en la mesa sigue ocupando su plaza. Pasados 10
   minutos sin tocar la pantalla, se suelta el oyente en vivo (los datos ya
   cargados se quedan tal cual en pantalla, no desaparece nada) y se
   reengancha en cuanto vuelve a haber interacción. */
const INFO_LOAD_TIMEOUT_MS = 8000;
const IDLE_DISCONNECT_MS = 10 * 60 * 1000;
let infoLoadTimeout = null;
let infoListenerRef = null;
let infoListenerCallback = null;
let infoListenerErrorCallback = null;
let idleListenerDetached = false;
let lastInteractionAt = Date.now();
function marcarInteraccion(){
  lastInteractionAt = Date.now();
  if(idleListenerDetached && infoListenerRef && infoListenerCallback){
    idleListenerDetached = false;
    apuntarDetalle('reenganchado tras inactividad');
    infoListenerRef.on('value', infoListenerCallback, infoListenerErrorCallback);
  }
}
['click','touchstart','keydown','scroll'].forEach(ev => document.addEventListener(ev, marcarInteraccion, {passive: true}));
setInterval(() => {
  if(idleListenerDetached || !infoListenerRef || !infoListenerCallback) return;
  if(Date.now() - lastInteractionAt < IDLE_DISCONNECT_MS) return;
  idleListenerDetached = true;
  apuntarDetalle('desenganchado por 10 min de inactividad');
  infoListenerRef.off('value', infoListenerCallback);
}, 60 * 1000);

// Colores de marca del negocio: principal (botones) y secundario (títulos, pestañas, foco). Un color elegido a ojo puede dejar
// ilegible el texto blanco de un botón: se oscurece hasta contrastar 4,5:1 con el blanco (3:1 el secundario, que es texto grande y bordes).
function _hexARgb(h){ const m = /^#?([0-9a-f]{6})$/i.exec(String(h || '').trim()); if(!m) return null; const n = parseInt(m[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function _lum(rgb){ const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]); }
function _contrasteBlanco(hex){ const r = _hexARgb(hex); return r ? 1.05 / (_lum(r) + 0.05) : 21; }
function _oscurecerHasta(hex, min){
  const rgb = _hexARgb(hex); if(!rgb) return hex;
  let out = hex, k = 0;
  while(_contrasteBlanco(out) < min && k < 20){ k++; out = '#' + rgb.map(v => Math.max(0, Math.round(v * (1 - k * 0.05))).toString(16).padStart(2, '0')).join(''); }
  return out;
}
function aplicarColoresMarca(b){
  if(!b) return;
  const root = document.documentElement.style;
  if(b.brandColor){ const c = _oscurecerHasta(b.brandColor, 4.5); root.setProperty('--olive', c); root.setProperty('--olive-l', c); }
  if(b.brandColor2){ root.setProperty('--brand2', _oscurecerHasta(b.brandColor2, 3)); }
}
function renderBranchSelector(business, sucursales){
  if(business.logo) document.getElementById('biz-logo').innerHTML = `<img src="${escapeHtml(business.logo)}" alt="${escapeHtml(business.name||'Logo')}">`;
  aplicarColoresMarca(business);
  if(business.name){ document.getElementById('biz-name').textContent = business.name; bizNameLoaded = true; }
  const base = location.href.split('?')[0];
  document.getElementById('app').innerHTML = `
    <section class="svc">
      <div class="wz-eye"><span>${escapeHtml(t('svc.eye'))}</span></div>
      <h2 class="wz-h" tabindex="-1">${t('branch.title')}</h2>
      <p class="wz-sub">${t('branch.subtitle')}</p>
      <div class="svc-list">
        ${sucursales.map(s => `
          <a href="${escapeHtml(base)}?neg=${escapeHtml(s.publicId)}&local=1" class="svc-card" style="text-decoration:none">
            <span class="svc-ic tab-local" aria-hidden="true"></span>
            <span class="svc-tx"><span class="svc-t">${escapeHtml(s.name)}</span>${s.address ? `<span class="svc-d">${escapeHtml(s.address)}</span>` : ''}</span>
            <span class="svc-go" aria-hidden="true">›</span>
          </a>`).join('')}
      </div>
    </section>
  `;
}

// Comprueba si el restaurante tiene activo el pago online (Stripe). Si la
// comprobación llega después del primer render, se vuelve a pintar el
// formulario de pedido para mostrar la opción de pago.
function comprobarPagoOnline(){
  fetch(`${PAGOS_WORKER_URL}/stripe/estado?publicId=${encodeURIComponent(publicId)}`)
    .then(r => r.json())
    .then(data => {
      pagoOnlineActivo = !!(data && data.activo);
      // renderTabContentPreservingForm (no renderTabContent a secas): si el
      // cliente ya había empezado a escribir su nombre/teléfono/dirección
      // antes de que esta comprobación terminase (llega por red, puede
      // tardar), un renderTabContent normal lo habría borrado todo de golpe
      // justo cuando aparece la opción de pagar con tarjeta.
      if(pagoOnlineActivo && (currentTab === 'takeaway' || currentTab === 'delivery' || currentTab === 'mesa')) renderTabContentPreservingForm();
    })
    .catch(() => {});
}

function renderHeader(){
  const b = DB.business || {};
  if(b.logo){
    document.getElementById('biz-logo').innerHTML = `<img src="${escapeHtml(b.logo)}" alt="${escapeHtml(b.name||'Logo')}" onload="ggTonoLogo(this)">`;
    const hd0 = document.querySelector('header'); if(hd0) hd0.classList.add('hd-conlogo');
  } else {
    document.getElementById('biz-logo').innerHTML = '';
    const hd = document.querySelector('header'); if(hd) hd.classList.remove('hd-oscuro', 'hd-placa', 'hd-conlogo');
  }
  if(b.name){ document.getElementById('biz-name').textContent = b.name; bizNameLoaded = true; }
  aplicarColoresMarca(b);
  const parts = [];
  if(b.address) parts.push(['pin', b.address]);
  if(b.schedule) parts.push(['clock', b.schedule]);
  if(b.phone) parts.push(['phone', b.phone]);
  if(b.email) parts.push(['mail', b.email]);
  // Teléfono y email son enlaces (llamar / escribir) con el mismo aspecto que el resto de la información.
  const enlace = {phone: v => 'tel:' + String(v).replace(/[^\d+]/g, ''), mail: v => 'mailto:' + v};
  // La dirección abre Google Maps: el enlace que dejó el negocio (si es una URL) o una búsqueda con la dirección.
  const urlMapas = /^https?:\/\//i.test(String(b.gmaps || '').trim()) ? String(b.gmaps).trim() : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.address || '');
  const enlaceExt = {pin: urlMapas};
  document.getElementById('biz-info').innerHTML = parts.map(([k, v]) => enlaceExt[k]
    ? `<a class="hi hi-${k}" href="${escapeHtml(enlaceExt[k])}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(t('hdr.comoLlegar'))}: ${escapeHtml(v)}">${escapeHtml(v)}</a>`
    : enlace[k]
    ? `<a class="hi hi-${k}" href="${escapeHtml(enlace[k](v))}">${escapeHtml(v)}</a>`
    : `<span class="hi hi-${k}">${escapeHtml(v)}</span>`).join('');
  renderLangSwitcher();
}

// Mismo criterio que ya usa el TPV interno (isBebidaCarta, js/tpv.js): las
// cartas de bebidas (área "sala") siempre se muestran antes que las de
// comida, sea cual sea el orden en que se crearon.
function isBebidaCarta(c){
  if(c && c.area) return c.area === 'sala';
  return /bebida/i.test(c.nombre||'');
}
function getActiveCartas(){
  const ids = DB.activeCartaIds || [];
  const active = (DB.cartas || []).filter(c => ids.includes(c.id));
  const bebidaCartas = active.filter(isBebidaCarta);
  const comidaCartas = active.filter(c => !isBebidaCarta(c));
  return [...bebidaCartas, ...comidaCartas];
}

// Promo con descuento activa AHORA MISMO (día + franja horaria) para un
// plato, si la hay — espejo simplificado de getActivePromoForDish/
// promoTimeActiveNow (js/app.js): aquí no hace falta comprobar el límite de
// usos porque el mirror público (getActivePromosForSync, js/core.js) ya
// deja de publicar la promo en cuanto se agota el cupo del día.
function getActivePromoForPlatoPublic(platoId){
  const promo = (DB.promos||[]).find(p => p.menuItemPlatoId === platoId);
  if(!promo) return null;
  if(!promo.horaInicio || !promo.horaFin) return promo;
  const toMin = hhmm => { const [h,m] = (hhmm||'').split(':').map(Number); return (h||0)*60+(m||0); };
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  const start = toMin(promo.horaInicio), end = toMin(promo.horaFin);
  const active = end > start ? (nowMin >= start && nowMin < end) : (nowMin >= start || nowMin < end);
  return active ? promo : null;
}
function promoDiscountedPrice(precio, promo){
  return Math.round(precio * (1 - promo.discountPct/100) * 100) / 100;
}

function renderApp(){
  // Encuesta de satisfacción privada (NPS): enlace aparte (?nps=1) que el
  // negocio manda tras la visita, distinto del enlace de reseña pública de
  // Google — sirve para detectar a alguien insatisfecho ANTES de que dejara
  // una mala reseña pública, y solo el negocio ve la nota y el comentario.
  if(new URLSearchParams(location.search).get('nps') === '1'){
    renderNpsSurvey();
    return;
  }
  // Seguimiento de un pedido ya enviado (?track=token): pantalla aparte,
  // con su propio listener en vivo — no pasa por las pestañas normales.
  if(trackToken){
    renderOrderTrackingView();
    return;
  }
  // Gestión de una reserva ya enviada (?res=token): misma idea, pantalla
  // aparte con su propio listener.
  if(resToken){
    renderReservationManageView();
    return;
  }
  const tabs = computeTabs();

  if(!tabs.length){
    document.getElementById('app').innerHTML = `<div class="empty">${t('no.services')}</div>`;
    return;
  }

  if(currentTab && !tabs.some(x => x.id === currentTab)) currentTab = null;
  if(!currentTab){
    // Con varios servicios, el cliente ELIGE al entrar (antes veía las tres pestañas aunque solo fuera a usar una).
    if(tableIdFromUrl && tabs.some(x => x.id === 'mesa')) currentTab = 'mesa';
    else if(tabs.length === 1) currentTab = tabs[0].id;
  }
  cart = [];
  cartTipPct = 0; cartTipCustom = 0;
  wzReset(); menuMode = null; menuQuery = ''; menuOpenSection = null;
  if(!currentTab){ renderServicios(tabs); return; }
  document.getElementById('app').innerHTML = `
    ${serviceBarHtml(tabs)}
    <div id="tab-content" role="tabpanel"></div>
  `;
  renderTabContent();
}

// Pedido en mesa SOLO se ofrece llegando desde el QR de la mesa (que ya
// trae el número de mesa en la URL) — antes también aparecía como pestaña
// normal con un desplegable para elegir mesa a mano, redundante con lo que
// ya hacen los QR de cada mesa y una vía más para que un pedido llegara sin
// que quedara claro a qué mesa.
function computeTabs(){
  const tiposServicio = (DB.business && DB.business.tiposServicio) || {mesa:true, takeaway:true, delivery:true};
  const tabs = [];
  if(tiposServicio.mesa !== false) tabs.push({id:'reserva', label: t('tab.reserva')});
  if(tiposServicio.mesa !== false && tableIdFromUrl && (DB.tables||[]).length) tabs.push({id:'mesa', label: t('tab.mesa.qr')});
  if(tiposServicio.takeaway !== false) tabs.push({id:'takeaway', label: t('tab.takeaway')});
  if(tiposServicio.delivery !== false) tabs.push({id:'delivery', label: t('tab.delivery')});
  return tabs;
}
function tabLabel(x){ return String(x.label).replace(/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+/u, ''); }
const tabIcono = id => 'tab-' + String(id).replace(/[^a-z]/gi, '-');
// Pantalla de entrada: una tarjeta grande por servicio que ofrece el negocio.
// ¿Abierto ahora? Lo dice el horario del negocio (con sus turnos, cierres y horarios especiales): «Abierto · cierra a las 16:00»,
// «Abre hoy a las 20:00» o «Hoy cerrado». Sin horario configurado no se afirma nada.
function estadoAperturaHoy(){
  try{
    const turnos = getTurnosForDate(todayStr());
    if(turnos === null) return null;
    if(!turnos.length) return {abierto:false, txt:t('svc.cerradoHoy')};
    const ahora = String(new Date().getHours()).padStart(2,'0') + ':' + String(new Date().getMinutes()).padStart(2,'0');
    const dentro = turnos.find(x => ahora >= x.abre && ahora < x.cierra);
    if(dentro) return {abierto:true, txt:t('svc.abiertoHasta').replace('%s', dentro.cierra)};
    const luego = turnos.find(x => x.abre > ahora);
    return luego ? {abierto:false, txt:t('svc.abreA').replace('%s', luego.abre)} : {abierto:false, txt:t('svc.cerradoHoy')};
  }catch(e){ return null; }
}
// Una línea de datos útiles por servicio (tiempo, mínimo, envío): lo que un cliente mira antes de elegir.
function metaServicio(id){
  const p = (DB.business || {}).pedidos || {};
  const f = n => fmtMoney ? fmtMoney(n) : n.toFixed(2) + ' €';
  const out = [];
  if(id === 'takeaway'){
    if(p.tiempoBasePrep) out.push(t('svc.m.listoEn').replace('%d', p.tiempoBasePrep));
    if(parseFloat(p.pedidoMinimo) > 0) out.push(t('svc.m.minimo').replace('%s', f(parseFloat(p.pedidoMinimo))));
  } else if(id === 'delivery'){
    const fee = parseFloat(p.deliveryFee) || 0;
    out.push(fee > 0 ? t('svc.m.envio').replace('%s', f(fee)) : t('svc.m.envioGratis'));
    if(parseFloat(p.freeDeliveryFrom) > 0 && fee > 0) out.push(t('svc.m.gratisDesde').replace('%s', f(parseFloat(p.freeDeliveryFrom))));
  } else if(id === 'reserva'){
    out.push(t('svc.m.alInstante'));
  }
  return out;
}
// Iconos grandes y tenues del fondo de la entrada: los de las propias secciones de la carta del negocio (su comida, no una foto de stock).
function heroIconosHtml(){
  const claves = [];
  try{
    getActiveCartas().forEach(c => (c.secciones || []).forEach(s => { const k = iconoComidaClave(s.icono, s.nombre); if(k && ICONOS_COMIDA[k] && !claves.includes(k)) claves.push(k); }));
  }catch(e){}
  ['hamburguesa', 'pizza', 'copa-vino', 'tarta', 'cafe'].forEach(k => { if(claves.length < 5 && !claves.includes(k) && ICONOS_COMIDA[k]) claves.push(k); });
  return claves.slice(0, 5).map((k, i) => `<span class="hg hg${i}">${iconoComidaSvg(k, 120)}</span>`).join('');
}
function renderServicios(tabs){

  document.getElementById('app').innerHTML = `
    <section class="svc svc-hero">
      <div class="hero-top">

        ${ap ? `<span class="hero-open ${ap.abierto ? 'is-on' : 'is-off'}"><i aria-hidden="true"></i>${escapeHtml(ap.txt)}</span>` : `<span class="wz-eye"><span>${escapeHtml(t('svc.eye'))}</span></span>`}
        <h2 class="hero-h" tabindex="-1">${escapeHtml(t('svc.title'))}</h2>
        <p class="hero-sub">${escapeHtml(t('svc.sub'))}</p>
      </div>
      <div class="svc-grid">
        ${tabs.map((x, i) => `<button type="button" class="svc-tile" style="--i:${i}" onclick="setTab('${x.id}')">
          <span class="svc-disc"><span class="svc-ic ${tabIcono(x.id)}" aria-hidden="true"></span></span>
          <span class="svc-tx"><span class="svc-t">${escapeHtml(tabLabel(x))}</span><span class="svc-d">${escapeHtml(t('svc.' + x.id))}</span></span>
          ${metaServicio(x.id).length ? `<span class="svc-meta">${metaServicio(x.id).map(m => `<span>${escapeHtml(m)}</span>`).join('')}</span>` : ''}
          <span class="svc-cta" aria-hidden="true"><span>${escapeHtml(t('svc.cta'))}</span><b>→</b></span>
        </button>`).join('')}
      </div>
    </section>`;
  const grid = document.querySelector('.svc-grid');
  if(grid) grid.addEventListener('pointermove', e => { const t = e.target.closest('.svc-tile'); if(!t) return; const r = t.getBoundingClientRect(); t.style.setProperty('--mx', (e.clientX - r.left) + 'px'); t.style.setProperty('--my', (e.clientY - r.top) + 'px'); });
}
// Con el servicio ya elegido: una barra pequeña con el nombre y «Cambiar» (solo si hay más de uno que elegir).
function serviceBarHtml(tabs){
  if(tabs.length < 2) return '';
  // Quien entra por el QR de una mesa solo puede pedir EN ESA MESA: no hay otro servicio al que «Cambiar» (y el botón llevaba a
  // reservar o pedir para llevar, que no es lo que escaneó).
  if(qrMesaToken) return '';
  const x = tabs.find(y => y.id === currentTab); if(!x) return '';
  return `<div class="svc-bar" id="svc-bar"><span class="svc-chip"><span class="svc-ic ${tabIcono(x.id)}" aria-hidden="true"></span>${escapeHtml(tabLabel(x))}</span><button type="button" class="svc-cambiar" onclick="volverAServicios()">${escapeHtml(t('svc.change'))}</button></div>`;
}
async function volverAServicios(){
  if((cart.length || wzState.step > 1 || wzState.reached > 1) && !(await confirmModal(t('svc.leave')))) return;
  currentTab = null;
  renderApp();
}
// Cambiar de idioma: la barra del servicio se repinta con el texto nuevo.
function renderTabBar(){
  const b = document.getElementById('svc-bar');
  if(b) b.outerHTML = serviceBarHtml(computeTabs());
}

async function setTab(tab){
  if(tab === currentTab) return;
  // Cambiar de pestaña vacía el carrito (son pedidos distintos: para llevar,
  // delivery, en mesa...) — antes se perdía sin más ni un aviso, así que un
  // toque sin querer en otra pestaña tiraba todo lo que el cliente llevaba
  // añadido sin poder deshacerlo.
  if(cart.length && !(await confirmModal(t('confirm.loseCart')))) return;
  currentTab = tab;
  cart = [];
  cartTipPct = 0; cartTipCustom = 0;
  // Volver también al índice de carpetas de la carta: si no, al cambiar de
  // Take Away a Delivery el cliente seguía "dentro" de la última familia que
  // había abierto (p.ej. solo Entrantes), dando la impresión de que en esa
  // otra pestaña hay muchos menos platos.
  menuOpenSection = null;
  renderApp();
}

function renderTabContent(){
  if(currentTab === 'reserva') renderReservaForm();
  else if(currentTab === 'mesa') renderMesaOrderForm();
  else renderOrderForm();
  const box = document.getElementById('tab-content');
  if(box){ box.classList.remove('fade-in-play'); void box.offsetWidth; box.classList.add('fade-in-play'); }
}

/* ============ PASOS (6/11): reservar y pedir en tres pantallas ============
   Antes todo era UN formulario larguísimo (carta, carrito, datos, pago y
   consentimiento en la misma página). Ahora el cliente avanza por pasos —elegir,
   sus datos, revisar y confirmar— y cada paso valida lo suyo antes de dejarle
   seguir. Los campos, sus ids y submitReserva()/submitOrder() son los de siempre:
   solo cambia qué se ve y cuándo. Si un envío falla por un campo de un paso
   anterior, markFieldInvalid() lleva al cliente a ese paso (ver wzMostrarCampo). */
let wzState = {kind:null, step:1, reached:1, rendered:null};
const WZ_PASOS = {reserva:['wz.s.when','wz.s.data','wz.s.confirm'], pedido:['wz.s.pick','wz.s.data','wz.s.confirm']};
const wzEl = id => document.getElementById(id);
const wzVal = id => { const e = wzEl(id); return e ? String(e.value || '').trim() : ''; };
function wzIniciar(kind){ if(wzState.kind !== kind) wzState = {kind, step:1, reached:1, rendered:null}; }
function wzReset(){ wzState = {kind:null, step:1, reached:1, rendered:null}; }
function telefonoValido(v){ return String(v || '').replace(/\D/g, '').length >= 7; }
function wzProgHtml(kind){
  return `<ol class="wz-prog" aria-label="${escapeHtml(t('wz.progress'))}">${WZ_PASOS[kind].map((k, i) => {
    const n = i + 1;
    return `<li data-wz-li="${n}"><button type="button" onclick="wzIr(${n})"><span class="n">${n}</span><span class="l">${escapeHtml(t(k))}</span></button></li>`;
  }).join('')}</ol>`;
}
function wzNavHtml(submitHtml){
  return `<div class="wz-nav" id="wz-nav"><div class="tray" id="wz-tray" hidden></div><button type="button" class="btn" id="wz-back" onclick="wzAtras()">${escapeHtml(t('wz.back'))}</button><button type="button" class="btn btn-primary" id="wz-next" onclick="wzSiguiente()">${escapeHtml(t('wz.next'))}</button>${submitHtml}</div>`;
}
function wzAplicar(){
  const k = wzState.kind; if(!k || !wzEl('wz')) return;
  const total = WZ_PASOS[k].length;
  document.querySelectorAll('.wz-step').forEach(s => { const activo = (+s.dataset.wz === wzState.step); if(activo && s.hidden) s.dataset.dir = wzState.dir || 'fw'; s.hidden = !activo; });
  document.querySelectorAll('[data-wz-li]').forEach(li => {
    const n = +li.dataset.wzLi, b = li.querySelector('button');
    li.classList.toggle('on', n === wzState.step); li.classList.toggle('done', n < wzState.step);
    b.disabled = n > wzState.reached;
    if(n === wzState.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  const ultimo = wzState.step === total;
  const back = wzEl('wz-back'), next = wzEl('wz-next'), sub = wzEl(k === 'reserva' ? 'r-submit' : 'o-submit');
  if(back) back.style.display = wzState.step > 1 ? '' : 'none';
  if(next) next.style.display = ultimo ? 'none' : '';
  if(sub) sub.style.display = ultimo ? '' : 'none';
  if(ultimo) wzResumen();
  wzNavActualizar();
}
function wzScroll(){
  const w = wzEl('wz'); if(!w) return;
  const top = w.getBoundingClientRect().top + window.scrollY - 8;
  window.scrollTo({top: Math.max(0, top), behavior: 'smooth'});
  const h = w.querySelector('.wz-step:not([hidden]) .wz-h'); if(h) h.focus({preventScroll:true});
}
function wzIr(n){
  if(n < 1 || n > wzState.reached) return;
  wzState.dir = n >= wzState.step ? 'fw' : 'bk';
  wzState.step = n; wzAplicar(); wzScroll();
}
function wzAtras(){ if(wzState.step > 1) wzIr(wzState.step - 1); }
function wzSiguiente(){
  if(!wzValidar(wzState.step)) return;
  const total = WZ_PASOS[wzState.kind].length;
  if(wzState.step >= total) return;
  wzState.dir = 'fw';
  wzState.step++; wzState.reached = Math.max(wzState.reached, wzState.step);
  wzAplicar(); wzScroll();
}
// Un campo con error que vive en OTRO paso (p. ej. el envío rechaza la hora
// estando ya en «Confirmar»): se vuelve a ese paso antes de señalarlo.
function wzMostrarCampo(input){
  if(!wzState.kind || !wzEl('wz')) return;
  const sec = input.closest && input.closest('.wz-step');
  if(sec && +sec.dataset.wz !== wzState.step){ wzState.dir = 'bk'; wzState.step = +sec.dataset.wz; wzAplicar(); }
}
function wzPeople(d){
  const i = wzEl('r-people'); if(!i) return;
  i.value = Math.min(50, Math.max(1, (parseInt(i.value) || 1) + d));
  updateDepositNoticeUi(); renderReservaCalendar();
}
/* Bandeja «Tu selección» (pedidos, paso 1): lo elegido hasta ahora SIEMPRE a la vista, abajo; al tocarla se despliega
   con sus − n + para ajustarlo sin salir de la carta. */
let trayOpen = false;
function trayToggle(){ trayOpen = !trayOpen; trayActualizar(); }
function cartLineHtml(l){
  const mods = (l.modificadores || []).length ? `<small>${l.modificadores.map(m => escapeHtml(trItem(m))).join(', ')}</small>` : '';
  return `
  <div class="cl-l">
    <div class="cl-n">${escapeHtml(l.name)}${mods}</div>
    <div class="cl-q" role="group" aria-label="${escapeHtml(l.name)}">
      <button type="button" data-k="${escapeHtml(l.key)}|-1" onclick="changeCartLineQty('${escapeJsAttr(l.key)}', -1)" aria-label="${escapeHtml(t('aria.removeItem').replace('%s', l.name))}">−</button>
      <span>${l.qty}</span>
      <button type="button" data-k="${escapeHtml(l.key)}|1" onclick="changeCartLineQty('${escapeJsAttr(l.key)}', 1)" aria-label="${escapeHtml(t('aria.addItem').replace('%s', l.name))}">+</button>
    </div>
    <div class="cl-p">${fmtMoney(l.price * l.qty)}</div>
  </div>`;
}
let trayPrevN = 0;
function trayActualizar(){
  const box = wzEl('wz-tray'); if(!box) return;
  const visible = wzState.kind === 'pedido' && wzState.step === 1 && cart.length > 0;
  box.hidden = !visible;
  if(!visible){ trayOpen = false; box.innerHTML = ''; return; }
  const foco = document.activeElement && box.contains(document.activeElement) ? document.activeElement.dataset.k : null;
  const n = cart.reduce((s, l) => s + l.qty, 0), sub = cart.reduce((s, l) => s + l.price * l.qty, 0);
  const subio = n > trayPrevN; trayPrevN = n;
  const resumen = cart.map(l => (l.qty > 1 ? l.qty + '× ' : '') + l.name).join(' · ');
  box.innerHTML = `<button type="button" class="tray-h${trayOpen ? ' on' : ''}" aria-expanded="${trayOpen}" aria-label="${escapeHtml(t('wz.tray.open'))}" onclick="trayToggle()">
      <span class="tray-k"><span class="tray-n${subio ? ' bump' : ''}">${n}</span>${escapeHtml(t('wz.tray'))}</span>
      <span class="tray-r">${escapeHtml(resumen)}</span>
      <span class="tray-t">${fmtMoney(sub)}</span>
      <span class="tray-c" aria-hidden="true"></span>
    </button>${trayOpen ? `<div class="tray-b">${cart.map(cartLineHtml).join('')}</div>` : ''}`;
  if(foco){ const b = [...box.querySelectorAll('[data-k]')].find(x => x.dataset.k === foco); if(b) b.focus({preventScroll:true}); }
}
/* Texto del botón «Continuar»: en el pedido lleva el total y avisa de lo que falta. */
function wzNavActualizar(){
  trayActualizar();
  const next = wzEl('wz-next'); if(!next) return;
  next.disabled = false; next.textContent = t('wz.next');
  if(wzState.kind !== 'pedido' || wzState.step !== 1) return;
  const p = (DB.business || {}).pedidos || {};
  const n = cart.reduce((s, l) => s + l.qty, 0), sub = cart.reduce((s, l) => s + l.price * l.qty, 0), min = p.pedidoMinimo || 0;
  if(!n){ next.disabled = true; next.textContent = t('wz.o.empty'); }
  else if(min > 0 && sub < min){ next.disabled = true; next.textContent = t('wz.o.faltan').replace('%s', fmtMoney(min - sub)); }
  else {
    next.innerHTML = `${escapeHtml(t('wz.next'))} · <span class="mono">${n} · ${fmtMoney(sub)}</span>`;
    const firma = n + '|' + sub;
    if(next.dataset.firma && next.dataset.firma !== firma){ next.classList.remove('pulso'); void next.offsetWidth; next.classList.add('pulso'); }
    next.dataset.firma = firma;
  }
}
function wzValidar(step){
  const k = wzState.kind;
  if(k === 'reserva'){
    if(step === 1){
      if(!wzVal('r-date') || !wzVal('r-time')){
        showInlineError(t('wz.err.when'));
        const c = wzEl('r-cal'); if(c) c.scrollIntoView({behavior:'smooth', block:'center'});
        return false;
      }
      return true;
    }
    if(step === 2){
      clearFieldInvalid(['r-name', 'r-phone', 'r-email']);
      const n = wzVal('r-name'), ph = wzVal('r-phone'), em = wzVal('r-email');
      let ok = true;
      if(!n){ markFieldInvalid('r-name'); ok = false; }
      if(!ph || !telefonoValido(ph)){ markFieldInvalid('r-phone'); ok = false; }
      if(!em){ markFieldInvalid('r-email'); ok = false; }
      if(!ok){ showInlineError(ph && !telefonoValido(ph) && n && em ? t('wz.err.phone') : t('error.campos.reserva')); return false; }
      if(!isValidEmail(em)){ markFieldInvalid('r-email'); showInlineError(t('error.email.invalido')); return false; }
      return true;
    }
    return true;
  }
  if(k === 'pedido'){
    const p = (DB.business || {}).pedidos || {};
    if(step === 1){
      if(!cart.length){ showInlineError(t('error.carrito.vacio')); return false; }
      const min = p.pedidoMinimo || 0, sub = cart.reduce((s, l) => s + l.price * l.qty, 0);
      if(min > 0 && sub < min){ showInlineError(t('error.pedido.min').replace('%s', fmtMoney(min))); return false; }
      return true;
    }
    if(step === 2) return wzValidarDatosPedido(p);
  }
  return true;
}
function wzValidarDatosPedido(p){
  const isDelivery = currentTab === 'delivery';
  const ids = ['o-name', 'o-phone', 'o-date', 'o-time', 'o-email'].concat(isDelivery ? ['o-address', 'o-cp'] : []);
  clearFieldInvalid(ids);
  let ok = true;
  const need = id => { if(!wzVal(id)){ markFieldInvalid(id); ok = false; } };
  need('o-name'); need('o-date'); need('o-time');
  if(isDelivery){ need('o-address'); need('o-cp'); }
  const ph = wzVal('o-phone');
  if(!ph || !telefonoValido(ph)){ markFieldInvalid('o-phone'); ok = false; }
  if(!ok){ showInlineError(ph && !telefonoValido(ph) && wzVal('o-name') ? t('wz.err.phone') : t('error.campos')); return false; }
  const em = wzVal('o-email');
  if(em && !isValidEmail(em)){ markFieldInvalid('o-email'); showInlineError(t('error.email.invalido')); return false; }
  const date = wzVal('o-date'), time = wzVal('o-time');
  if(date < todayStr()){ markFieldInvalid('o-date'); showInlineError(t('error.campos')); return false; }
  const turnos = getTurnosForDate(date);
  if(turnos !== null && !turnos.length){ markFieldInvalid('o-date'); showInlineError(t('error.cerrado').replace('%s', nombreDia(date).toLowerCase())); return false; }
  if(turnos !== null && turnos.length && !isTimeAllowed(date, time)){
    markFieldInvalid('o-time');
    showInlineError(t('error.horario').replace('%s', t('error.horario.pedidos')).replace('%s', nombreDia(date).toLowerCase()).replace('%s', formatTurnos(turnos)));
    return false;
  }
  if(turnos !== null && turnos.length){
    const cutoff = pedidosCutoffTimeForTurno(date, time, p);
    if(cutoff && time > cutoff.limite){ markFieldInvalid('o-time'); showInlineError(t('error.cierrePedidos').replace('%s', cutoff.limite)); return false; }
  }
  const lead = getLeadTimeMin('pedido');
  if(lead && date === todayStr()){
    const d = new Date(Date.now() + lead * 60000);
    const minTime = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if(time < minTime){ markFieldInvalid('o-time'); showInlineError(t('error.antelacion').replace('%d', lead).replace('%s', minTime)); return false; }
  }
  if(isDelivery){
    const cp = wzVal('o-cp').replace(/\s+/g, '');
    const cpList = p.cpList || [];
    if(cpList.length && !cpList.includes(cp)){
      markFieldInvalid('o-cp'); checkCpLive(); showInlineError(t('cp.fueraDeZona').replace('${lista}', cpList.join(', '))); return false;
    }
  }
  return true;
}
/* Resumen de la última pantalla: lo que el cliente va a enviar, con «Cambiar» en cada bloque. */

/* Horas con un toque: los huecos REALES del día (horario, antelación y cierre de cocina), en vez de adivinar con el selector nativo.
   El primero es «Cuanto antes». El selector de hora sigue ahí por si el cliente quiere otra, y el envío revalida igual. */
function updateOrderSlots(preseleccionar){
  const box = wzEl('o-slots'); if(!box) return;
  const date = wzVal('o-date') || todayStr();
  const p = (DB.business || {}).pedidos || {};
  const lead = getLeadTimeMin('pedido');
  let min = '00:00';
  if(date === todayStr()){ const d = new Date(Date.now() + lead * 60000); min = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  const todos = slotsDelDia(date).filter(sl => sl >= min).filter(sl => { const c = pedidosCutoffTimeForTurno(date, sl, p); return !c || sl <= c.limite; });
  const inp = wzEl('o-time');
  if(!todos.length){ if(inp) inp.value = ''; box.innerHTML = `<p class="slots-vacio">${escapeHtml(t('wz.o.sinHoras'))}</p>`; return; }
  // Sin campo manual: solo se puede elegir una hora que SEA viable. Si la que había ya no lo es (o no había ninguna), la primera.
  if(inp && !todos.includes(inp.value)) inp.value = todos[0];
  const cur = inp ? inp.value : '';
  const lista = todos;
  box.innerHTML = lista.map((sl, i) => `<button type="button" class="${sl === cur ? 'on' : ''}${i === 0 ? ' asap' : ''}" aria-pressed="${sl === cur}" onclick="pedidoHora('${sl}')">${i === 0 ? `<span class="a">${escapeHtml(t('wz.o.asap'))}</span> ` : ''}${sl}</button>`).join('');
}
function pedidoHora(sl){
  const inp = wzEl('o-time'); if(!inp) return;
  inp.value = sl; clearFieldInvalid(['o-time']);
  updateCierreHint(); updateOrderSlots();
}

/* ============ CABECERA: el logo manda (6/11) ============
   La franja era siempre negra: un logo oscuro (lo más habitual) y hasta el
   nombre del negocio —tinta sobre tinta— desaparecían. Se mide el logo: oscuro
   → franja clara; claro → franja de tinta; si el navegador no deja medirlo
   (imagen de otro dominio) → franja de tinta con el logo sobre una placa blanca. */
function ggTonoLogo(img){
  const h = document.querySelector('header'); if(!h) return;
  h.classList.remove('hd-oscuro', 'hd-placa');
  try{
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data;
    let n = 0, l = 0;
    for(let i = 0; i < d.length; i += 4){
      const a = d[i + 3] / 255; if(a < .2) continue;
      n += a; l += a * (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
    }
    if(n < 8) return;               // casi transparente: no se puede medir, franja clara
    if(l / n > 0.62) h.classList.add('hd-oscuro');
  }catch(e){ h.classList.add('hd-oscuro', 'hd-placa'); }
}

/* ============ HORARIOS ============ */
const DIAS_SEMANA_I18N = {
  es:['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],
  en:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],
  ca:['Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte','Diumenge']
};
function getDiasSemana(){ return DIAS_SEMANA_I18N[currentLang] || DIAS_SEMANA_I18N.es; }

// Devuelve los turnos (franjas horarias) del día de la semana correspondiente
// a dateStr, o null si el negocio no ha configurado horario (sin restricción).
// Días cerrados fuera del cierre habitual (vacaciones, obras…): los pone el negocio en Mi Negocio → Horario.
function cierreExcepcionalDe(dateStr){
  const lista = (DB.business || {}).diasCerrados;
  if(!Array.isArray(lista) || !dateStr) return null;
  return lista.find(c => c && c.desde && dateStr >= c.desde && dateStr <= (c.hasta || c.desde)) || null;
}
// Horario ESPECIAL (8/11): un día con otras horas que las de su semana. Mismo formato que un día normal; un cierre siempre gana.
function horarioEspecialDe(dateStr){
  const lista = (DB.business || {}).horariosEspeciales;
  if(!Array.isArray(lista) || !dateStr) return null;
  return lista.find(h => h && h.desde && dateStr >= h.desde && dateStr <= (h.hasta || h.desde)) || null;
}
function getTurnosForDate(dateStr){
  if(cierreExcepcionalDe(dateStr)) return [];
  const esp = horarioEspecialDe(dateStr);
  const horario = (DB.business || {}).horario;
  if(!esp && (!horario || horario.length !== 7)) return null;
  const jsDay = new Date(dateStr + 'T00:00:00').getDay(); // 0=domingo..6=sábado
  const d = esp || horario[(jsDay + 6) % 7]; // 0=lunes..6=domingo
  if(!d || d.abierto === false) return [];
  const turnos = [];
  const add = (ini, fin) => { if(ini && fin && fin > ini) turnos.push({abre:ini, cierra:fin}); };
  // Formato nuevo: {modo:'seguido'|'turnos', seguido:{ini,fin}, turnos:[{ini,fin}]}
  if(d.modo === 'seguido' && d.seguido){
    add(d.seguido.ini, d.seguido.fin);
  } else if(Array.isArray(d.turnos)){
    d.turnos.forEach(t => t && add(t.ini, t.fin));
  } else {
    // Formato antiguo: {t1i,t1f,t2i,t2f}
    add(d.t1i, d.t1f);
    add(d.t2i, d.t2f);
  }
  // Un día marcado como abierto pero sin ninguna franja horaria rellenada
  // (el estado de fábrica: defaultHorario() deja ini/fin en blanco) no
  // significa "cerrado" — significa que el negocio aún no ha configurado
  // Horario de apertura en Mi Negocio. Sin esto, esta página bloqueaba
  // CUALQUIER reserva/pedido (isTimeAllowed devuelve false para un array
  // vacío) hasta que alguien rellenara el horario — mismo fix que ya tenía
  // el panel interno (js/menu.js), que aquí no se había aplicado.
  if(!turnos.length && d.abierto !== false) return null;
  return turnos;
}

function isTimeAllowed(dateStr, time){
  const turnos = getTurnosForDate(dateStr);
  if(turnos === null) return true;
  return turnos.some(t => time >= t.abre && time <= t.cierra);
}

// Hora límite real para hacer un PEDIDO (no una reserva) dentro del turno al
// que pertenece `time`: el cierre del turno menos los minutos que el
// negocio haya configurado en "Dejar de aceptar pedidos X min antes del
// cierre" (mn.pedidos.cierreAntes). Devuelve null si no hay cutoff
// configurado o `time` no cae dentro de ningún turno (ese caso ya lo separa
// isTimeAllowed).
function pedidosCutoffTimeForTurno(dateStr, time, p){
  const cutoffMin = parseInt(p.cierrePedidosAntesMin) || 0;
  if(!cutoffMin) return null;
  const turnos = getTurnosForDate(dateStr);
  if(!turnos) return null;
  const turno = turnos.find(t => time >= t.abre && time <= t.cierra);
  if(!turno) return null;
  const [ch, cm] = turno.cierra.split(':').map(Number);
  let limiteMin = ch * 60 + cm - cutoffMin;
  if(limiteMin < 0) limiteMin = 0; // cutoff mayor que la duración del turno: no se acepta ningún pedido en él
  const limite = String(Math.floor(limiteMin/60)).padStart(2,'0') + ':' + String(limiteMin%60).padStart(2,'0');
  return {limite, turno};
}

// Índice del turno al que pertenece `time` en `dateStr`, o null si no hay
// horario configurado o la hora no encaja en ninguno. Cierre EXCLUSIVO salvo
// en el último turno del día (inclusivo) — mismo criterio que
// getTurnoIndexForTime() en el panel interno (js/menu.js): antes aquí todos
// los cierres eran inclusivos, así que justo en el minuto de cambio de turno
// (p.ej. las 16:00 entre un turno 13-16 y otro 16-19) esta página podía
// calcular un turnoIdx distinto al que usa el panel interno.
function getTurnoIndexForTime(dateStr, time){
  const turnos = getTurnosForDate(dateStr);
  if(!turnos || !turnos.length) return null;
  const idx = turnos.findIndex((t, i) => time >= t.abre && (i === turnos.length - 1 ? time <= t.cierra : time < t.cierra));
  return idx === -1 ? null : idx;
}
// Devuelve {aforo, turnoIdx, reservados, disponible} o null si no hay aforo
// configurado o la hora no encaja en ningún turno. reservados es el último
// recuento SINCRONIZADO desde el panel interno (puede llevar algo de retraso
// respecto a reservas que otros clientes están completando ahora mismo) —
// la comprobación final de verdad es la transacción atómica al enviar.
function getAforoInfo(dateStr, time){
  const aforo = parseInt((DB.business||{}).aforo) || 0;
  if(!aforo) return null;
  const turnoIdx = getTurnoIndexForTime(dateStr, time);
  if(turnoIdx === null) return null;
  const resumen = (DB.reservasResumen||{})[dateStr] || {};
  const reservados = resumen[turnoIdx] || 0;
  return {aforo, turnoIdx, reservados, disponible: Math.max(0, aforo - reservados)};
}
// Reserva de forma ATÓMICA `people` plazas del turno, usando una transacción
// de Firebase sobre un contador de "holds" independiente del resumen ya
// sincronizado. Esto evita que dos clientes reservando casi a la vez (antes
// de que el panel interno vuelva a sincronizar el resumen) puedan juntos
// superar el aforo sin que ninguno de los dos lo viera en su momento. Si la
// transacción no se puede completar sin pasarse del aforo, se aborta
// (result.committed === false) y no se ha reservado nada.
function reserveAforoAtomic(dateStr, turnoIdx, people, aforo, baseline){
  const ref = db.ref('gastrogoan/public/' + publicId + '/aforoHold/' + dateStr + '/' + turnoIdx);
  return ref.transaction(current => {
    const held = current || 0;
    if(baseline + held + people > aforo) return; // abort: se pasaría del aforo
    return held + people;
  });
}
// Antes había un margen que dejaba emparejar una mesa MÁS PEQUEÑA que el
// grupo (mesa de 4 aceptando un grupo de 5) — decisión del dueño: una mesa
// nunca puede ser más pequeña que el grupo que se sienta en ella, así que
// esto se quitó. El único margen que queda es por ARRIBA, y no decide si
// cabe o no (eso ahora es estricto): decide si la reserva se autoconfirma
// sola o si el personal la revisa a mano por no querer bloquear en
// automático una mesa grande para un grupo pequeño (ver AUTO_CONFIRM_MARGIN
// en js/core.js, que es quien de verdad decide el estado de la reserva).

// Cuánto tiempo ocupa una reserva la mesa antes de poder volver a
// reservarse — configurable en Mi Negocio (mn-reserva-duracion), 90 min por
// defecto. Mismo valor y mismo concepto que reservaVentanaMin() en el panel
// interno (js/app.js), pero es un archivo aparte sin acceso a ese código.
function getReservaDuracionMin(){
  return parseInt((DB.business||{}).reservaDuracionMin) || 90;
}
// Franjas de 30 min que ocupa una reserva de `time` a `time + duración`
// (p.ej. 14:00 con 90 min -> ["14:00","14:30","15:00"], libre desde las
// 15:30). Misma rejilla de 30 min que ya usa getReservationTimeSlots() en
// el panel interno.
function slotsForReservation(time, durationMin){
  const [h, m] = time.split(':').map(Number);
  const start = h * 60 + m;
  const end = start + durationMin;
  // Hallazgo real de auditoría: al arrancar la rejilla desde la hora EXACTA
  // de cada reserva (14:00 → 14:00/14:30/15:00; 14:15 → 14:15/14:45/15:15),
  // dos reservas que se solapan de verdad no comparten ninguna franja y el
  // candado atómico de la mesa no detecta el choque. Al encajar el inicio
  // en la misma rejilla fija de 15 min que usa el calendario (nunca la hora
  // exacta que haya escrito el cliente), cualquier solape real de al menos
  // 15 minutos comparte siempre al menos una franja.
  let cur = start - (start % 15);
  const slots = [];
  while(cur < end){
    slots.push(String(Math.floor(cur / 60)).padStart(2, '0') + ':' + String(cur % 60).padStart(2, '0'));
    cur += 15;
  }
  return slots;
}
// Mayor capacidad entre las mesas dadas de alta (con plazas configuradas).
// Si un grupo no cabe ni en la mesa más grande ni con margen, es que hace
// falta juntar mesas — algo que ya no puede decidir la web sola.
function getMaxTableCapacity(){
  return Math.max(0, ...(DB.tables || []).filter(tb => tb.plazas).map(tb => tb.plazas));
}
// Franjas ya ocupadas de una mesa concreta ese día, según el espejo
// sincronizado (DB.mesasOcupadas, sin ningún dato de cliente — solo qué
// mesa y qué franjas).
function getOccupiedSlotsForTable(dateStr, tableId){
  return ((DB.mesasOcupadas || {})[dateStr] || {})[tableId] || {};
}
function tableFreeForSlots(dateStr, tableId, slots){
  const occupied = getOccupiedSlotsForTable(dateStr, tableId);
  return slots.every(s => !occupied[s]);
}
// Mejor mesa libre para un grupo de `people` personas en esas franjas: la
// más pequeña que cumple people <= plazas + margen y no choca con ninguna
// reserva ya existente en esa mesa. Solo se consideran mesas con capacidad
// configurada — una sin plazas no se puede juzgar.
// ⚠️ Decisión del dueño (1/10): una mesa vale si le caben todos y no le
// sobran más de dos sillas (3 personas → mesas de 3 a 5). La app aplica la
// MISMA regla al recibir la reserva (mesaEncajaGrupo, js/core.js): si no
// coincidieran, la web ofrecería mesas que la app luego deja pendientes.
const MESA_MARGEN_PLAZAS = 2;
function mesaEncajaGrupo(tb, people){
  const plazas = parseInt(tb && tb.plazas) || 0;
  return plazas >= people && plazas <= people + MESA_MARGEN_PLAZAS;
}
function getEligibleTables(dateStr, people, slots){
  return (DB.tables || [])
    .filter(tb => mesaEncajaGrupo(tb, people) && tableFreeForSlots(dateStr, tb.id, slots))
    .sort((a, b) => a.plazas - b.plazas);
}
function getBestFitTable(dateStr, time, people, slots){
  return getEligibleTables(dateStr, people, slots)[0] || null;
}
// ¿Existe en el local ALGUNA mesa de ese tamaño, libre o no? Si no, ninguna
// hora va a salir en verde y no tiene sentido enseñar un calendario todo en
// rojo: se le dice que llame, igual que a un grupo grande.
function hayMesaDeEseTamano(people){
  return (DB.tables || []).some(tb => mesaEncajaGrupo(tb, people));
}
// Grupos: a partir de X personas (Mi Negocio) no se reserva por la web.
function esGrupoPorTelefono(people){
  const desde = parseInt((DB.business || {}).reservaConfirmManualDesde) || 0;
  return desde > 0 && people >= desde;
}
// Motivo por el que este número de personas no puede reservar online, o null.
function motivoSinReservaOnline(people){
  if(esGrupoPorTelefono(people)) return 'grupo';
  if((DB.tables||[]).some(tb => tb.plazas) && !hayMesaDeEseTamano(people)) return 'sinMesa';
  return null;
}
function avisoGrupoHtml(people, motivo){
  const b = DB.business || {};
  const phone = (b.phone || '').trim(), email = (b.email || '').trim();
  const desde = parseInt(b.reservaConfirmManualDesde) || people;
  const titulo = motivo === 'grupo' ? t('grupo.titulo').replace('%d', desde) : '';
  const texto = motivo === 'grupo' ? t('grupo.texto') : t('grupo.sinMesa').replace('%d', people);
  const asunto = encodeURIComponent(t('grupo.asunto').replace('%d', people));
  return `<div class="grp-aviso">
    ${titulo ? `<div class="grp-titulo">${escapeHtml(titulo)}</div>` : ''}
    <p>${escapeHtml(texto)}</p>

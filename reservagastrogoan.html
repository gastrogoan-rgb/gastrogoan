      ${phone ? `<a class="btn btn-primary grp-btn" href="tel:${escapeHtml(phone.replace(/\s+/g,''))}">${t('grupo.llamar')} · ${escapeHtml(phone)}</a>` : ''}
      ${email ? `<a class="btn grp-btn" href="mailto:${escapeHtml(email)}?subject=${asunto}">${t('grupo.escribir')}</a>` : ''}
    </div>
  </div>`;
}
// Reserva de forma ATÓMICA una mesa concreta para esas franjas, usando una
// transacción de Firebase sobre un "candado" independiente del resumen ya
// sincronizado. Esto evita que dos clientes casi a la vez (antes de que el
// panel interno vuelva a sincronizar mesasOcupadas) se lleven la misma
// franja de la misma mesa sin que ninguno de los dos lo viera en su
// momento. Si alguna franja ya estaba cogida, se aborta (result.committed
// === false) y no se reserva nada — la transacción entera es sobre el
// mismo nodo (todas las franjas de esa mesa ese día), así que dos
// solicitudes que choquen SIEMPRE se serializan entre sí.
function reserveTableAtomic(dateStr, tableId, slots){
  const ref = db.ref('gastrogoan/public/' + publicId + '/mesaHold/' + dateStr + '/' + tableId);
  return ref.transaction(current => {
    const held = current || {};
    for(const s of slots){ if(held[s]) return; } // abort: alguna franja ya está cogida
    const merged = Object.assign({}, held);
    slots.forEach(s => { merged[s] = true; });
    return merged;
  });
}
// Deshace una reserva de aforo ya confirmada, si después la mesa no se pudo
// reservar (dos pasos no atómicos entre sí: aforo primero, mesa después —
// si el segundo falla, hay que devolver el hueco del primero). El resumen
// sincronizado del panel interno recalcula este contador desde cero en
// cada sync de todos modos, así que un desajuste puntual aquí se autocorrige.
function releaseAforoHold(dateStr, turnoIdx, people){
  const ref = db.ref('gastrogoan/public/' + publicId + '/aforoHold/' + dateStr + '/' + turnoIdx);
  return ref.transaction(current => Math.max(0, (current || 0) - people));
}

// Mismo mecanismo que reserveAforoAtomic pero para el límite de pedidos por
// franja de 30 min (mn.pedidos.maxPorFranja): evita que dos pedidos casi
// simultáneos para la misma franja superen juntos el límite que el negocio
// ha configurado, antes de que el resumen sincronizado se actualice.
function roundToPedidoSlot(time){
  const parts = (time||'').split(':');
  const h = parseInt(parts[0], 10) || 0;
  const m = parseInt(parts[1], 10) || 0;
  return String(h).padStart(2,'0') + ':' + (m < 30 ? '00' : '30');
}
function reservePedidoSlotAtomic(dateStr, slot, max, baseline){
  const ref = db.ref('gastrogoan/public/' + publicId + '/pedidosHold/' + dateStr + '/' + slot);
  return ref.transaction(current => {
    const held = current || 0;
    if(baseline + held + 1 > max) return; // abort: se pasaría del límite
    return held + 1;
  });
}
// Hallazgo de una auditoría externa: la franja se reservaba aquí, pero si
// una comprobación POSTERIOR (zona de reparto fuera de cobertura) rechazaba
// el pedido, el hold se quedaba ocupado sin ningún pedido real detrás — el
// negocio limpia estos holds en cada sincronización de su propio panel
// (limpiarHolds, js/core.js), así que no queda bloqueado para siempre, pero
// sí puede tapar un hueco real durante el resto del servicio si el negocio
// no vuelve a sincronizar hasta el día siguiente. Se libera explícitamente
// en el momento del fallo en vez de esperar a que otro dispositivo lo limpie.
function releasePedidoSlot(dateStr, slot){
  const ref = db.ref('gastrogoan/public/' + publicId + '/pedidosHold/' + dateStr + '/' + slot);
  ref.transaction(current => Math.max(0, (current || 0) - 1)).catch(()=>{});
}

function formatTurnos(turnos){
  return turnos.map(t => `${t.abre}–${t.cierra}`).join(' y ');
}

function nombreDia(dateStr){
  const jsDay = new Date(dateStr + 'T00:00:00').getDay();
  return getDiasSemana()[(jsDay + 6) % 7];
}

function horarioHintHtml(dateStr){
  const turnos = getTurnosForDate(dateStr);
  if(turnos === null) return '';
  if(!turnos.length){
    const ce = cierreExcepcionalDe(dateStr);
    const motivo = ce && ce.motivo ? ' (' + escapeHtml(ce.motivo) + ')' : '';
    return `<p style="font-size:13px;color:var(--red);margin-top:-8px">${t('hint.cerrado').replace('%s', nombreDia(dateStr).toLowerCase())}${motivo}</p>`;
  }
  return `<p style="font-size:13px;color:var(--muted);margin-top:-8px">${t('hint.horario').replace('%s', nombreDia(dateStr).toLowerCase()).replace('%s', formatTurnos(turnos))}</p>`;
}

function updateTimeInputRange(dateInputId, timeInputId, hintBoxId){
  const date = document.getElementById(dateInputId).value;
  const turnos = getTurnosForDate(date);
  const timeInput = document.getElementById(timeInputId);
  const hintBox = document.getElementById(hintBoxId);
  hintBox.innerHTML = horarioHintHtml(date);
  if(turnos && turnos.length){
    timeInput.min = turnos[0].abre;
    timeInput.max = turnos[turnos.length - 1].cierra;
  }else{
    timeInput.removeAttribute('min');
    timeInput.removeAttribute('max');
  }
}
// Primer turno que empieza EN O DESPUÉS de minTime (hoy con antelación
// mínima) — o, si ya estamos dentro de un turno, ese mismo turno. Hallazgo
// real de auditoría: applyLeadTime() solo miraba el primer turno del día y
// el último cierre, así que con un horario partido (13-16 y 20-23) y
// "ahora + antelación" cayendo en el descanso (17:30), sugería esa hora
// como mínima aunque el negocio estuviera cerrado — el envío final sí lo
// rechazaba, pero el aviso llevaba al cliente a un hueco que no existe.
function primerTurnoDesde(turnos, minTime){
  for(const tn of turnos){
    if(minTime <= tn.cierra) return tn.abre > minTime ? tn.abre : minTime;
  }
  return null; // no queda ningún turno hoy a partir de esa hora
}

/* ============ TIEMPO DE ANTELACIÓN / ZONA DE REPARTO ============ */
// Si el pedido/reserva es para hoy, no se puede elegir una hora anterior a
// "ahora + tiempo de antelación configurado por el restaurante". Reservas y
// pedidos tienen cada uno su propio ajuste (Mi Negocio → Operativa); si un
// negocio antiguo aún no tiene los campos nuevos, ambos caen al ajuste
// único que había antes de separarlos.
function getLeadTimeMin(kind){
  const b = DB.business || {};
  const specific = kind === 'reserva' ? b.leadTimeMinReservas : b.leadTimeMinPedidos;
  if(specific != null) return parseInt(specific) || 0;
  if(b.leadTimeMin != null) return parseInt(b.leadTimeMin) || 0;
  return parseInt((b.pedidos||{}).leadTimeMin) || 0;
}
function applyLeadTime(dateInputId, timeInputId, hintBoxId, kind){
  const leadTimeMin = getLeadTimeMin(kind);
  const date = document.getElementById(dateInputId).value;
  const timeInput = document.getElementById(timeInputId);
  const hintBox = document.getElementById(hintBoxId);
  if(!leadTimeMin || date !== todayStr()) return;

  const now = new Date(Date.now() + leadTimeMin * 60000);
  let minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  // Antes solo se comparaba contra timeInput.min (apertura del PRIMER turno
  // / último cierre, puestos por updateTimeInputRange) — con un horario
  // partido, "ahora + antelación" podía caer en el descanso entre turnos y
  // el aviso ofrecía esa hora igualmente, aunque el negocio estuviera
  // cerrado hasta el turno siguiente. Aquí se salta ese hueco de verdad.
  const turnos = getTurnosForDate(date);
  if(turnos && turnos.length){
    const siguiente = primerTurnoDesde(turnos, minTime);
    minTime = siguiente || turnos[turnos.length - 1].cierra; // sin más turnos hoy: no queda hora válida
  }

  if(!timeInput.min || minTime > timeInput.min) timeInput.min = minTime;
  if(timeInput.value && timeInput.value < timeInput.min) timeInput.value = timeInput.min;

  // El aviso tiene que decir la hora mínima REAL, ya acotada por el horario
  // del negocio y por el próximo turno (ver arriba) — antes mostraba
  // siempre "ahora + antelación" a secas, contradiciendo el horario que se
  // acaba de mostrar encima.
  const minTimeReal = timeInput.min || minTime;
  const hint = `<p style="font-size:13px;color:var(--muted);margin-top:-8px">${t('hint.antelacion').replace('%s', minTimeReal).replace('%d', leadTimeMin)}</p>`;
  hintBox.innerHTML = (hintBox.innerHTML || '') + hint;
}

// Aviso al momento, tecla a tecla, de si ese código postal entra en zona —
// para no hacer esperar al cliente a rellenar toda la dirección y darle al
// botón para enterarse. Solo cuando la zona se define por lista de códigos
// postales (lo único que existe desde el 8/11).
function checkCpLive(){
  const el = document.getElementById('o-cp');
  const hint = document.getElementById('o-cp-hint');
  if(!el || !hint) return;
  const cp = el.value.replace(/\s+/g, '');
  const p = (DB.business||{}).pedidos || {};
  const cpList = p.cpList || [];
  if(!cpList.length || !cp){ hint.textContent = ''; return; }
  if(cpList.includes(cp)){
    hint.style.color = 'var(--green)';
    hint.textContent = t('cp.enZona');
  } else {
    hint.style.color = 'var(--red)';
    hint.textContent = t('cp.fueraDeZona').replace('${lista}', cpList.join(', '));
  }
}

// Comprueba si el código postal de entrega está en la lista de zonas de reparto del negocio (desde el 8/11 el reparto se define
// SOLO por códigos postales: se quitó el radio y su geocodificación, que era lento, gastaba cuota ajena y dejaba pedidos «por verificar»).
// Sin lista = sin restricción. Devuelve {ok}.
async function checkDeliveryZone(p, codigoPostal){
  codigoPostal = String(codigoPostal || '').replace(/\s+/g, '');
  const cpList = (p && p.cpList) || [];
  if(!cpList.length) return {ok:true};
  return {ok: cpList.includes(codigoPostal)};
}

/* ============ CALENDARIO INTERACTIVO DE DISPONIBILIDAD ============
   Antes había que rellenar fecha y hora a ciegas y enterarte de si había
   sitio solo al enviar el formulario entero. Ahora se ve de un vistazo,
   por día/semana/mes, y en verde/rojo según los comensales que ya se
   hayan puesto arriba — la misma comprobación que hace submitReserva al
   enviar, solo que aquí se repite muchas veces (una por franja) para
   pintar el calendario, así que se separa en checkSlotFree() para no
   duplicar la lógica de mesas/aforo en dos sitios que puedan desincronizarse. */
let calView = 'dia'; // 'dia' | 'semana' | 'mes'
let calDate = null;  // fecha (YYYY-MM-DD) que se está mirando ahora mismo
let calSelectedTime = null;
let calSelectedTable = null; // id de la mesa que ha elegido el cliente

function currentPeopleValue(){
  return Math.min(50, Math.max(1, parseInt(document.getElementById('r-people')?.value) || 1));
}

// Huecos de 30 en 30 min dentro de los turnos configurados ese día. Si el
// negocio no tiene horario configurado (getTurnosForDate devuelve null),
// no hay ninguna franja que ofrecer aquí — ese caso ya se trata aparte en
// computeDayStatus como "sin restricción" (cualquier hora vale).
// Huecos de 15 en 15 min. El último posible se queda a un margen de 30 min
// ANTES del cierre (no en el cierre mismo): una reserva necesita algo de
// tiempo para servirse, y "reservar mesa a la hora exacta de cerrar" no
// tiene sentido para ningún restaurante — antes se ofrecía hueco hasta el
// propio minuto de cierre.
const RESERVA_MARGEN_CIERRE_MIN = 30;
// Configurable por el negocio (Mi Negocio → «Última reserva antes del cierre»); 30 si no lo ha tocado.
function reservaMargenCierreMin(){
  const v = (DB.business || {}).reservaMargenCierreMin;
  if(v === '' || v == null) return RESERVA_MARGEN_CIERRE_MIN;
  const n = parseInt(v, 10);
  return isNaN(n) || n < 0 ? RESERVA_MARGEN_CIERRE_MIN : n;
}
function slotsDelDia(dateStr){
  const turnos = getTurnosForDate(dateStr);
  if(!turnos || !turnos.length) return [];
  const out = [];
  turnos.forEach(t => {
    const [ih, im] = t.abre.split(':').map(Number);
    const [fh, fm] = t.cierra.split(':').map(Number);
    let cur = ih * 60 + im;
    const fin = (fh * 60 + fm) - reservaMargenCierreMin();
    while(cur <= fin){
      out.push(String(Math.floor(cur/60)).padStart(2,'0') + ':' + String(cur%60).padStart(2,'0'));
      cur += 15;
    }
  });
  return out;
}
// Hora mínima reservable HOY según la antelación configurada — mismo
// cálculo que applyLeadTime, pero sin depender de un &lt;input&gt; del DOM.
function reservaMinTimeHoy(){
  // Sin antelación configurada, HOY tampoco se puede reservar una hora que ya pasó (antes el calendario enseñaba «hay sitio» a las 13:00 estando a las 22:50).
  const leadTimeMin = getLeadTimeMin('reserva') || 0;
  const now = new Date(Date.now() + leadTimeMin * 60000);
  return String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}
// Misma comprobación que hace submitReserva al enviar de verdad (mesas +
// aforo), extraída aparte para poder repetirla franja a franja al pintar
// el calendario sin que las dos copias puedan desincronizarse con el
// tiempo. Un grupo más grande que la mesa más grande (needsManualReview)
// se pinta como disponible: la app ya deja pasar esos casos para que el
// negocio los revise a mano, en vez de rechazarlos sin más.
function checkSlotFree(dateStr, time, people){
  if(motivoSinReservaOnline(people)) return false;
  const hasConfiguredTables = (DB.tables||[]).some(tb => tb.plazas);
  if(hasConfiguredTables){
    const slots = slotsForReservation(time, getReservaDuracionMin());
    if(!getBestFitTable(dateStr, time, people, slots)) return false;
  }
  const aforoInfo = getAforoInfo(dateStr, time);
  if(aforoInfo && people > aforoInfo.disponible) return false;
  return true;
}
// Estado de un día entero para pintar semana/mes de un vistazo:
// 'cerrado' | 'lleno' | 'libre'. Un día sin horario configurado se pinta
// como 'libre' (la app no restringe nada en ese caso, igual que hoy).
function computeDayStatus(dateStr, people){
  if(dateStr < todayStr()) return 'pasado';
  const turnos = getTurnosForDate(dateStr);
  if(turnos === null) return 'libre';
  if(!turnos.length) return 'cerrado';
  const minHoy = dateStr === todayStr() ? reservaMinTimeHoy() : null;
  const slots = slotsDelDia(dateStr).filter(s => !minHoy || s >= minHoy);
  if(!slots.length) return 'cerrado';
  const hayLibre = slots.some(s => checkSlotFree(dateStr, s, people));
  return hayLibre ? 'libre' : 'lleno';
}
// ⚠️ NUNCA toISOString() aquí: convierte a UTC, y en cualquier huso por
// delante de UTC (España incluida, todo el año) la medianoche local cae en
// el día UTC ANTERIOR — "31 de agosto + 0 días" devolvía "30 de agosto".
// Eso desplazaba TODO un día: la cuadrícula del mes salía descuadrada
// (el 7 de septiembre aparecía en la columna del miércoles en vez de la
// del lunes) y las flechas de ir adelante/atrás parecían fallar a ratos,
// porque el desplazamiento cambiaba según la hora del día. Mismo criterio
// que ya usa todayStr(): año/mes/día en LOCAL, nunca ISO/UTC.
function addDaysStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addMonthsStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function renderReservaCalendar(){
  const box = document.getElementById('r-cal');
  if(!box) return;
  const people = currentPeopleValue();
  const motivo = motivoSinReservaOnline(people);
  const btnEnviar = document.getElementById('r-submit');
  if(btnEnviar) btnEnviar.disabled = !!motivo;
  if(motivo){
    calSelectedTime = null; calSelectedTable = null;
    document.getElementById('r-time').value = '';
    box.innerHTML = avisoGrupoHtml(people, motivo);
    return;
  }
  if(document.getElementById('r-date').value && document.getElementById('r-date').value !== calDate) calSelectedTime = null;
  // Si al cambiar de personas la hora elegida deja de tener mesa, se suelta.
  if(calSelectedTime && !checkSlotFree(calDate, calSelectedTime, people)){
    calSelectedTime = null; calSelectedTable = null;
    document.getElementById('r-time').value = '';
  }
  const tabs = `
    <div style="display:flex;gap:6px;margin-bottom:10px">
      ${['dia','semana','mes'].map(v => `<button type="button" class="btn btn-sm" style="flex:1;${calView===v?'background:var(--ink);color:#fff':''}" onclick="calSetView('${v}')">${t('cal.'+v)}</button>`).join('')}
    </div>`;
  let body = '';
  if(calView === 'dia'){
    const status = computeDayStatus(calDate, people);
    const minHoy = calDate === todayStr() ? reservaMinTimeHoy() : null;
    const slots = slotsDelDia(calDate).filter(s => !minHoy || s >= minHoy);
    body = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
        <button type="button" class="btn btn-sm" style="flex:0 0 44px;width:44px;padding:8px" ${calDate<=todayStr()?'disabled':''} onclick="calNav(-1)">‹</button>
        <strong style="font-size:13.5px;flex:1;text-align:center">${escapeHtml(fechaLegible(calDate))}</strong>
        <button type="button" class="btn btn-sm" style="flex:0 0 44px;width:44px;padding:8px" onclick="calNav(1)">›</button>
      </div>
      ${status === 'cerrado' ? `<p style="font-size:13px;color:var(--muted);text-align:center;padding:10px 0">${t('cal.cerrado')}</p>` :
        !slots.length ? `<p style="font-size:13px;color:var(--muted);text-align:center;padding:10px 0">${t('cal.sinHuecos')}</p>` : `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px">
        ${slots.map(s => {
          const libre = checkSlotFree(calDate, s, people);
          const selected = calSelectedTime === s;
          // El color de "elegido" NO puede ser --olive: es el color de marca
          // del negocio (personalizable), así que en un negocio con marca
          // naranja/roja se confundía visualmente con "no disponible". El
          // negro de aquí es el mismo que ya usan las pestañas Día/Semana/Mes
          // para "esto es lo activo" — no depende de ninguna marca y nunca
          // se puede confundir con el verde/rojo de disponibilidad.
          const estilo = selected
            ? 'background:var(--ink);color:#fff;border-color:var(--ink)'

function fechaLegible(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return getDiasSemana()[(d.getDay()+6)%7] + ' ' + d.getDate() + ' ' + nombreMes(dateStr).split(' ')[0];
}
function fechaLegibleCorta(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.getDate() + '/' + (d.getMonth()+1);
}
const MESES_I18N = {
  es: ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],
  ca: ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'],
  en: ['January','February','March','April','May','June','July','August','September','October','November','December'],
};
function nombreMes(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const nombres = MESES_I18N[currentLang] || MESES_I18N.es;
  return nombres[d.getMonth()] + ' ' + d.getFullYear();
}

// La señal puede pedirse SIEMPRE (depositMinPeople en 0 o sin poner) o solo
// a partir de un número de comensales (p.ej. "solo grupos de 8 o más") — un
// grupo de 2 no tiene por qué pagar señal si lo que preocupa al negocio son
// las mesas grandes que se quedan vacías si no se presentan.
function depositAppliesForPeople(people){
  const b = DB.business || {};
  if(!b.requireDeposit) return false;
  const minPeople = parseInt(b.depositMinPeople) || 0;
  return minPeople <= 0 || (parseInt(people) || 0) >= minPeople;
}

// Repinta SOLO el aviso de señal y el texto del botón cuando cambia el
// número de personas — sin esto, un negocio con "señal a partir de 8" le
// seguía pidiendo tarjeta a un grupo de 2, o al revés, nunca se la pedía a
// un grupo de 10 hasta recargar la página.
function updateDepositNoticeUi(){
  const box = document.getElementById('r-deposit-notice');
  const btn = document.getElementById('r-submit');
  if(!box || !btn) return;
  const people = document.getElementById('r-people')?.value;
  const applies = depositAppliesForPeople(people);
  box.innerHTML = applies ? `<div class="card" style="background:var(--bg-soft, #fff7ed);margin:10px 0;padding:10px 12px">
    <div style="font-size:13px;font-weight:600">${t('deposit.notice.title')}</div>
    <div style="font-size:12.5px;margin-top:4px">${t('deposit.notice.body').replace('${amount}', reservaDepositAmount())}</div>
    ${(DB.business.depositInstructions||'').trim() ? `<div style="font-size:12.5px;margin-top:6px;color:var(--muted)">${escapeHtml(DB.business.depositInstructions)}</div>` : ''}
  </div>` : '';
  btn.textContent = applies ? t('reserva.submitWithDeposit') : t('reserva.submit');
}

// Calcula el importe de la señal para la reserva actual (según el tipo
// configurado: fijo, o por persona multiplicado por los comensales del
// formulario en este momento).
function reservaDepositAmount(){
  const b = DB.business || {};
  const amount = parseFloat(b.depositAmount) || 0;
  if(b.depositType === 'perPerson'){
    const people = parseInt(document.getElementById('r-people')?.value) || 1;
    return (amount * people).toFixed(2);
  }
  return amount.toFixed(2);
}

// Punto único de envío de una reserva: si pide señal (y el TPV virtual está
// disponible), va a pagar antes de crearse; si no, se manda tal cual, como
// siempre. Reemplaza los 3 sendRequest(req, ...) que había sueltos en
// submitReserva (uno por cada camino: sin mesas configuradas, éxito de la
// reserva atómica, y fallback si la transacción atómica falla por red).
function sendReservaRequest(req, successMsg){
  if(req.depositRequired){
    payWithCard(req, req.depositAmount, t('deposit.paymentDescription'), 'resToken', 'r-submit');
    return;
  }
  sendRequest(req, successMsg);
}

function submitReserva(){
  if(submittingRequest) return;
  submittingRequest = true;
  setBtnLoading('r-submit', true);
  const clientName = document.getElementById('r-name').value.trim();
  const clientPhone = document.getElementById('r-phone').value.trim();
  const clientEmail = document.getElementById('r-email').value.trim();
  const date = document.getElementById('r-date').value;
  const time = document.getElementById('r-time').value;
  // El "max" del input es solo una pista visual del navegador — se puede
  // teclear/pegar cualquier número saltándosela, así que se acota aquí
  // también (evita reservas de miles de comensales cuando el negocio aún
  // no tiene aforo/mesas configurados, que es cuando no hay más validación).
  const people = Math.min(50, Math.max(1, parseInt(document.getElementById('r-people').value) || 1));
  const notes = document.getElementById('r-notes').value.trim();
  const referral = document.getElementById('r-referral')?.value || '';

  clearFieldInvalid(['r-name','r-phone','r-email','r-date','r-time']);
  if(!clientName || !clientPhone || !clientEmail || !date || !time){
    if(!clientName) markFieldInvalid('r-name');
    if(!clientPhone) markFieldInvalid('r-phone');
    if(!clientEmail) markFieldInvalid('r-email');
    if(!date) markFieldInvalid('r-date');
    if(!time) markFieldInvalid('r-time');
    showInlineError(t('error.campos.reserva'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  // El "min" del &lt;input type=date&gt; también es solo una pista del navegador
  // (editable a mano, o con el reloj del dispositivo cambiado) — se revalida
  // aquí que no sea una fecha ya pasada respecto a "hoy" en el propio envío.
  if(date < todayStr()){
    markFieldInvalid('r-date');
    showInlineError(t('error.campos.reserva'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  // Validación básica de formato: sin esto, un email mal escrito por prisa
  // ("laura@gmial.con") pasaría como válido y la reserva se auto-confirmaría
  // sin que el cliente llegase a enterarse nunca por ningún sitio.
  if(!isValidEmail(clientEmail)){
    markFieldInvalid('r-email');
    showInlineError(t('error.email.invalido'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  if(!document.getElementById('r-privacy-consent').checked){
    showInlineError(t('privacy.mustAccept'));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }

  const turnos = getTurnosForDate(date);
  if(turnos !== null && !turnos.length){
    showInlineError(t('error.cerrado').replace('%s', nombreDia(date).toLowerCase()));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }
  if(turnos !== null && turnos.length && !isTimeAllowed(date, time)){
    showInlineError(t('error.horario').replace('%s', t('error.horario.reservas')).replace('%s', nombreDia(date).toLowerCase()).replace('%s', formatTurnos(turnos)));
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }

  const leadTimeMin = getLeadTimeMin('reserva') || 0;
  if(date === todayStr()){
    const now = new Date(Date.now() + leadTimeMin * 60000);
    const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    if(time < minTime){
      showInlineError(t('error.antelacion').replace('%d', leadTimeMin).replace('%s', minTime));
      submittingRequest = false;
      setBtnLoading('r-submit', false);
      return;
    }
  }

  // Disponibilidad real: hace falta UNA mesa que le quepa al grupo (con
  // margen) Y que no se pase del aforo total del turno — las dos cosas a
  // la vez, igual que decidiría el negocio a mano.
  const turnoIdx = getTurnoIndexForTime(date, time);
  const hasConfiguredTables = (DB.tables||[]).some(tb => tb.plazas);
  const aforoInfo = getAforoInfo(date, time);

  let matchedTable = null, slots = null;
  // Grupos grandes o sin mesa de su tamaño: no se reserva por la web (el
  // calendario ya lo dice; esto es por si se salta la pantalla).
  if(motivoSinReservaOnline(people)){
    renderReservaCalendar();
    submittingRequest = false;
    setBtnLoading('r-submit', false);
    return;
  }

  if(hasConfiguredTables){
    slots = slotsForReservation(time, getReservaDuracionMin());
    const elegibles = getEligibleTables(date, people, slots);
    matchedTable = elegibles.find(tb => tb.id === calSelectedTable) || elegibles[0] || null;
    if(!matchedTable){
      // Sí existe una mesa de ese tamaño, pero está ocupada a esa hora —
      // esto sí es "no hay disponibilidad" de verdad, se dice en el momento.
      showInlineError(t('error.mesa.nodisponible'));
      submittingRequest = false;
      setBtnLoading('r-submit', false);
      return;
    }
    if(aforoInfo && people > aforoInfo.disponible){
      showInlineError(t('error.mesa.nodisponible'));
      submittingRequest = false;
      setBtnLoading('r-submit', false);
      return;
    }
  }

  // Si el negocio pide señal Y tiene el TPV virtual conectado, enviar la
  // reserva no la manda directa a la cola: primero lleva al cliente a pagar
  // la señal con tarjeta (payWithCard), y la reserva solo se crea si la
  // firma del pago tiene éxito (ver payWithCard más abajo). Si el negocio
  // marcó "pedir señal" pero el TPV virtual no está disponible ahora mismo
  // (mn.ops.requireDeposit ya lo impide al guardar, pero por si un negocio
  // antiguo quedó con datos inconsistentes), se cae al envío normal sin
  // señal en vez de dejar al cliente sin poder reservar.
  const depositRequired = depositAppliesForPeople(people) && pagoOnlineActivo;
  const req = {
    type:'reserva', clientName, clientPhone, clientEmail, date, time, people, notes, referral,
    depositRequired, depositAmount: depositRequired ? reservaDepositAmount() : '',
    createdAt: new Date().toISOString(),
    // Token para poder volver más tarde a "Gestionar mi reserva" (ver
    // renderReservationManageView) sin tener que llamar por teléfono.
    resToken: genClientRef()
  };
  if(matchedTable) req.tableId = matchedTable.id;

  const btn = document.getElementById('r-submit');
  if(btn) btn.disabled = true;
  // Con mesa ya reservada de forma atómica, o sin mesas configuradas (nada que comprobar), no hay motivo para esperar a nadie.
  reservaOptimista = !!matchedTable || !hasConfiguredTables;

  if(!matchedTable){
    // Sin mesas configuradas todavía, grupo que necesita juntar mesas, o sin
    // horario para saber el turno: no hay nada que comprobar automáticamente,
    // se manda tal cual y el negocio la revisa a mano.
    sendReservaRequest(req, t('reserva.ok') + (clientEmail ? t('reserva.ok.emailHint') : ''));
    return;
  }

  // Comprobación final ATÓMICA justo antes de enviar: cierra la ventana de
  // carrera en la que dos clientes reservan casi a la vez y se llevarían
  // entre los dos el mismo aforo o la misma mesa antes de que el resumen
  // sincronizado reflejase la del otro. Primero el aforo (más barato de
  // deshacer si falla lo segundo), luego la mesa; si la mesa falla, se
  // devuelve el hueco de aforo ya reservado.
  (async () => {
    try{
      if(aforoInfo){
        const aforoResult = await reserveAforoAtomic(date, aforoInfo.turnoIdx, people, aforoInfo.aforo, aforoInfo.reservados);
        if(!aforoResult.committed){
          if(btn) btn.disabled = false;
          submittingRequest = false;
          setBtnLoading('r-submit', false);
          showInlineError(t('error.mesa.nodisponible'));
          return;
        }
      }
      const tableResult = await reserveTableAtomic(date, matchedTable.id, slots);
      if(!tableResult.committed){
        if(aforoInfo) releaseAforoHold(date, aforoInfo.turnoIdx, people).catch(()=>{});
        if(btn) btn.disabled = false;
        submittingRequest = false;
        setBtnLoading('r-submit', false);
        showInlineError(t('error.mesa.nodisponible'));
        return;
      }
      sendReservaRequest(req, t('reserva.ok') + (clientEmail ? t('reserva.ok.emailHint') : ''));
    }catch(e){
      console.error(e);
      if(btn) btn.disabled = false;
      // Si la transacción falla por un problema de conexión, dejamos seguir
      // con el envío normal en vez de bloquear al cliente por completo: es
      // preferible el pequeño riesgo de carrera a que no pueda reservar.
      sendReservaRequest(req, t('reserva.ok') + (clientEmail ? t('reserva.ok.emailHint') : ''));
    }
  })();
}

function iconoNombreNormal(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
// Las palabras de tres letras o menos ('ou', 'pa', 'vi', 'te') solo valen si son la palabra entera: buscadas por
// dentro, «Pasta» y «Paella» salían con un pan, y «Mousses» con un huevo.
function iconoPalabraCoincide(n, w){
  const k = iconoNombreNormal(w);
  if(k.length > 3) return n.includes(k);
  return new RegExp('(^|[^a-z0-9])' + k + '([^a-z0-9]|$)').test(n);
}
function iconoComidaPorNombre(nombre){
  const n = iconoNombreNormal(nombre);
  for(const [palabras, clave] of ICONOS_PALABRAS){ if(palabras.some(w => iconoPalabraCoincide(n, w))) return clave; }

}
// Qué icono (clave del catálogo, o '' si ninguno) corresponde a lo guardado en una sección.
function iconoComidaClave(valor, nombre){
  if(valor === 'ic:none') return '';
  if(typeof valor === 'string' && valor.startsWith('ic:') && ICONOS_COMIDA[valor.slice(3)]) return valor.slice(3);
  if(valor && EMOJI_A_ICONO[valor] && ICONOS_COMIDA[EMOJI_A_ICONO[valor]]) return EMOJI_A_ICONO[valor];
  return iconoComidaPorNombre(nombre);
}
function iconoComidaSvg(clave, tam){
  const ic = ICONOS_COMIDA[clave];
  if(!ic) return '';
  return `<svg class="ic-comida" viewBox="0 0 24 24" width="${tam||24}" height="${tam||24}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[0]}</svg>`;
}
// HTML del icono de una sección, listo para meter en una página (nada que escapar: sale del catálogo).
function iconoSeccionHtml(valor, nombre, tam){
  return iconoComidaSvg(iconoComidaClave(valor, nombre), tam);
}
function iconoComidaNombre(clave, lang){
  const ic = ICONOS_COMIDA[clave]; if(!ic) return '';
  return ic[lang === 'ca' ? 2 : lang === 'en' ? 3 : 1];
}

/* ============ CARTA Y MENÚS NAVEGABLES (6/11) ============

let menuMode = null;          // 'menus' | 'carta' (null = el primero que haya)

}
function menuModoActual(cartas){

}
function menuSetModo(m){ menuMode = m; menuQuery = ''; menuOpenSection = null; repaintMenu(); }

// Resultados de la carta: búsqueda cruzada si hay texto; si no, las carpetas (o los platos directos si solo hay una).
function menuResultadosHtml(cartas){

    }).join('');

          </button>`;
        }).join('')}

// Suplemento delivery (Escandallo): importe fijo que se suma al precio de sala en pedidos a domicilio.
function publicPlatoPrice(p){

  return p.precio;
}
function dishPriceInfo(p){

// Cada plato es UNA tarjeta que es en sí el botón: tocarla lo añade (o abre sus extras). Varias por fila; la cantidad va en la

function dishQty(p){ return cart.filter(l => l.recipeId === p.id).reduce((s, l) => s + l.qty, 0); }
function dishTap(id, secId){
  const f = findPlatoById(id); if(!f) return;
  const p = f.plato;

// Lo que se añade «vuela» hasta la bandeja «Tu selección»: se ve a dónde ha ido. Sin movimiento si el sistema lo pide así.
function volarAlCarrito(origen){
  try{
    if(!origen || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || !origen.animate) return;
    const dest = document.querySelector('#wz-tray .tray-n') || document.querySelector('#wz-tray');
    if(!dest) return;
    const a = origen.getBoundingClientRect(), b = dest.getBoundingClientRect();
    const dot = document.createElement('span'); dot.className = 'fly-dot'; dot.setAttribute('aria-hidden', 'true');
    document.body.appendChild(dot);
    const x0 = a.left + a.width / 2 - 11, y0 = a.top + a.height / 2 - 11, x1 = b.left + b.width / 2 - 11, y1 = b.top + b.height / 2 - 11;
    const an = dot.animate([{transform:`translate(${x0}px,${y0}px) scale(1)`, opacity:1}, {transform:`translate(${(x0 + x1) / 2}px,${Math.min(y0, y1) - 60}px) scale(1.15)`, opacity:1, offset:.45}, {transform:`translate(${x1}px,${y1}px) scale(.35)`, opacity:.2}], {duration:620, easing:'cubic-bezier(.4,.1,.3,1)'});
    an.onfinish = () => dot.remove();
  }catch(e){}
}
function dishCtlRefreshAll(){

  });

}

let menuStepIdx = 0;

function menuOpcionElegida(gi){

  if(!m || gi >= (m.grupos || []).length - 1) return;      // el último apartado no avanza solo: ahí está «Añadir»

function menuStepIr(i){

  menuStepIdx = Math.max(0, Math.min(n - 1, i));
  document.querySelectorAll('.sh-g').forEach(f => { f.hidden = +f.dataset.step !== menuStepIdx; });
  const g = m.grupos[menuStepIdx];
  const eye = document.getElementById('mn-eye'); if(eye) eye.textContent = `${t('wz.m.eyebrow')} · ${t('wz.m.step').replace('%d', menuStepIdx + 1).replace('%d', n)} · ${trItem(g)}`;
  const bar = document.getElementById('mn-prog-i'); if(bar) bar.style.width = ((menuStepIdx + 1) / n * 100) + '%';
  const back = document.getElementById('mn-back'); if(back) back.hidden = menuStepIdx === 0;

function menuStepSiguiente(){
  const m = menuModalContext && (DB.menus || []).find(x => x.id === menuModalContext.menuId); if(!m) return;

  if(menuStepIdx >= (m.grupos || []).length - 1) confirmAddMenuFromModal(); else menuStepIr(menuStepIdx + 1);

// El botón dice qué viene: «Siguiente: Segundo» (apagado hasta elegir) y, en el último apartado, «Añadir · total» con suplementos.
function menuSheetTotal(){
  if(!menuModalContext) return;
  const m = (DB.menus || []).find(x => x.id === menuModalContext.menuId); const b = document.getElementById('mn-add');
  if(!m || !b) return;
  let extra = 0;
  (m.grupos || []).forEach(g => {

// Un único grupo de opciones con las 3 formas de pago posibles (en vez del
// antiguo esquema de dos niveles "online vs en persona" + "efectivo vs
// tarjeta"): efectivo, tarjeta al entregar/recoger, y TPV virtual (pagar ya
// online con tarjeta, si el negocio lo tiene configurado). Respeta lo que
// el negocio haya marcado en Mi Negocio → Pedidos; si solo hay una
// disponible, se fija sin preguntar.
function renderPaymentMethodRadiosHtml(p){
  // Compatibilidad con negocios que ya tenían el antiguo interruptor
  // "permitirPagoLocal: false" (pago online obligatorio) puesto de antes de
  // que existieran estas 3 casillas independientes: si nunca han tocado el
  // nuevo ajuste (aceptaEfectivo/aceptaTarjetaLocal siguen "undefined", no
  // "false" explícito), se respeta la preferencia antigua. En cuanto el
  // dueño guarda el nuevo ajuste una vez, savePedidosConfig fija
  // permitirPagoLocal=true y ya no vuelve a aplicar este fallback.
  const legacyForceOnline = p.permitirPagoLocal === false && p.aceptaEfectivo === undefined && p.aceptaTarjetaLocal === undefined;
  const opts = [];
  if(pagoOnlineActivo && p.aceptaTpvVirtual !== false) opts.push({value:'tpv', label:t('pago.tarjeta')});
  if(!legacyForceOnline && p.aceptaEfectivo !== false) opts.push({value:'efectivo', label: t('pago.efectivo')});
  if(!legacyForceOnline && p.aceptaTarjetaLocal !== false) opts.push({value:'tarjeta_local', label: t('pago.tarjetaLocal')});
  if(!opts.length) opts.push({value:'efectivo', label: t('pago.efectivo')}); // salvaguarda: nunca dejar el formulario sin ninguna opción
  if(opts.length === 1){
    return `<input type="radio" name="o-pago-metodo" value="${opts[0].value}" checked style="display:none"><p style="font-size:13px;color:var(--muted)">${t('pago.metodoFijado').replace('%s', opts[0].label)}</p>`;
  }
  return `
    <label>${t('pago')}</label>
    ${opts.map((o,i) => `<label style="display:flex;align-items:center;gap:10px;font-weight:400;margin-bottom:6px;padding:6px 0"><input type="radio" name="o-pago-metodo" value="${o.value}" ${i===0?'checked':''} onchange="updateCashAmountVisibility()" style="width:20px;height:20px;flex-shrink:0"> ${o.label}</label>`).join('')}
  `;
}

// Identificador único de una línea del carrito: por plato solo para los
// platos SIN extras (se pueden agrupar en un único contador +/-), y por
// plato+combinación exacta de extras elegidos para los que sí tienen —
// así "1 pizza con extra queso" y "1 pizza sin nada" son líneas distintas
// del carrito, cada una con su propia cantidad, en vez de mezclarse en un
// solo contador que no podría representar la diferencia.
function cartLineKey(platoId, modIds){
  return (modIds && modIds.length) ? (platoId + ':' + [...modIds].sort((a,b)=>a-b).join(',')) : String(platoId);
}
// Busca el plato (con su lista de extras) dentro de las cartas activas —
// hace falta al confirmar el modal de extras, donde solo tenemos el id.
function findPlatoById(platoId){
  for(const c of (DB.cartas||[])){
    for(const sec of (c.secciones||[])){
      const p = (sec.platos||[]).find(x => x.id === platoId);
      if(p) return {plato: p, sectionId: sec.id};
    }
  }
  return null;
}

function getCartQty(recipeId){
  // Solo cuenta la línea SIN extras (la del contador +/- de la lista) —
  // las líneas con extras elegidos tienen su propio contador en el
  // resumen del carrito, ver renderCartSummary/tipSelectorHtml.
  const line = cart.find(l => l.recipeId === recipeId && (!l.modificadores || !l.modificadores.length));
  return line ? line.qty : 0;
}

function changeCartQty(recipeId, sectionId, delta, name, price){
  let line = cart.find(l => l.recipeId === recipeId && (!l.modificadores || !l.modificadores.length));
  if(!line){
    if(delta <= 0) return;
    line = {key: cartLineKey(recipeId, []), recipeId, sectionId, name, price, qty:0, modificadores:[]};
    cart.push(line);
  }
  line.qty += delta;
  if(line.qty <= 0) cart = cart.filter(l => l !== line);

  dishBump = recipeId;
  renderCartSummary();
}

// Ajusta la cantidad de una línea YA en el carrito por su clave exacta —
// se usa desde el resumen del carrito para las líneas con extras (que no
// tienen un contador +/- propio en el listado de la carta, porque ahí solo
// cabe "Añadir", ver openModifierModal).
function changeCartLineQty(key, delta){
  const line = cart.find(l => l.key === key);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0) cart = cart.filter(l => l !== line);
  renderCartSummary();
}

/* ============ EXTRAS / MODIFICADORES por plato ============
   Un plato con extras configurados (p.modificadores, cada uno {id,nombre,
   precio}) no usa el contador +/- directo: se abre un modal para elegir
   cuáles quiere (checkboxes, sin restricción de cardinalidad — así está
   modelado en la app principal, ver js/menu.js) y SOLO entonces se añade
   al carrito, con el precio final ya calculado. */
function confirmAddWithModifiers(){
  if(!modModalContext) return;
  const found = findPlatoById(modModalContext.platoId);
  if(!found){ closeInfoModal(); return; }
  const { plato, sectionId } = found;
  const checkedIds = [...document.querySelectorAll('.mod-check:checked')].map(el => parseInt(el.value));
  const selected = (plato.modificadores||[]).filter(m => checkedIds.includes(m.id));
  const finalPrice = modModalContext.basePrice + selected.reduce((s,m)=>s+(m.precio||0),0);
  const key = cartLineKey(plato.id, selected.map(m=>m.id));
  let line = cart.find(l => l.key === key);
  if(!line){
    line = {key, recipeId: plato.id, sectionId, name: plato.nombre, price: finalPrice, qty:0, modificadores: selected};
    cart.push(line);
  }
  line.qty += 1;
  modModalContext = null;
  closeInfoModal();
  renderCartSummary();
}

// Menús combo (ej. "Menú del día"): antes no se publicaban al espejo
// público en absoluto (ver syncPublicMirror, js/core.js), así que un
// cliente nunca podía pedir un menú desde el móvil, solo platos sueltos.
function getActiveMenusPublic(){
  const ids = DB.activeMenuIds || [];
  return (DB.menus||[]).filter(m => ids.includes(m.id) && m.disponible !== false && (m.grupos||[]).length);
}
function confirmAddMenuFromModal(){
  if(!menuModalContext) return;
  const m = (DB.menus||[]).find(x=>x.id===menuModalContext.menuId);
  if(!m){ closeInfoModal(); return; }
  let extra = 0;
  const selections = (m.grupos||[]).map(g => {
    const selId = parseInt(document.querySelector(`input[name="menu-grupo-${g.id}"]:checked`)?.value);
    const o = (g.opciones||[]).find(x=>x.id===selId) || (g.opciones||[]).find(x=>x.disponible!==false);
    if(!o) return null;
    extra += o.suplemento||0;
    // Nombre crudo, sin traducir: esto viaja a DB.tpvOrders y se queda ahí
    // para siempre (comanda, historial de ventas) — trItem() es solo para
    // pintar el modal, no para lo que se guarda (ver principio de i18n:
    // "un dato guardado no se traduce; se traduce al mostrarlo").
    return { nombre: `${g.nombre}: ${o.nombre}`, precio: o.suplemento||0 };
  }).filter(Boolean);
  const finalPrice = (m.precio||0) + extra;
  const key = 'menu:' + m.id + ':' + selections.map(s=>s.nombre).join('|');
  let line = cart.find(l => l.key === key);
  if(!line){
    line = { key, recipeId: null, sectionId: null, name: m.nombre, price: finalPrice, qty: 0, modificadores: selections };
    cart.push(line);
  }
  line.qty += 1;
  menuModalContext = null;
  closeInfoModal();
  renderCartSummary();
}
// Coste de envío a domicilio, con posibilidad de que el negocio lo haga
// gratis a partir de un importe mínimo de pedido (p.freeDeliveryFrom, 0 o
// sin definir = no hay umbral, siempre se cobra el envío fijo).
function getDeliveryFee(p, subtotal, isDelivery){
  if(!isDelivery) return 0;
  const fee = p.deliveryFee || 0;
  const freeFrom = p.freeDeliveryFrom || 0;
  if(freeFrom > 0 && subtotal >= freeFrom) return 0;
  return fee;
}

// Importe de propina a partir del % elegido (o el importe fijo si se
// escribió uno "otro importe") sobre el subtotal de platos — nunca sobre
// el gasto de envío, igual que se calcularía a mano.
function computeTipAmount(subtotal){
  if(cartTipPct === 'custom') return Math.max(0, cartTipCustom || 0);
  return Math.round(subtotal * (cartTipPct||0) / 100 * 100) / 100;
}
function setTip(pct){
  cartTipPct = pct;
  cartTipCustom = 0;
  renderCartSummary();
}
/* "Otro" hacía focus() sobre el campo del importe... que solo se pinta
   CUANDO ya está elegido "Otro". Así que el botón no hacía absolutamente
   nada: el cliente lo pulsaba, no pasaba nada y se iba sin dejar propina
   (lo vio el dueño el 12/09). Primero se marca la opción, y el foco se
   pone después, ya con el campo en pantalla. */
function activarPropinaOtra(){
  cartTipPct = 'custom';
  cartTipCustom = 0;
  renderCartSummary();
  const el = document.getElementById('tip-custom-input');
  if(el) el.focus();
}
// Estimación de "tu pedido debería estar listo en X min" a partir de la
// carga real de cocina ahora mismo (cocinaCargaActiva, sincronizado en
// vivo) — no un tiempo fijo que sea mentira en hora punta o exagerado en
// horas tranquilas. Formula configurable desde Mi Negocio → Pedidos:
// tiempo base + minutos extra por cada pedido que cocina tiene aún sin
// terminar, con un tope máximo para no anunciar esperas disparatadas.
function etaHintHtml(){
  const p = (DB.business||{}).pedidos || {};
  const base = p.tiempoBasePrep != null ? p.tiempoBasePrep : 15;
  const extra = p.extraPorPedidoEnCola != null ? p.extraPorPedidoEnCola : 3;
  const max = p.tiempoMaxEstimado != null ? p.tiempoMaxEstimado : 60;
  const carga = DB.cocinaCargaActiva || 0;
  const eta = Math.min(base + carga * extra, max || (base + carga * extra));
  const label = currentTab === 'delivery' ? t('cart.etaDelivery') : t('cart.etaTakeaway');
  return `<p class="hi hi-clock" style="font-size:13px;color:var(--muted);margin-top:8px">${label.replace('%d', eta)}</p>`;
}

async function submitOrder(){
  if(!cart.length){ showInlineError(t('error.carrito.vacio')); return; }
  if((DB.business||{}).pedidosOnlineActivos === false){ showInlineError(t('error.pedidosPausados.body')); return; }
  if(submittingRequest) return;
  submittingRequest = true;
  setBtnLoading('o-submit', true);
  const clienteNombre = document.getElementById('o-name').value.trim();
  const clienteTelefono = document.getElementById('o-phone').value.trim();
  const clienteEmail = document.getElementById('o-email').value.trim();
  const date = document.getElementById('o-date').value;
  const time = document.getElementById('o-time').value;
  const isDelivery = currentTab === 'delivery';
  const clienteDireccion = isDelivery ? document.getElementById('o-address').value.trim() : '';
  const notas = document.getElementById('o-notes').value.trim();
  const p = (DB.business||{}).pedidos || {};
  const zoneRestricted = isDelivery && (p.cpList||[]).length > 0;
  // El código postal se pide SIEMPRE en domicilio, no solo cuando hay zona
  // configurada: una sola línea de "dirección" a mano es demasiado ambigua
  // para un repartidor (o para geocodificar bien contra el radio, si lo
  // hay) — con el CP aparte no hay duda de a qué zona pertenece.
  const codigoPostal = isDelivery ? document.getElementById('o-cp').value.replace(/\s+/g, '') : '';

  clearFieldInvalid(['o-name','o-phone','o-date','o-time','o-address','o-cp','o-email']);
  if(!clienteNombre || !clienteTelefono || !date || !time || (isDelivery && !clienteDireccion) || (isDelivery && !codigoPostal)){
    if(!clienteNombre) markFieldInvalid('o-name');
    if(!clienteTelefono) markFieldInvalid('o-phone');
    if(!date) markFieldInvalid('o-date');
    if(!time) markFieldInvalid('o-time');
    if(isDelivery && !clienteDireccion) markFieldInvalid('o-address');
    if(isDelivery && !codigoPostal) markFieldInvalid('o-cp');
    showInlineError(t('error.campos'));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  // Igual que en la reserva: el "min" del <input type=date> es solo una
  // pista del navegador, editable a mano o con el reloj del dispositivo
  // cambiado — se revalida aquí que no sea una fecha ya pasada.
  if(date < todayStr()){
    markFieldInvalid('o-date');
    showInlineError(t('error.campos'));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  if(clienteEmail && !isValidEmail(clienteEmail)){
    markFieldInvalid('o-email');
    showInlineError(t('error.email.invalido'));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  if(!document.getElementById('o-privacy-consent').checked){
    showInlineError(t('privacy.mustAccept'));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }

  const subtotal = cart.reduce((s,l)=>s+l.price*l.qty,0);
  const pedidoMinimo = p.pedidoMinimo || 0;
  if(pedidoMinimo > 0 && subtotal < pedidoMinimo){
    showInlineError(t('error.pedido.min').replace('%s', fmtMoney(pedidoMinimo)));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }

  const turnos = getTurnosForDate(date);
  if(turnos !== null && !turnos.length){
    showInlineError(t('error.cerrado').replace('%s', nombreDia(date).toLowerCase()));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  if(turnos !== null && turnos.length && !isTimeAllowed(date, time)){
    showInlineError(t('error.horario').replace('%s', t('error.horario.pedidos')).replace('%s', nombreDia(date).toLowerCase()).replace('%s', formatTurnos(turnos)));
    submittingRequest = false;
    setBtnLoading('o-submit', false);
    return;
  }
  // Además de estar dentro del horario de apertura, la cocina puede
  // necesitar dejar de aceptar pedidos un rato antes del cierre real (para
  // dar tiempo a prepararlos y no quedarse con un pedido a medias a la hora
  // de cerrar). Se aplica solo a pedidos, no a reservas de mesa.
  if(turnos !== null && turnos.length){
    const cutoffTime = pedidosCutoffTimeForTurno(date, time, p);
    if(cutoffTime && time > cutoffTime.limite){
      showInlineError(t('error.cierrePedidos').replace('%s', cutoffTime.limite));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
  }

  const leadTimeMin = getLeadTimeMin('pedido');
  if(leadTimeMin && date === todayStr()){
    const now = new Date(Date.now() + leadTimeMin * 60000);
    const minTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    if(time < minTime){
      showInlineError(t('error.antelacion').replace('%d', leadTimeMin).replace('%s', minTime));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
  }

  const maxPorFranja = p.maxPorFranja || 0;
  let pedidoSlotReservado = null;
  if(maxPorFranja > 0){
    const slot = roundToPedidoSlot(time);
    const baseline = ((DB.pedidosResumen||{})[date]||{})[slot] || 0;
    // Comprobación final ATÓMICA justo antes de enviar, igual que con el
    // aforo de reservas: cierra la ventana de carrera entre dos pedidos
    // casi simultáneos para la misma franja.
    // Hallazgo real de auditoría: sin este try/catch, un rechazo de verdad
    // de Firebase (permisos, sin red a mitad de la transacción) no vuelve
    // como result.committed:false — lanza una excepción que aquí escapaba
    // sin capturar, dejando submittingRequest en true y el botón clavado en
    // "Enviando…" para siempre, sin aviso, hasta recargar la página.
    let result;
    try{
      result = await reservePedidoSlotAtomic(date, slot, maxPorFranja, baseline);
    }catch(e){
      console.error('Error reservando la franja del pedido', e);
      showInlineError(t('error.envio'));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
    if(!result.committed){
      showInlineError(t('error.pedidos.completo'));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
    pedidoSlotReservado = {date, slot};
  }

  if(zoneRestricted){
    const zoneCheck = await checkDeliveryZone(p, codigoPostal);
    if(!zoneCheck.ok){
      // Si ya se había reservado franja y el pedido no sigue adelante, hay
      // que liberarla: si no, ese hueco se queda ocupado sin ningún pedido
      // real detrás (ver releasePedidoSlot).
      if(pedidoSlotReservado) releasePedidoSlot(pedidoSlotReservado.date, pedidoSlotReservado.slot);
      showInlineError(t('error.zona'));
      submittingRequest = false;
      setBtnLoading('o-submit', false);
      return;
    }
  }

  const deliveryFee = getDeliveryFee(p, subtotal, isDelivery);
  const tip = computeTipAmount(subtotal);
  const total = subtotal + deliveryFee + tip;

  // Método de pago elegido entre las opciones que el negocio acepta
  // (efectivo / tarjeta al recibir / TPV virtual). Si es DOMICILIO y elige
  // efectivo, pedimos con qué billete va a pagar — así el repartidor sabe
  // de antemano cuánto cambio llevar, en vez de descubrirlo al llegar.
  // Para recoger en el local no se pregunta: el cliente paga en persona en
  // el mostrador, no hace falta que nadie lleve cambio a ningún sitio.
  const metodoPago = document.querySelector('input[name="o-pago-metodo"]:checked')?.value || 'efectivo';
  let metodoPagoLocal = null, pagaCon = null;
  if(metodoPago !== 'tpv'){
    metodoPagoLocal = metodoPago === 'tarjeta_local' ? 'tarjeta' : 'efectivo';
    if(isDelivery && metodoPagoLocal === 'efectivo'){
      const pagaConEl = document.getElementById('o-paga-con');
      pagaCon = pagaConEl ? parseFloat(pagaConEl.value) : NaN;
      if(isNaN(pagaCon) || pagaCon < total){
        if(pedidoSlotReservado) releasePedidoSlot(pedidoSlotReservado.date, pedidoSlotReservado.slot);
        showInlineError(t('error.pagaCon').replace('%s', fmtMoney(total)));
        submittingRequest = false;
        setBtnLoading('o-submit', false);
        return;
      }
    }
  }

  const req = {
    type:'pedido', tipo: isDelivery ? 'delivery' : 'takeaway',
    clienteNombre, clienteTelefono, clienteEmail, clienteDireccion, codigoPostal, notas, date, time,
    costeEnvio: deliveryFee, propina: tip,
    // platoId: con él la app del negocio vuelve a poner el precio con SU
    // carta (ver revisarPreciosPedidoPublico, js/core.js) — el `price` de
    // aquí es solo lo que el cliente vio, no lo que se cobra.
    items: cart.map(l => ({platoId: l.recipeId, name:l.name, price:l.price, qty:l.qty, modificadores:l.modificadores||undefined})),
    createdAt: new Date().toISOString(),
    // Token para poder seguir el estado del pedido después de enviarlo (ver
    // trackOrderStatus más abajo) — antes solo se generaba si se pagaba con
    // tarjeta (dentro de payWithCard), así que un pedido pagado en efectivo
    // no tenía ninguna forma de que el cliente comprobara su estado.
    clientRef: genClientRef()
  };
  if(metodoPagoLocal) req.metodoPagoLocal = metodoPagoLocal;
  if(pagaCon != null) req.pagaCon = pagaCon;

  req.total = total;
  guardarResumenPedido(req);

  const submitBtn = document.getElementById('o-submit');
  if(submitBtn) submitBtn.disabled = true;

  if(metodoPago === 'tpv'){
    setPaySubmitEnabled(false);
    payWithCard(req, total, isDelivery ? t('order.delivery.title') : t('order.takeaway.title'));
    return;
  }

  sendRequest(req, t('order.ok'));
}

/* ============ PAGO CON TARJETA (Stripe) ============
   1) Se pide al Worker el pago ANTES de registrar el pedido en el negocio:
      si el Worker falla, no llega a crearse ningún pedido huérfano, sin
      estado de pago e indistinguible de uno a pagar en el local.
   2) Solo si Stripe acepta crear el pago, se registra el pedido (con su
      clientRef) y se manda al cliente a la página de pago de Stripe.
   3) Cuando el cliente paga, Stripe avisa al Worker (con su firma) y la app
      del negocio lo recoge preguntando (ver comprobarPagosTarjeta, js/core.js). */
// refField: qué campo de `req` identifica el pago al volver del banco
// (clientRef para pedidos, resToken para la señal de una reserva — ver
// pago_confirmado en initPublicRequestsListener, js/core.js, que busca por
// ambos). submitBtnId: qué botón reactivar si algo falla.
function payWithCard(req, amount, description, refField, submitBtnId){
  refField = refField || 'clientRef';
  submitBtnId = submitBtnId || 'o-submit';
  const ref = req[refField] || genClientRef();
  req[refField] = ref;

  const base = location.href.split('?')[0] + '?neg=' + encodeURIComponent(publicId) + (req.mesaToken ? '&mesa=' + encodeURIComponent(req.mesaToken) : '');
  // Al volver del banco, el cliente entra DIRECTO en el seguimiento de su
  // pedido o en «Gestionar mi reserva», igual que si hubiera pagado en
  // efectivo. Antes caía en una pantalla fija sin enlace a nada que decía
  // «el restaurante lo confirmará», aunque el negocio acepte los pedidos solo.
  // El autopedido de mesa no tiene seguimiento propio: ese sí va a la
  // pantalla de siempre.
  const seguimiento = refField === 'resToken' ? '&res=' + encodeURIComponent(ref)
    : (req.type === 'pedido' && req.tipo !== 'mesa') ? '&track=' + encodeURIComponent(ref) : '';
  fetch(`${PAGOS_WORKER_URL}/stripe/pagar`, {
    method: 'POST',
    headers: {'content-type':'application/json'},
    body: JSON.stringify({
      publicId, orderRef: ref, amount, description,
      urlOk: base + seguimiento + '&pago=ok',
      urlKo: base + '&pago=ko'
    })
  }).then(r => r.json()).then(data => {
    if(!data || !data.url || data.error){
      showInlineError(t('error.pago') + (data && data.error ? ' ' + data.error : ''));
      setPaySubmitEnabled(true, submitBtnId);
      return;
    }
    return db.ref('gastrogoan/public/' + publicId + '/requests').push(req).then(() => {
      yendoAPagar = true;   // salir hacia Stripe no es «perder el pedido»: el aviso de salida no debe saltar
      location.href = data.url;   // la página de pago de Stripe
    });
  }).catch(e => {
    console.error(e);
    showInlineError(t('error.pago.conexion'));
    setPaySubmitEnabled(true, submitBtnId);
  });
}
/* «Lo que has pedido» en el seguimiento (1/10). El estado público del pedido
   solo lleva el estado, a propósito: con el enlace no se puede ver lo que ha
   pedido nadie. El detalle se guarda en ESTE navegador al enviarlo, y el
   seguimiento lo enseña si es el mismo móvil (lo normal). Los 20 últimos. */
const RESUMENES_LS = 'gastrogoan_mis_pedidos';
function guardarResumenPedido(req){
  try{
    if(!req || !req.clientRef) return;
    const todos = JSON.parse(localStorage.getItem(RESUMENES_LS) || '{}');
    todos[req.clientRef] = {
      items: (req.items || []).map(l => ({n: String(l.name || ''), q: Number(l.qty) || 1, p: Number(l.price) || 0,
        m: Array.isArray(l.modificadores) ? l.modificadores.map(x => x && x.nombre).filter(Boolean) : []})),
      envio: Number(req.costeEnvio) || 0, propina: Number(req.propina) || 0, total: Number(req.total) || 0,
      date: req.date || '', time: req.time || '', dir: req.clienteDireccion || '', ts: Date.now()
    };
    const claves = Object.keys(todos).sort((a, b) => (todos[b].ts || 0) - (todos[a].ts || 0));
    claves.slice(20).forEach(k => delete todos[k]);
    localStorage.setItem(RESUMENES_LS, JSON.stringify(todos));
  }catch(e){ /* sin almacenamiento (modo privado): el seguimiento funciona igual */ }
}
function resumenPedidoHtml(token){
  let r = null;
  try{ r = (JSON.parse(localStorage.getItem(RESUMENES_LS) || '{}'))[token] || null; }catch(e){}
  if(!r || !Array.isArray(r.items) || !r.items.length) return '';
  const fila = (izq, der, fuerte) => `<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);${fuerte ? 'font-weight:700;color:var(--ink)' : ''}"><span>${izq}</span><span class="mono" style="white-space:nowrap">${der}</span></div>`;
  let dia = r.date || '';
  try{
    if(/^\d{4}-\d{2}-\d{2}$/.test(dia)){
      const [y, m, d] = dia.split('-').map(Number);
      const f = new Date(y, m - 1, d).toLocaleDateString(currentLang === 'ca' ? 'ca-ES' : (currentLang === 'en' ? 'en-GB' : 'es-ES'), {weekday: 'long', day: 'numeric', month: 'long'});
      dia = f.charAt(0).toUpperCase() + f.slice(1);
    }
  }catch(e){}
  const cuando = [dia, r.time].filter(Boolean).join(' · ');
  return `
    <div class="trk-block">
      <div class="trk-label">${t('track.summaryTitle')}</div>
      ${cuando || r.dir ? `<p style="margin:0 0 8px;font-size:14px">${escapeHtml(cuando)}${cuando && r.dir ? '<br>' : ''}${escapeHtml(r.dir)}</p>` : ''}
      ${r.items.map(l => fila(`${l.q} × ${escapeHtml(l.n)}${l.m && l.m.length ? `<br><span style="color:var(--muted);font-size:13px">${l.m.map(escapeHtml).join(', ')}</span>` : ''}`, fmtMoney(l.p * l.q))).join('')}
      ${r.envio > 0 ? fila(t('cart.shipping'), fmtMoney(r.envio)) : ''}
      ${r.propina > 0 ? fila(t('track.tip'), fmtMoney(r.propina)) : ''}
      ${fila(t('track.total'), fmtMoney(r.total), true)}
    </div>`;
}
// Aviso fijo arriba, fuera de #app: el seguimiento se redibuja solo cada vez
// que cambia el estado, y un aviso dentro desaparecería al primer cambio.
function mostrarAvisoPagoHecho(){
  if(!avisoPagoHecho) return;
  const el = document.createElement('div');
  el.setAttribute('role', 'status');
  el.style.cssText = 'position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--ink);color:#fff;font-size:14px;font-weight:600';
  el.innerHTML = `<span style="flex:1">${escapeHtml(avisoPagoHecho)}</span><button type="button" aria-label="OK" style="background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;min-width:44px;min-height:44px;cursor:pointer">OK</button>`;
  el.querySelector('button').onclick = () => el.remove();
  document.body.insertBefore(el, document.body.firstChild);
  avisoPagoHecho = null;
}
function setPaySubmitEnabled(enabled, submitBtnId){
  submitBtnId = submitBtnId || 'o-submit';
  if(enabled){
    submittingRequest = false;
    setBtnLoading(submitBtnId, false);
  }else{
    const btn = document.getElementById(submitBtnId);
    if(btn) btn.disabled = true;
  }
}

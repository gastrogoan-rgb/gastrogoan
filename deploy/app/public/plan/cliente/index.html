<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan 360° · GastroGoan</title>
<!--
  La entrada del CLIENTE del coaching: usuario + PIN, mismo lenguaje que ya
  conoce de GastroGoan App (ver plan/comun.js para el porqué del mecanismo).

  ⚠️ Esto es un ESQUELETO funcional, no el contenido final. Hoy demuestra
  que la cadena entera funciona -formulario, derivación de clave, Firebase,
  lectura de la ruta- pero lo que se ve tras entrar es un marcador de
  posición. El checklist, el plan de 30 días y los informes mensuales van
  encima de esta misma base, no en un sitio aparte.
-->
<style>
  @font-face{font-family:'SG';src:url('/fonts/schibsted-grotesk-500-normal.woff2') format('woff2');font-weight:500}
  @font-face{font-family:'SG';src:url('/fonts/schibsted-grotesk-700-normal.woff2') format('woff2');font-weight:700}
  @font-face{font-family:'PM';src:url('/fonts/ibm-plex-mono-500-normal.woff2') format('woff2');font-weight:500}

  :root{
    --ink:#1C1A17; --olive:#4A5D4E; --olive-l:#7E9B84;
    --paper:#FBFAF7; --bg:#14120F; --border:#E7E2D9; --muted:#9A9488;
    --red:#8A4A3B; --red-l:#F5EBE7;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--paper);
    font:16px/1.5 'SG',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px;
    padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}

  .caja{width:100%;max-width:380px}
  .marca{display:flex;align-items:center;gap:9px;font-weight:700;
    letter-spacing:-.02em;margin-bottom:36px;justify-content:center}
  .marca i{width:10px;height:10px;border-radius:50%;background:var(--olive-l);display:block}

  h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px;text-align:center}
  .sub{color:var(--muted);font-size:14px;text-align:center;margin:0 0 32px}

  form{background:var(--paper);color:var(--ink);border-radius:16px;
    padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  label{display:block;font-family:'PM',monospace;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:#6E675E;margin:0 0 6px}
  input{width:100%;font:500 17px 'SG',sans-serif;padding:13px 14px;
    border:1.5px solid var(--border);border-radius:10px;background:#fff;
    color:var(--ink);margin-bottom:16px}
  input:focus{outline:none;border-color:var(--olive)}
  input#pin{font-family:'PM',monospace;letter-spacing:.15em}

  button{width:100%;min-height:50px;border:none;border-radius:10px;
    background:var(--ink);color:var(--paper);font:700 15px 'SG',sans-serif;
    cursor:pointer;margin-top:4px}
  button:disabled{opacity:.6;cursor:default}

  .error{background:var(--red-l);color:var(--red);font-size:13px;
    padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}
  .error.show{display:block}

  .pie{text-align:center;margin-top:22px;font-size:12.5px;color:var(--muted)}

  /* Lo que se ve TRAS entrar. Marcador de posición a propósito -ver aviso
     al principio del fichero-, con el mismo lenguaje visual que tendrá el
     contenido real. */
  #bienvenida{display:none;background:var(--paper);color:var(--ink);
    border-radius:16px;padding:32px 26px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35)}
  #bienvenida .ok{width:44px;height:44px;border-radius:50%;background:var(--olive-l);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px}
  #bienvenida h2{font-size:20px;margin:0 0 6px}
  #bienvenida p{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0}
</style>

<div class="caja">
  <div class="marca"><i></i><span>PLAN 360° · GASTROGOAN</span></div>

  <div id="login">
    <h1>Tu plan</h1>
    <p class="sub">Entra con el usuario y el PIN que te dio Marcos</p>
    <form id="form-login" onsubmit="return false">
      <div class="error" id="err"></div>
      <label for="usuario">Tu negocio</label>
      <input id="usuario" autocomplete="username" placeholder="casapaco" autocapitalize="off">
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
      <button id="btn-entrar" type="submit">Entrar</button>
    </form>
    <p class="pie">¿No tienes tus datos? Escribe a tu coach.</p>
  </div>

  <div id="bienvenida">
    <div class="ok">✓</div>
    <h2 id="nombre-negocio">Bienvenido</h2>
    <p>Tu plan se está preparando. En cuanto tengas el checklist, el plan de 30 días y tus informes, aparecerán aquí.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="../comun.js"></script>
<script>
  const form = document.getElementById('form-login');
  const btn = document.getElementById('btn-entrar');
  const err = document.getElementById('err');

  function mostrarError(msg){
    err.textContent = msg;
    err.classList.add('show');
  }

  form.addEventListener('submit', async () => {
    err.classList.remove('show');
    const usuario = document.getElementById('usuario').value;
    const pin = document.getElementById('pin').value;
    const authKey = coachAuthKey(usuario, pin);
    if(!authKey){ mostrarError('Escribe tu negocio y tu PIN.'); return; }

    btn.disabled = true; btn.textContent = 'Entrando…';
    try{
      await initCoachFirebase();
      const snap = await firebase.database().ref('coaching/clientes/' + authKey).once('value');
      const datos = snap.val();
      if(!datos){
        // Nunca se dice CUÁL de los dos falla — ni al cliente le sirve
        // saberlo, ni conviene dárselo gratis a quien esté probando.
        mostrarError('Negocio o PIN incorrectos.');
        btn.disabled = false; btn.textContent = 'Entrar';
        return;
      }
      document.getElementById('login').style.display = 'none';
      document.getElementById('bienvenida').style.display = 'block';
      document.getElementById('nombre-negocio').textContent =
        'Bienvenido, ' + coachEscapeHtml(datos.negocio || usuario);
    }catch(e){
      console.error(e);
      mostrarError('No se ha podido conectar. Comprueba tu conexión e inténtalo de nuevo.');
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });
</script>
</html>
